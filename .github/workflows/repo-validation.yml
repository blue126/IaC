name: Repository Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: repo-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repo-validation:
    name: repo-validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      # Classify once, before any toolchain download, so unrelated toolchains are
      # never fetched. validate-repository.sh re-runs the same classifier on the
      # same SHAs and therefore reaches the same decisions.
      - name: Classify changed files
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/ci/classify-pr.sh "${BASE_SHA}" "${HEAD_SHA}" >>"${GITHUB_OUTPUT}"

      - name: Set up Terraform
        if: steps.classify.outputs.terraform_applicable == 'true'
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.14.9
          terraform_wrapper: false

      # Unconditional: the contract tests and the documentation checks always
      # need the pinned Python runtime.
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Set up Go
        if: steps.classify.outputs.hugo_applicable == 'true'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.0'
          cache: true

      - name: Set up Hugo
        if: steps.classify.outputs.hugo_applicable == 'true'
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: '0.165.0'
          extended: true

      - name: Run validation contract tests
        run: tests/ci/repo-validation-test.sh

      - name: Run review policy gate contract tests
        run: tests/ci/review-policy-gate-test.sh

      # Collections are pinned in ansible/requirements.yml, so the manifest hash
      # fully determines the resolved set. restore-keys allow a partially stale
      # snapshot to be topped up by the install step that always follows.
      - name: Cache Ansible collections
        if: steps.classify.outputs.ansible_applicable == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ansible/collections
          key: ${{ runner.os }}-ansible-collections-${{ hashFiles('ansible/requirements.yml') }}
          restore-keys: |
            ${{ runner.os }}-ansible-collections-

      - name: Validate repository
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/ci/validate-repository.sh "${BASE_SHA}" "${HEAD_SHA}"
