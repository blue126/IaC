name: OINK Document Proposal

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Candidate discovery run ID
        required: true
        type: string
      document_id:
        description: Stable candidate document ID
        required: true
        type: string
      candidate_id:
        description: Trusted candidate ID to propose for
        required: true
        type: string
      expected_base:
        description: Trusted candidate merge-base SHA
        required: true
        type: string
      expected_head:
        description: Trusted candidate head SHA
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  propose:
    name: document-proposal
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out trusted merge base
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.expected_base }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Download candidate artifacts
        env:
          DOCUMENT_ID: ${{ inputs.document_id }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          artifact_dir="${RUNNER_TEMP}/candidate-artifacts"
          mkdir -p "${artifact_dir}/preparation" "${artifact_dir}/result"
          gh run download "${SOURCE_RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
            --name "oink-candidate-preparation-${SOURCE_RUN_ID}" \
            --dir "${artifact_dir}/preparation"
          gh run download "${SOURCE_RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
            --name "oink-candidate-result-${DOCUMENT_ID}-${SOURCE_RUN_ID}" \
            --dir "${artifact_dir}/result"

      - name: Bridge trusted candidate
        id: bridge
        env:
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          DOCUMENT_ID: ${{ inputs.document_id }}
          EXPECTED_BASE: ${{ inputs.expected_base }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          artifact_dir="${RUNNER_TEMP}/candidate-artifacts"
          bridge_dir="${RUNNER_TEMP}/proposal-input"
          mkdir -p "${bridge_dir}"
          python3 tools/doc-gardening/bridge-candidate.py \
            --root . \
            --manifest "${artifact_dir}/preparation/manifests/${DOCUMENT_ID}.json" \
            --result "${artifact_dir}/result/${DOCUMENT_ID}.json" \
            --run-record "${artifact_dir}/result/${DOCUMENT_ID}.run.json" \
            --candidate-id "${CANDIDATE_ID}" \
            --expected-base "${EXPECTED_BASE}" \
            --expected-head "${EXPECTED_HEAD}" \
            --output-manifest "${bridge_dir}/manifest.json" \
            --output-candidate "${bridge_dir}/candidate.json"
          python3 tools/doc-gardening/render-proposal.py \
            --manifest "${bridge_dir}/manifest.json" \
            --candidate "${bridge_dir}/candidate.json" \
            --output "${bridge_dir}/prompt.md"
          delimiter="prompt-$(python3 -c 'import secrets; print(secrets.token_hex(16))')"
          while grep -Fq "${delimiter}" "${bridge_dir}/prompt.md"; do
            delimiter="prompt-$(python3 -c 'import secrets; print(secrets.token_hex(16))')"
          done
          {
            echo "prompt<<${delimiter}"
            cat "${bridge_dir}/prompt.md"
            echo "${delimiter}"
            printf 'schema=%s\n' "$(jq -c . tools/doc-gardening/schemas/edit-proposal-v1.json)"
          } >> "${GITHUB_OUTPUT}"

      - name: Generate one exact proposal
        id: proposal
        uses: anthropics/claude-code-action@ef8bb1e43bf303cff727a1dd0b8837029fe982a2 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            ${{ steps.bridge.outputs.prompt }}
          claude_args: >-
            --model claude-opus-5
            --max-turns 3
            --allowedTools "Read"
            --json-schema '${{ steps.bridge.outputs.schema }}'

      - name: Validate no-write proposal receipt
        env:
          EXPECTED_BASE: ${{ inputs.expected_base }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          STRUCTURED_OUTPUT: ${{ steps.proposal.outputs.structured_output }}
        run: |
          [[ "${{ steps.proposal.outcome }}" == "success" ]]
          [[ "${{ steps.proposal.outputs.conclusion }}" == "success" ]]
          [[ -n "${STRUCTURED_OUTPUT}" ]]
          proposal_dir="${RUNNER_TEMP}/proposal-input"
          printf '%s\n' "${STRUCTURED_OUTPUT}" > "${proposal_dir}/proposal.json"
          python3 tools/doc-gardening/validate-proposal.py \
            --root . \
            --manifest "${proposal_dir}/manifest.json" \
            --candidate "${proposal_dir}/candidate.json" \
            --proposal "${proposal_dir}/proposal.json" \
            --expected-base "${EXPECTED_BASE}" \
            --expected-head "${EXPECTED_HEAD}" \
            --output "${proposal_dir}/receipt.json"

      - name: Upload validated no-write proposal
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oink-document-proposal-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/proposal-input/manifest.json
            ${{ runner.temp }}/proposal-input/candidate.json
            ${{ runner.temp }}/proposal-input/proposal.json
            ${{ runner.temp }}/proposal-input/receipt.json
          if-no-files-found: warn
          retention-days: 14
