[[entry]]
id = 3
type = "story"
title = "网站员工登录与我的工作区"
description = "员工在网站用邮箱验证码登录，获得 2 小时 HttpOnly 会话，查看自己的状态与到期日，并在有效期内直接下载设备包（与邮件链接共用 3 次额度，AD-17）；执行器把状态副本推送到网站（D1，管理令牌接口）。"
verify = "以测试副本推送后，测试员工登录看到副本中的状态与到期日；会话 2 小时后失效；未登录或他人邮箱看不到状态；未开通邮箱请求登录码得到相同响应且不发信；登录后可下载设备包，次数与邮件链接合计不超过 3 次，失效后不可下载。"
notes = ["2026-11-02 用户决定：5.3 只做网站侧与接收接口，执行器生成与推送副本移到 5.6；副本格式见 5.3 计划", "2026-11-05 「我的工作区」登录 Claude 步骤改为打开 workspace-login 显示的地址，去掉员工核对证书指纹（证书由 verify 核对）"]
covers = ["R20"]
after = [2]
hitl = true
risk = "medium"

