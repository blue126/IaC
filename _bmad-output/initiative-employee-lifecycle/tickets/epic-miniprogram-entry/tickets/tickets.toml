# Stories of epic-miniprogram-entry, in build order.

[[entry]]
id = 1
type = "story"
title = "新视觉设计与统一文案源"
description = "设计一套网站与小程序共用的视觉（配色、字体层级、卡片、按钮、表单、状态标签，含深色模式）并输出设计 token；把规格说明、申请须知、表单提示、状态与到期日表述整理为一份 JSON 文案源。"
verify = "管理员审定设计稿与文案；token 与 text.json 可被两端构建读取。"
covers = ["R20"]
after = []
hitl = true
risk = "low"
notes = ["2026-11-02 用户选择重新设计一套；文案源为单一 JSON", "2026-11-02 风格参考 pay.sh：近黑底、细线网格分区、等宽字体标签、荧光绿强调色、直角卡片、终端感；只借鉴风格，不使用其品牌、标志与素材"]

