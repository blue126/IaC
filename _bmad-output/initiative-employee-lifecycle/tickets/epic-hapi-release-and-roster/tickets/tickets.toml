[[entry]]
id = 1
type = "spike"
title = "现场只读核实"
description = "确认 Hub 是否热加载 credentials.json、SSH sudo 能否运行 hapi-ctl、VM500 的 Python 与依赖、已到期员工、settings 实际值、未完成的 provision 计划。"
verify = "方案第 7 节每一项都有现场结果，不成立的项已写回方案。"
covers = ["R19"]
after = []
hitl = true
risk = "low"

[[entry]]
id = 2
type = "story"
title = "hapi-control 成形，新代码能比对线上"
description = "建 remotecc/hapi-control/，迁入应用代码和测试，把 Nginx 生成改成纯 Python，hapi-ctl apply --check 能读线上文件并报告差异。"
verify = "VM500 上运行 apply --check，除代码路径外差异为零，线上文件未变。"
covers = ["R19"]
after = [1]
hitl = true
risk = "medium"

[[entry]]
id = 3
type = "story"
title = "名单只有一种形状，到期规则只有一份"
description = "新增 hub-hapi.roster() 和 hub-expiry 的到期判断，定义 schema 1 载荷，enforce 与 hub-status 共用。"
verify = "单元测试覆盖到期、续费、不到期标记和无效日期，roster() 不访问 BWS。"
covers = ["R19"]
after = []
hitl = false
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "hapi-ctl 能写入：apply 和 activate"
description = "实现两个写入子命令、flock、pending 重载标记、令牌回收规则、schema 校验。"
verify = "用合成数据的测试覆盖替换失败、重载失败后补重载、并发、静态令牌不被回收、未知 schema 被拒绝。"
covers = ["R19"]
after = [2, 3]
hitl = false
risk = "high"

[[entry]]
id = 5
type = "story"
title = "wsctl hapi-release 能发布和回滚"
description = "打包、计划、批准、回滚、健康检查和自动切回，审批 SHA 覆盖版本和包内容。"
verify = "测试环境发布一个坏版本后自动切回；回滚到不支持当前 schema 的版本在计划阶段被拒绝。"
covers = ["R19"]
after = [4]
hitl = false
risk = "high"

[[entry]]
id = 6
type = "story"
title = "IaC 角色只管机器"
description = "瘦身 hapi-control-plane 和 hapi-shared-hub，补公开 inventory 和 trust.json，单元指向 current，加角色指向说明。"
verify = "--check --diff 显示只改单元和 trust.json，不碰路由、令牌和名单文件。"
covers = ["R19"]
after = [1]
hitl = false
risk = "high"

[[entry]]
id = 7
type = "story"
title = "切换到新代码路径（P2）"
description = "冻结 hapi-sync 和开户退役，运行瘦身角色，用 activate 写入指向 current 的 Nginx。"
verify = "VM502 全流程登录成功，hapi-control-auth 运行的是 current 下的代码，Hub 没有重启。"
covers = ["R19"]
after = [5, 6]
hitl = true
risk = "high"

[[entry]]
id = 8
type = "story"
title = "hapi-sync 接管写入（P3）"
description = "hapi-sync 改走 hapi-ctl apply，enabled 恒为 true，加 Semaphore 每日任务，解除冻结。"
verify = "首次运行报告无变化，日志里没有 ansible-playbook 写 VM500。"
covers = ["R19"]
after = [7]
hitl = true
risk = "high"

[[entry]]
id = 9
type = "story"
title = "到期员工被拒绝登录（P4）"
description = "enforce 开始推送名单，enabled 按到期计算，失败不影响关机。"
verify = "测试员工到期后被拒绝并断开，续费后恢复，已有身份绑定不变。"
covers = ["R19"]
after = [8]
hitl = true
risk = "medium"

[[entry]]
id = 10
type = "story"
title = "验收和清理（P5）"
description = "测试员工走一次开户、到期、续费、退役；观察一周后删 hapi-registry、旧文件，以及 vm500_writer 开关和它的 ansible、frozen 分支，把真实部署路径写进文档，去掉维护说明的目标设计提示。"
verify = "仓库没有 hapi-registry 和 vm500_writer；wsctl README 和手册写的是新路径；hapi-hub-config.py 保留。"
covers = ["R19"]
after = [9]
hitl = true
risk = "medium"

[[entry]]
id = 11
type = "story"
title = "VM502 转为普通员工 VM（P6）"
description = "改用员工 ID，重配 Runner 和令牌，删除 static_routes、static_ids 和相关例外。"
verify = "VM502 登录正常，代码和 settings 里没有静态路由。"
covers = ["R19"]
after = [10]
hitl = true
risk = "medium"
