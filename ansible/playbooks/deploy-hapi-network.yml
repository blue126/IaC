---
- name: Deploy the independent HAPI PVE network boundaries
  hosts: hapi_pve
  become: true
  roles:
    - hapi-network

- name: Verify the independent HAPI PVE network boundaries
  hosts: hapi_pve
  become: true
  gather_facts: false
  tags: [verify]
  tasks:
    - name: Verify the kernel enforcement receipts
      ansible.builtin.include_role:
        name: hapi-network
        tasks_from: verify
