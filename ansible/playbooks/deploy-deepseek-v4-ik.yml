---
- name: Deploy DeepSeek V4 GGUF production service
  hosts: llm-server
  become: true
  gather_facts: true
  vars:
    deepseek_v4_ik_production: true
  roles:
    - common
    - tailscale
    - role: deepseek-v4-ik
  tags: [production]

- name: Verify DeepSeek V4 GGUF production service
  hosts: llm-server
  become: true
  gather_facts: false
  tasks:
    - name: Verify the GGUF API model listing
      ansible.builtin.uri:
        url: http://172.17.0.1:8081/v1/models
        status_code: 200
      tags: [verify]
