---
- name: Deploy the private VM500 HAPI control plane prototype
  hosts: hapi_control_plane
  become: true
  roles:
    - hapi-control-plane

- name: Verify the private HAPI control plane prototype
  hosts: hapi_control_plane
  become: true
  gather_facts: false
  tags: [verify]
  tasks:
    - name: Verify private control plane contracts
      ansible.builtin.include_role:
        name: hapi-control-plane
        tasks_from: verify
