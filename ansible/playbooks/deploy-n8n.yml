---
- name: Deploy n8n Docker runtime
  hosts: n8n
  gather_facts: true
  become: true
  roles:
    - common
    - tailscale
    - docker
    - n8n

- name: Verify n8n Docker Deployment
  hosts: n8n
  gather_facts: false
  become: true
  tags: [verify]
  tasks:
    - name: Wait for n8n to start
      ansible.builtin.wait_for:
        port: 5678
        delay: 5
        timeout: 60

    - name: Check Docker service status
      ansible.builtin.systemd_service:
        name: docker
      register: docker_service_status

    - name: Assert Docker service is active
      ansible.builtin.assert:
        that:
          - docker_service_status.status.ActiveState == "active"
          - docker_service_status.status.SubState == "running"
        success_msg: "✅ Docker service is active and running"
        fail_msg: "❌ Docker service is not active and running"

    - name: Check legacy n8n service state
      ansible.builtin.systemd_service:
        name: n8n
      register: legacy_n8n_service_state
      changed_when: false
      failed_when: false

    - name: Assert legacy n8n service is not active
      ansible.builtin.assert:
        that:
          - legacy_n8n_service_state.status.ActiveState | default('unknown', true) != "active"
        success_msg: "✅ Legacy npm/systemd n8n service is stopped"
        fail_msg: "❌ Legacy npm/systemd n8n service is still active"

    - name: Validate the merged Compose configuration
      ansible.builtin.command:
        cmd: docker compose config --quiet
        chdir: /opt/n8n-rental
      changed_when: false

    - name: List running n8n Compose services
      ansible.builtin.command:
        cmd: docker compose ps --status running --services
        chdir: /opt/n8n-rental
      register: n8n_running_services
      changed_when: false
      check_mode: false

    - name: Assert n8n Compose service is running
      ansible.builtin.assert:
        that:
          - "'n8n' in n8n_running_services.stdout.splitlines()"
        success_msg: "✅ n8n Compose service is running"
        fail_msg: "❌ n8n Compose service is not running"

    - name: Get n8n version from the container
      ansible.builtin.command:
        cmd: docker compose exec -T n8n n8n --version
        chdir: /opt/n8n-rental
      register: n8n_installed_version
      changed_when: false
      check_mode: false

    - name: Assert installed n8n version
      ansible.builtin.assert:
        that:
          - n8n_installed_version.stdout == n8n_version
        fail_msg: >-
          Expected n8n {{ n8n_version }}, but found
          {{ n8n_installed_version.stdout }}.

    - name: Check n8n readiness endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:5678/healthz/readiness
        status_code: 200
        timeout: 5
      register: n8n_readiness
      check_mode: false
      until: n8n_readiness.status == 200
      retries: 6
      delay: 5

    - name: Display n8n verification summary
      ansible.builtin.debug:
        msg: |
          ======================================
          ✅ n8n verification complete
          URL: http://{{ ansible_host }}:5678
          Runtime: Docker Compose inside the existing LXC
          n8n: {{ n8n_installed_version.stdout }}
          ======================================
