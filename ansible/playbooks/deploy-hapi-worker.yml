---
- name: Deploy a Runner and personal login component for the VM500 HAPI application
  hosts: hapi_workers
  become: true
  roles:
    - hapi-worker

- name: Verify this HAPI worker application baseline
  hosts: hapi_workers
  become: true
  gather_facts: false
  tags: [verify]
  tasks:
    - name: Verify only the worker application and transport components
      ansible.builtin.include_role:
        name: hapi-worker
        tasks_from: verify
