---
- name: Pin and recover the LLM GPU platform
  hosts: llm-server
  become: true
  gather_facts: false
  vars:
    deepseek_v4_ik_platform: true
    deepseek_v4_ik_platform_verify_only: false
  roles:
    - role: deepseek-v4-ik
  tags: [never, platform]

- name: Verify the pinned LLM GPU platform
  hosts: llm-server
  become: true
  gather_facts: false
  vars:
    deepseek_v4_ik_platform: true
    deepseek_v4_ik_platform_verify_only: true
  roles:
    - role: deepseek-v4-ik
  tags: [never, platform-verify]

- name: Prepare DeepSeek V4 GGUF candidate
  hosts: llm-server
  become: true
  gather_facts: false
  vars:
    deepseek_v4_ik_prepare: true
    deepseek_v4_ik_run_candidate: false
    deepseek_v4_ik_verify_stable: false
  roles:
    - role: deepseek-v4-ik
  tags: [never, prepare]

- name: Run DeepSeek V4 GGUF experiment
  hosts: llm-server
  become: true
  gather_facts: false
  vars:
    deepseek_v4_ik_prepare: false
    deepseek_v4_ik_run_candidate: true
    deepseek_v4_ik_verify_stable: false
  roles:
    - role: deepseek-v4-ik
  tags: [never, experiment]

- name: Capture DeepSeek V4 dual-GPU topology and P2P evidence
  hosts: llm-server
  become: true
  gather_facts: false
  vars:
    deepseek_v4_ik_prepare: false
    deepseek_v4_ik_run_candidate: false
    deepseek_v4_ik_verify_stable: false
    deepseek_v4_ik_run_topology_preflight: true
  roles:
    - role: deepseek-v4-ik
  tags: [never, preflight]

- name: Verify stable DeepSeek V4 GGUF service
  hosts: llm-server
  become: true
  gather_facts: false
  vars:
    deepseek_v4_ik_prepare: false
    deepseek_v4_ik_run_candidate: false
    deepseek_v4_ik_verify_stable: true
  tasks:
    - name: Load read-only stable service verification
      ansible.builtin.include_role:
        name: deepseek-v4-ik
        tasks_from: verify
  tags: [never, verify]

- name: Run final DeepSeek V4 production qualification
  hosts: llm-server
  become: true
  gather_facts: false
  vars:
    deepseek_v4_ik_prepare: false
    deepseek_v4_ik_run_candidate: false
    deepseek_v4_ik_verify_stable: false
    deepseek_v4_ik_run_final_qualification: true
  roles:
    - role: deepseek-v4-ik
  tags: [never, final]
