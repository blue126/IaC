---
- name: Deploy OCI Hub gated Portal and quota executor
  hosts: oci
  become: true
  roles:
    - oci-hub

- name: Verify OCI Hub live isolation and services
  hosts: oci
  become: true
  tags: [verify]
  tasks:
    - name: Verify actual Hub ACL state
      ansible.builtin.command: /usr/local/lib/oci-hub-boundary.py verify --routing
      changed_when: false
    - name: Verify isolated Portal and accounting timer
      ansible.builtin.command: systemctl is-active oci-hub-portal oci-hub-quota.timer  # noqa command-instead-of-module
      changed_when: false
