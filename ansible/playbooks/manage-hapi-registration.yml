---
- name: Manage one employee in the HAPI application on VM500
  hosts: hapi_vm500
  become: true
  gather_facts: false
  roles:
    - hapi-registration

- name: Verify the request registration without changing other HAPI workspaces
  hosts: hapi_vm500
  become: true
  gather_facts: false
  tags: [verify]
  tasks:
    - name: Verify this worker ownership and shared application health
      ansible.builtin.include_role:
        name: hapi-registration
        tasks_from: verify
