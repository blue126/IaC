---
- name: Deploy existing pve2 guest storage policy
  hosts: pve2
  become: true
  gather_facts: false
  roles:
    - proxmox-storage

- name: Verify existing pve2 guest storage policy
  hosts: pve2
  become: true
  gather_facts: false
  tags: [verify]
  tasks:
    - name: Verify configured guest storage
      ansible.builtin.include_role:
        name: proxmox-storage
        tasks_from: verify
