---
- name: Deploy the dedicated employee entry and management routes
  hosts: gateway
  gather_facts: false
  tasks:
    - name: Reject unrelated pending UCI changes or conflicting employee settings
      ansible.builtin.raw: |
        set -eu
        test -z "$(uci -q changes network)"
        test -z "$(uci -q changes firewall)"
        check_field() {
          value="$(uci -q get "$1" || true)"
          test -z "$value" || test "$value" = "$2"
        }
        check_field network.employee_pilot route
        check_field network.employee_control route
        check_field firewall.employee_access redirect
        for section in employee_pilot employee_control; do
          check_field "network.$section.interface" lan
          check_field "network.$section.gateway" 192.168.1.140
          check_field "network.$section.netmask" 255.255.255.252
        done
        check_field network.employee_pilot.target 10.231.1.0
        check_field network.employee_control.target 10.231.2.0
        check_field firewall.employee_access.name Employee-WireGuard
        check_field firewall.employee_access.src wan
        check_field firewall.employee_access.dest lan
        check_field firewall.employee_access.src_dport 51820
        check_field firewall.employee_access.dest_ip 192.168.1.140
        check_field firewall.employee_access.dest_port 51820
        check_field firewall.employee_access.proto udp
        check_field firewall.employee_access.target DNAT
        for subnet in 10.231.1.0/30 10.231.2.0/30; do
          route="$(ip -4 route show exact "$subnet")"
          test -z "$route" || echo "$route" | grep -F 'via 192.168.1.140'
        done
        if netstat -lnu | grep -q ':51820 '; then
          echo "Router UDP 51820 is already occupied." >&2
          exit 1
        fi
      changed_when: false
      check_mode: false

    - name: Reconcile only the reviewed employee UDP entry and two private routes
      ansible.builtin.raw: |
        set -eu
        umask 077
        mkdir -p /root/employee-access-before
        test -e /root/employee-access-before/network || cp /etc/config/network /root/employee-access-before/network
        test -e /root/employee-access-before/firewall || cp /etc/config/firewall /root/employee-access-before/firewall
        uci batch <<'UCI'
        set network.employee_pilot=route
        set network.employee_pilot.interface='lan'
        set network.employee_pilot.target='10.231.1.0'
        set network.employee_pilot.netmask='255.255.255.252'
        set network.employee_pilot.gateway='192.168.1.140'
        set network.employee_control=route
        set network.employee_control.interface='lan'
        set network.employee_control.target='10.231.2.0'
        set network.employee_control.netmask='255.255.255.252'
        set network.employee_control.gateway='192.168.1.140'
        set firewall.employee_access=redirect
        set firewall.employee_access.name='Employee-WireGuard'
        set firewall.employee_access.src='wan'
        set firewall.employee_access.src_dport='51820'
        set firewall.employee_access.dest='lan'
        set firewall.employee_access.dest_ip='192.168.1.140'
        set firewall.employee_access.dest_port='51820'
        set firewall.employee_access.proto='udp'
        set firewall.employee_access.target='DNAT'
        UCI
        changed=0
        firewall_changed=0
        if test -n "$(uci -q changes network)"; then
          uci commit network
          changed=1
        fi
        if test -n "$(uci -q changes firewall)"; then
          uci commit firewall
          firewall_changed=1
          changed=1
        fi
        for subnet in 10.231.1.0/30 10.231.2.0/30; do
          if test -z "$(ip -4 route show exact "$subnet")"; then
            ip route add "$subnet" via 192.168.1.140 dev br-lan
            changed=1
          fi
        done
        if test "$firewall_changed" = 1; then
          /etc/init.d/firewall reload
        fi
        if test "$changed" = 1; then
          echo EMPLOYEE_ROUTER_CHANGED
        fi
      register: employee_router_update
      changed_when: "'EMPLOYEE_ROUTER_CHANGED' in employee_router_update.stdout"
      when: not ansible_check_mode

- name: Verify only the dedicated employee entry and routes
  hosts: gateway
  gather_facts: false
  tags: [verify]
  tasks:
    - name: Verify the persisted mapping and live private routes
      ansible.builtin.raw: |
        set -eu
        test "$(uci -q get firewall.employee_access.proto)" = udp
        test "$(uci -q get firewall.employee_access.src_dport)" = 51820
        test "$(uci -q get firewall.employee_access.dest_ip)" = 192.168.1.140
        ip -4 route show exact 10.231.1.0/30 | grep -F 'via 192.168.1.140'
        ip -4 route show exact 10.231.2.0/30 | grep -F 'via 192.168.1.140'
        nft list chain inet fw4 dstnat_wan | grep -E 'udp dport 51820.*dnat.*192\.168\.1\.140:51820'
      changed_when: false
      when: not ansible_check_mode
