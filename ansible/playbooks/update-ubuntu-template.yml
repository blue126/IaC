---
# Playbook to update Ubuntu template with qemu-guest-agent
# This should be run once to update the base template

- name: Update Ubuntu Template with QEMU Guest Agent
  hosts: pve0
  become: true
  vars:
    template_id: 9000
    template_name: "ubuntu-24.04-template"
  
  tasks:
    - name: Check if template exists
      ansible.builtin.shell: |
        set -o pipefail
        qm list | grep {{ template_id }}
      args:
        executable: /bin/bash
      register: template_check
      changed_when: false
      check_mode: false
      failed_when: false

    - name: Fail if template not found
      ansible.builtin.fail:
        msg: "Template {{ template_id }} not found on {{ inventory_hostname }}"
      when: template_check.rc != 0

    - name: Convert template to VM (remove template flag)
      ansible.builtin.command: qm set {{ template_id }} --template 0
      register: revert_result
      changed_when: true

    - name: Start the VM
      ansible.builtin.command: qm start {{ template_id }}
      changed_when: true

    - name: Wait for VM to boot (60 seconds)
      ansible.builtin.pause:
        seconds: 60

    - name: Get VM IP address
      ansible.builtin.shell: |
        set -o pipefail
        qm guest cmd {{ template_id }} network-get-interfaces |
          grep -oP '(?<="ip-address":")[^"]+' | grep -v "127.0.0.1" | sed -n '1p'
      args:
        executable: /bin/bash
      register: vm_ip
      retries: 10
      delay: 5
      until: vm_ip.stdout != ""
      changed_when: false

    - name: Display VM IP
      ansible.builtin.debug:
        msg: "VM IP: {{ vm_ip.stdout }}"

    - name: Wait for SSH to be available
      ansible.builtin.wait_for:
        host: "{{ vm_ip.stdout }}"
        port: 22
        timeout: 120

    - name: Add VM to in-memory inventory
      ansible.builtin.add_host:
        name: template-vm
        ansible_host: "{{ vm_ip.stdout }}"
        ansible_user: ubuntu
        ansible_ssh_pass: ubuntu
        ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

- name: Install QEMU Guest Agent in VM
  hosts: template-vm
  become: true
  gather_facts: false
  
  tasks:
    - name: Wait for cloud-init to finish
      ansible.builtin.command: cloud-init status --wait
      changed_when: false

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 0

    - name: Install qemu-guest-agent
      ansible.builtin.apt:
        name: qemu-guest-agent
        state: present

    - name: Enable and start qemu-guest-agent
      ansible.builtin.systemd:
        name: qemu-guest-agent
        enabled: yes
        state: started

    - name: Verify qemu-guest-agent is running
      ansible.builtin.systemd:
        name: qemu-guest-agent
      register: agent_status

    - name: Display agent status
      ansible.builtin.debug:
        msg: "QEMU Guest Agent is {{ agent_status.status.ActiveState }}"

    - name: Clean cloud-init
      ansible.builtin.command: cloud-init clean
      changed_when: true

    - name: Remove cloud-init instances
      ansible.builtin.file:
        path: /var/lib/cloud/instances
        state: absent

    - name: Truncate machine-id
      ansible.builtin.command: truncate -s 0 /etc/machine-id
      changed_when: true

    - name: Remove dbus machine-id
      ansible.builtin.file:
        path: /var/lib/dbus/machine-id
        state: absent

    - name: Create symlink for dbus machine-id
      ansible.builtin.file:
        src: /etc/machine-id
        dest: /var/lib/dbus/machine-id
        state: link

    - name: Clear bash history
      ansible.builtin.shell: history -c && > ~/.bash_history
      changed_when: false

    - name: Shutdown VM
      community.general.shutdown:
        delay: 0

- name: Convert VM back to template
  hosts: pve0
  become: true
  vars:
    template_id: 9000
  
  tasks:
    - name: Wait for VM to shutdown
      ansible.builtin.pause:
        seconds: 60

    - name: Verify VM is stopped
      ansible.builtin.shell: |
        set -o pipefail
        qm status {{ template_id }} | grep stopped
      args:
        executable: /bin/bash
      register: vm_status
      retries: 10
      delay: 5
      until: vm_status.rc == 0
      changed_when: false

    - name: Convert VM back to template
      ansible.builtin.command: qm template {{ template_id }}
      changed_when: true

    - name: Verify template conversion
      ansible.builtin.shell: |
        set -o pipefail
        qm list | grep {{ template_id }} | grep template
      args:
        executable: /bin/bash
      changed_when: false

    - name: Display success message
      ansible.builtin.debug:
        msg: 
          - "========================================="
          - "✅ Template Update Successful"
          - "========================================="
          - "Template ID: {{ template_id }}"
          - "QEMU Guest Agent: Installed and Enabled"
          - "Template is ready for use"
          - "========================================="
