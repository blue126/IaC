---
- name: Deploy Qwen3-TTS OpenAI-compatible API
  hosts: llm-server
  become: true
  gather_facts: false
  roles:
    - role: qwen3-tts
  tags: [deploy]

- name: Verify Qwen3-TTS OpenAI-compatible API
  hosts: llm-server
  become: true
  gather_facts: false
  tasks:
    - name: Load read-only Qwen3-TTS verification
      ansible.builtin.import_role:
        name: qwen3-tts
        tasks_from: verify
      tags: [verify]
  tags: [never, verify]
