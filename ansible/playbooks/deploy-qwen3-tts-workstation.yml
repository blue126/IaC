---
# Host-decoupled entrypoint for ansible/roles/qwen3-tts-workstation, adapted
# from the unmerged codex/qwen3-tts-speech-central-shim draft (PR #13) for
# llm-workstation (192.168.1.191). See that role's defaults for the
# deviations from the draft's llm-server-pinned values.
- name: Deploy Qwen3-TTS Base clone on llm-workstation
  hosts: llm-workstation
  become: true
  gather_facts: false
  tags: [deploy]
  roles:
    - qwen3-tts-workstation

- name: Verify Qwen3-TTS on llm-workstation
  hosts: llm-workstation
  become: true
  gather_facts: false
  tags: [never, verify]
  tasks:
    - name: Load read-only Qwen3-TTS verification
      ansible.builtin.import_role:
        name: qwen3-tts-workstation
        tasks_from: verify
