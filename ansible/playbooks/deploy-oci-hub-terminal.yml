---
- name: Reconcile only the approved native Hub or PVE boundary
  hosts: oci_hub_terminal_controls
  become: true
  gather_facts: false
  tags: [terminal_boundary]
  tasks:
    - name: Validate the complete candidate on the controller
      ansible.builtin.command:
        argv: [python3, '{{ playbook_dir }}/../../scripts/oci-hub/boundary.py', render, --config, '-']
        stdin: '{{ oci_hub_terminal_policy | to_json }}'
      delegate_to: localhost
      become: false
      changed_when: false
    - name: Read the current policy fingerprint before any write
      ansible.builtin.stat:
        path: /etc/oci-hub/boundary.json
        checksum_algorithm: sha256
      register: oci_hub_terminal_policy_file
    - name: Require the exact independently reviewed current policy
      ansible.builtin.assert:
        that:
          - oci_hub_terminal_policy_file.stat.exists
          - not oci_hub_terminal_policy_file.stat.islnk
          - oci_hub_terminal_policy_file.stat.checksum == oci_hub_terminal_before_sha256
    - name: Deploy the matching scoped boundary controller
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../../scripts/oci-hub/boundary.py'
        dest: /usr/local/lib/oci-hub-boundary.py
        owner: root
        group: root
        mode: '0755'
    - name: Save the approved complete policy
      ansible.builtin.copy:
        content: '{{ oci_hub_terminal_policy | to_nice_json }}'
        dest: /etc/oci-hub/boundary.json
        owner: root
        group: root
        mode: '0600'
    - name: Apply only the owned policy and exact host compatibility rules
      ansible.builtin.command: /usr/local/lib/oci-hub-boundary.py apply
      changed_when: true
    - name: Verify actual boundary rules routes and forwarding
      ansible.builtin.command: /usr/local/lib/oci-hub-boundary.py verify --routing
      changed_when: false

- name: Configure the native employee Mosh endpoint on its assigned VM
  hosts: oci_hub_terminal_vm
  become: true
  gather_facts: false
  tags: [terminal_configure]
  pre_tasks:
    - name: Read the assigned VM hostname
      ansible.builtin.command: hostname
      register: oci_hub_terminal_guest_name
      changed_when: false
    - name: Require the exact native VM identity
      ansible.builtin.assert:
        that:
          - oci_hub_terminal_guest_name.stdout == oci_hub_terminal_hostname
          - employee_workspace_profile == 'oci-hub'
  roles:
    - oci-hub-mosh

- name: Check configured native services without claiming user acceptance
  hosts: oci_hub_terminal_vm
  become: true
  gather_facts: false
  tags: [terminal_verify]
  tasks:
    - name: Verify the native Mosh launcher
      ansible.builtin.command: /usr/local/bin/workspace-mosh --version
      changed_when: false
    - name: Verify the VM owned Spoke service
      ansible.builtin.systemd_service:
        name: wg-quick@wg-workspace
      register: oci_hub_terminal_spoke
    - name: Require the active Spoke and native identity
      ansible.builtin.assert:
        that:
          - oci_hub_terminal_spoke.status.ActiveState == 'active'
    - name: Verify employee passwordless administration
      ansible.builtin.command: sudo -n -u employee sudo -n true
      changed_when: false
    - name: Verify SSH daemon syntax
      ansible.builtin.command: sshd -t
      changed_when: false
