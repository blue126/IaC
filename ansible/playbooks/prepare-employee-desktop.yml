---
- name: Deploy the explicitly selected employee presentation phase
  hosts: "{{ employee_desktop_target | default('kasmvnc_no_target_selected') }}"
  become: true
  gather_facts: false
  roles:
    - kasmvnc

# HAPI is on by default: every provisioned or updated desktop also gets the employee side of
# HAPI (Runner, link to the shared Hub, VM500 ingress whose viewer is this desktop, login API).
- name: Deploy HAPI on the employee VM after its desktop
  hosts: "{{ employee_desktop_target | default('kasmvnc_no_target_selected') }}"
  become: true
  gather_facts: true
  tasks:
    - name: Install HAPI with the desktop it depends on
      ansible.builtin.include_role:
        name: hapi
      when: employee_desktop_phase in ['provision', 'update']

- name: Verify the selected employee presentation phase without starting a session
  hosts: "{{ employee_desktop_target | default('kasmvnc_no_target_selected') }}"
  become: true
  gather_facts: false
  tags: [verify]
  tasks:
    - name: Verify the pinned KasmVNC package
      ansible.builtin.command:
        argv: [dpkg-query, -W, '-f=${Version}', kasmvncserver]
      register: kasmvnc_verified_version
      changed_when: false
      failed_when: kasmvnc_verified_version.stdout != '1.5.0-1'

    - name: Validate the staged desktop configuration and immutable materials
      ansible.builtin.command:
        argv:
          - python3
          - -I
          - /usr/local/lib/employee-workspace/presentation/desktop-service.py
          - validate-config
          - /usr/local/lib/employee-workspace/presentation/desktop.json
      changed_when: false
      no_log: true
      when: employee_desktop_phase in ['prepare', 'activate', 'update', 'provision']

    - name: Validate the active nginx configuration
      ansible.builtin.command: nginx -t
      changed_when: false
      no_log: true

    - name: Verify installed on-demand desktop metadata and strict material checks
      ansible.builtin.command:
        argv: [python3, -I, /usr/local/lib/employee-workspace/desktop-service.py, check]
      become_user: employee
      become: true
      changed_when: false
      no_log: true
      when: employee_desktop_phase in ['activate', 'update', 'provision']

    - name: Verify HAPI on the employee VM
      ansible.builtin.include_role:
        name: hapi
        tasks_from: verify
      when: employee_desktop_phase in ['provision', 'update']
