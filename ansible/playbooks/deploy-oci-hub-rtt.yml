---
- name: Enable the approved isolated VM509 boundary and start only that VM
  hosts: oci_hub_pve
  become: true
  gather_facts: false
  tags: [rtt_start]
  tasks:
    - name: Check the existing boundary before any write
      ansible.builtin.command: /usr/local/lib/oci-hub-boundary.py verify --routing
      changed_when: false
    - name: Read the approved policy fingerprint
      ansible.builtin.stat:
        path: /etc/oci-hub/boundary.json
        checksum_algorithm: sha256
      register: oci_hub_rtt_pve_file
    - name: Require the exact original policy and VM allocation
      ansible.builtin.assert:
        that:
          - oci_hub_rtt_pve_file.stat.checksum == oci_hub_rtt_pve_before_sha256
          - oci_hub_rtt_pve_policy.kind == 'pve'
          - oci_hub_rtt_pve_policy.workspaces | selectattr('vmid', 'equalto', 509) | selectattr('vnet', 'equalto', 'oh509') | list | length == 1
    - name: Update only the independently owned PVE boundary policy
      ansible.builtin.copy:
        content: '{{ oci_hub_rtt_pve_policy | to_nice_json }}'
        dest: /etc/oci-hub/boundary.json
        owner: root
        group: root
        mode: '0600'
    - name: Load the approved boundary before VM startup
      ansible.builtin.command: /usr/local/lib/oci-hub-boundary.py apply
      changed_when: true
    - name: Validate the VM startup gate without starting other workspaces
      ansible.builtin.command: /usr/local/lib/oci-hub-boundary.py hook 509 pre-start
      changed_when: false
    - name: Start only the already created VM509
      ansible.builtin.command: qm start 509
      changed_when: true

- name: Reconcile only the cloned VM509 hostname before reading its SSH pin
  hosts: oci_hub_pve
  become: true
  gather_facts: false
  tags: [rtt_bootstrap]
  tasks:
    - name: Read the trusted PVE VM configuration
      ansible.builtin.command: qm config 509
      register: oci_hub_rtt_boot_config
      changed_when: false
    - name: Require the approved VM name and independent network before guest writes
      ansible.builtin.assert:
        that:
          - "'name: oci-hub-pilot509' in oci_hub_rtt_boot_config.stdout_lines"
          - "'bridge=oh509' in oci_hub_rtt_boot_config.stdout"
          - "'02:ec:09:00:01:02' in oci_hub_rtt_boot_config.stdout"
    - name: Read the guest hostname through the trusted guest agent
      ansible.builtin.command: qm guest exec 509 --timeout 10 -- hostname
      register: oci_hub_rtt_guest_name
      changed_when: false
    - name: Refuse unrelated guest identities
      ansible.builtin.assert:
        that:
          - (oci_hub_rtt_guest_name.stdout | from_json).exitcode == 0
          - ((oci_hub_rtt_guest_name.stdout | from_json)['out-data'] | trim) in ['employee-workspace-baseline-20261022', 'oci-hub-pilot509']
    - name: Set the approved hostname only on the new VM509
      ansible.builtin.command: qm guest exec 509 --timeout 10 -- hostnamectl set-hostname oci-hub-pilot509
      register: oci_hub_rtt_set_name
      changed_when: true
      failed_when: (oci_hub_rtt_set_name.stdout | from_json).exitcode != 0
      when: ((oci_hub_rtt_guest_name.stdout | from_json)['out-data'] | trim) != 'oci-hub-pilot509'

- name: Configure VM509 as an independent Spoke and bounded UDP echo target
  hosts: oci_hub_rtt_vm
  become: true
  gather_facts: false
  tags: [rtt_configure]
  tasks:
    - name: Read the expected VM hostname
      ansible.builtin.command: hostname
      register: oci_hub_rtt_hostname
      changed_when: false
    - name: Require the explicitly approved pilot and package installation
      ansible.builtin.assert:
        that:
          - oci_hub_rtt_hostname.stdout == 'oci-hub-pilot509'
          - oci_hub_rtt_install_authorized | bool
    - name: Install only the approved WireGuard and Mosh packages
      ansible.builtin.apt:
        name: [wireguard-tools, mosh]
        state: present
        update_cache: true
        cache_valid_time: 3600
    - name: Configure the VM owned Spoke using the existing role
      ansible.builtin.include_role:
        name: oci-hub-spoke
        tasks_from: vpn
    - name: Install the bounded private-overlay echo probe
      ansible.builtin.copy:
        dest: /usr/local/lib/oci-hub-rtt509.py
        owner: root
        group: root
        mode: '0700'
        content: |
          import socket
          sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          sock.bind(('10.234.0.3', 60049))
          while True:
              data, peer = sock.recvfrom(512)
              sock.sendto(data, peer)
    - name: Install a disabled test service with an automatic runtime limit
      ansible.builtin.copy:
        dest: /etc/systemd/system/oci-hub-rtt509.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Private-overlay VM509 latency probe
          After=wg-quick@wg-workspace.service
          [Service]
          ExecStart=/usr/bin/python3 /usr/local/lib/oci-hub-rtt509.py
          RuntimeMaxSec=600
    - name: Start the bounded probe only for this approved test
      ansible.builtin.systemd_service:
        name: oci-hub-rtt509
        daemon_reload: true
        enabled: false
        state: started

- name: Stop only the test echo service
  hosts: oci_hub_rtt_vm
  become: true
  gather_facts: false
  tags: [rtt_cleanup]
  tasks:
    - name: Inspect the test service status
      ansible.builtin.systemd_service:
        name: oci-hub-rtt509
      register: oci_hub_rtt_echo_status
    - name: Stop the active test service
      ansible.builtin.systemd_service:
        name: oci-hub-rtt509
        state: stopped
      when: oci_hub_rtt_echo_status.status.ActiveState | default('') in ['active', 'activating']
