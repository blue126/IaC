---
- name: Deploy the explicitly authorized original HAPI transport checkpoint
  hosts: hapi_control_plane:hapi_hub_clients
  become: true
  any_errors_fatal: true
  tasks:
    - name: Restore the HAPI proxy checkpoint without changing Hub data or Runner
      ansible.builtin.include_role:
        name: hapi-internal-http
        tasks_from: rollback

- name: Verify restored control plane and compatibility endpoint health
  hosts: hapi_control_plane:hapi_hub_clients
  become: true
  gather_facts: false
  tags: [verify]
  tasks:
    - name: Check the original Hub or worker loopback endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:3006/health
        status_code: 200
        use_proxy: false
