---
- name: Deploy the shared VM500 HAPI Hub and worker transport
  hosts: hapi_control_plane
  become: true
  roles:
    - hapi-shared-hub

- name: Verify the shared VM500 HAPI Hub
  hosts: hapi_control_plane
  become: true
  gather_facts: false
  tags: [verify]
  tasks:
    - name: Verify the shared Hub contracts
      ansible.builtin.include_role:
        name: hapi-shared-hub
        tasks_from: verify
