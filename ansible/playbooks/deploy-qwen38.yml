---
# Qwen3.8-27B, split across both RTX 3090s.
#
# Prerequisite (out of band, same as the DeepSeek and Qwen3.6 runtimes on
# llm-server): the pinned llama.cpp build must already exist on the host.
#   scripts/llama-cpp-mainline-build.sh /opt/llama-cpp-mainline
# This role verifies that artifact; it does not build it.
- name: Deploy Qwen3.8-27B
  hosts: llm-workstation
  become: true
  gather_facts: true
  tags: [deploy]
  roles:
    - qwen38

- name: Verify Qwen3.8-27B
  hosts: llm-workstation
  become: true
  gather_facts: false
  tags: [never, verify]
  tasks:
    - name: Load read-only Qwen3.8 verification
      ansible.builtin.import_role:
        name: qwen38
        tasks_from: verify
