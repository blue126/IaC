---
- name: Deploy Qwen3.6-27B as the daily runtime
  hosts: llm-server
  become: true
  gather_facts: true
  roles:
    - common
    - tailscale
    - role: qwen36
  tags: [deploy]

- name: Verify Qwen3.6-27B
  hosts: llm-server
  become: true
  gather_facts: false
  tasks:
    - name: Load read-only Qwen3.6 verification
      ansible.builtin.import_role:
        name: qwen36
        tasks_from: verify
      tags: [verify]
  tags: [never, verify]
