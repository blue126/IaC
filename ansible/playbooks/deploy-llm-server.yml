---
# Retired production entrypoint. Use deploy-deepseek-v4.yml.
- name: Reject the retired LLM Server deployment entrypoint
  hosts: llm-server
  gather_facts: false
  tasks:
    - name: Stop the retired deployment path safely
      ansible.builtin.fail:
        msg: >-
          This playbook is retired and cannot download or start legacy models.
          Use playbooks/deploy-deepseek-v4.yml with an explicitly approved gate.
