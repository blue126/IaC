---
- name: Deploy the worker connection to the shared HAPI Hub
  hosts: hapi_hub_clients
  become: true
  roles:
    - hapi-hub-client

- name: Verify the worker connection to the shared HAPI Hub
  hosts: hapi_hub_clients
  become: true
  gather_facts: false
  tags: [verify]
  tasks:
    - name: Verify the Hub client contracts
      ansible.builtin.include_role:
        name: hapi-hub-client
        tasks_from: verify
