---
- name: Deploy Proxmox Backup Server
  hosts: pbs
  become: true
  pre_tasks:
    - name: Verify connectivity
      ping:

  roles:
    - pbs

- name: Verify PBS Deployment
  hosts: pbs
  become: true
  tags: [verify]
  tasks:
    - name: Load verification fallbacks without overriding inventory
      ansible.builtin.include_vars:
        file: ../roles/pbs/defaults/main.yml
        name: pbs_verify_defaults

    - name: Wait for PBS web interface
      wait_for:
        port: 8007
        timeout: 60

    - name: Check PBS API endpoint
      uri:
        url: "https://{{ ansible_host }}:8007/api2/json/version"
        validate_certs: no
        status_code: [200, 401]
      register: pbs_api

    - name: Check PBS service status
      service_facts:

    - name: Assert PBS service is running
      assert:
        that:
          - "'proxmox-backup.service' in ansible_facts.services"
          - "ansible_facts.services['proxmox-backup.service'].state == 'running'"
        fail_msg: "PBS service is not running"

    - name: Check ZFS pool health
      command: "zpool list -H -o health {{ pbs_zfs_pool_name | default(pbs_verify_defaults.pbs_zfs_pool_name) }}"
      register: zpool_status
      changed_when: false

    - name: Assert ZFS pool is ONLINE
      assert:
        that:
          - zpool_status.stdout | trim == 'ONLINE'
        fail_msg: "ZFS pool is not healthy"

    - name: Check PBS datastore status
      command: proxmox-backup-manager datastore list --output-format json
      register: ds_list
      changed_when: false

    - name: Verify the configured datastore and path
      ansible.builtin.assert:
        that:
          - pbs_matching_datastores | length == 1
          - pbs_matching_datastores[0].path == (pbs_zfs_mount_point | default(pbs_verify_defaults.pbs_zfs_mount_point))
      vars:
        pbs_matching_datastores: >-
          {{ ds_list.stdout | from_json
             | selectattr('name', 'equalto', pbs_datastore_name | default(pbs_verify_defaults.pbs_datastore_name))
             | list }}

    - name: Show deployment summary
      debug:
        msg:
          - "PBS API: {{ 'accessible' if pbs_api.status in [200, 401] else 'unreachable' }}"
          - "ZFS Pool: {{ 'ONLINE' if 'ONLINE' in zpool_status.stdout else 'PROBLEM' }}"
          - "Datastores: {{ ds_list.stdout_lines }}"
