---
- name: Deploy the independent HAPI test workspace services
  hosts: hapi_workspaces
  become: true
  roles:
    - hapi-workspace

- name: Verify the independent HAPI test workspace services
  hosts: hapi_workspaces
  become: true
  gather_facts: false
  tags: [verify]
  tasks:
    - name: Verify the independent workspace service boundaries
      ansible.builtin.include_role:
        name: hapi-workspace
        tasks_from: verify
