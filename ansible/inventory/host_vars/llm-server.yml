---
# LLM appliance host configuration
ansible_host: 192.168.1.247

# Publish the stable OpenAI-compatible API only to the trusted home LAN.
# Docker bridge access remains necessary for Open WebUI via host.docker.internal.
deepseek_v4_ik_api_bind_address: 0.0.0.0
deepseek_v4_ik_api_allowed_cidrs:
  - 127.0.0.0/8
  - 172.17.0.0/16
  - 172.18.0.0/16
  - 192.168.1.0/24

# Best measured prefill setting: permit pinned host allocations for H2D.
deepseek_v4_ik_disable_pinned_memory: false
deepseek_v4_ik_batch_size: 4096
deepseek_v4_ik_ubatch_size: 2048
deepseek_v4_ik_context_length: 131072
deepseek_v4_ik_cpu_threads: 32
# Controlled prefill experiment baseline.  Each subsequent adjustment is
# deployed and benchmarked independently before progressing to the next one.
deepseek_v4_ik_numa_mode: distribute
deepseek_v4_ik_batch_threads: 36

# Verified VM kernel/NVIDIA bundle. Platform recovery validates that every
# version is already installed before it changes holds, GRUB, or reboots.
deepseek_v4_ik_platform_target_kernel: 6.8.0-101-generic
deepseek_v4_ik_platform_kernel_package_version: 6.8.0-101.101
deepseek_v4_ik_platform_nvidia_package_version: 590.48.01-0ubuntu0.24.04.1
deepseek_v4_ik_platform_nvidia_module_version: 590.48.01
deepseek_v4_ik_platform_tracking_packages:
  - linux-virtual
  - linux-image-virtual
  - linux-headers-virtual
  - linux-headers-generic
  - linux-modules-nvidia-590-open-generic

# DeepSeek V4 controlled release pins, captured for the approved G2 rollout.
deepseek_v4_model_repository: deepseek-ai/DeepSeek-V4-Flash-0731
deepseek_v4_model_revision: 7872f01b1d1fe23eabc4c98b48bffcef5a386062
deepseek_v4_model_file_manifest: []
deepseek_v4_runtime_image_repository: approachingai/ktransformers
deepseek_v4_runtime_image_digest: sha256:5e8f614b5f80ca9d281719a81d65f7dd153d9755696053a7487cd6b90558d1d8
deepseek_v4_runtime_commit: f5ee50d4cfa29f5f3e8f2af5a2fd90771c574c58
deepseek_v4_runtime_entrypoint: /usr/local/bin/entrypoint-dsv4
deepseek_v4_runtime_arguments:
  # SM86 Marlin CUDA-graph JIT repeatedly exits its child process on this host.
  # Keep TP2 and both GPUs enabled while avoiding that unstable capture path.
  - --disable-cuda-graph
  - --reasoning-parser
  - deepseek-v4
  - --tool-call-parser
  - deepseekv4
  - --served-model-name
  - deepseek-v4-flash
deepseek_v4_reasoning_parser: deepseek-v4
deepseek_v4_tool_parser: deepseekv4
deepseek_v4_webui_image_repository: ghcr.io/open-webui/open-webui
deepseek_v4_webui_image_digest: sha256:2b9d2bec40ff30eb71216065f5244c2861d30b75b4e49c40e39973ee64218cde
deepseek_v4_cache_precision: MXFP4
deepseek_v4_release_id: deepseek-v4-flash-0731-7872f01b-5e8f614b
deepseek_v4_release_created_at: '2026-08-13T14:24:00Z'
deepseek_v4_source_revision: 90ddf8062d7e3593ffeec5612b47b36a34c7c77d
deepseek_v4_webui_seed_api_key: "{{ vault_deepseek_v4_webui_seed_api_key }}"
# TP2 remains the required serving profile while we fix long-stream stability.
deepseek_v4_profile: tp2
# Measured TP2 tuning candidate: the CPU-resident MoE path regresses with
# larger worker pools and with GPU expert placement on this PCIe topology.
deepseek_v4_gpu_experts: 0
deepseek_v4_cpu_infer_threads: 16
# Current pinned model/runtime cannot initialize the EAGLE NextN head; retain
# the measured stable TP2 decode configuration and its full KV-pool capacity.
deepseek_v4_memory_fraction: 0.90
deepseek_v4_mtp_enabled: false

# These are the only legacy units the approved lifecycle gate may stop and disable.
deepseek_v4_legacy_units:
  - llama-server@m25.service
  - llama-server@qwen3-vl-32b.service
  - llama-server@glm-4.7.service
