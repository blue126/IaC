# Anki sync server
anki_sync_server_port: 8080

# ldoce5-api data files — set to the actual filenames present under /opt/anki/dict/
ldoce5_mdx_filename: "Longman Dictionary Of Contemporary English 5th.mdx"   # TODO: replace with actual filename
ldoce5_mdd_filename: "Longman Dictionary Of Contemporary English 5th.mdd"   # TODO: replace with actual filename, or remove if absent

# anki-writer sync credentials
anki_writer_sync_user: anki
# anki_writer_sync_password comes from vault_anki_writer_sync_password

# Public Anki Writer reverse proxy
anki_writer_public_domain: ankiwriter.willfan.me
anki_writer_proxy_upstream: 127.0.0.1:5051
caddy_binary_path: /usr/bin/caddy

# unified-proxy
repo_url: "https://github.com/blue126/unified-proxy.git"
repo_version: "main"
proxy_domain: "proxy.willfan.me"   # TODO: set to your public domain, e.g. proxy.yourdomain.com
# vault_proxy_api_key and vault_auth_json must be added to vault

# OCI Hub browser administration through the existing HTTPS reverse proxy.
oci_hub_portal_external_url: https://wgportal.remotecc.net
# The site's read-only Portal metrics route (/ga2-metrics); absent from the Vault, the route stays off.
oci_hub_portal_metrics_password_hash: "{{ vault_oci_hub_portal_metrics_password_hash | default('') }}"
# OCI Hub Portal secrets (AD-31); BWS keeps the recovery copy, so rotate both together.
oci_hub_portal_admin_password: "{{ vault_oci_hub_portal_admin_password }}"
oci_hub_portal_api_token: "{{ vault_oci_hub_portal_api_token }}"
oci_hub_portal_session_secret: "{{ vault_oci_hub_portal_session_secret }}"
oci_hub_portal_csrf_secret: "{{ vault_oci_hub_portal_csrf_secret }}"

# Public BookOrbit library; credentials come from the bookorbit role's Vault aliases.
bookorbit_public_domain: bookorbit.willfan.me
