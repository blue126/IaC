---
# The border router (iStoreOS 24.10.8, OpenWrt-derived). Deliberately excluded
# from site.yml -- see the two reasons below.
#
# 1. No Python interpreter. opkg has a python3 package but it is not installed,
#    and installing anything here needs explicit authorization. Any
#    Python-backed role (common, tailscale) would fail on this host; roles
#    targeting it must use ansible.builtin.raw exclusively.
# 2. It routes WAN traffic. Changes to its DNS, firewall, routing, or installed
#    packages require explicit prior authorization, so it must never be swept
#    up by a broad play. `hosts: all` matches every inventory host regardless
#    of groups.yml, so site.yml excludes this group by name.
#
# remote_user is root directly over SSH key auth; no become.
#
# Note: the `bare_metal` group previously also held `llm-workstation`
# (192.168.1.191). That host and everything deployed to it moved to the
# separate `llm-ops` repo and is no longer managed from here.
network_appliance:
  hosts:
    gateway:
      ansible_host: 192.168.1.1
      ansible_user: root
