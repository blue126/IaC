---
bare_metal:
  hosts:
    llm-workstation:
      ansible_host: 192.168.1.191
      ansible_user: will
    # OpenWrt-derived router (iStoreOS 24.10.8). No Python interpreter and
    # none is installed without explicit authorization -- the
    # open-webui-gateway role uses ansible.builtin.raw exclusively for this
    # reason. remote_user is root directly over SSH key auth, no become.
    gateway:
      ansible_host: 192.168.1.1
      ansible_user: root
