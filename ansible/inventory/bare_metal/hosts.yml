---
# Hosts that Terraform does not manage, so the dynamic inventory plugin never
# produces them. Split into two groups on purpose: `bare_metal` is a normally
# managed Linux host, `network_appliance` is not.
bare_metal:
  hosts:
    llm-workstation:
      ansible_host: 192.168.1.191
      ansible_user: will

# The border router (iStoreOS 24.10.8, OpenWrt-derived). Deliberately NOT in
# `bare_metal`, and excluded from site.yml -- see the two reasons below.
#
# 1. No Python interpreter. opkg has a python3 package but it is not installed,
#    and installing anything here needs explicit authorization. The
#    open-webui-gateway role therefore uses ansible.builtin.raw exclusively;
#    any Python-backed role (common, tailscale) would fail on this host.
# 2. It routes WAN traffic. Changes to its DNS, firewall, routing, or installed
#    packages require explicit prior authorization, so it must never be swept
#    up by a broad play. `hosts: all` matches every inventory host regardless
#    of groups.yml, so site.yml excludes this group by name.
#
# remote_user is root directly over SSH key auth; no become.
network_appliance:
  hosts:
    gateway:
      ansible_host: 192.168.1.1
      ansible_user: root
