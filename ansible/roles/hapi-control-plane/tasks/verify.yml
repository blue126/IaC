---
- name: Verify the private identity endpoint and publication gate
  ansible.builtin.command:
    argv:
      - curl
      - --fail
      - --silent
      - --unix-socket
      - /run/hapi-control-plane/auth.sock
      - --header
      - "Host: {{ hapi_control_plane_origin | regex_replace('^https://', '') }}"
      - http://localhost/health
  changed_when: false
  register: hapi_control_plane_health
  failed_when: hapi_control_plane_health.rc != 0 or (hapi_control_plane_health.stdout | from_json).public_ready

- name: Verify anonymous access is rejected by the private proxy
  ansible.builtin.uri:
    url: http://127.0.0.1:8080/
    headers:
      Host: "{{ hapi_control_plane_origin | regex_replace('^https://', '') }}"
    status_code: 403
    follow_redirects: none

- name: Verify the proxy listens only on loopback
  ansible.builtin.command: ss -H -lnt
  changed_when: false
  register: hapi_control_plane_listeners
  failed_when: >-
    hapi_control_plane_listeners.rc != 0 or
    '127.0.0.1:8080' not in hapi_control_plane_listeners.stdout or
    (hapi_control_plane_listeners.stdout is search('(?:0\.0\.0\.0|\*|\[::\]):8080'))
