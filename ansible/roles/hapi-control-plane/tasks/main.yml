---
- name: Inspect the dedicated certificate lifecycle ownership marker
  ansible.builtin.stat:
    path: /var/lib/hapi-pki-agent/managed.json
    follow: false
  register: hapi_control_plane_pki_managed

- name: Restrict the control plane to VM500 and explicitly authorized publication
  ansible.builtin.assert:
    that:
      - hapi_control_plane_vmid | int == 500
      - not hapi_control_plane_public_entry | bool or hapi_control_plane_migration_authorized | bool
      - ansible_facts.system == 'Linux'
      - hapi_control_plane_origin is match('^https://[a-z0-9.-]+$')
      - hapi_control_plane_issuer is match('^https://[a-z0-9-]+\.cloudflareaccess\.com$')
      - hapi_control_plane_audience is match('^[a-f0-9]{64}$')
    fail_msg: Publication requires an explicitly approved migration and validated identity and transport bindings.

- name: Install explicitly approved prototype dependencies
  ansible.builtin.apt:
    name: [nginx-core, python3, python3-cryptography, novnc]
    state: present
    policy_rc_d: 101
  when: hapi_control_plane_install_dependencies | bool

- name: Check the preinstalled verification runtime
  ansible.builtin.command: /usr/bin/python3 -c 'import cryptography'
  changed_when: false

- name: Check the preinstalled proxy modules
  ansible.builtin.command: /usr/sbin/nginx -V
  changed_when: false
  register: hapi_control_plane_nginx
  failed_when: "'--with-http_auth_request_module' not in hapi_control_plane_nginx.stderr"

- name: Create the dedicated proxy group
  ansible.builtin.group:
    name: hapi-proxy
    system: true

- name: Create isolated control plane service users
  ansible.builtin.user:
    name: "{{ item }}"
    group: hapi-proxy
    system: true
    create_home: false
    shell: /usr/sbin/nologin
  loop: [hapi-auth, hapi-proxy]

- name: Create the dedicated control plane configuration directory
  ansible.builtin.file:
    path: /etc/hapi-control-plane
    state: directory
    owner: root
    group: hapi-proxy
    mode: '0750'

- name: Create the authentication-only credential directory
  ansible.builtin.file:
    path: /etc/hapi-control-plane/tokens
    state: directory
    owner: hapi-auth
    group: hapi-proxy
    mode: '0700'

- name: Validate the supplied transport identities
  ansible.builtin.assert:
    that:
      - hapi_control_plane_ca | length > 0
      - hapi_control_plane_crl | length > 0
      - hapi_control_plane_client_certificate | length > 0
      - hapi_control_plane_client_key | length > 0
  no_log: true

- name: Validate the supplied transport identities and workspace secrets
  ansible.builtin.assert:
    that:
      - hapi_control_plane_ca | length > 0
      - hapi_control_plane_crl | length > 0
      - hapi_control_plane_client_certificate | length > 0
      - hapi_control_plane_client_key | length > 0
      - item.workspace_id is match('^[a-z][a-z0-9-]{0,31}$')
      - hapi_control_plane_tokens[item.workspace_id] is match('^[A-Za-z0-9_-]{32,}$')
  loop: "{{ hapi_control_plane_routes }}"
  no_log: true

- name: Deploy the private transport identity files
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "/etc/hapi-control-plane/{{ item.name }}"
    owner: root
    group: hapi-proxy
    mode: '0440'
  loop:
    - {name: ca.pem, content: '{{ hapi_control_plane_ca }}'}
    - {name: crl.pem, content: '{{ hapi_control_plane_crl }}'}
    - {name: client.pem, content: '{{ hapi_control_plane_client_certificate }}'}
    - {name: client.key, content: '{{ hapi_control_plane_client_key }}'}
  no_log: true
  diff: false
  notify: Reload HAPI control proxy

  when: not hapi_control_plane_pki_managed.stat.exists

- name: Deploy the supplied workspace API tokens without exposing them
  ansible.builtin.copy:
    content: "{{ hapi_control_plane_tokens[item.workspace_id] }}\n"
    dest: "/etc/hapi-control-plane/tokens/{{ item.workspace_id }}"
    owner: hapi-auth
    group: hapi-proxy
    mode: '0400'
  loop: "{{ hapi_control_plane_routes }}"
  no_log: true
  diff: false

- name: Install the isolated authorization service
  ansible.builtin.copy:
    src: '{{ item }}.py'
    dest: '/usr/local/lib/{{ item }}.py'
    owner: root
    group: root
    mode: '0755'
  loop: [hapi-auth, hapi-stream-guard]
  notify: Restart HAPI control authentication

- name: Bind authentication restarts only to trust anchor changes
  ansible.builtin.copy:
    dest: /etc/hapi-control-plane/trust.json
    owner: root
    group: hapi-proxy
    mode: '0640'
    content: >-
      {{ {'issuer': hapi_control_plane_issuer, 'audience': hapi_control_plane_audience,
          'origin': hapi_control_plane_origin} | to_nice_json }}
  notify: Restart HAPI control authentication

- name: Deploy the private route snapshot
  ansible.builtin.template:
    src: config.json.j2
    dest: /etc/hapi-control-plane/config.json
    validate: /usr/bin/python3 /usr/local/lib/hapi-auth.py --config %s --check
    owner: root
    group: hapi-proxy
    mode: '0640'
  diff: false

- name: Validate the identity and route snapshot before proxy configuration
  ansible.builtin.command: /usr/bin/python3 /usr/local/lib/hapi-auth.py --config /etc/hapi-control-plane/config.json --check
  changed_when: false

- name: Install the centralized personal login page assets
  ansible.builtin.copy:
    src: hapi-login-portal/
    dest: /usr/local/lib/hapi-login-portal/
    owner: root
    group: root
    mode: '0644'
    directory_mode: '0755'

- name: Require the centralized noVNC client runtime
  ansible.builtin.stat:
    path: /usr/share/novnc/core/rfb.js
  register: hapi_control_plane_novnc
  failed_when: not hapi_control_plane_novnc.stat.exists

- name: Deploy the internal authorization fragment
  ansible.builtin.template:
    src: authorize.inc.j2
    dest: /etc/hapi-control-plane/authorize.inc
    owner: root
    group: hapi-proxy
    mode: '0640'
  notify: Reload HAPI control proxy

- name: Deploy the isolated Nginx configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/hapi-control-plane/nginx.conf
    owner: root
    group: hapi-proxy
    mode: '0640'
  notify: Reload HAPI control proxy

- name: Deploy the independent control plane units
  ansible.builtin.template:
    src: '{{ item }}.service.j2'
    dest: '/etc/systemd/system/hapi-control-{{ item }}.service'
    owner: root
    group: root
    mode: '0644'
  loop: [auth, proxy]
  notify: "Restart HAPI control {{ item }}"

- name: Apply prototype service changes
  ansible.builtin.meta: flush_handlers

- name: Enable the private prototype services
  ansible.builtin.systemd_service:
    name: 'hapi-control-{{ item }}'
    enabled: true
    state: started
    daemon_reload: true
  loop: [auth, proxy]
