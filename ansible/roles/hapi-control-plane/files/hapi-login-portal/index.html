<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="workspace-identity" content="{{workspace}}">
  <title>Claude 登录 · 我的工作区</title>
  <link rel="stylesheet" href="/_workspace/login/guide.css">
  <script type="module" src="/_workspace/login/guide.js"></script>
</head>
<body>
  <main>
    <header><span class="eyebrow">我的工作区</span><h1>登录 Claude</h1>
      <p>在下方远程浏览器中完成 Claude 官方授权，登录凭据保存在你的 VM。</p></header>
    <section class="card" aria-labelledby="status-title">
      <h2 id="status-title">正在检查登录状态…</h2>
      <p id="status" role="status" aria-live="polite">请稍候。</p>
      <div class="actions">
        <button id="start" hidden>开始 Claude 授权</button>
        <button id="cancel" class="secondary" hidden>取消本次授权</button>
        <a id="return" class="button" href="{{hapi_url}}" hidden>进入 HAPI</a>
      </div>
      <p id="error" role="alert" hidden></p>
    </section>
    <section id="viewer-section" class="card" hidden aria-labelledby="viewer-title">
      <div class="viewer-heading"><h2 id="viewer-title">VM 内的官方授权页面</h2>
        <button id="fullscreen" class="secondary">全屏画面</button></div>
      <p id="viewer-status" role="status">正在连接远程浏览器…</p>
      <div id="screen" aria-label="本人 VM 远程 Firefox"></div>
      <details><summary>需要粘贴文本到远程浏览器？</summary>
        <p>先在远程画面中选中目标输入框，再粘贴下方文本。文本仅用于远程粘贴，发送后清空输入框。</p>
        <textarea id="clipboard" rows="2" autocomplete="off" spellcheck="false" aria-label="粘贴到远程浏览器的文本"></textarea>
        <button id="paste" class="secondary">粘贴到远程输入框</button>
      </details>
    </section>
    <section id="code-section" class="card" hidden aria-labelledby="code-title">
      <h2 id="code-title">官方页面显示了授权码？</h2>
      <p>只有页面要求复制授权码时才需要填写；正常自动完成时可以忽略。</p>
      <form id="code-form"><label for="code">授权码</label>
        <input id="code" type="password" maxlength="4096" autocomplete="off" spellcheck="false">
        <button type="submit">提交授权码</button></form>
      <p id="code-result" role="status"></p>
    </section>
    <footer>日常使用直接进入 HAPI；只有首次登录或重新授权时需要本页。取消授权不会删除 Firefox 配置。</footer>
  </main>
</body>
</html>
