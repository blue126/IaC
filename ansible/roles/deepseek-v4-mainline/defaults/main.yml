---
# Compose file and systemd unit always live here, independent of which runtime
# build is selected below.
deepseek_v4_mainline_install_dir: /opt/deepseek-v4-mainline
# Which built runtime to run. Every entry is a build whose binary SHA-256 was
# recorded at build time; the role asserts the selected triple matches one of
# them exactly, so an unverified binary can never be deployed.
#   mainline  - ggml-org upstream, the promoted default
#   moe-cache - leloch/llama.cpp @ moe-cache-v2-pr, adds --moe-cache. Branches
#               from upstream 15586e2d, an ancestor of the mainline pin with
#               153 commits in between, so it is A/B material, not a pin bump.
deepseek_v4_mainline_runtime_variants:
  mainline:
    root: /opt/deepseek-v4-mainline
    commit: 10bf611e533d81f739128304991c5e133c6aebd8
    binary_sha256: >-
      2e63f6a8aa2508d129aaef1d59769754e2ae37558b9eec3dbe8d0307ea4d7074
  moe-cache:
    root: /opt/deepseek-v4-moe-cache
    commit: e3096b046bb809f7f80bc47801f6579aed1cbc60
    binary_sha256: >-
      b3ff859472b5f760a1688355dfe09e833a79a6c2b3d49abd6d642b2032918503
deepseek_v4_mainline_runtime_variant: mainline
# Indexed directly rather than through an intermediate dict variable: a folded
# scalar holding a whole mapping comes back as its string form, and .root then
# silently yields nothing.
deepseek_v4_mainline_runtime_root: >-
  {{ deepseek_v4_mainline_runtime_variants[
     deepseek_v4_mainline_runtime_variant]['root'] }}
deepseek_v4_mainline_source_dir: >-
  {{ deepseek_v4_mainline_runtime_root }}/src
deepseek_v4_mainline_build_dir: "{{ deepseek_v4_mainline_source_dir }}/build"
deepseek_v4_mainline_binary_path: >-
  {{ deepseek_v4_mainline_build_dir }}/bin/llama-server
deepseek_v4_mainline_commit: >-
  {{ deepseek_v4_mainline_runtime_variants[
     deepseek_v4_mainline_runtime_variant]['commit'] }}
deepseek_v4_mainline_binary_sha256: >-
  {{ deepseek_v4_mainline_runtime_variants[
     deepseek_v4_mainline_runtime_variant]['binary_sha256'] }}
# Explicit drafter device. Empty lets the runtime place it, which mainline does
# well (10.2 GiB on CUDA0, 0.2 on CUDA1). The moe-cache fork predates the
# shared-draft device fixes and instead tries to put the whole 10.4 GiB drafter
# on CUDA1, which OOMs once the main model is resident, so that variant needs
# this set explicitly.
deepseek_v4_mainline_draft_device: ""
# MoE expert cache, only available on the moe-cache variant. Empty omits the
# flag. Values: auto | on | off | 0 | N (MiB of VRAM per device).
deepseek_v4_mainline_moe_cache: ""
# Weight repacking. Empty leaves the binary default. 'on' or 'off' render
# --repack / --no-repack, needed to separate the cost of disabling repacking
# from the benefit of the cache itself.
deepseek_v4_mainline_repack: ""
deepseek_v4_mainline_runtime_image: >-
  approachingai/ktransformers@sha256:5e8f614b5f80ca9d281719a81d65f7dd153d9755696053a7487cd6b90558d1d8

deepseek_v4_mainline_model_dir: /data/models/DeepSeek-V4-Flash-0731-GGUF
# Hashing 138GB costs about 7 minutes per run, which dominates a parameter-only
# redeploy, so size is the default gate and the pinned digests are opt-in.
# Turn this back on whenever the model files themselves change or are re-synced.
deepseek_v4_mainline_verify_model_checksums: false
deepseek_v4_mainline_model_files:
  - path: UD-Q3_K_M/DeepSeek-V4-Flash-0731-UD-Q3_K_M-00001-of-00004.gguf
    size: 5257664
    sha256: 36e02d6d87c9fbfe0dd4e8fd0d03cef2aa2c509248802a9d1772159112db3734
  - path: UD-Q3_K_M/DeepSeek-V4-Flash-0731-UD-Q3_K_M-00002-of-00004.gguf
    size: 49222528448
    sha256: b210930a3dc8ad13b55f6a0eb79b58abb0752ac446cb53aebcdc744c6834a7ad
  - path: UD-Q3_K_M/DeepSeek-V4-Flash-0731-UD-Q3_K_M-00003-of-00004.gguf
    size: 49533038144
    sha256: ac71bc6fd30c0af3eb702cea5bc94be570b9fed4857d63bf7180ec668683612c
  - path: UD-Q3_K_M/DeepSeek-V4-Flash-0731-UD-Q3_K_M-00004-of-00004.gguf
    size: 29317659776
    sha256: 28b764750db8c4539df530292cd5950c6d161d81b20673b736ff4f8ca4ffa7ae
  - path: dspark-DeepSeek-V4-Flash-0731-Q8_0.gguf
    size: 10896057440
    sha256: 2c7ac54b0b64a99df1f139a9f1371a00198265e1d6a614b77597d20a655a4249
deepseek_v4_mainline_model_path: >-
  /models/UD-Q3_K_M/DeepSeek-V4-Flash-0731-UD-Q3_K_M-00001-of-00004.gguf
deepseek_v4_mainline_draft_model_path: >-
  /models/dspark-DeepSeek-V4-Flash-0731-Q8_0.gguf

deepseek_v4_mainline_compose_project: deepseek-v4-mainline
deepseek_v4_mainline_service_unit: deepseek-v4-mainline.service
deepseek_v4_mainline_ik_service_unit: deepseek-v4-ik.service
deepseek_v4_mainline_compat_service_unit: deepseek-v4-ik-compat.service
deepseek_v4_mainline_backend_port: 8082
deepseek_v4_mainline_stable_port: 8081
deepseek_v4_mainline_model_name: deepseek-v4-flash
# Speculative implementations, comma separated. Draftless implementations run
# ahead of the draft model. 'ngram-mod,draft-dspark' was measured and rejected:
# it costs 14.7% at 1K and 18.4% at 8K on the corpus, with no overlap between
# the sample sets at 8K. The lookup and fallback path is not free when the
# output does not repeat the context, so the miss case is a real regression
# rather than the expected no-op. Do not enable it without a workload whose
# output quotes its input heavily enough to pay that back.
deepseek_v4_mainline_spec_types: draft-dspark
# Only rendered when ngram-mod is in the type list above.
deepseek_v4_mainline_ngram_mod_n_match: 24
deepseek_v4_mainline_ngram_mod_n_min: 48
deepseek_v4_mainline_ngram_mod_n_max: 64
# DSpark draft length. Mean accepted length is capped at n_max + 1, so this is
# the only knob that can raise it. 2 is the measured optimum: mean len goes
# 1.83 -> 2.3 -> 2.6 for n_max 1 -> 2 -> 3, but decode goes 8.94 -> 9.46 -> 8.15
# because the third draft token costs another drafter forward pass while its
# acceptance falls to 0.53. 1 was the old default and only looked right while
# the NUMA placement was broken and per-layer overhead was different.
deepseek_v4_mainline_spec_draft_n_max: 2
# --override-tensor rules, joined with commas and rendered ahead of --cpu-moe
# because the loader takes the first matching override and stops. Each rule must
# target the device that already owns those layers under --split-mode layer
# (blk.0-21 on CUDA0, blk.22-42 plus output on CUDA1), otherwise every token
# pays a cross-device hop and there is no P2P between these two cards.
# Keep one rule per list entry: a folded scalar would inject a space after the
# comma and the following pattern would silently never match.
# Costs 7968 MiB of CUDA1. Empty restores all-CPU MoE.
# A second rule putting blk.0 on CUDA0 was measured and rolled back: it left
# only 1866 MiB of CUDA0 headroom and widened the 8K decode spread from 0.26 to
# 1.46 tok/s over six cold samples without improving the median.
deepseek_v4_mainline_tensor_overrides:
  - 'blk\.(40|41|42)\.ffn_(down|gate|up)_exps=CUDA1'
# Optional -lv threshold (0 generic, 3 info, 4 trace, 5 debug). Empty keeps the
# binary default of 3. Raise to 5 for one run when you need the per-device model
# / KV / compute buffer sizes and the layer-to-device assignment, which the
# library only logs at trace and debug; do not leave it on, it logs per request.
deepseek_v4_mainline_log_verbosity: ""
# Decode-side thread count on a 36-core host. Fewer threads win because decode
# is latency bound, not throughput bound: measured host bandwidth is ~80 GB/s
# interleaved while decode only draws ~22 GB/s, and per-layer GPU/CPU handoff
# plus threadpool sync dominates the 2.6 ms each layer costs. Coordinating more
# threads over that little work costs more than it returns: 32 beat 36, 16 beat
# 32, and 8 ties 16.
deepseek_v4_mainline_threads: 16
# Memory policy for the server process. --no-mmap loads the 105 GiB of expert
# weights through cudaHostAlloc, whose pages follow first touch, so they landed
# 74/26 across the two NUMA nodes and left one memory controller carrying most
# of the decode traffic. Interleaving spreads them evenly. Empty runs the binary
# directly. numactl ships in the pinned runtime image at /usr/bin/numactl.
deepseek_v4_mainline_numactl_policy: --interleave=all
# kernel.numa_balancing on the inference host. llama.cpp warns about it at every
# start: automatic page migration moves pages out from under a long-lived
# threadpool and costs TLB shootdowns. Empty leaves the host setting untouched.
deepseek_v4_mainline_numa_balancing: "0"
deepseek_v4_mainline_start_retries: 120
deepseek_v4_mainline_start_delay_seconds: 8
deepseek_v4_mainline_chat_prompt: Reply with exactly OK.
