---
- name: Require an explicitly approved native workspace attachment
  ansible.builtin.assert:
    that:
      - oci_hub_mosh_attach_authorized | bool
      - employee_workspace_profile == 'oci-hub'
      - oci_hub_workspace_devices | length > 0
      - oci_hub_mosh_network_timeout | type_debug == 'int'
      - oci_hub_mosh_network_timeout >= 60
      - oci_hub_mosh_network_timeout <= 2592000
      - >-
        oci_hub_spoke_device_addresses | sort ==
        oci_hub_workspace_devices | map(attribute='address') | map('regex_replace', '$', '/32') | sort

- name: Validate existing SSH authorization ownership and the new roster
  ansible.builtin.include_role:
    name: employee-workspace
    tasks_from: authorization-preflight

- name: Install Mosh and WireGuard only with explicit package authorization
  ansible.builtin.apt:
    name: [mosh, wireguard-tools]
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: oci_hub_mosh_install_authorized | bool

- name: Check preinstalled native Mosh and WireGuard runtimes
  ansible.builtin.command:
    argv: [which, /usr/bin/mosh-server, wg, wg-quick, python3, sshd]
  changed_when: false

- name: Configure only the independent VM WireGuard Spoke
  ansible.builtin.include_role:
    name: oci-hub-spoke
    tasks_from: vpn

- name: Configure the independent employee account and its native device keys
  ansible.builtin.include_tasks: native-account.yml

- name: Install the overlay-bound native Mosh launcher
  ansible.builtin.template:
    src: workspace-mosh.j2
    dest: /usr/local/bin/workspace-mosh
    owner: root
    group: root
    mode: '0755'

- name: Give the workspace a UTF-8 native locale for mosh-server
  ansible.builtin.include_role:
    name: employee-workspace
    tasks_from: locale

- name: Read the current native Mosh SSH drop-in
  ansible.builtin.slurp:
    src: /etc/ssh/sshd_config.d/10-mosh.conf
  register: oci_hub_mosh_sshd_previous
  failed_when: false

- name: Configure the system mosh-server timeout for the employee account
  block:
    - name: Deploy the native Mosh SSH drop-in
      ansible.builtin.template:
        src: sshd-mosh.conf.j2
        dest: /etc/ssh/sshd_config.d/10-mosh.conf
        owner: root
        group: root
        mode: '0644'
      notify: Reload native Mosh SSH
    - name: Validate the complete SSH configuration with the drop-in
      ansible.builtin.command: sshd -t
      changed_when: false
  rescue:
    - name: Restore the previous native Mosh SSH drop-in
      ansible.builtin.copy:
        content: "{{ oci_hub_mosh_sshd_previous.content | b64decode }}"
        dest: /etc/ssh/sshd_config.d/10-mosh.conf
        owner: root
        group: root
        mode: '0644'
      when: oci_hub_mosh_sshd_previous.content is defined
    - name: Remove the rejected native Mosh SSH drop-in
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d/10-mosh.conf
        state: absent
      when: oci_hub_mosh_sshd_previous.content is not defined
    - name: Stop after the Mosh drop-in could not be applied
      ansible.builtin.fail:
        msg: >-
          "{{ ansible_failed_task.name }}" failed for /etc/ssh/sshd_config.d/10-mosh.conf
          ({{ ansible_failed_result.stderr | default(ansible_failed_result.msg | default('')) }});
          the drop-in was rolled back to its previous state

- name: Read the effective SSH settings for the employee account
  ansible.builtin.command:
    argv: [sshd, -T, -C, 'user=employee,host=localhost,addr=127.0.0.1']
  register: oci_hub_mosh_sshd_effective
  changed_when: false

- name: Require the system mosh-server timeout in employee SSH sessions
  ansible.builtin.assert:
    that:
      - >-
        ('setenv MOSH_SERVER_NETWORK_TMOUT=' ~ oci_hub_mosh_network_timeout)
        in oci_hub_mosh_sshd_effective.stdout_lines
      - "'acceptenv LANG' in oci_hub_mosh_sshd_effective.stdout_lines"
      - "'acceptenv LC_*' in oci_hub_mosh_sshd_effective.stdout_lines"
  when: not ansible_check_mode
