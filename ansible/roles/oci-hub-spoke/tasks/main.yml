---
- name: Validate approved VM Spoke identity
  ansible.builtin.assert:
    that:
      - employee_workspace_profile == 'oci-hub'
      - oci_hub_spoke_address is match('^[0-9.]+/32$')
      - oci_hub_spoke_device_addresses | length > 0
      - oci_hub_spoke_private_key | length == 44
      - oci_hub_spoke_hub_public_key | length == 44
      - oci_hub_spoke_endpoint is match('^[0-9.]+:51825$')
  no_log: true

- name: Check preinstalled WireGuard runtime
  ansible.builtin.command: which wg-quick
  changed_when: false

- name: Create protected WireGuard directory
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Deploy only this VM WireGuard identity
  ansible.builtin.template:
    src: wg-workspace.conf.j2
    dest: /etc/wireguard/wg-workspace.conf
    owner: root
    group: root
    mode: '0600'
  no_log: true
  notify: Restart OCI Hub Spoke

- name: Enable VM-owned Spoke interface
  ansible.builtin.systemd_service:
    name: wg-quick@wg-workspace
    state: started
    enabled: true

- name: Apply changed Spoke peers and routes before verification
  ansible.builtin.meta: flush_handlers

- name: Validate approved preinstalled native desktop baseline
  ansible.builtin.command:
    argv: [which, nginx, Xvnc, workspace-login, workspace-browser]
  changed_when: false

- name: Verify raw KasmVNC backend binds only to loopback
  ansible.builtin.command: ss -H -ltn
  register: oci_hub_desktop_listeners
  changed_when: false

- name: Require fixed KasmVNC backend and protected presentation inputs
  ansible.builtin.assert:
    that:
      - oci_hub_desktop_backend_type == 'kasmvnc'
      - "'127.0.0.1:8444' in oci_hub_desktop_listeners.stdout"
      - "'0.0.0.0:8444' not in oci_hub_desktop_listeners.stdout"
      - "'[::]:8444' not in oci_hub_desktop_listeners.stdout"
      - oci_hub_desktop_listeners.stdout_lines | select('search', ':8444\\s') | reject('search', '127\\.0\\.0\\.1:8444\\s') | list | length == 0
      - oci_hub_desktop_backend_basic is match('^[A-Za-z0-9+/]+={0,2}$')
  no_log: true

- name: Create protected local presentation directory
  ansible.builtin.file:
    path: /etc/oci-hub
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Deploy this VM leaf TLS identity and verified upstream CA
  ansible.builtin.copy:
    content: '{{ item.content }}'
    dest: '/etc/oci-hub/{{ item.name }}'
    owner: root
    group: root
    mode: '0600'
  loop:
    - {name: desktop.crt, content: '{{ oci_hub_desktop_certificate }}'}
    - {name: desktop.key, content: '{{ oci_hub_desktop_private_key }}'}
    - {name: backend-ca.crt, content: '{{ oci_hub_desktop_backend_ca }}'}
  no_log: true

- name: Deploy overlay-only TLS presentation
  ansible.builtin.template:
    src: desktop.conf.j2
    dest: /etc/nginx/conf.d/oci-hub-desktop.conf
    owner: root
    group: root
    mode: '0600'
  no_log: true

- name: Validate nginx configuration before reload
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Reload local presentation after successful validation
  ansible.builtin.systemd_service:
    name: nginx
    state: reloaded

- name: Configure this profile browser viewer URL
  ansible.builtin.copy:
    dest: /etc/employee-workspace-browser.json
    owner: root
    group: root
    mode: '0644'
    content: "{{ {'bind_address': '127.0.0.1', 'viewer_url': 'https://' + oci_hub_spoke_address.split('/')[0] + ':8443/'} | to_nice_json }}"
