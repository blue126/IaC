---
- name: Check the Qwen3.8 systemd service state
  ansible.builtin.command:
    argv: [systemctl, is-active, "{{ qwen38_service_unit }}"]
  register: qwen38_verify_systemd
  changed_when: false

- name: Check the running Qwen3.8 Compose service
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-name
      - "{{ qwen38_compose_project }}"
      - --file
      - "{{ qwen38_install_dir }}/docker-compose.yml"
      - ps
      - --services
      - --status
      - running
  register: qwen38_verify_compose
  changed_when: false

- name: Read the served model identity
  ansible.builtin.uri:
    url: "http://{{ qwen38_bind_address }}:{{ qwen38_api_port }}/v1/models"
    status_code: 200
    return_content: true
  register: qwen38_verify_models

- name: Send a deterministic chat completion
  ansible.builtin.uri:
    url: "http://{{ qwen38_bind_address }}:{{ qwen38_api_port }}/v1/chat/completions"
    method: POST
    body_format: json
    body:
      model: "{{ qwen38_model_name }}"
      temperature: 0
      seed: 42
      max_tokens: 32
      # Qwen3.8 thinks by default and puts that in reasoning_content, leaving
      # content empty until it finishes; a short smoke probe would otherwise
      # spend its whole budget reasoning. Turning thinking off also asserts
      # the chat template still honours the switch, same as qwen36 does.
      chat_template_kwargs:
        enable_thinking: false
      messages:
        - role: user
          content: "{{ qwen38_chat_prompt }}"
    status_code: 200
    timeout: 300
    return_content: true
  register: qwen38_verify_chat

- name: Read the Qwen3.8 container restart count
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - --format
      - "{{ '{{.RestartCount}}' }}"
      - "{{ qwen38_compose_project }}-server-1"
  register: qwen38_verify_restart_count
  changed_when: false

# Aggregate per-card usage cannot show that THIS service occupies both cards:
# Qwen3-TTS shares GPU 1 and holds ~11 GB there on its own, which satisfies any
# "this card is busy" threshold even if Qwen3.8 had loaded entirely onto GPU 0.
# Attribute the memory to the container's own process instead.
- name: Read the Qwen3.8 container main process id
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - --format
      - "{{ '{{.State.Pid}}' }}"
      - "{{ qwen38_compose_project }}-server-1"
  register: qwen38_verify_pid
  changed_when: false

- name: Read per-process GPU memory after deployment
  ansible.builtin.command:
    argv:
      - nvidia-smi
      - --query-compute-apps=gpu_uuid,pid,used_memory
      - --format=csv,noheader,nounits
  register: qwen38_verify_compute_apps
  changed_when: false

# Lines are "<gpu_uuid>, <pid>, <used_memory>". Matching ", <pid>, " with both
# delimiters keeps a row whose memory figure happens to equal our pid from
# being picked up, since that value is line-final and has no trailing comma.
- name: Attribute GPU memory to the Qwen3.8 process
  ansible.builtin.set_fact:
    qwen38_verify_own_allocations: >-
      {{
        qwen38_verify_compute_apps.stdout_lines
        | select('search', ', ' ~ (qwen38_verify_pid.stdout | trim) ~ ', ')
        | list
      }}

- name: Display the GPU memory held by the Qwen3.8 process
  ansible.builtin.debug:
    var: qwen38_verify_own_allocations

- name: Validate the Qwen3.8 deployment
  ansible.builtin.assert:
    that:
      - qwen38_verify_systemd.stdout == 'active'
      - "'server' in qwen38_verify_compose.stdout_lines"
      - >-
        qwen38_verify_models.json.data | map(attribute='id') | list
        is search(qwen38_model_name)
      - qwen38_verify_chat.json.choices | length > 0
      - >-
        qwen38_verify_chat.json.choices[0].message.content
        | default('') | trim | length > 0
      - qwen38_verify_chat.json.choices[0].finish_reason == 'stop'
      - qwen38_verify_restart_count.stdout | int == 0
      # Weights are split across both cards, so this process must hold a
      # context on two distinct GPUs, each carrying a model-sized allocation.
      - >-
        qwen38_verify_own_allocations
        | map('regex_replace', '^([^,]+),.*$', '\1')
        | unique | list | length == 2
      - >-
        qwen38_verify_own_allocations
        | map('regex_replace', '^.*, ', '') | map('int')
        | select('gt', 4096) | list | length == 2
    fail_msg: Qwen3.8 read-only verification failed
