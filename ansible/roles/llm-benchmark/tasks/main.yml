---
# LLM Benchmark — main task orchestrator

- name: Validate benchmark sampling controls
  ansible.builtin.assert:
    that:
      - llm_benchmark_repeat_samples | int > 0
    fail_msg: "llm_benchmark_repeat_samples must be greater than zero."

- name: Include short prompt benchmark
  ansible.builtin.include_tasks: short-prompt.yml

- name: Include long prompt benchmark
  ansible.builtin.include_tasks: long-prompt.yml

- name: Include resource snapshot
  ansible.builtin.include_tasks: resources.yml

- name: Include benchmark report
  ansible.builtin.include_tasks: report.yml
