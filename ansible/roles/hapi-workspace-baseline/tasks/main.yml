---
- name: Require an independent workspace and approved baseline installation
  ansible.builtin.assert:
    that:
      - hapi_workspace_vmid | int > 502
      - hapi_workspace_baseline_install_dependencies | bool
      - hapi_workspace_baseline_claude_binary_url is match('^https://downloads\.claude\.ai/claude-code-releases/[0-9.]+/linux-x64/claude$')
      - hapi_workspace_baseline_claude_sha256 is match('^[a-f0-9]{64}$')
      - ansible_facts.system == 'Linux'
      - ansible_facts.architecture == 'x86_64'
    fail_msg: Approve the baseline package scope and exact Claude artifact before deployment.

- name: Install the approved package verification prerequisites
  ansible.builtin.apt:
    name: [ca-certificates, gnupg, sudo]
    state: present
    update_cache: true
    cache_valid_time: 3600
    policy_rc_d: 101

- name: Create the independent application account with sudo
  ansible.builtin.user:
    name: employee
    shell: /bin/bash
    groups: sudo
    append: true
    create_home: true
    password_lock: true

- name: Permit dependency administration inside the employee VM
  ansible.builtin.copy:
    dest: /etc/sudoers.d/hapi-employee
    owner: root
    group: root
    mode: '0440'
    content: 'employee ALL=(ALL) NOPASSWD: ALL'
    validate: /usr/sbin/visudo -cf %s

- name: Create the package signing directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Download the official Mozilla signing key
  ansible.builtin.get_url:
    url: https://packages.mozilla.org/apt/repo-signing-key.gpg
    dest: /etc/apt/keyrings/hapi-mozilla.candidate.asc
    owner: root
    group: root
    mode: '0644'

- name: Inspect the Mozilla key fingerprint
  ansible.builtin.command:
    argv: [gpg, --batch, --show-keys, --with-colons, /etc/apt/keyrings/hapi-mozilla.candidate.asc]
  register: hapi_workspace_baseline_mozilla_key
  changed_when: false

- name: Require the pinned Mozilla signing fingerprint
  ansible.builtin.assert:
    that: "'fpr:::::::::35BAA0B33E9EB396F59CA838C0BA5CE6DC6315A3:' in hapi_workspace_baseline_mozilla_key.stdout"

- name: Publish only the validated Mozilla signing key
  ansible.builtin.copy:
    src: /etc/apt/keyrings/hapi-mozilla.candidate.asc
    dest: /etc/apt/keyrings/hapi-mozilla.asc
    remote_src: true
    owner: root
    group: root
    mode: '0644'

- name: Configure the signed native Firefox repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/hapi-mozilla.sources
    owner: root
    group: root
    mode: '0644'
    content: |
      Types: deb
      URIs: https://packages.mozilla.org/apt
      Suites: mozilla
      Components: main
      Signed-By: /etc/apt/keyrings/hapi-mozilla.asc

- name: Prefer the native Mozilla Firefox package
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/hapi-mozilla
    owner: root
    group: root
    mode: '0644'
    content: |
      Package: firefox firefox-l10n-*
      Pin: origin packages.mozilla.org
      Pin-Priority: 1000

- name: Install the approved native browser and fonts
  ansible.builtin.apt:
    name: [firefox, fonts-dejavu-core, fonts-noto-cjk]
    state: present
    update_cache: true
    policy_rc_d: 101

- name: Install the approved checksum-pinned Claude executable
  ansible.builtin.get_url:
    url: '{{ hapi_workspace_baseline_claude_binary_url }}'
    checksum: 'sha256:{{ hapi_workspace_baseline_claude_sha256 }}'
    dest: /usr/local/bin/claude
    owner: root
    group: root
    mode: '0755'

- name: Verify the application baseline without starting authorization
  ansible.builtin.include_tasks: verify.yml
