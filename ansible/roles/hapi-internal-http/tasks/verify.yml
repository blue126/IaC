---
- name: Require the approved HTTP trust model
  ansible.builtin.assert:
    that: hapi_internal_http_authorized | bool

- name: Verify the shared Hub loopback or worker compatibility endpoint
  ansible.builtin.uri:
    url: http://127.0.0.1:3006/health
    status_code: 200
    use_proxy: false

- name: Verify the live private Hub endpoint from the registered worker
  ansible.builtin.uri:
    url: 'http://{{ hapi_hub_client_address }}:9443/health'
    headers:
      Host: hapi-hub.internal
      X-Hapi-Expected-Namespace: forged-namespace
    status_code: 200
    use_proxy: false
  when: not hapi_http_is_control | bool

- name: Verify the live worker login endpoints from VM500
  ansible.builtin.uri:
    url: 'http://{{ item.backend_address }}:9443/api/login/status'
    headers:
      Host: '{{ item.backend_name }}'
      Origin: '{{ hapi_control_plane_origin }}'
    status_code: 200
    use_proxy: false
  loop: '{{ hapi_control_plane_routes }}'
  when: hapi_http_is_control | bool
  no_log: true

- name: Reject an unregistered control source even with a forged worker header
  ansible.builtin.uri:
    url: 'http://{{ hapi_shared_hub_bind_address }}:9443/health'
    headers:
      Host: hapi-hub.internal
      X-Forwarded-For: '{{ hapi_shared_hub_agents[0].address }}'
      X-Hapi-Expected-Namespace: '{{ hapi_shared_hub_agents[0].namespace }}'
    status_code: 403
    use_proxy: false
  when: hapi_http_is_control | bool

- name: Require Cloudflare identity on the public proxy loopback
  ansible.builtin.uri:
    url: http://127.0.0.1:8080/
    headers:
      Host: '{{ hapi_control_plane_origin | regex_replace("^https://", "") }}'
    status_code: 403
    use_proxy: false
  when: hapi_http_is_control | bool

- name: Require the same live Hub or Runner process after transport changes
  ansible.builtin.command:
    argv: [systemctl, show, --property=MainPID, --value, '{{ hapi_http_business_unit }}.service']
  changed_when: false
  register: hapi_http_business_pid_after
  failed_when: >-
    hapi_http_business_pid_after.stdout | int <= 0 or
    (hapi_http_business_pid_before is defined and
     hapi_http_business_pid_after.stdout != hapi_http_business_pid_before.stdout)

- name: Record successful live HTTP verification for this run
  ansible.builtin.set_fact:
    hapi_http_verified: true
