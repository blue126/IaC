---
- name: Require the explicitly approved existing-host HTTP cutover
  ansible.builtin.assert:
    that:
      - hapi_internal_http_authorized | bool
      - groups.get('hapi_http_boundary', []) | length == 1
      - groups.get('hapi_control_plane', []) | length == 1
      - hostvars[groups['hapi_http_boundary'][0]].hapi_http_boundary_verified | default(false) | bool
      - ansible_facts.system == 'Linux'
      - (hapi_http_is_control and hapi_control_plane_vmid | int == 500) or (not hapi_http_is_control and hapi_ingress_vmid | int == 502)
      - not hapi_http_is_control or hapi_control_plane_shared_hub | bool
      - hapi_http_is_control or hapi_ingress_control_address is match('^(10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.)[0-9.]+$')
      - hapi_http_is_control or hapi_ingress_control_address != hapi_ingress_backend_address

- name: Restrict the shared Hub listener to the same private control endpoint
  ansible.builtin.assert:
    that:
      - hapi_shared_hub_bind_address is match('^(10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.)[0-9.]+$')
      - hapi_shared_hub_origin == hapi_control_plane_origin
  when: hapi_http_is_control | bool

- name: Restrict the worker proxy to its registered private allocation
  ansible.builtin.assert:
    that:
      - hapi_ingress_backend_address is match('^(10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.)[0-9.]+$')
      - hapi_hub_client_address == hostvars[groups['hapi_control_plane'][0]].hapi_shared_hub_bind_address
      - hapi_ingress_control_address == hostvars[groups['hapi_control_plane'][0]].hapi_shared_hub_bind_address
      - hapi_ingress_origin == hostvars[groups['hapi_control_plane'][0]].hapi_control_plane_origin
      - hapi_ingress_web_sha256 is match('^[a-f0-9]{64}$')
      - hapi_ingress_id is match('^[a-z][a-z0-9-]{0,31}$')
      - >-
        hostvars[groups['hapi_control_plane'][0]].hapi_control_plane_routes |
        selectattr('backend_name', 'equalto', hapi_ingress_id + '.hapi.internal') |
        map(attribute='backend_address') | list == [hapi_ingress_backend_address]
  when: not hapi_http_is_control | bool

- name: Inspect existing HAPI services
  ansible.builtin.service_facts:

- name: Require running proxy services before preparing a cutover
  ansible.builtin.assert:
    that: ansible_facts.services.get(item.unit + '.service', {}).get('state') == 'running'
  loop: '{{ hapi_http_configs }}'

- name: Require the existing business service identity
  ansible.builtin.assert:
    that: hapi_http_business_unit is match('^[a-z][a-z0-9-]{0,63}$')

- name: Capture the running Hub or Runner PID without restarting it
  ansible.builtin.command:
    argv: [systemctl, show, --property=MainPID, --value, '{{ hapi_http_business_unit }}.service']
  changed_when: false
  register: hapi_http_business_pid_before
  failed_when: hapi_http_business_pid_before.stdout | int <= 0

- name: Create the root-only cutover checkpoint
  ansible.builtin.file:
    path: /var/lib/hapi-internal-http
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Inspect the fixed rollback inputs without following links
  ansible.builtin.stat:
    path: '{{ item }}'
    follow: false
  loop: '{{ hapi_http_snapshot_paths }}'
  register: hapi_http_original_files

- name: Require regular checkpoint inputs
  ansible.builtin.assert:
    that: not item.stat.exists or item.stat.isreg | default(false)
  loop: '{{ hapi_http_original_files.results }}'
  loop_control:
    label: '{{ item.item }}'

- name: Save original configuration and retired unit files once
  ansible.builtin.command:
    argv: >-
      {{ ['/usr/bin/tar', '-czf', '/var/lib/hapi-internal-http/rollback.tar.gz', '--'] +
         (hapi_http_original_files.results | selectattr('stat.exists') | map(attribute='item') | list) }}
    creates: /var/lib/hapi-internal-http/rollback.tar.gz

- name: Restrict checkpoint permissions
  ansible.builtin.file:
    path: /var/lib/hapi-internal-http/rollback.tar.gz
    owner: root
    group: root
    mode: '0600'

- name: Read original certificate unit enablement
  ansible.builtin.command:
    argv: [systemctl, is-enabled, '{{ item }}']
  loop: '{{ hapi_http_retired_units }}'
  changed_when: false
  failed_when: false
  register: hapi_http_original_unit_states

- name: Preserve original enablement for an explicit rollback
  ansible.builtin.copy:
    content: '{{ hapi_http_original_unit_states.results | to_nice_json }}'
    dest: /var/lib/hapi-internal-http/original-units.json
    owner: root
    group: root
    mode: '0600'
    force: false

- name: Pause the existing certificate timer before changing transport
  ansible.builtin.systemd_service:
    name: hapi-pki-controller.timer
    state: stopped
    enabled: false
  when: >-
    hapi_http_original_files.results | selectattr('item', 'equalto', '/etc/systemd/system/hapi-pki-controller.timer') |
    selectattr('stat.exists') | list | length > 0

- name: Wait for any already running signing transaction to finish
  ansible.builtin.command:
    argv: [systemctl, is-active, hapi-pki-controller.service]
  changed_when: false
  failed_when: false
  register: hapi_http_signer_state
  until: hapi_http_signer_state.stdout not in ['active', 'activating', 'deactivating']
  retries: 20
  delay: 1

- name: Check the deployed Hub credential and source bindings
  ansible.builtin.command: /usr/bin/python3 /usr/local/lib/hapi-hub-config.py bindings /etc/hapi-shared-hub
  changed_when: false
  no_log: true
  when: hapi_http_is_control | bool

- name: Read the registered worker sources
  ansible.builtin.slurp:
    src: /etc/hapi-shared-hub/agents.json
  register: hapi_http_live_agents
  when: hapi_http_is_control | bool
  no_log: true

- name: Require the same worker allocation during protocol migration
  ansible.builtin.assert:
    that: (hapi_http_live_agents.content | b64decode | from_json).agents == hapi_shared_hub_agents
  when: hapi_http_is_control | bool
  no_log: true

- name: Read the existing Cloudflare and workspace allocation
  ansible.builtin.slurp:
    src: /etc/hapi-control-plane/config.json
  register: hapi_http_live_control
  no_log: true
  when: hapi_http_is_control | bool

- name: Preserve the existing public identity and workspace allocation
  ansible.builtin.assert:
    that:
      - (hapi_http_live_control.content | b64decode | from_json).origin == hapi_control_plane_origin
      - (hapi_http_live_control.content | b64decode | from_json).issuer == hapi_control_plane_issuer
      - (hapi_http_live_control.content | b64decode | from_json).audience == hapi_control_plane_audience
      - (hapi_http_live_control.content | b64decode | from_json).routes == hapi_control_plane_routes
      - (hapi_http_live_control.content | b64decode | from_json).shared_hub
  no_log: true
  when: hapi_http_is_control | bool

- name: Stage the existing identity service with internal HTTP support
  ansible.builtin.copy:
    src: '{{ role_path }}/../hapi-control-plane/files/hapi-auth.py'
    dest: /var/lib/hapi-internal-http/hapi-auth.py.candidate
    owner: root
    group: root
    mode: '0700'
  when: hapi_http_is_control | bool

- name: Stage and validate the same identity allocation without certificate fields
  ansible.builtin.template:
    src: '{{ role_path }}/../hapi-control-plane/templates/config.json.j2'
    dest: /var/lib/hapi-internal-http/control-config.candidate
    owner: root
    group: root
    mode: '0600'
    validate: /usr/bin/python3 /var/lib/hapi-internal-http/hapi-auth.py.candidate --config %s --check
  when: hapi_http_is_control | bool

- name: Render and validate all private HTTP proxy candidates
  ansible.builtin.template:
    src: '{{ role_path }}/../{{ item.role }}/templates/nginx.conf.j2'
    dest: '/var/lib/hapi-internal-http/{{ item.directory }}.candidate'
    owner: root
    group: root
    mode: '0600'
    validate: /usr/sbin/nginx -t -c %s
  loop: '{{ hapi_http_configs }}'

- name: Publish validated candidates before the coordinated reload
  ansible.builtin.copy:
    src: '/var/lib/hapi-internal-http/{{ item.directory }}.candidate'
    remote_src: true
    dest: '/etc/{{ item.directory }}/nginx.conf'
    owner: root
    group: '{{ item.group }}'
    mode: '0640'
  loop: '{{ hapi_http_configs }}'
  register: hapi_http_published
  notify: Reload validated HAPI HTTP proxy masters


- name: Publish the existing identity service with internal HTTP support
  ansible.builtin.copy:
    src: /var/lib/hapi-internal-http/hapi-auth.py.candidate
    remote_src: true
    dest: /usr/local/lib/hapi-auth.py
    owner: root
    group: root
    mode: '0755'
  when: hapi_http_is_control | bool
  notify: Restart cutover HAPI identity service

- name: Publish the unchanged identity allocation without certificate fields
  ansible.builtin.copy:
    src: /var/lib/hapi-internal-http/control-config.candidate
    remote_src: true
    dest: /etc/hapi-control-plane/config.json
    owner: root
    group: hapi-proxy
    mode: '0640'
  when: hapi_http_is_control | bool
  notify: Restart cutover HAPI identity service
