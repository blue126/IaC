---
- name: Require explicit rollback authorization
  ansible.builtin.assert:
    that: hapi_internal_http_rollback_authorized | default(false) | bool

- name: Inspect the original root-only checkpoint
  ansible.builtin.stat:
    path: /var/lib/hapi-internal-http/rollback.tar.gz
    follow: false
  register: hapi_http_checkpoint
  failed_when: >-
    not hapi_http_checkpoint.stat.exists or not hapi_http_checkpoint.stat.isreg or
    hapi_http_checkpoint.stat.uid != 0 or hapi_http_checkpoint.stat.mode != '0600'

- name: List checkpoint members before root extraction
  ansible.builtin.command:
    argv: [/usr/bin/tar, -tzf, /var/lib/hapi-internal-http/rollback.tar.gz]
  changed_when: false
  register: hapi_http_checkpoint_members

- name: Restrict checkpoint extraction to the fixed HAPI file set
  ansible.builtin.assert:
    that:
      - hapi_http_checkpoint_members.stdout_lines | length > 0
      - >-
        hapi_http_checkpoint_members.stdout_lines |
        difference(hapi_http_snapshot_paths | map('regex_replace', '^/', '') | list) | length == 0

- name: Restore only the original HAPI configuration and unit archive
  ansible.builtin.unarchive:
    src: /var/lib/hapi-internal-http/rollback.tar.gz
    remote_src: true
    dest: /

- name: Validate restored proxy configurations
  ansible.builtin.command:
    argv: [/usr/sbin/nginx, -t, -c, '/etc/{{ item.directory }}/nginx.conf']
  loop: '{{ hapi_http_configs }}'
  changed_when: false

- name: Reload restored proxy masters
  ansible.builtin.command:
    argv: [systemctl, kill, --kill-who=main, --signal=HUP, '{{ item.unit }}.service']
  loop: '{{ hapi_http_configs }}'
  changed_when: true

- name: Restore the original identity service process after restoring its code
  ansible.builtin.systemd_service:
    name: hapi-control-auth
    state: restarted
  when: hapi_http_is_control | bool

- name: Read original certificate unit enablement
  ansible.builtin.slurp:
    src: /var/lib/hapi-internal-http/original-units.json
  register: hapi_http_enablement

- name: Restore previously enabled certificate checks
  ansible.builtin.systemd_service:
    name: '{{ item.item }}'
    enabled: true
    state: started
    daemon_reload: true
  loop: '{{ hapi_http_enablement.content | b64decode | from_json }}'
  when: item.stdout == 'enabled'

- name: Remove the HTTP activation marker after an explicit rollback
  ansible.builtin.file:
    path: /var/lib/hapi-internal-http/active.json
    state: absent
