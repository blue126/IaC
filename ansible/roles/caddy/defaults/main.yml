---
caddy_version: "2.8.4"
caddy_user: caddy
caddy_group: caddy
caddy_config_dir: /etc/caddy
caddy_data_dir: /var/lib/caddy
caddy_log_dir: /var/log/caddy
caddy_webdav_root: /var/www/webdav
caddy_webdav_port: 8080
caddy_domain: localhost
caddy_reverse_proxies: []

# Existing-install reverse proxy configuration
caddy_binary_path: /usr/sbin/caddy
caddy_service_name: caddy
caddy_base_config_path: /etc/caddy/Caddyfile
caddy_managed_config_path: /etc/caddy/managed.Caddyfile
caddy_site_config_dir: /etc/caddy/conf.d
caddy_systemd_override_dir: /etc/systemd/system/caddy.service.d
caddy_reverse_proxy_name: ""
caddy_reverse_proxy_domain: ""
caddy_reverse_proxy_upstream: ""
# Cloudflare API token for DNS challenge (vault indirect reference)
cloudflare_api_token: "{{ vault_cloudflare_api_token }}"
# WebDAV basic auth password, hashed for Caddy (vault indirect reference).
# A fixed per-host salt keeps the hash, and so the Caddyfile, stable across runs;
# without it every run re-renders the Caddyfile and reloads Caddy. The salt is
# not derived from the password; its last character must be one of ".Oeu".
caddy_webdav_password_salt: "{{ (('caddy-webdav-' ~ inventory_hostname) | hash('sha256'))[:21] }}e"
caddy_webdav_password_hash: "{{ vault_caddy_webdav_password | password_hash('blowfish', salt=caddy_webdav_password_salt) }}"
