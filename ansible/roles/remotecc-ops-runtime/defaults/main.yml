remotecc_ops_hugo_version: "0.169.0"
remotecc_ops_hugo_sha256: c41672a0725d307758a132bc94a962e59760eb33f9ba08c991b81f9881d6fa7d

# Runtime layout on the executor VM.
remotecc_ops_git_root: /srv/git
remotecc_ops_remotecc_root: /srv/remotecc
remotecc_ops_iac_root: /srv/iac

# Bare repositories pushed from the administrator's machine and the
# work tree each one checks out on push.
remotecc_ops_repositories:
  - name: remotecc
    work_tree: /srv/remotecc
    branch: main
    # A push is refused while wsctl runs, so it cannot swap its code mid-run.
    run_lock: /run/wsctl.lock
  - name: iac
    work_tree: /srv/iac
    branch: main
