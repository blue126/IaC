---
- name: Install executor base packages
  ansible.builtin.apt:
    # wireguard-tools: workspace onboarding derives WireGuard public keys with wg.
    name: [git, python3, python3-venv, unzip, jq, rsync, wireguard-tools]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create versioned tool directories
  ansible.builtin.file:
    path: "/usr/local/lib/ws-executor/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "terraform-{{ remotecc_ops_terraform_version }}"
    - "uv-{{ remotecc_ops_uv_version }}"
    - "bws-{{ remotecc_ops_bws_version }}"
    - "hugo-{{ remotecc_ops_hugo_version }}"

# Each archive is verified against its pinned checksum before it is unpacked.
- name: Download pinned tool archives
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "/usr/local/lib/ws-executor/{{ item.archive }}"
    checksum: "sha256:{{ item.sha256 }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - url: "https://releases.hashicorp.com/terraform/{{ remotecc_ops_terraform_version }}/terraform_{{ remotecc_ops_terraform_version }}_linux_amd64.zip"
      archive: "terraform-{{ remotecc_ops_terraform_version }}.zip"
      sha256: "{{ remotecc_ops_terraform_sha256 }}"
    - url: "https://github.com/astral-sh/uv/releases/download/{{ remotecc_ops_uv_version }}/uv-x86_64-unknown-linux-gnu.tar.gz"
      archive: "uv-{{ remotecc_ops_uv_version }}.tar.gz"
      sha256: "{{ remotecc_ops_uv_sha256 }}"
    - url: "https://github.com/bitwarden/sdk-sm/releases/download/bws-v{{ remotecc_ops_bws_version }}/bws-x86_64-unknown-linux-gnu-{{ remotecc_ops_bws_version }}.zip"
      archive: "bws-{{ remotecc_ops_bws_version }}.zip"
      sha256: "{{ remotecc_ops_bws_sha256 }}"
    - url: "https://github.com/gohugoio/hugo/releases/download/v{{ remotecc_ops_hugo_version }}/hugo_extended_{{ remotecc_ops_hugo_version }}_linux-amd64.tar.gz"
      archive: "hugo-{{ remotecc_ops_hugo_version }}.tar.gz"
      sha256: "{{ remotecc_ops_hugo_sha256 }}"

- name: Unpack pinned tools
  ansible.builtin.unarchive:
    src: "/usr/local/lib/ws-executor/{{ item.archive }}"
    dest: "/usr/local/lib/ws-executor/{{ item.dir }}"
    remote_src: true
    extra_opts: "{{ item.extra_opts }}"
    creates: "/usr/local/lib/ws-executor/{{ item.dir }}/{{ item.binary }}"
  # A check run does not create the directory of a newly pinned version.
  ignore_errors: "{{ ansible_check_mode }}"
  loop:
    - {archive: "terraform-{{ remotecc_ops_terraform_version }}.zip", dir: "terraform-{{ remotecc_ops_terraform_version }}", binary: terraform, extra_opts: []}
    - {archive: "uv-{{ remotecc_ops_uv_version }}.tar.gz", dir: "uv-{{ remotecc_ops_uv_version }}", binary: uv, extra_opts: [--strip-components=1]}
    - {archive: "bws-{{ remotecc_ops_bws_version }}.zip", dir: "bws-{{ remotecc_ops_bws_version }}", binary: bws, extra_opts: []}
    - {archive: "hugo-{{ remotecc_ops_hugo_version }}.tar.gz", dir: "hugo-{{ remotecc_ops_hugo_version }}", binary: hugo, extra_opts: []}

- name: Link pinned tools onto PATH
  ansible.builtin.file:
    src: "/usr/local/lib/ws-executor/{{ item.dir }}/{{ item.binary }}"
    dest: "/usr/local/bin/{{ item.binary }}"
    state: link
    force: true
  loop:
    - {dir: "terraform-{{ remotecc_ops_terraform_version }}", binary: terraform}
    - {dir: "uv-{{ remotecc_ops_uv_version }}", binary: uv}
    - {dir: "bws-{{ remotecc_ops_bws_version }}", binary: bws}
    - {dir: "hugo-{{ remotecc_ops_hugo_version }}", binary: hugo}

# A host deployed before the rename keeps its work tree and history by moving them.
- name: Move the former source tree and bare repository to their new names
  ansible.builtin.command:
    argv: [mv, "{{ item.from }}", "{{ item.to }}"]
    creates: "{{ item.to }}"
    removes: "{{ item.from }}"
  loop:
    - {from: "{{ remotecc_ops_remotecc_root }}/employee-admin", to: "{{ remotecc_ops_remotecc_root }}/wsctl"}
    - {from: "{{ remotecc_ops_git_root }}/employee-admin.git", to: "{{ remotecc_ops_git_root }}/wsctl.git"}

- name: Create runtime directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ remotecc_ops_git_root }}", mode: "0700"}
    - {path: "{{ remotecc_ops_remotecc_root }}", mode: "0700"}
    - {path: "{{ remotecc_ops_remotecc_root }}/employee-data", mode: "0700"}
    - {path: "{{ remotecc_ops_iac_root }}", mode: "0700"}
    - {path: "{{ remotecc_ops_remotecc_root }}/wsctl", mode: "0700"}

# The ledger and past requests store absolute paths under the former directory name.
- name: Keep the former source path working
  ansible.builtin.file:
    path: "{{ remotecc_ops_remotecc_root }}/employee-admin"
    src: wsctl
    state: link
    owner: root
    group: root

- name: Create bare repositories for pushed code
  ansible.builtin.command:
    argv: [git, init, --bare, --initial-branch=main, "{{ remotecc_ops_git_root }}/{{ item.name }}.git"]
    creates: "{{ remotecc_ops_git_root }}/{{ item.name }}.git/HEAD"
  loop: "{{ remotecc_ops_repositories }}"

- name: Deploy post-receive checkout hooks
  ansible.builtin.template:
    src: post-receive.j2
    dest: "{{ remotecc_ops_git_root }}/{{ item.name }}.git/hooks/post-receive"
    owner: root
    group: root
    mode: "0700"
  loop: "{{ remotecc_ops_repositories }}"

- name: Deploy pre-receive run-lock hooks
  ansible.builtin.template:
    src: pre-receive.j2
    dest: "{{ remotecc_ops_git_root }}/{{ item.name }}.git/hooks/pre-receive"
    owner: root
    group: root
    mode: "0700"
  loop: "{{ remotecc_ops_repositories | selectattr('run_lock', 'defined') }}"

# The per-component bare repositories stay as history; a push there is refused, not silently dropped.
- name: Remove checkout hooks of the former repositories
  ansible.builtin.file:
    path: "{{ remotecc_ops_git_root }}/{{ item }}.git/hooks/post-receive"
    state: absent
  loop: [wsctl, apply-site]

- name: Refuse pushes to the former repositories
  ansible.builtin.copy:
    dest: "{{ remotecc_ops_git_root }}/{{ item }}.git/hooks/pre-receive"
    content: |
      #!/bin/bash
      echo "{{ item }}.git is retired; push to {{ remotecc_ops_git_root }}/remotecc.git" >&2
      exit 1
    owner: root
    group: root
    mode: "0700"
  loop: [wsctl, apply-site]

- name: Check whether the IaC checkout has been pushed
  ansible.builtin.stat:
    path: "{{ remotecc_ops_iac_root }}/scripts/setup-dev-env.sh"
  register: remotecc_ops_iac_setup

# The IaC toolchain (.venv and Ansible collections) is built once the first
# push has checked the repository out; re-run after requirements change.
- name: Build the IaC toolchain
  ansible.builtin.command:
    argv: ["{{ remotecc_ops_iac_root }}/scripts/setup-dev-env.sh"]
    chdir: "{{ remotecc_ops_iac_root }}"
    creates: "{{ remotecc_ops_iac_root }}/.venv/bin/ansible-playbook"
  environment:
    PATH: "/usr/local/bin:{{ ansible_env.PATH }}"
  when: remotecc_ops_iac_setup.stat.exists
