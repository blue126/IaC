---
deepseek_v4_mainline_service_unit_ref: deepseek-v4-mainline.service

qwen36_install_dir: /opt/qwen36
# The runtime binary is shared with the DeepSeek deployment: same pinned
# llama.cpp build, same container image, so there is one binary to verify and
# one image to keep. This role never writes into that directory.
qwen36_runtime_bin_dir: /opt/deepseek-v4-mainline/src/build/bin
qwen36_runtime_image: >-
  approachingai/ktransformers@sha256:5e8f614b5f80ca9d281719a81d65f7dd153d9755696053a7487cd6b90558d1d8

qwen36_model_dir: /data/models/qwen36
qwen36_model_file: Qwen3.6-27B-Q5_K_M.gguf
# Third-party GGUF conversion, so the digest is pinned to an immutable hub
# revision and checked before the service is allowed to start.
qwen36_model_repo: unsloth/Qwen3.6-27B-MTP-GGUF
qwen36_model_revision: e61310b84ddc5e4b47b2422bf60f1a22342c36d0
qwen36_model_sha256: >-
  e85d114efc50b6df20b5707042f9092afed852a3c9958a478efec4bc79f148a7
qwen36_model_size: 19814392960

qwen36_compose_project: qwen36
qwen36_service_unit: qwen36.service
qwen36_compat_service_unit: deepseek-v4-ik-compat.service
# Same loopback backend port DeepSeek uses. The two runtimes are mutually
# exclusive, so whichever is running answers the existing stable API on 8081
# and Open WebUI needs no reconfiguration.
qwen36_backend_port: 8082
qwen36_stable_port: 8081
qwen36_model_name: qwen36

# Hermes Agent needs at least 64K and Qwen recommends keeping 128K for complex
# work. f16 KV is deliberate: llama.cpp warns that aggressive KV quantisation
# degrades tool calling, which is the whole point of this deployment.
qwen36_ctx_size: 131072
qwen36_cache_type: f16
qwen36_gpu_layers: 999
qwen36_split_mode: layer
# Native MTP head, so speculative decoding needs no separate drafter. Left off
# until measured on its own; set to draft-mtp to try it.
qwen36_spec_type: ""
qwen36_spec_draft_n_max: 2

qwen36_start_retries: 60
qwen36_start_delay_seconds: 5
qwen36_chat_prompt: Reply with exactly OK.
