---
- name: Validate the fixed Qwen3.6 deployment boundary
  ansible.builtin.assert:
    that:
      - >-
        qwen36_model_repo == 'unsloth/Qwen3.6-27B-MTP-GGUF'
      - >-
        qwen36_model_revision ==
        'e61310b84ddc5e4b47b2422bf60f1a22342c36d0'
      - >-
        qwen36_model_sha256 | trim ==
        'e85d114efc50b6df20b5707042f9092afed852a3c9958a478efec4bc79f148a7'
      - qwen36_backend_port | int == 8082
      - qwen36_stable_port | int == 8081
      - qwen36_cache_type == 'f16'
    fail_msg: >-
      Qwen3.6 model pin or fixed service boundary changed. The GGUF is a
      third-party conversion, so the digest is the only thing standing between
      a silent swap and production.

- name: Inspect the model artifact
  ansible.builtin.stat:
    path: "{{ qwen36_model_dir }}/{{ qwen36_model_file }}"
    checksum_algorithm: sha256
    get_checksum: true
  register: qwen36_model

- name: Require the model artifact to match its pin
  ansible.builtin.assert:
    that:
      - qwen36_model.stat.exists
      - qwen36_model.stat.size == qwen36_model_size
      - >-
        qwen36_model.stat.checksum | default('') ==
        qwen36_model_sha256 | trim
    fail_msg: >-
      Model mismatch at {{ qwen36_model_dir }}/{{ qwen36_model_file }}.
      Re-download from {{ qwen36_model_repo }} at revision
      {{ qwen36_model_revision }}.

- name: Require the shared runtime binary to exist
  ansible.builtin.stat:
    path: "{{ qwen36_runtime_bin_dir }}/llama-server"
  register: qwen36_binary

- name: Fail when the shared runtime binary is missing
  ansible.builtin.assert:
    that:
      - qwen36_binary.stat.exists
    fail_msg: >-
      Shared runtime binary missing at {{ qwen36_runtime_bin_dir }}. This role
      reuses the pinned llama.cpp build from the DeepSeek deployment; deploy
      that first.

- name: Create the Qwen3.6 install directory
  ansible.builtin.file:
    path: "{{ qwen36_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy the Qwen3.6 Compose definition
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ qwen36_install_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Deploy the Qwen3.6 systemd owner
  ansible.builtin.template:
    src: qwen36.service.j2
    dest: "/etc/systemd/system/{{ qwen36_service_unit }}"
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Apply the Qwen3.6 systemd owner
  ansible.builtin.meta: flush_handlers

- name: Validate the Compose definition before switching runtimes
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-name
      - "{{ qwen36_compose_project }}"
      - --file
      - "{{ qwen36_install_dir }}/docker-compose.yml"
      - config
      - --quiet
  changed_when: false

- name: Take over the backend port from the DeepSeek runtime
  ansible.builtin.systemd:
    name: "{{ deepseek_v4_mainline_service_unit_ref }}"
    state: stopped
    enabled: false

- name: Wait for the backend port to be released
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ qwen36_backend_port }}"
    state: stopped
    timeout: 180

- name: Start and enable the Qwen3.6 runtime owner
  ansible.builtin.systemd:
    name: "{{ qwen36_service_unit }}"
    state: restarted
    enabled: true

- name: Wait for the Qwen3.6 backend
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ qwen36_backend_port }}/health"
    status_code: 200
    timeout: 2
  register: qwen36_backend_health
  until: qwen36_backend_health.status == 200
  retries: "{{ qwen36_start_retries }}"
  delay: "{{ qwen36_start_delay_seconds }}"

- name: Start the existing compatibility proxy
  ansible.builtin.systemd:
    name: "{{ qwen36_compat_service_unit }}"
    state: started
    enabled: true

- name: Verify the deployment
  ansible.builtin.include_tasks: verify.yml
