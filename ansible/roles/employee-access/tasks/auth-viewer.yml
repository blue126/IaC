---
- name: Validate fixed viewer mapping inputs
  ansible.builtin.include_tasks: validate-network.yml

- name: Install the private viewer proxy without starting a default web server
  ansible.builtin.apt:
    name: nginx-light
    state: present
    update_cache: true
    cache_valid_time: 3600
    policy_rc_d: 101

- name: Keep the package default web service disabled on the dedicated gateway
  ansible.builtin.systemd:
    name: nginx
    enabled: false
    state: stopped

- name: Install the private viewer service
  ansible.builtin.copy:
    dest: /etc/systemd/system/employee-auth-viewer.service
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=WireGuard fixed-employee authorization viewer
      After=wg-quick@wg-employee.service employee-firewall.service
      Requires=wg-quick@wg-employee.service employee-firewall.service
      [Service]
      User=www-data
      Group=www-data
      RuntimeDirectory=employee-auth-viewer
      ExecStart=/usr/sbin/nginx -c /etc/employee-auth-viewer.conf -g "daemon off;"
      Restart=on-failure
      NoNewPrivileges=true
      ProtectSystem=strict
      ProtectHome=true
      PrivateTmp=true
      [Install]
      WantedBy=multi-user.target

  register: employee_auth_viewer_unit

- name: Create the viewer runtime directory for first configuration validation
  ansible.builtin.file:
    path: /run/employee-auth-viewer
    state: directory
    owner: www-data
    group: www-data
    mode: '0750'

- name: Apply the narrow viewer firewall policy
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/employee-access.nft
    owner: root
    group: root
    mode: '0600'
    validate: /usr/sbin/nft --check --file %s

- name: Reconcile the actual viewer firewall before opening the entry
  ansible.builtin.systemd:
    name: employee-firewall
    state: reloaded

- name: Reconcile the private viewer device policy
  ansible.builtin.include_tasks: auth-viewer-policy.yml
