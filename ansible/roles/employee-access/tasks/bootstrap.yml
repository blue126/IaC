---
- name: Wait for first boot and reject operational cloud-init errors
  ansible.builtin.command: cloud-init status --wait --format=json
  register: employee_cloud_init_status
  changed_when: false
  failed_when: >-
    employee_cloud_init_status.rc not in [0, 2]
    or (employee_cloud_init_status.stdout | from_json).status != 'done'
    or ((employee_cloud_init_status.stdout | from_json).errors | length > 0)
    or (((employee_cloud_init_status.stdout | from_json).recoverable_errors.keys() | list | difference(['DEPRECATED'])) | length > 0)

- name: Validate network structure before first boot
  ansible.builtin.include_tasks: validate-network.yml
  vars:
    employee_access_action: boundary

- name: Require the intended management source and PVE host
  ansible.builtin.assert:
    that:
      - employee_access_pve_host in hostvars
      - employee_access_maintenance_sources | length > 0
      - employee_access_home_public_ipv4 | length > 0

- name: Install gateway network software before first employee boot
  ansible.builtin.apt:
    name: [nftables, openssh-server, openssh-client, python3]
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 600

- name: Establish PVE boundary before first employee boot
  ansible.builtin.include_tasks: pve.yml

- name: Establish controlled public egress without publishing employee identities
  ansible.builtin.include_tasks: gateway-network.yml

- name: Apply pending initial network handlers
  ansible.builtin.meta: flush_handlers
