---
- name: Keep disabled device identities revoked during ordinary deployment
  ansible.builtin.include_tasks: revoke.yml
  vars:
    employee_revoke_account: "{{ employee_device.key }}"
  when: not employee_device.value.enabled | bool or employee_access_networks[employee_device.value.employee].disabled | bool

- name: Publish only enabled device identities
  when: employee_device.value.enabled | bool and not employee_access_networks[employee_device.value.employee].disabled | bool
  block:
    - name: Write authoritative fixed device mapping
      ansible.builtin.copy:
        dest: "/etc/employee-access/devices/{{ employee_device.key }}.json"
        owner: root
        group: root
        mode: '0644'
        content: "{{ {'employee': employee_device.value.employee, 'host': employee_access_networks[employee_device.value.employee].ip, 'user': 'employee', 'enabled': (employee_device.value.enabled | bool and not employee_access_networks[employee_device.value.employee].disabled | bool)} | to_nice_json }}"
      register: employee_device_mapping

    - name: Reconcile device public key
      ansible.builtin.copy:
        dest: "/etc/employee-access/authorized-keys/{{ employee_device.key }}"
        owner: root
        group: root
        mode: '0644'
        content: "{{ ('restrict,pty ' + employee_device.value.ssh_public_key + '\n') if (employee_device.value.enabled | bool and not employee_access_networks[employee_device.value.employee].disabled | bool) else '' }}"
      register: employee_device_authorization

    - name: Terminate old sessions on mapping or authorization changes
      ansible.builtin.command:
        argv: [pkill, -KILL, -u, "{{ employee_device.key }}"]
      register: employee_device_kill
      changed_when: employee_device_kill.rc == 0
      failed_when: employee_device_kill.rc not in [0, 1]
      when: employee_device_mapping.changed or employee_device_authorization.changed

    - name: Install per-device system credential from Vault
      ansible.builtin.copy:
        dest: "/etc/employee-access/keys/{{ employee_device.key }}"
        owner: "{{ employee_device.key }}"
        group: root
        mode: '0400'
        content: "{{ employee_access_private_keys[employee_device.key] }}"
      no_log: true
