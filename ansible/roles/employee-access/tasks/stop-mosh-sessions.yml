---
- name: Validate the changed Mosh account identifier
  ansible.builtin.assert:
    that: employee_mosh_account is match('^[a-z][a-z0-9-]{0,27}$')

- name: Inspect the changed Mosh operating-system account
  ansible.builtin.getent:
    database: passwd
    key: "{{ employee_mosh_account }}"
    fail_key: false
  no_log: true

- name: Refuse to signal an unmanaged operating-system account
  ansible.builtin.assert:
    that: ansible_facts.getent_passwd.get(employee_mosh_account) is none or (ansible_facts.getent_passwd[employee_mosh_account][1] | int > 0 and ansible_facts.getent_passwd[employee_mosh_account][4] == '/var/empty/employee-access')

- name: Terminate only the changed account Mosh servers
  ansible.builtin.command:
    argv: [pkill, -TERM, -u, "{{ employee_mosh_account }}", -x, mosh-server]
  register: employee_mosh_kill
  changed_when: employee_mosh_kill.rc == 0
  failed_when: employee_mosh_kill.rc not in [0, 1]
  when: ansible_facts.getent_passwd.get(employee_mosh_account) is not none
