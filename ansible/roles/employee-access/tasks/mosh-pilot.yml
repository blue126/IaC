---
- name: Validate and select the Mosh device policies
  ansible.builtin.include_tasks: validate-mosh.yml

- name: Install the matching full firewall controller
  ansible.builtin.copy:
    src: employee-firewall.py
    dest: /usr/local/lib/employee-firewall.py
    owner: root
    group: root
    mode: '0755'

- name: Install Mosh on the managed gateway
  ansible.builtin.apt:
    name: mosh
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: employee_access_active_mosh_devices | length > 0

- name: Create restricted Mosh policy directory
  ansible.builtin.file:
    path: /etc/employee-access/mosh-devices
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install dispatcher with controlled Mosh startup
  ansible.builtin.copy:
    src: employee-dispatch.py
    dest: /usr/local/lib/employee-dispatch.py
    owner: root
    group: root
    mode: '0755'

- name: Publish restricted Mosh pilot policies
  ansible.builtin.copy:
    dest: "/etc/employee-access/mosh-devices/{{ item.key }}.json"
    owner: root
    group: root
    mode: '0644'
    content: "{{ {'address': employee_access_wireguard_address.split('/')[0], 'port_start': item.value.port_start, 'port_end': item.value.port_end, 'network_timeout': employee_access_mosh_network_timeout} | to_nice_json }}"
  notify: Stop changed Mosh policy sessions
  register: employee_access_mosh_policy_updates
  loop: "{{ employee_access_active_mosh_devices | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Find Mosh policies removed from the pilot roster
  ansible.builtin.find:
    paths: /etc/employee-access/mosh-devices
    patterns: '*.json'
  register: employee_access_saved_mosh_policies

- name: Stop sessions for devices removed from the effective Mosh list
  ansible.builtin.include_tasks: stop-mosh-sessions.yml
  vars:
    employee_mosh_account: "{{ employee_mosh_saved_policy.path | basename | regex_replace('\\.json$', '') }}"
  loop: "{{ employee_access_saved_mosh_policies.files }}"
  loop_control:
    loop_var: employee_mosh_saved_policy
    label: "{{ employee_mosh_saved_policy.path | basename }}"
  when: (employee_mosh_saved_policy.path | basename | regex_replace('\\.json$', '')) not in employee_access_active_mosh_devices

- name: Remove obsolete Mosh pilot policies
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ employee_access_saved_mosh_policies.files }}"
  when: (item.path | basename | regex_replace('\\.json$', '')) not in employee_access_active_mosh_devices
  loop_control:
    label: "{{ item.path | basename }}"

- name: Deploy Mosh-specific gateway firewall allowance
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/employee-access.nft
    owner: root
    group: root
    mode: '0600'
    validate: /usr/sbin/nft --check --file %s
  notify: Reload gateway firewall
