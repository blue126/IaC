---
- name: Sync employee WireGuard peers
  ansible.builtin.shell: |
    set -euo pipefail
    if ip link show wg-employee >/dev/null 2>&1; then
      if [[ "$(ip -4 -o address show dev wg-employee | awk '{print $4}')" != {{ employee_access_wireguard_address | quote }} ]]; then
        ip -4 address flush dev wg-employee
        ip -4 address add {{ employee_access_wireguard_address | quote }} dev wg-employee
      fi
      wg-quick strip wg-employee | wg syncconf wg-employee /dev/stdin
    else
      systemctl start wg-quick@wg-employee
    fi
  args:
    executable: /bin/bash
  changed_when: true
  no_log: true
