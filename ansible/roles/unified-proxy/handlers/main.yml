---
# Order matters: systemd must be reloaded before restarting the service
- name: Reload systemd
  systemd:
    daemon_reload: true

- name: Restart unified-proxy
  systemd:
    name: unified-proxy
    state: restarted

- name: Reload Caddy
  ansible.builtin.systemd:
    name: caddy
    state: reloaded
