---
# ── 1. System packages ─────────────────────────────────────────────────

- name: Install prerequisite packages
  apt:
    name:
      - curl
      - ca-certificates
      - gnupg
      - git
      - debian-keyring
      - debian-archive-keyring
      - apt-transport-https
      - python3
      - netfilter-persistent
      - iptables-persistent
    state: present
    update_cache: true

# ── 2. Node.js repository ──────────────────────────────────────────────

- name: Inspect NodeSource GPG key
  ansible.builtin.stat:
    path: /usr/share/keyrings/nodesource.gpg
  register: nodesource_key_file

- name: Download NodeSource GPG key
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /usr/share/keyrings/nodesource.asc
    mode: "0644"
  when: not nodesource_key_file.stat.exists

- name: Add NodeSource GPG key
  ansible.builtin.command:
    argv: [gpg, --batch, --dearmor, -o, /usr/share/keyrings/nodesource.gpg, /usr/share/keyrings/nodesource.asc]
  args:
    creates: /usr/share/keyrings/nodesource.gpg

- name: Add NodeSource apt repository
  deb822_repository:
    name: nodesource
    types: deb
    uris: "https://deb.nodesource.com/node_{{ nodejs_major }}.x"
    suites: nodistro
    components: main
    signed_by: /usr/share/keyrings/nodesource.gpg
    state: present
  register: nodesource_repo

# ── 3. Caddy repository ────────────────────────────────────────────────

- name: Inspect Caddy GPG key
  ansible.builtin.stat:
    path: /usr/share/keyrings/caddy-stable-archive-keyring.gpg
  register: caddy_key_file

- name: Download Caddy GPG key
  ansible.builtin.get_url:
    url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
    dest: /usr/share/keyrings/caddy-stable-archive-keyring.asc
    mode: "0644"
  when: not caddy_key_file.stat.exists

- name: Add Caddy GPG key
  ansible.builtin.command:
    argv: [gpg, --batch, --dearmor, -o, /usr/share/keyrings/caddy-stable-archive-keyring.gpg, /usr/share/keyrings/caddy-stable-archive-keyring.asc]
  args:
    creates: /usr/share/keyrings/caddy-stable-archive-keyring.gpg

- name: Add Caddy apt repository
  deb822_repository:
    name: caddy-stable
    types: deb
    uris: https://dl.cloudsmith.io/public/caddy/stable/deb/debian
    suites: any-version
    components: main
    signed_by: /usr/share/keyrings/caddy-stable-archive-keyring.gpg
    state: present
  register: caddy_repo

- name: Update apt cache after adding repositories
  apt:
    update_cache: true
  when: nodesource_repo.changed or caddy_repo.changed

- name: Install Node.js {{ nodejs_major }}
  apt:
    name: nodejs
    state: present

- name: Install Caddy
  apt:
    name: caddy
    state: present

# ── 4. Firewall ────────────────────────────────────────────────────────

- name: Allow HTTP (80) through iptables
  iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "80"
    jump: ACCEPT
    state: present

- name: Allow HTTPS (443) through iptables
  iptables:
    chain: INPUT
    protocol: tcp
    destination_port: "443"
    jump: ACCEPT
    state: present

- name: Persist iptables rules
  command: netfilter-persistent save
  changed_when: false

# ── 5. Application code ────────────────────────────────────────────────

- name: Create install directory
  file:
    path: "{{ proxy_install_dir }}"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"

- name: Clone / update unified-proxy repository
  git:
    repo: "{{ repo_url }}"
    dest: "{{ repo_clone_dir }}"
    version: "{{ repo_version }}"
    depth: 1
    force: true
  become: true
  become_user: ubuntu
  tags: [code]

- name: Copy server.js from repo
  copy:
    src: "{{ repo_clone_dir }}/server.js"
    dest: "{{ proxy_install_dir }}/server.js"
    remote_src: true
    owner: ubuntu
    group: ubuntu
    mode: "0644"
  notify: Restart unified-proxy
  tags: [code]

- name: Copy package.json from repo
  copy:
    src: "{{ repo_clone_dir }}/package.json"
    dest: "{{ proxy_install_dir }}/package.json"
    remote_src: true
    owner: ubuntu
    group: ubuntu
    mode: "0644"
  tags: [code]

- name: Clean up temporary clone directory
  file:
    path: "{{ repo_clone_dir }}"
    state: absent
  tags: [code]

# ── 6. Sensitive data (from vault) ────────────────────────────────────

- name: Deploy auth.json from vault
  copy:
    content: "{{ vault_auth_json }}"
    dest: "{{ proxy_install_dir }}/auth.json"
    owner: ubuntu
    group: ubuntu
    mode: "0600"
  no_log: true
  notify: Restart unified-proxy
  tags: [auth]

- name: Check if .env exists
  ansible.builtin.stat:
    path: "{{ proxy_install_dir }}/.env"
  register: env_file
  tags: [env]

- name: Deploy .env from template (first time only)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ proxy_install_dir }}/.env"
    owner: ubuntu
    group: ubuntu
    mode: "0600"
  no_log: true
  when: not env_file.stat.exists
  notify: Restart unified-proxy
  tags: [env]

- name: Update .env non-secret values
  ansible.builtin.lineinfile:
    path: "{{ proxy_install_dir }}/.env"
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
  loop:
    - { key: HOST, value: "{{ proxy_host }}" }
    - { key: PORT, value: "{{ proxy_port }}" }
    - { key: PROXY_AUTH_FILE, value: "{{ proxy_install_dir }}/auth.json" }
  notify: Restart unified-proxy
  tags: [env]

# ── 7. systemd service ─────────────────────────────────────────────────

- name: Deploy systemd service unit
  template:
    src: unified-proxy.service.j2
    dest: /etc/systemd/system/unified-proxy.service
    mode: "0644"
  notify:
    - Reload systemd
    - Restart unified-proxy

- name: Enable and start unified-proxy
  systemd:
    name: unified-proxy
    enabled: true
    state: started
    daemon_reload: true

# ── 8. Caddy configuration ─────────────────────────────────────────────

- name: Configure Caddy
  tags: [caddy-config]
  block:
    - name: Create temporary Caddyfile candidate
      ansible.builtin.tempfile:
        state: file
        suffix: .Caddyfile
      register: caddyfile_candidate
      check_mode: false

    - name: Render Caddyfile candidate
      ansible.builtin.template:
        src: Caddyfile.j2
        dest: "{{ caddyfile_candidate.path }}"
        owner: caddy
        group: caddy
        mode: "0644"
      check_mode: false

    - name: Validate Caddyfile candidate
      ansible.builtin.command:
        argv:
          - /usr/bin/caddy
          - validate
          - --config
          - "{{ caddyfile_candidate.path }}"
          - --adapter
          - caddyfile
      become: true
      become_user: caddy
      changed_when: false
      check_mode: false

    - name: Deploy validated Caddyfile
      ansible.builtin.copy:
        src: "{{ caddyfile_candidate.path }}"
        dest: /etc/caddy/Caddyfile
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      notify: Reload Caddy

    - name: Validate deployed Caddyfile
      ansible.builtin.command:
        argv:
          - /usr/bin/caddy
          - validate
          - --config
          - /etc/caddy/Caddyfile
          - --adapter
          - caddyfile
      become: true
      become_user: caddy
      changed_when: false
      when: not ansible_check_mode

    - name: Enable and start Caddy
      ansible.builtin.systemd:
        name: caddy
        enabled: true
        state: started
  always:
    - name: Remove temporary Caddyfile candidate
      ansible.builtin.file:
        path: "{{ caddyfile_candidate.path }}"
        state: absent
      when:
        - caddyfile_candidate is defined
        - caddyfile_candidate.path is defined
      check_mode: false
