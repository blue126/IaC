---
jenkins_agent_controller_url: http://192.168.1.107:8080
jenkins_agent_jar_url: "{{ jenkins_agent_controller_url }}/jnlpJars/agent.jar"
jenkins_agent_jar_path: /opt/jenkins-agent/agent.jar
jenkins_agent_java_command: /usr/lib/jvm/temurin-25-jre-amd64/bin/java
jenkins_agent_base_dir: /var/lib/jenkins-agent
jenkins_agent_config_dir: /etc/jenkins-agent
jenkins_agent_install_authorized: false
jenkins_agent_activate: false
jenkins_agent_offline_kit: /var/lib/jenkins-agent-kit
jenkins_agent_plan_secret: ""
jenkins_agent_deploy_secret: ""
jenkins_agent_apps_secret: ""
jenkins_agent_instances:
  - name: iac-plan
    secret: "{{ jenkins_agent_plan_secret }}"
  - name: iac-deploy
    secret: "{{ jenkins_agent_deploy_secret }}"
  - name: iac-apps
    secret: "{{ jenkins_agent_apps_secret }}"
jenkins_agent_runner_config: {}
jenkins_agent_wrapper_trust: {}
jenkins_agent_client_certificates: []
jenkins_agent_root_certificates: []
jenkins_agent_public_keys: []
