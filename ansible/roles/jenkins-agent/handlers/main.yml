---
# Never restart the remoting service from the job that is updating it.
- name: Queue Jenkins agent maintenance
  ansible.builtin.copy:
    content: "pending\n"
    dest: /var/lib/jenkins-agent-control/agent-update-pending
    owner: root
    group: root
    mode: "0600"
  when: jenkins_agent_activate | bool and jenkins_agent_runner_before_staging.rc == 0
