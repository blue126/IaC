---
- name: Check Qwen3-TTS systemd service state
  ansible.builtin.command:
    argv: [systemctl, is-active, "{{ qwen3_tts_service_name }}"]
  register: qwen3_tts_verify_systemd
  changed_when: false

- name: Check running Qwen3-TTS Compose services
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-name
      - "{{ qwen3_tts_compose_project }}"
      - --file
      - "{{ qwen3_tts_install_dir }}/compose.yml"
      - ps
      - --services
      - --status
      - running
  register: qwen3_tts_verify_compose
  changed_when: false

- name: Check Qwen3-TTS health endpoint
  ansible.builtin.uri:
    url: "http://{{ qwen3_tts_bind_address }}:{{ qwen3_tts_port }}/health"
    method: GET
    status_code: 200
    return_content: true
  register: qwen3_tts_verify_health

- name: Check Qwen3-TTS models endpoint
  ansible.builtin.uri:
    url: "http://{{ qwen3_tts_bind_address }}:{{ qwen3_tts_port }}/v1/models"
    method: GET
    status_code: 200
    return_content: true
  register: qwen3_tts_verify_models

- name: Create temporary file for Qwen3-TTS WAV response
  ansible.builtin.tempfile:
    state: file
    suffix: .wav
  register: qwen3_tts_verify_wav_file

- name: Validate short Qwen3-TTS WAV response
  block:
    - name: Generate short Qwen3-TTS WAV response
      ansible.builtin.uri:
        url: >-
          http://{{ qwen3_tts_bind_address }}:{{ qwen3_tts_port
          }}/v1/audio/speech
        method: POST
        body_format: json
        body:
          model: tts-1
          voice: alloy
          input: Hello.
          response_format: wav
        status_code: 200
        dest: "{{ qwen3_tts_verify_wav_file.path }}"
        timeout: 300

    - name: Read Qwen3-TTS WAV response metadata
      ansible.builtin.stat:
        path: "{{ qwen3_tts_verify_wav_file.path }}"
      register: qwen3_tts_verify_wav_stat

    - name: Read Qwen3-TTS WAV response header
      ansible.builtin.command:
        argv: [od, -An, -tx1, -N12, "{{ qwen3_tts_verify_wav_file.path }}"]
      register: qwen3_tts_verify_wav_header
      changed_when: false

    - name: Validate Qwen3-TTS WAV response file
      ansible.builtin.assert:
        that:
          - qwen3_tts_verify_wav_stat.stat.size | int > 44
          - >-
            qwen3_tts_verify_wav_header.stdout |
            regex_replace('\s+', '') is
            match('^52494646[0-9a-f]{8}57415645$')
        fail_msg: Qwen3-TTS WAV response has an invalid RIFF/WAVE header
  always:
    - name: Remove temporary Qwen3-TTS WAV response
      ansible.builtin.file:
        path: "{{ qwen3_tts_verify_wav_file.path }}"
        state: absent

- name: Create temporary file for female Qwen3-TTS WAV response
  ansible.builtin.tempfile:
    state: file
    suffix: .wav
  register: qwen3_tts_verify_female_wav_file

- name: Validate female Qwen3-TTS voice mapping
  block:
    - name: Generate female Qwen3-TTS WAV response
      ansible.builtin.uri:
        url: >-
          http://{{ qwen3_tts_bind_address }}:{{ qwen3_tts_port
          }}/v1/audio/speech
        method: POST
        body_format: json
        body:
          model: tts-1
          voice: coral
          input: 你好。
          response_format: wav
        status_code: 200
        dest: "{{ qwen3_tts_verify_female_wav_file.path }}"
        timeout: 300

    - name: Read female Qwen3-TTS WAV response metadata
      ansible.builtin.stat:
        path: "{{ qwen3_tts_verify_female_wav_file.path }}"
      register: qwen3_tts_verify_female_wav_stat

    - name: Read female Qwen3-TTS WAV response header
      ansible.builtin.command:
        argv:
          - od
          - -An
          - -tx1
          - -N12
          - "{{ qwen3_tts_verify_female_wav_file.path }}"
      register: qwen3_tts_verify_female_wav_header
      changed_when: false

    - name: Validate female Qwen3-TTS WAV response file
      ansible.builtin.assert:
        that:
          - qwen3_tts_verify_female_wav_stat.stat.size | int > 44
          - >-
            qwen3_tts_verify_female_wav_header.stdout |
            regex_replace('\s+', '') is
            match('^52494646[0-9a-f]{8}57415645$')
        fail_msg: Female Qwen3-TTS WAV response has an invalid header
  always:
    - name: Remove temporary female Qwen3-TTS WAV response
      ansible.builtin.file:
        path: "{{ qwen3_tts_verify_female_wav_file.path }}"
        state: absent

- name: Generate stream-compatible Qwen3-TTS PCM response
  ansible.builtin.command:
    argv:
      - curl
      - --fail
      - --silent
      - --show-error
      - --no-buffer
      - --dump-header
      - "-"
      - --output
      - /dev/null
      - --write-out
      - "qwen3_tts_download_size=%{size_download}"
      - --header
      - "Content-Type: application/json"
      - --data
      - >-
        {"model":"tts-1","voice":"alloy","input":"Hello.",
        "response_format":"pcm","stream":true,"stream_format":"audio"}
      - >-
        http://{{ qwen3_tts_bind_address }}:{{ qwen3_tts_port
        }}/v1/audio/speech
  register: qwen3_tts_verify_streaming_speech
  changed_when: false

- name: Generate Speech Central AAC-compatible response
  ansible.builtin.command:
    argv:
      - curl
      - --fail
      - --silent
      - --show-error
      - --dump-header
      - "-"
      - --output
      - /dev/null
      - --write-out
      - "qwen3_tts_download_size=%{size_download}"
      - --header
      - "Content-Type: application/json"
      - --data
      - >-
        {"model":"tts-1","voice":"coral","input":"你好。",
        "response_format":"aac"}
      - >-
        http://{{ qwen3_tts_bind_address }}:{{ qwen3_tts_port
        }}/v1/audio/speech
  register: qwen3_tts_verify_aac_compatibility
  changed_when: false

- name: Validate Qwen3-TTS API responses
  ansible.builtin.assert:
    that:
      - qwen3_tts_verify_systemd.stdout == 'active'
      - "'server' in qwen3_tts_verify_compose.stdout_lines"
      - "'shim' in qwen3_tts_verify_compose.stdout_lines"
      - qwen3_tts_verify_health.status == 200
      - qwen3_tts_verify_models.json.object == 'list'
      - qwen3_tts_verify_models.json.data | length > 0
      - >-
        qwen3_tts_model_repository in
        (qwen3_tts_verify_models.json.data | map(attribute='id') | list)
      - >-
        qwen3_tts_verify_streaming_speech.stdout is
        search('(?im)^content-type: audio/pcm\s*$')
      - >-
        qwen3_tts_verify_streaming_speech.stdout is
        search('(?m)^qwen3_tts_download_size=[1-9][0-9]*$')
      - >-
        qwen3_tts_verify_aac_compatibility.stdout is
        search('(?im)^content-type: audio/mpeg\s*$')
      - >-
        qwen3_tts_verify_aac_compatibility.stdout is
        search('(?m)^qwen3_tts_download_size=[1-9][0-9]*$')
    fail_msg: Qwen3-TTS read-only verification failed

- name: Read Qwen3-TTS container restart counts
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - --format
      - "{{ '{{.RestartCount}}' }}"
      - "{{ item }}"
  loop:
    - "{{ qwen3_tts_compose_project }}-server-1"
    - "{{ qwen3_tts_compose_project }}-shim-1"
  register: qwen3_tts_verify_restart_counts
  changed_when: false

- name: Read Qwen3-TTS container health states
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - --format
      - "{{ '{{.State.Health.Status}}' }}"
      - "{{ item }}"
  loop:
    - "{{ qwen3_tts_compose_project }}-server-1"
    - "{{ qwen3_tts_compose_project }}-shim-1"
  register: qwen3_tts_verify_health_states
  changed_when: false

- name: Validate Qwen3-TTS container health and restart counts
  ansible.builtin.assert:
    that:
      - >-
        qwen3_tts_verify_restart_counts.results |
        selectattr('stdout', 'ne', '0') | list | length == 0
      - >-
        qwen3_tts_verify_health_states.results |
        selectattr('stdout', 'ne', 'healthy') | list | length == 0
    fail_msg: A Qwen3-TTS container restarted unexpectedly or is unhealthy

- name: Read free memory for each GPU after deployment
  ansible.builtin.command:
    argv:
      - nvidia-smi
      - --query-gpu=index,memory.free
      - --format=csv,noheader,nounits
  register: qwen3_tts_gpu_memory_after
  changed_when: false

- name: Display free memory for each GPU after deployment
  ansible.builtin.debug:
    var: qwen3_tts_gpu_memory_after.stdout_lines
