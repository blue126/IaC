---
# Pinned from vLLM-Omni v0.28.0 qwen3_tts.yaml.
# Both stages use the single GPU exposed inside the container as device 0.
async_chunk: true

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      codec_streaming: true
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      codec_chunk_frames: 25
      codec_left_context_frames: 72
      initial_codec_chunk_frames: 1
      decode_batch_max_size: 1
      # Bound Code2Wav's CUDA graph capture to batch 1. Stage 1 keeps
      # enforce_eager: false, so raising its max_num_seqs would otherwise
      # widen the set of captured shapes -- and an oversized Code2Wav capture
      # is the documented way this model OOMs on a 3090 (upstream's
      # max_num_seqs=64 fails during warmup). decode_batch_max_size is already
      # 1, so nothing decodes wider than this anyway. Same value upstream's
      # own qwen3_tts_high_concurrency.yaml uses.
      decode_cudagraph_batch_sizes: [1]

stages:
  - stage_id: 0
    # Three concurrent requests. Measured on this host at max_num_seqs 1, the
    # KV cache held 27,296 tokens -- 6.66x one request's 4096-token ceiling.
    # Three requests need 12,288, which the cache already covered, so this
    # costs no additional KV memory; only scheduler and activation state grow.
    max_num_seqs: 3
    gpu_memory_utilization: 0.3
    # Pin the KV cache instead of letting it size itself from whatever is free
    # at startup. Measured: 2.92 GiB held 27,296 tokens (114,864 B/token), and
    # vLLM logged that 2.66 GiB was all its own 0.3 budget actually asked for
    # -- it overshot because the profiling fallback sized against free memory.
    # 2.00 GiB is 18,696 tokens, 4.56x the 4096-token ceiling, so it covers
    # max_num_seqs: 3 with room and returns ~0.9 GiB to a card that had 739 MiB
    # free with Qwen3.8 co-resident. Recompute this if max_model_len or
    # max_num_seqs changes: bytes = tokens * 114864.
    kv_cache_memory_bytes: 2147483648
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: true
    max_num_batched_tokens: 4096
    max_model_len: 4096
    devices: "0"
    output_connectors:
      to_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.6
      top_k: 50
      # No seed. The seed: 42 that used to sit here did nothing, and neither
      # does an explicit per-request one: the same sentence rendered three
      # times came back 6.16s / 6.56s / 6.80s -- a 10.4% spread in duration,
      # audible as pacing, not dither -- and two requests carrying an
      # identical seed: 777 differed just as much. A knob with no effect at
      # any value reads as a control over reproducibility that does not exist.
      #
      # Candidates for why, none confirmed: both stages log engine seed=0;
      # subtalker_sampling_params below runs do_sample with no seed of its own,
      # and it generates every codebook after the first; async_scheduling is on.
      # Do not re-add a seed expecting reproducible output without measuring.
      #
      # Timbre stability does not depend on this. That comes from the Base ICL
      # profile pinning the voice to a fixed reference WAV, and from
      # temperature 0.6 above (upstream ships 0.9).

      # Upstream ships 512, which caps a request at roughly 55 seconds of
      # audio: measured on this host, 220 Chinese characters synthesise fine
      # and 264 fail after 14.2s with "did not emit codec EOS before its token
      # budget (512/512)". A reader client sending whole paragraphs hits that
      # constantly and retries, which looks like a slow service rather than a
      # failing one. stage 0's max_model_len is 4096 and the ICL prompt takes
      # ~181, so 2048 is comfortably inside the window and lifts the ceiling to
      # roughly 3.5 minutes of audio per request. The cost of raising it is
      # that a degenerate no-EOS generation now burns ~57s instead of ~14s
      # before it is rejected.
      max_tokens: 2048
      min_tokens: 2
      repetition_penalty: 1.05
    # Left off deliberately. Clips come back with ~400ms of leading and ~350ms
    # of trailing near-silence, so back-to-back sentence playback has ~775ms of
    # dead air at each seam. This knob looks like the fix and is not: it bans
    # the 12 codec tokens that encode true digital silence, but what the model
    # actually emits at the head of a clip is low-level noise around 0.2-0.7%
    # of peak, which uses other tokens. Measured 15 samples per arm: seam median
    # 775ms at 0 and 806ms at 10, i.e. no effect. Trimming on an energy
    # threshold is the approach that would work -- speech sits 10x above that
    # noise floor -- but it needs a decoder in the shim for non-PCM formats.
    silence_ban_frames: 0
    subtalker_sampling_params:
      do_sample: true
      temperature: 0.6
      top_k: 50
      top_p: 1.0

  - stage_id: 1
    # Matched to stage 0 so a queued request is not blocked behind Code2Wav.
    # Cheap here: this stage is a decoder with no KV cache at all -- it never
    # reports one, and its measured 3.24 GiB is weights plus activation.
    max_num_seqs: 3
    # Unreachable ceiling, kept at upstream's value. This stage shares the card
    # with stage 0 and Qwen3.8, so at startup it logs "Capping requested memory
    # to available free memory" and settles well below 0.3 -- harmless, because
    # with no KV cache there is nothing for the extra budget to fill. Do not
    # read this number as a reservation.
    gpu_memory_utilization: 0.3
    enforce_eager: false
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: true
    max_num_batched_tokens: 65536
    max_model_len: 65536
    devices: "0"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      repetition_penalty: 1.0

platforms:
  rocm:
    stages:
      - stage_id: 1
        enforce_eager: true
  npu:
    stages:
      - stage_id: 0
        enforce_eager: false
        compilation_config:
          cudagraph_mode: PIECEWISE
      - stage_id: 1
        compilation_config:
          cudagraph_mode: PIECEWISE
