---
# The standalone pilot (employee-hapi) ran its own Hub and Tunnel on VM502; the shared
# Hub on VM500 replaced them. Its Runner was stopped in runner.yml before hapi-runner.
- name: Stop and disable the retired pilot units
  ansible.builtin.systemd_service:
    name: '{{ item }}'
    state: stopped
    enabled: false
  loop: [employee-hapi-hub, employee-hapi-tunnel, employee-hapi-runner, hapi-hub-client-validation]
  failed_when: false

- name: Remove the retired pilot unit files and drop-ins
  ansible.builtin.file:
    path: '/etc/systemd/system/{{ item }}'
    state: absent
  loop:
    - employee-hapi-hub.service
    - employee-hapi-hub.service.d
    - employee-hapi-tunnel.service
    - employee-hapi-runner.service
    - employee-hapi-runner.service.d
    - hapi-hub-client-validation.service
  notify: Reload systemd units

- name: Remove the retired pilot configuration and Tunnel executable
  ansible.builtin.file:
    path: '{{ item }}'
    state: absent
  loop: [/etc/employee-hapi, /usr/local/bin/employee-hapi-cloudflared, /usr/local/lib/employee-hapi-verify.py]
