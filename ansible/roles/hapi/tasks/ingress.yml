---
- name: Create the dedicated ingress account
  ansible.builtin.user:
    name: hapi-ingress
    system: true
    create_home: false
    shell: /usr/sbin/nologin

- name: Create the private ingress configuration directory
  ansible.builtin.file:
    path: /etc/hapi-ingress
    state: directory
    owner: root
    group: hapi-ingress
    mode: '0750'

- name: Prepare the isolated ingress runtime for configuration checks
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: hapi-ingress
    group: hapi-ingress
    mode: '0750'
  loop: [/run/hapi-ingress, /run/hapi-ingress/body, /run/hapi-ingress/proxy, /run/hapi-ingress/fastcgi, /run/hapi-ingress/uwsgi, /run/hapi-ingress/scgi]

- name: Verify the approved frontend on the controller
  ansible.builtin.stat:
    path: '{{ hapi_web_archive }}'
    checksum_algorithm: sha256
  delegate_to: localhost
  become: false
  register: hapi_web_source
  failed_when: hapi_web_source.stat.checksum | default('') != hapi_web_sha256

- name: Create the immutable frontend destination
  ansible.builtin.file:
    path: '/opt/hapi-ingress/web/{{ hapi_web_sha256 }}'
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Extract the approved frontend
  ansible.builtin.unarchive:
    src: '{{ hapi_web_archive }}'
    dest: '/opt/hapi-ingress/web/{{ hapi_web_sha256 }}'
    owner: root
    group: root
    creates: '/opt/hapi-ingress/web/{{ hapi_web_sha256 }}/index.html'

- name: Deploy the ingress configuration
  ansible.builtin.template:
    src: ingress.nginx.conf.j2
    dest: /etc/hapi-ingress/nginx.conf
    owner: root
    group: hapi-ingress
    mode: '0640'
    validate: /usr/sbin/nginx -t -c %s
  notify: Reload HAPI ingress proxy

- name: Deploy the ingress service
  ansible.builtin.template:
    src: ingress.service.j2
    dest: /etc/systemd/system/hapi-ingress-proxy.service
    owner: root
    group: root
    mode: '0644'
  notify: Reload HAPI ingress proxy

- name: Inspect the PID file left by configuration checks
  ansible.builtin.stat:
    path: /run/hapi-ingress/nginx.pid
    follow: false
  register: hapi_ingress_pid

- name: Require a regular ingress PID file
  ansible.builtin.assert:
    that: not hapi_ingress_pid.stat.exists or hapi_ingress_pid.stat.isreg

- name: Keep the PID file writable by the ingress account
  ansible.builtin.file:
    path: /run/hapi-ingress/nginx.pid
    owner: hapi-ingress
    group: hapi-ingress
    mode: '0644'
    follow: false
  when: hapi_ingress_pid.stat.exists

- name: Enable the ingress
  ansible.builtin.systemd_service:
    name: hapi-ingress-proxy
    daemon_reload: true
    enabled: true
    state: started
