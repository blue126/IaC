---
- name: Create the versioned HAPI installation directory
  ansible.builtin.file:
    path: '/opt/hapi/{{ hapi_version }}'
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Download the pinned HAPI release
  ansible.builtin.get_url:
    url: 'https://github.com/tiann/hapi/releases/download/{{ hapi_version }}/hapi-linux-x64-baseline.tar.gz'
    checksum: 'sha256:{{ hapi_release_sha256 }}'
    dest: '/opt/hapi/{{ hapi_version }}/hapi-linux-x64-baseline.tar.gz'
    owner: root
    group: root
    mode: '0644'
  register: hapi_archive

- name: Extract the pinned HAPI executable
  ansible.builtin.unarchive:
    src: '/opt/hapi/{{ hapi_version }}/hapi-linux-x64-baseline.tar.gz'
    dest: '/opt/hapi/{{ hapi_version }}'
    remote_src: true
    owner: root
    group: root
    creates: "{{ omit if hapi_archive.changed else '/opt/hapi/' + hapi_version + '/hapi' }}"
  notify: Restart HAPI Runner

- name: Link the pinned HAPI executable
  ansible.builtin.file:
    src: '/opt/hapi/{{ hapi_version }}/hapi'
    dest: /usr/local/bin/hapi
    state: link
    force: true
  notify: Restart HAPI Runner

- name: Create the private Runner configuration directory
  ansible.builtin.file:
    path: /etc/hapi
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Deploy the Runner token and Hub endpoint
  ansible.builtin.template:
    src: runner.env.j2
    dest: /etc/hapi/runner.env
    owner: root
    group: root
    mode: '0600'
  no_log: true
  diff: false
  notify: Restart HAPI Runner

- name: Create the employee HAPI data and log directories
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: employee
    group: employee
    mode: '0700'
  loop: [/home/employee/.hapi, /home/employee/.hapi/logs]

- name: Deploy the Runner service
  ansible.builtin.template:
    src: runner.service.j2
    dest: /etc/systemd/system/hapi-runner.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart HAPI Runner

- name: Enable the Runner
  ansible.builtin.systemd_service:
    name: hapi-runner
    daemon_reload: true
    enabled: true
    state: started
