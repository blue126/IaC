---
- name: Create DeepSeek V4 configuration directory
  ansible.builtin.file:
    path: "{{ deepseek_v4_install_dir }}"
    state: directory
    owner: "{{ deepseek_v4_config_owner }}"
    group: "{{ deepseek_v4_config_group }}"
    mode: "0750"

- name: Create DeepSeek V4 harness directory
  ansible.builtin.file:
    path: "{{ deepseek_v4_harness_dir }}"
    state: directory
    owner: "{{ deepseek_v4_config_owner }}"
    group: "{{ deepseek_v4_config_group }}"
    mode: "0750"

- name: Deploy versioned DeepSeek V4 harness
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ deepseek_v4_harness_dir }}/{{ item }}"
    owner: "{{ deepseek_v4_config_owner }}"
    group: "{{ deepseek_v4_config_group }}"
    mode: "{{ '0750' if item.endswith('.py') else '0640' }}"
  loop:
    - benchmark-runner.py
    - contract-runner.py
    - correctness-corpus-v1.json
    - api-fixtures-v1.json
    - benchmark-corpus-v1.json
    - evidence-schema-v1.json
    - evidence-validator.py
    - model-manifest-fetch.py
    - activate-after-download.sh
    - sqlite-backup.py

- name: Create DeepSeek V4 evidence directory
  ansible.builtin.file:
    path: "{{ deepseek_v4_evidence_dir }}"
    state: directory
    owner: "{{ deepseek_v4_config_owner }}"
    group: "{{ deepseek_v4_config_group }}"
    mode: "0750"

- name: Create writable DeepSeek V4 cache directory
  ansible.builtin.file:
    path: "{{ deepseek_v4_cache_dir }}"
    state: directory
    owner: "{{ deepseek_v4_config_owner }}"
    group: "{{ deepseek_v4_config_group }}"
    mode: "0750"

- name: Create executable DeepSeek V4 compilation cache directory
  ansible.builtin.file:
    path: "{{ deepseek_v4_cache_dir }}/tmp"
    state: directory
    owner: "{{ deepseek_v4_config_owner }}"
    group: "{{ deepseek_v4_config_group }}"
    mode: "0750"

- name: Render DeepSeek V4 Compose definition
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ deepseek_v4_install_dir }}/docker-compose.yml"
    owner: "{{ deepseek_v4_config_owner }}"
    group: "{{ deepseek_v4_config_group }}"
    mode: "0640"

- name: Render DeepSeek V4 systemd orchestration unit
  ansible.builtin.template:
    src: deepseek-v4.service.j2
    dest: "{{ deepseek_v4_install_dir }}/deepseek-v4.service"
    owner: "{{ deepseek_v4_config_owner }}"
    group: "{{ deepseek_v4_config_group }}"
    mode: "0644"

- name: Render DeepSeek V4 release manifest
  ansible.builtin.template:
    src: release-manifest.yml.j2
    dest: "{{ deepseek_v4_install_dir }}/release-manifest.yml"
    owner: "{{ deepseek_v4_config_owner }}"
    group: "{{ deepseek_v4_config_group }}"
    mode: "0640"
