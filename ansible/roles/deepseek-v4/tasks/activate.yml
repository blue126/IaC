---
- name: Install the guarded post-download activation script
  ansible.builtin.copy:
    src: activate-after-download.sh
    dest: "{{ deepseek_v4_install_dir }}/activate-after-download.sh"
    owner: root
    group: root
    mode: "0750"

- name: Allow capability-minimized inference container to traverse model directory
  ansible.builtin.file:
    path: "{{ deepseek_v4_model_dir }}"
    state: directory
    mode: "0755"

- name: Install the DeepSeek V4 systemd orchestration unit for activation
  ansible.builtin.copy:
    src: "{{ deepseek_v4_install_dir }}/deepseek-v4.service"
    remote_src: true
    dest: /etc/systemd/system/deepseek-v4.service
    owner: root
    group: root
    mode: "0644"

- name: Reload systemd before guarded activation
  ansible.builtin.systemd:
    daemon_reload: true

- name: Discover NVIDIA GPU ordinals before activation
  ansible.builtin.command:
    argv:
      - nvidia-smi
      - --query-gpu=index
      - --format=csv,noheader
  register: deepseek_v4_visible_gpus
  changed_when: false

- name: Require every GPU in the approved performance profile
  ansible.builtin.assert:
    that:
      - >-
        deepseek_v4_gpu_ordinals
        | difference(deepseek_v4_visible_gpus.stdout_lines | map('trim') | list)
        | length == 0
    fail_msg: >-
      The requested {{ deepseek_v4_profile }} profile requires GPUs
      {{ deepseek_v4_gpu_ordinals | join(', ') }}, but nvidia-smi reported
      {{ deepseek_v4_visible_gpus.stdout_lines | join(', ') }}. No service was changed.

- name: Stop a superseded guarded activation task
  ansible.builtin.systemd:
    name: deepseek-v4-activation.service
    state: stopped
  failed_when: false

- name: Start guarded DeepSeek V4 post-download activation
  ansible.builtin.command: >-
    systemd-run --wait --collect --unit deepseek-v4-activation
    --property=After=network-online.target
    --property=TimeoutStartSec=infinity
    {{ deepseek_v4_install_dir }}/activate-after-download.sh
  changed_when: true
