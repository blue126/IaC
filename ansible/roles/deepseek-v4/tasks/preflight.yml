---
- name: Run read-only DeepSeek V4 preflight collector
  ansible.builtin.script: preflight-runner.py
  args:
    executable: python3
  register: deepseek_v4_preflight
  changed_when: false

- name: Ensure local preflight evidence directory exists
  ansible.builtin.file:
    path: "{{ deepseek_v4_local_evidence_dir }}"
    state: directory
    mode: "0750"
  delegate_to: localhost
  become: false

- name: Save preflight evidence on the control node
  ansible.builtin.copy:
    content: "{{ deepseek_v4_preflight.stdout }}\n"
    dest: "{{ deepseek_v4_local_evidence_dir }}/preflight.json"
    mode: "0640"
  delegate_to: localhost
  become: false
