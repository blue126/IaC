---
- name: Check pinned model directory
  ansible.builtin.stat:
    path: "{{ deepseek_v4_model_dir }}"
  register: deepseek_v4_model_stat

- name: Require a read-only-ready model artifact
  ansible.builtin.assert:
    that:
      - deepseek_v4_model_stat.stat.exists
      - deepseek_v4_model_stat.stat.isdir
    fail_msg: >-
      Pinned model artifact is absent; this gate validates and never
      downloads it.

- name: Validate model manifest paths
  ansible.builtin.assert:
    that:
      - item.path | length > 0
      - not (item.path | ansible.builtin.regex_search('(^/|(^|/)\.\.(/|$))'))
      - item.size | int > 0
      - item.sha256 is match('^[0-9a-f]{64}$')
    fail_msg: >-
      Model manifest entries require a safe relative path, positive size
      and SHA-256.
  loop: "{{ deepseek_v4_model_file_manifest }}"
  loop_control:
    label: "{{ item.path | default('invalid') }}"

- name: Select the safetensors index manifest entry
  ansible.builtin.set_fact:
    deepseek_v4_model_index_entries: >-
      {{ deepseek_v4_model_file_manifest
         | selectattr('path', 'equalto', 'model.safetensors.index.json')
         | list }}

- name: Require exactly one official safetensors index
  ansible.builtin.assert:
    that:
      - deepseek_v4_model_index_entries | length == 1
    fail_msg: >-
      The official snapshot manifest must contain exactly one
      model.safetensors.index.json entry.

- name: Inspect pinned model files
  ansible.builtin.stat:
    path: "{{ deepseek_v4_model_dir }}/{{ item.path }}"
    checksum_algorithm: sha256
  loop: "{{ deepseek_v4_model_file_manifest }}"
  loop_control:
    label: "{{ item.path }}"
  register: deepseek_v4_model_files

- name: Require model file size and checksum matches
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isreg
      - item.stat.size | int == item.item.size | int
      - item.stat.checksum == item.item.sha256
    fail_msg: >-
      Pinned model file failed size or SHA-256 verification:
      {{ item.item.path }}
  loop: "{{ deepseek_v4_model_files.results }}"
  loop_control:
    label: "{{ item.item.path }}"

- name: Read the pinned safetensors index
  ansible.builtin.slurp:
    src: "{{ deepseek_v4_model_dir }}/model.safetensors.index.json"
  register: deepseek_v4_model_index

- name: Derive declared and indexed model file paths
  ansible.builtin.set_fact:
    deepseek_v4_declared_model_paths: >-
      {{ deepseek_v4_model_file_manifest | map(attribute='path') | list }}
    deepseek_v4_indexed_shards: >-
      {{ (deepseek_v4_model_index.content | b64decode | from_json).weight_map
         .values() | unique | list }}

- name: Require every indexed shard in the pinned manifest
  ansible.builtin.assert:
    that:
      - deepseek_v4_indexed_shards | length > 0
      - >-
        deepseek_v4_indexed_shards
        | difference(deepseek_v4_declared_model_paths) | length == 0
    fail_msg: >-
      The model manifest omits one or more shards referenced by the
      safetensors index.

- name: Initialize observed artifact evidence
  ansible.builtin.set_fact:
    deepseek_v4_artifact_observations: []

- name: Record observed artifact evidence
  ansible.builtin.set_fact:
    deepseek_v4_artifact_observations: >-
      {{ deepseek_v4_artifact_observations + [{
        'id': item.item.path,
        'pass': true,
        'expected_size': item.item.size | int,
        'observed_size': item.stat.size | int,
        'expected_sha256': item.item.sha256,
        'observed_sha256': item.stat.checksum
      }] }}
  loop: "{{ deepseek_v4_model_files.results }}"
  loop_control:
    label: "{{ item.item.path }}"

- name: Ensure artifact evidence directory exists
  ansible.builtin.file:
    path: "{{ deepseek_v4_evidence_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Write artifact integrity evidence
  ansible.builtin.copy:
    content: >-
      {{ {'schema_version': 1,
          'fixture_revision': deepseek_v4_fixture_revision,
          'status': 'pass',
          'host': inventory_hostname,
          'observed_at': now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ'),
          'model_repository': deepseek_v4_model_repository,
          'model_revision': deepseek_v4_model_revision,
          'results': deepseek_v4_artifact_observations} | to_nice_json }}
    dest: "{{ deepseek_v4_evidence_dir }}/artifact-integrity.json"
    owner: root
    group: root
    mode: "0640"

- name: Validate artifact integrity evidence schema
  ansible.builtin.script: >-
    evidence-validator.py
    {{ deepseek_v4_evidence_dir }}/artifact-integrity.json
  args:
    executable: python3
  changed_when: false
