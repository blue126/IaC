---
- name: Build the DeepSeek V4 loopback API URL
  ansible.builtin.set_fact:
    deepseek_v4_api_url: >-
      http://{{ deepseek_v4_api_bind_address }}:{{ deepseek_v4_api_port }}

- name: Wait for the DeepSeek V4 loopback API
  ansible.builtin.wait_for:
    host: "{{ deepseek_v4_api_bind_address }}"
    port: "{{ deepseek_v4_api_port }}"
    timeout: "{{ deepseek_v4_readiness_timeout }}"

- name: Verify DeepSeek V4 health readiness
  ansible.builtin.uri:
    url: "{{ deepseek_v4_api_url }}/health"
    status_code: 200
    return_content: true
  register: deepseek_v4_health_response
  until: deepseek_v4_health_response.status == 200
  retries: 80
  delay: 15

- name: Verify the pinned model identity
  ansible.builtin.uri:
    url: "{{ deepseek_v4_api_url }}/v1/models"
    return_content: true
    status_code: 200
  register: deepseek_v4_models_response

- name: Require the expected model identity
  ansible.builtin.assert:
    that:
      - >-
        deepseek_v4_model_identity in
        (deepseek_v4_models_response.json.data
         | map(attribute='id') | list)
    fail_msg: "The API did not return the exact pinned model identity."

- name: Run the versioned API contract corpus
  ansible.builtin.command: >-
    python3 {{ deepseek_v4_harness_dir }}/contract-runner.py
    --base-url {{ deepseek_v4_api_url }}
    --model {{ deepseek_v4_model_identity }}
    --output {{ deepseek_v4_evidence_dir }}/contract.json
  changed_when: false

- name: Validate API contract evidence schema
  ansible.builtin.command: >-
    python3 {{ deepseek_v4_harness_dir }}/evidence-validator.py
    {{ deepseek_v4_evidence_dir }}/contract.json
  changed_when: false

- name: Wait for Open WebUI
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ deepseek_v4_webui_port }}"
    timeout: 120
  when: "'open-webui' in deepseek_v4_compose_services"

- name: Verify Open WebUI HTTP availability
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ deepseek_v4_webui_port }}"
    status_code: [200, 301, 302]
    return_content: false
  when: "'open-webui' in deepseek_v4_compose_services"
