---
- name: Resolve the requested DeepSeek V4 performance profile
  ansible.builtin.set_fact:
    deepseek_v4_active_profile: >-
      {{ deepseek_v4_profiles[deepseek_v4_profile] | default({}) }}

- name: Validate the requested DeepSeek V4 performance profile
  ansible.builtin.assert:
    that:
      - deepseek_v4_profile in ['tp1', 'tp2']
      - deepseek_v4_active_profile | length ==
        (2 if deepseek_v4_profile == 'tp1' else 3)
      - deepseek_v4_active_profile.tensor_parallelism | int ==
        (1 if deepseek_v4_profile == 'tp1' else 2)
      - deepseek_v4_active_profile.gpu_ordinals ==
        (['0'] if deepseek_v4_profile == 'tp1' else ['0', '1'])
      - >-
        (deepseek_v4_active_profile.nccl_p2p_disable | default(false) | bool)
        == (deepseek_v4_profile == 'tp2')
      - deepseek_v4_context_length | int == 16384
      - deepseek_v4_max_running_requests | int == 1
      - deepseek_v4_mtp_enabled is boolean
      - deepseek_v4_api_bind_address == '127.0.0.1'
      - deepseek_v4_webui_host_gateway_address == '172.17.0.1'
      - deepseek_v4_runtime_container_port | int == 30000
    fail_msg: >-
      Only the approved tp1 (GPU 0, TP1) and tp2 (GPUs 0/1, TP2) profiles
      may be used; serving invariants and restricted host bindings remain fixed.

- name: Set the resolved DeepSeek V4 serving profile
  ansible.builtin.set_fact:
    deepseek_v4_tensor_parallelism: >-
      {{ deepseek_v4_active_profile.tensor_parallelism | int }}
    deepseek_v4_gpu_ordinals: "{{ deepseek_v4_active_profile.gpu_ordinals }}"
    deepseek_v4_nccl_p2p_disable: >-
      {{ deepseek_v4_active_profile.nccl_p2p_disable | default(false) | bool }}

- name: Build unresolved release field list
  ansible.builtin.set_fact:
    deepseek_v4_unresolved_fields: >-
      {%- set missing = [] -%}
      {%- for field in deepseek_v4_required_release_fields -%}
      {%- set value = lookup('vars', field, default='unresolved')
                       | string | trim -%}
      {%- if value in ['', 'unresolved', 'main', 'latest'] -%}
      {%- set _ = missing.append(field) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ missing }}

- name: Build requested gated action list
  ansible.builtin.set_fact:
    deepseek_v4_gated_actions: >-
      {{ (deepseek_v4_gated_action_names | intersect(ansible_run_tags))
         + ([deepseek_v4_requested_action]
            if deepseek_v4_requested_action in deepseek_v4_gated_action_names
            else [])
         | unique }}
  vars:
    deepseek_v4_gated_action_names:
      - config
      - preflight
      - artifact
      - lifecycle
      - activate
      - verify
      - benchmark

- name: Reject floating image references
  ansible.builtin.assert:
    that:
      - >-
        deepseek_v4_runtime_image_digest == 'unresolved'
        or deepseek_v4_runtime_image_digest is match('^sha256:[0-9a-f]{64}$')
      - "':' not in deepseek_v4_runtime_image_repository"
      - "'@' not in deepseek_v4_runtime_image_repository"
      - >-
        deepseek_v4_webui_image_digest == 'unresolved'
        or deepseek_v4_webui_image_digest is match('^sha256:[0-9a-f]{64}$')
      - "':' not in deepseek_v4_webui_image_repository"
      - "'@' not in deepseek_v4_webui_image_repository"
    fail_msg: >-
      Runtime images must use a repository plus an immutable SHA-256 digest,
      never a tag.

- name: Validate resolved runtime arguments
  ansible.builtin.assert:
    that:
      - deepseek_v4_runtime_arguments | length > 0
      - >-
        deepseek_v4_reasoning_parser in
        (deepseek_v4_runtime_arguments | join(' '))
      - >-
        deepseek_v4_tool_parser in
        (deepseek_v4_runtime_arguments | join(' '))
    fail_msg: >-
      A gated release must provide audited runtime arguments containing
      both parser identities.
  when: deepseek_v4_unresolved_fields | length == 0

- name: Validate exact legacy retirement whitelist
  ansible.builtin.assert:
    that:
      - >-
        deepseek_v4_legacy_units
        | difference(deepseek_v4_allowed_legacy_units)
        | length == 0
      - >-
        deepseek_v4_legacy_units | unique | length
        == deepseek_v4_legacy_units | length
    fail_msg: >-
      Legacy lifecycle targets must be unique members of the exact
      approved whitelist.

- name: Validate controlled Compose services
  ansible.builtin.assert:
    that:
      - >-
        deepseek_v4_compose_services
        | difference(['inference', 'open-webui']) | length == 0
      - "'inference' in deepseek_v4_compose_services"
      - >-
        'open-webui' not in deepseek_v4_compose_services
        or deepseek_v4_webui_cutover_approved | bool
    fail_msg: >-
      Compose may always start inference; Open WebUI additionally requires
      explicit cutover approval.

- name: Require a matching approval gate for sensitive paths
  ansible.builtin.assert:
    that:
      - deepseek_v4_gate == item
    fail_msg: >-
      Gate '{{ item }}' requires deepseek_v4_gate={{ item }}.
  loop: "{{ deepseek_v4_gated_actions }}"

- name: Require resolved immutable fields after preflight
  ansible.builtin.assert:
    that:
      - deepseek_v4_unresolved_fields | length == 0
    fail_msg: >-
      Gate '{{ item }}' requires resolved immutable fields.
      Unresolved fields: {{ deepseek_v4_unresolved_fields | join(', ') }}
  loop: >-
    {{ deepseek_v4_gated_actions
       | reject('equalto', 'preflight') | list }}

- name: Require a complete model file manifest after artifact preparation
  ansible.builtin.assert:
    that:
      - >-
        deepseek_v4_model_file_manifest | length > 0
        or deepseek_v4_model_manifest_dynamic | bool
    fail_msg: >-
      Artifact and later gates require a non-empty file manifest with size
      and SHA-256 evidence.
  when: >-
    deepseek_v4_gated_actions
    | intersect(['artifact', 'lifecycle', 'activate', 'verify', 'benchmark'])
    | length > 0
