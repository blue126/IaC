---
- name: Verify the prepared signing service and timer units
  ansible.builtin.command:
    argv:
      - /usr/bin/systemd-analyze
      - verify
      - /etc/systemd/system/hapi-pki-controller.service
      - /etc/systemd/system/hapi-pki-controller.timer
  changed_when: false

- name: Inspect the last certificate lifecycle result without showing secret material
  ansible.builtin.stat:
    path: /var/lib/hapi-pki-controller/health.json
  register: hapi_pki_controller_health

- name: Read the public lifecycle verification receipt
  ansible.builtin.slurp:
    src: /var/lib/hapi-pki-controller/health.json
  register: hapi_pki_controller_receipt
  when: hapi_pki_controller_enable_timer | bool

- name: Require a successful first certificate rollout
  ansible.builtin.assert:
    that: (hapi_pki_controller_receipt.content | b64decode | from_json).ok
  when: hapi_pki_controller_enable_timer | bool
