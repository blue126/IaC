---
- name: Require an explicitly approved VM500 certificate controller deployment
  ansible.builtin.assert:
    that:
      - hapi_pki_controller_activate | bool
      - hapi_pki_agent_config.role == 'control'
      - hapi_pki_controller_config.version == 1
      - hapi_pki_controller_hub_key | length > 0
      - hapi_pki_controller_login_key | length > 0
  no_log: true

- name: Create the dedicated signing service identity
  ansible.builtin.user:
    name: hapi-pki
    group: hapi-pki
    system: true
    create_home: false
    shell: /usr/sbin/nologin

- name: Create the root-only signing credential directory
  ansible.builtin.file:
    path: /etc/hapi-pki/issuer-credentials
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Materialize only the approved CA signing keys from encrypted runtime input
  ansible.builtin.copy:
    content: '{{ item.key }}'
    dest: '/etc/hapi-pki/issuer-credentials/{{ item.name }}.key'
    owner: root
    group: root
    mode: '0600'
  loop:
    - {name: hub, key: '{{ hapi_pki_controller_hub_key }}'}
    - {name: login, key: '{{ hapi_pki_controller_login_key }}'}
  no_log: true
  diff: false

- name: Publish the public certificate identities and fixed deployment targets
  ansible.builtin.copy:
    content: '{{ hapi_pki_controller_config | to_nice_json }}'
    dest: /etc/hapi-pki/controller.json
    owner: root
    group: hapi-pki
    mode: '0640'
    validate: /usr/bin/python3 /usr/local/lib/hapi-pki.py check-controller --config %s

- name: Allow the signing identity to traverse only the public configuration directory
  ansible.builtin.file:
    path: /etc/hapi-pki
    state: directory
    owner: root
    group: hapi-pki
    mode: '0750'

- name: Deploy the lifecycle service and hourly timer
  ansible.builtin.template:
    src: '{{ item }}.j2'
    dest: '/etc/systemd/system/hapi-pki-{{ item }}'
    owner: root
    group: root
    mode: '0644'
  loop: [controller.service, controller.timer]

- name: Validate actual systemd units before the first signing run
  ansible.builtin.command:
    argv:
      - /usr/bin/systemd-analyze
      - verify
      - /etc/systemd/system/hapi-pki-agent.service
      - /etc/systemd/system/hapi-pki-controller.service
      - /etc/systemd/system/hapi-pki-controller.timer
  changed_when: false

- name: Run the explicitly approved first lifecycle check before enabling the timer
  ansible.builtin.systemd_service:
    name: hapi-pki-controller.service
    daemon_reload: true
    state: started
  when: hapi_pki_controller_enable_timer | bool
  changed_when: false

- name: Configure the explicitly approved hourly certificate lifecycle timer
  ansible.builtin.systemd_service:
    name: hapi-pki-controller.timer
    daemon_reload: true
    enabled: '{{ hapi_pki_controller_enable_timer | bool }}'
    state: "{{ 'started' if hapi_pki_controller_enable_timer | bool else 'stopped' }}"
