---
- name: Require an explicit desktop operation
  ansible.builtin.assert:
    that: employee_desktop_phase in ['packages', 'trust', 'prepare', 'activate', 'provision']

- name: Install the pinned desktop packages
  ansible.builtin.import_tasks: packages.yml
  when: employee_desktop_phase == 'packages'

- name: Prepare the explicitly selected KasmVNC presentation
  ansible.builtin.import_tasks: presentation.yml
  when: employee_desktop_phase in ['trust', 'prepare', 'activate']

- name: Install the desktop and its frontend identity on a new employee VM
  ansible.builtin.include_tasks: provision.yml
  when: employee_desktop_phase == 'provision'
