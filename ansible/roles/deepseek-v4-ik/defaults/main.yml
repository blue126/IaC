deepseek_v4_ik_graph_preflight_evidence_path: ""
deepseek_v4_ik_experiment_dir: >-
  {{ deepseek_v4_ik_evidence_dir }}/{{ deepseek_v4_ik_experiment_id }}
deepseek_v4_ik_experiment_compose_project: >-
  deepseek-v4-ik-exp-{{ deepseek_v4_ik_experiment_id }}
deepseek_v4_ik_resource_sample_interval_seconds: 2
deepseek_v4_ik_resource_sample_limit: 18000
deepseek_v4_ik_minimum_memavailable_bytes: 34359738368
deepseek_v4_ik_minimum_gpu_free_mib: 2048
deepseek_v4_ik_cache_prompt_repeats: 1024
deepseek_v4_ik_experiment_watchdog_timeout_seconds: 25200
deepseek_v4_ik_experiment_heartbeat_stale_seconds: 1200
