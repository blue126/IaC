deepseek_v4_ik_api_port: 8081
deepseek_v4_ik_api_bind_address: 172.17.0.1
deepseek_v4_ik_api_probe_address: 127.0.0.1
deepseek_v4_ik_api_allowed_cidrs:
  - 127.0.0.0/8
  - 172.17.0.0/16
  - 172.18.0.0/16
deepseek_v4_ik_backend_api_port: 8082
deepseek_v4_ik_backend_api_bind_address: 127.0.0.1
deepseek_v4_ik_compat_service_unit: deepseek-v4-ik-compat.service
deepseek_v4_ik_compat_proxy_path: /usr/local/libexec/openai-compat-proxy.py
