deepseek_v4_ik_candidate_harness_dir: "{{ deepseek_v4_ik_install_dir }}/harness"
deepseek_v4_ik_compat_timeout_seconds: 1800
# 128K is the approved interactive coding target. The measured 128K KV cache
# uses about 5,504 MiB across both GPUs and retains headroom for one session.
deepseek_v4_ik_context_length: 131072
deepseek_v4_ik_cpu_threads: 32
deepseek_v4_ik_numa_mode: distribute
deepseek_v4_ik_batch_threads: 36
deepseek_v4_ik_disable_pinned_memory: false
deepseek_v4_ik_batch_size: 4096
deepseek_v4_ik_ubatch_size: 2048
deepseek_v4_ik_cache_ram_mib: 8192
# Stable production intentionally uses the pinned runtime default. Candidate
# controls can emit 32 explicitly to prove equivalence before a reduction.
deepseek_v4_ik_ctx_checkpoints: 32
deepseek_v4_ik_emit_ctx_checkpoints: false
deepseek_v4_ik_moe_mode: all_cpu
deepseek_v4_ik_n_cpu_moe: 0
deepseek_v4_ik_split_mode: layer
deepseek_v4_ik_main_unit: deepseek-v4.service
deepseek_v4_ik_service_unit: deepseek-v4-ik.service
deepseek_v4_ik_model_name: deepseek-v4-flash-gguf-candidate
deepseek_v4_ik_approved_command:
  - /opt/ik/bin/llama-server
  - --model
  - /models/DeepSeek-V4-Flash.gguf
  - --host
  - 0.0.0.0
  - --port
  - "8082"
  - --alias
  - deepseek-v4-flash-gguf-candidate
  - --ctx-size
  - "131072"
  - --threads
  - "32"
  - --numa
  - distribute
  - --threads-batch
  - "36"
  - --batch-size
  - "4096"
  - --ubatch-size
  - "2048"
  - --cache-ram
  - "8192"
  - --n-gpu-layers
  - "100"
  - --split-mode
  - layer
  - --cpu-moe
  - --flash-attn
  - "on"
  - --cache-type-k
  - f16
  - --cache-type-v
  - f16
  - --no-mmap
  - --jinja
  - --reasoning-format
  - deepseek
  - --no-display-prompt
deepseek_v4_ik_configured_command: >-
  {{ deepseek_v4_ik_approved_command[0:11]
  + (['--ctx-checkpoints', deepseek_v4_ik_ctx_checkpoints | string]
     if deepseek_v4_ik_emit_ctx_checkpoints | bool else [])
  + deepseek_v4_ik_approved_command[11:] }}
deepseek_v4_ik_evidence_dir: /var/lib/deepseek-v4-ik/evidence
deepseek_v4_ik_experiment_id: ""
deepseek_v4_ik_control_id: ""
deepseek_v4_ik_cache_intermediate_id: ""
deepseek_v4_ik_checkpoint_intermediate_id: ""
deepseek_v4_ik_experiment_primary_variable: ""
deepseek_v4_ik_checkpoint_diagnostic: false
deepseek_v4_ik_checkpoint_transition_repeats: 3
deepseek_v4_ik_reuse_verified_model_checksum: false
deepseek_v4_ik_model_checksum_proof_path: >-
  {{ deepseek_v4_ik_evidence_dir }}/model.sha256
deepseek_v4_ik_control_cache_ram_mib: 8192
deepseek_v4_ik_control_ctx_checkpoints: 32
deepseek_v4_ik_control_moe_mode: all_cpu
deepseek_v4_ik_control_n_cpu_moe: 0
deepseek_v4_ik_control_split_mode: layer
deepseek_v4_ik_control_experiment_dir: >-
  {{ deepseek_v4_ik_evidence_dir }}/{{ deepseek_v4_ik_control_id }}
