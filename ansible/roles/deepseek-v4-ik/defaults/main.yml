  deepseek-v4-ik-watchdog-{{ deepseek_v4_ik_experiment_id }}.service
deepseek_v4_ik_webui_container: open-webui
deepseek_v4_ik_webui_database_path: /opt/open-webui/data/webui.db
deepseek_v4_ik_webui_backup_dir: /var/backups/open-webui
deepseek_v4_ik_webui_expected_url: http://host.docker.internal:8080/v1
deepseek_v4_ik_webui_target_url: http://host.docker.internal:8081/v1
deepseek_v4_ik_download_container: deepseek-v4-ik-download
deepseek_v4_ik_platform: false
deepseek_v4_ik_platform_verify_only: false
deepseek_v4_ik_platform_allow_reboot: false
deepseek_v4_ik_platform_reboot_timeout_seconds: 900
# Platform pins are host-specific and must be supplied by inventory.  Empty
# defaults make accidental use on another GPU host fail before any mutation.
deepseek_v4_ik_platform_target_kernel: ""
deepseek_v4_ik_platform_kernel_package_version: ""
deepseek_v4_ik_platform_nvidia_package_version: ""
deepseek_v4_ik_platform_nvidia_module_version: ""
deepseek_v4_ik_platform_nvidia_driver_package: nvidia-driver-590-open
deepseek_v4_ik_platform_nvidia_module_package: >-
  linux-modules-nvidia-590-open-{{ deepseek_v4_ik_platform_target_kernel }}
deepseek_v4_ik_platform_package_bundle:
  - name: "linux-image-{{ deepseek_v4_ik_platform_target_kernel }}"
    version: "{{ deepseek_v4_ik_platform_kernel_package_version }}"
  - name: "linux-modules-{{ deepseek_v4_ik_platform_target_kernel }}"
    version: "{{ deepseek_v4_ik_platform_kernel_package_version }}"
  - name: "linux-headers-{{ deepseek_v4_ik_platform_target_kernel }}"
    version: "{{ deepseek_v4_ik_platform_kernel_package_version }}"
  - name: "{{ deepseek_v4_ik_platform_nvidia_module_package }}"
    version: "{{ deepseek_v4_ik_platform_kernel_package_version }}"
  - name: "{{ deepseek_v4_ik_platform_nvidia_driver_package }}"
    version: "{{ deepseek_v4_ik_platform_nvidia_package_version }}"
  - name: nvidia-utils-590
    version: "{{ deepseek_v4_ik_platform_nvidia_package_version }}"
deepseek_v4_ik_platform_tracking_packages: []
deepseek_v4_ik_platform_hold_packages: >-
  {{ ((deepseek_v4_ik_platform_package_bundle |
  map(attribute='name') | list) +
  deepseek_v4_ik_platform_tracking_packages) | unique | list }}
deepseek_v4_ik_platform_grub_menuentry: >-
  Advanced options for Ubuntu>Ubuntu, with Linux
  {{ deepseek_v4_ik_platform_target_kernel }}
deepseek_v4_ik_platform_grub_dropin_path: >-
  /etc/default/grub.d/99-deepseek-v4-kernel.cfg
deepseek_v4_ik_platform_unattended_policy_path: >-
  /etc/apt/apt.conf.d/52deepseek-v4-platform-pins
