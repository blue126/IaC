---
- name: Render the production GGUF Compose project
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ deepseek_v4_ik_install_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  register: deepseek_v4_ik_compose_config

- name: Create the local compatibility proxy directory
  ansible.builtin.file:
    path: /usr/local/libexec
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the local OpenAI compatibility proxy
  ansible.builtin.copy:
    src: openai-compat-proxy.py
    dest: "{{ deepseek_v4_ik_compat_proxy_path }}"
    owner: root
    group: root
    mode: "0755"
  register: deepseek_v4_ik_compat_proxy_code

- name: Install the versioned compatibility contract harness
  ansible.builtin.copy:
    src: "{{ role_path }}/../deepseek-v4/files/{{ item }}"
    dest: "/usr/local/libexec/{{ item }}"
    owner: root
    group: root
    mode: "{{ '0755' if item.endswith('.py') else '0644' }}"
  loop:
    - contract-runner.py
    - benchmark-runner.py
    - coding-cache-runner.py
    - experiment-watchdog.py
    - resource-sampler.py
    - runtime-log-sanitizer.py
    - topology-preflight.py
    - context-window-runner.py
    - soak-runner.py
    - api-fixtures-v1.json
    - correctness-corpus-v1.json
    - benchmark-corpus-v1.json

- name: Render the production GGUF systemd owner
  ansible.builtin.template:
    src: deepseek-v4-ik.service.j2
    dest: "/etc/systemd/system/{{ deepseek_v4_ik_service_unit }}"
    owner: root
    group: root
    mode: "0644"
  register: deepseek_v4_ik_service_unit_config
  notify: Reload systemd

- name: Render the OpenAI compatibility proxy owner
  ansible.builtin.template:
    src: deepseek-v4-ik-compat.service.j2
    dest: "/etc/systemd/system/{{ deepseek_v4_ik_compat_service_unit }}"
    owner: root
    group: root
    mode: "0644"
  register: deepseek_v4_ik_compat_proxy_unit
  notify: Reload systemd

- name: Flush systemd unit changes
  ansible.builtin.meta: flush_handlers

- name: Gather service facts before retiring the superseded owner
  ansible.builtin.service_facts:

- name: Stop and disable the superseded KTransformers owner
  ansible.builtin.systemd:
    name: "{{ deepseek_v4_ik_main_unit }}"
    state: stopped
    enabled: false
  when: >-
    deepseek_v4_ik_main_unit in ansible_facts.services
    and ansible_facts.services[deepseek_v4_ik_main_unit].status | default('not-found') != 'not-found'

- name: Inspect the current GGUF production owner state
  ansible.builtin.command:
    argv: [systemctl, is-active, "{{ deepseek_v4_ik_service_unit }}"]
  register: deepseek_v4_ik_service_state
  changed_when: false
  failed_when: false

- name: Enable and start the GGUF production owner
  ansible.builtin.systemd:
    name: "{{ deepseek_v4_ik_service_unit }}"
    state: >-
      {{ 'restarted' if (deepseek_v4_ik_compose_config.changed
      or deepseek_v4_ik_service_unit_config.changed
      or deepseek_v4_ik_service_state.rc != 0) else 'started' }}
    enabled: true

- name: Enable and start the OpenAI compatibility proxy
  ansible.builtin.systemd:
    name: "{{ deepseek_v4_ik_compat_service_unit }}"
    state: >-
      {{ 'restarted' if (deepseek_v4_ik_compat_proxy_code.changed
      or deepseek_v4_ik_compat_proxy_unit.changed
      or deepseek_v4_ik_compose_config.changed) else 'started' }}
    enabled: true

- name: Wait for the GGUF production API
  ansible.builtin.uri:
    url: "http://{{ deepseek_v4_ik_api_probe_address }}:{{ deepseek_v4_ik_api_port }}/health"
    status_code: 200
  register: deepseek_v4_ik_production_health
  retries: 120
  delay: 10
  until: deepseek_v4_ik_production_health.status == 200

- name: Run the production-facing compatibility API contract
  ansible.builtin.command: >-
    python3 {{ deepseek_v4_ik_contract_runner_path }}
    --base-url http://{{ deepseek_v4_ik_api_probe_address }}:{{ deepseek_v4_ik_api_port }}
    --model {{ deepseek_v4_ik_model_name }}
    --output {{ deepseek_v4_ik_evidence_dir }}/compatibility-contract.json
  register: deepseek_v4_ik_compatibility_contract
  changed_when: false

- name: Require the production-facing compatibility contract to pass
  ansible.builtin.assert:
    that:
      - (deepseek_v4_ik_compatibility_contract.stdout | from_json).status == 'pass'
    fail_msg: >-
      The proxy-facing API contract failed; inspect
      {{ deepseek_v4_ik_evidence_dir }}/compatibility-contract.json before using the service.

- name: Verify the candidate is reachable from Open WebUI
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ deepseek_v4_ik_webui_container }}"
      - curl
      - --fail
      - --silent
      - --show-error
      - "{{ deepseek_v4_ik_webui_target_url }}/models"
  changed_when: false

- name: Create the local administration script directory
  ansible.builtin.file:
    path: /usr/local/libexec
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: deepseek_v4_ik_manage_webui | bool

- name: Install the guarded Open WebUI connection updater
  ansible.builtin.copy:
    src: update-open-webui-connection.py
    dest: /usr/local/libexec/update-open-webui-connection.py
    owner: root
    group: root
    mode: "0750"
  when: deepseek_v4_ik_manage_webui | bool

- name: Render the Open WebUI production Compose project
  ansible.builtin.template:
    src: open-webui-compose.yml.j2
    dest: /opt/open-webui/docker-compose.yml
    owner: root
    group: root
    mode: "0644"
  when: deepseek_v4_ik_manage_webui | bool

- name: Stop Open WebUI before its SQLite connection migration
  community.docker.docker_container:
    name: "{{ deepseek_v4_ik_webui_container }}"
    state: stopped
  when: deepseek_v4_ik_manage_webui | bool

- name: Remove the stopped legacy Open WebUI container before Compose ownership changes
  community.docker.docker_container:
    name: "{{ deepseek_v4_ik_webui_container }}"
    state: absent
  when: deepseek_v4_ik_manage_webui | bool

- name: Switch the saved Open WebUI local endpoint to the GGUF service
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - /usr/local/libexec/update-open-webui-connection.py
      - --database
      - "{{ deepseek_v4_ik_webui_database_path }}"
      - --backup-dir
      - "{{ deepseek_v4_ik_webui_backup_dir }}"
      - --expected-url
      - "{{ deepseek_v4_ik_webui_expected_url }}"
      - --target-url
      - "{{ deepseek_v4_ik_webui_target_url }}"
  register: deepseek_v4_ik_webui_switch
  changed_when: "(deepseek_v4_ik_webui_switch.stdout | from_json).changed"
  when: deepseek_v4_ik_manage_webui | bool

- name: Recreate Open WebUI with its private host gateway mapping
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - up
      - --detach
      - --force-recreate
      - --no-deps
      - "{{ deepseek_v4_ik_webui_container }}"
  args:
    chdir: /opt/open-webui
  when: deepseek_v4_ik_manage_webui | bool

- name: Wait for Open WebUI to become healthy
  ansible.builtin.command:
    argv: [docker, inspect, "{{ deepseek_v4_ik_webui_container }}"]
  register: deepseek_v4_ik_webui_inspect
  changed_when: false
  retries: 60
  delay: 5
  until: >-
    (deepseek_v4_ik_webui_inspect.stdout | from_json)[0].State.Health.Status == 'healthy'
  when: deepseek_v4_ik_manage_webui | bool

- name: Remove legacy service units
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/deepseek-v4.service
    - /etc/systemd/system/llama-server@.service
  when: deepseek_v4_ik_remove_legacy | bool
  notify: Reload systemd

- name: Remove legacy model and runtime artifacts
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /opt/deepseek-v4
    - /opt/llm-server
    - /data/models/DeepSeek-V4-Flash-0731
    - /data/models/UD-Q5_K_XL
    - /data/models/glm-4.7-flash-abl
    - /data/models/qwen3-vl
  when: deepseek_v4_ik_remove_legacy | bool
  notify: Reload systemd

- name: Flush legacy unit retirement changes
  ansible.builtin.meta: flush_handlers
  when: deepseek_v4_ik_remove_legacy | bool
