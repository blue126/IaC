---
- name: Render the production GGUF Compose project
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ deepseek_v4_ik_install_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Render the production GGUF systemd owner
  ansible.builtin.template:
    src: deepseek-v4-ik.service.j2
    dest: "/etc/systemd/system/{{ deepseek_v4_ik_service_unit }}"
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Flush systemd unit changes
  ansible.builtin.meta: flush_handlers

- name: Stop and disable the superseded KTransformers owner
  ansible.builtin.systemd:
    name: "{{ deepseek_v4_ik_main_unit }}"
    state: stopped
    enabled: false

- name: Enable and start the GGUF production owner
  ansible.builtin.systemd:
    name: "{{ deepseek_v4_ik_service_unit }}"
    state: started
    enabled: true

- name: Wait for the GGUF production API
  ansible.builtin.uri:
    url: "http://{{ deepseek_v4_ik_api_bind_address }}:{{ deepseek_v4_ik_api_port }}/health"
    status_code: 200
  register: deepseek_v4_ik_production_health
  retries: 120
  delay: 10
  until: deepseek_v4_ik_production_health.status == 200

- name: Verify the candidate is reachable from Open WebUI
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ deepseek_v4_ik_webui_container }}"
      - curl
      - --fail
      - --silent
      - --show-error
      - "{{ deepseek_v4_ik_webui_target_url }}/models"
  changed_when: false

- name: Create the local administration script directory
  ansible.builtin.file:
    path: /usr/local/libexec
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the guarded Open WebUI connection updater
  ansible.builtin.copy:
    src: update-open-webui-connection.py
    dest: /usr/local/libexec/update-open-webui-connection.py
    owner: root
    group: root
    mode: "0750"

- name: Render the Open WebUI production Compose project
  ansible.builtin.template:
    src: open-webui-compose.yml.j2
    dest: /opt/open-webui/docker-compose.yml
    owner: root
    group: root
    mode: "0644"

- name: Stop Open WebUI before its SQLite connection migration
  community.docker.docker_container:
    name: "{{ deepseek_v4_ik_webui_container }}"
    state: stopped

- name: Remove the stopped legacy Open WebUI container before Compose ownership changes
  community.docker.docker_container:
    name: "{{ deepseek_v4_ik_webui_container }}"
    state: absent

- name: Switch the saved Open WebUI local endpoint to the GGUF service
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - /usr/local/libexec/update-open-webui-connection.py
      - --database
      - "{{ deepseek_v4_ik_webui_database_path }}"
      - --backup-dir
      - "{{ deepseek_v4_ik_webui_backup_dir }}"
      - --expected-url
      - "{{ deepseek_v4_ik_webui_expected_url }}"
      - --target-url
      - "{{ deepseek_v4_ik_webui_target_url }}"
  register: deepseek_v4_ik_webui_switch
  changed_when: "(deepseek_v4_ik_webui_switch.stdout | from_json).changed"

- name: Recreate Open WebUI with its private host gateway mapping
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - up
      - --detach
      - --force-recreate
      - --no-deps
      - "{{ deepseek_v4_ik_webui_container }}"
  args:
    chdir: /opt/open-webui

- name: Wait for Open WebUI to become healthy
  ansible.builtin.command:
    argv: [docker, inspect, "{{ deepseek_v4_ik_webui_container }}"]
  register: deepseek_v4_ik_webui_inspect
  changed_when: false
  retries: 60
  delay: 5
  until: >-
    (deepseek_v4_ik_webui_inspect.stdout | from_json)[0].State.Health.Status == 'healthy'

- name: Remove legacy service units
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/deepseek-v4.service
    - /etc/systemd/system/llama-server@.service
  when: deepseek_v4_ik_remove_legacy | bool
  notify: Reload systemd

- name: Remove legacy model and runtime artifacts
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /opt/deepseek-v4
    - /opt/llm-server
    - /data/models/DeepSeek-V4-Flash-0731
    - /data/models/UD-Q5_K_XL
    - /data/models/glm-4.7-flash-abl
    - /data/models/qwen3-vl
  when: deepseek_v4_ik_remove_legacy | bool
  notify: Reload systemd

- name: Flush legacy unit retirement changes
  ansible.builtin.meta: flush_handlers
  when: deepseek_v4_ik_remove_legacy | bool
