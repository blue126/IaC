---
- name: Refuse duplicate immutable evidence
  ansible.builtin.import_tasks: evidence-dir-guard.yml

- name: Inspect graph preflight evidence
  ansible.builtin.stat:
    path: "{{ deepseek_v4_ik_graph_preflight_evidence_path }}"
    checksum_algorithm: sha256
  register: deepseek_v4_ik_graph_preflight_stat
  when: deepseek_v4_ik_split_mode == 'graph'

- name: Inspect the named control manifest
  ansible.builtin.stat:
    path: "{{ deepseek_v4_ik_control_experiment_dir }}/manifest.json"
  register: deepseek_v4_ik_control_manifest_stat
  when:
    - deepseek_v4_ik_experiment_primary_variable != 'baseline'
    - not (deepseek_v4_ik_checkpoint_diagnostic | bool)

- name: Inspect the named control result
  ansible.builtin.stat:
    path: "{{ deepseek_v4_ik_control_experiment_dir }}/candidate-result.json"
  register: deepseek_v4_ik_control_result_stat
  when:
    - deepseek_v4_ik_experiment_primary_variable != 'baseline'
    - not (deepseek_v4_ik_checkpoint_diagnostic | bool)

- name: Inspect the named control benchmark
  ansible.builtin.stat:
    path: "{{ deepseek_v4_ik_control_experiment_dir }}/benchmark.json"
  register: deepseek_v4_ik_control_benchmark_stat
  when:
    - deepseek_v4_ik_experiment_primary_variable != 'baseline'
    - not (deepseek_v4_ik_checkpoint_diagnostic | bool)

- name: Inspect the named control qualification verdict
  ansible.builtin.stat:
    path: "{{ deepseek_v4_ik_control_experiment_dir }}/qualification.json"
  register: deepseek_v4_ik_control_qualification_stat
  when:
    - deepseek_v4_ik_experiment_primary_variable != 'baseline'
    - not (deepseek_v4_ik_checkpoint_diagnostic | bool)

- name: Require immutable control evidence
  ansible.builtin.assert:
    that:
      - deepseek_v4_ik_control_manifest_stat.stat.exists
      - deepseek_v4_ik_control_manifest_stat.stat.isreg
      - deepseek_v4_ik_control_result_stat.stat.exists
      - deepseek_v4_ik_control_result_stat.stat.isreg
      - deepseek_v4_ik_control_benchmark_stat.stat.exists
      - deepseek_v4_ik_control_benchmark_stat.stat.isreg
      - deepseek_v4_ik_control_qualification_stat.stat.exists
      - deepseek_v4_ik_control_qualification_stat.stat.isreg
    fail_msg: >-
      Non-baseline experiments require an existing immutable control manifest
      and lifecycle result under the declared control ID.
  when:
    - deepseek_v4_ik_experiment_primary_variable != 'baseline'
    - not (deepseek_v4_ik_checkpoint_diagnostic | bool)

- name: Read the named control evidence
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop:
    - "{{ deepseek_v4_ik_control_experiment_dir }}/manifest.json"
    - "{{ deepseek_v4_ik_control_experiment_dir }}/candidate-result.json"
    - "{{ deepseek_v4_ik_control_experiment_dir }}/benchmark.json"
    - "{{ deepseek_v4_ik_control_experiment_dir }}/qualification.json"
  register: deepseek_v4_ik_control_evidence
  when:
    - deepseek_v4_ik_experiment_primary_variable != 'baseline'
    - not (deepseek_v4_ik_checkpoint_diagnostic | bool)

- name: Parse the named control evidence
  ansible.builtin.set_fact:
    deepseek_v4_ik_control_manifest_document: >-
      {{ deepseek_v4_ik_control_evidence.results[0].content | b64decode | from_json }}
    deepseek_v4_ik_control_result_document: >-
      {{ deepseek_v4_ik_control_evidence.results[1].content | b64decode | from_json }}
    deepseek_v4_ik_control_benchmark_document: >-
      {{ deepseek_v4_ik_control_evidence.results[2].content | b64decode | from_json }}
    deepseek_v4_ik_control_qualification_document: >-
      {{ deepseek_v4_ik_control_evidence.results[3].content | b64decode | from_json }}
  when:
    - deepseek_v4_ik_experiment_primary_variable != 'baseline'
    - not (deepseek_v4_ik_checkpoint_diagnostic | bool)

- name: Require the declared control values and passing lifecycle evidence
  ansible.builtin.assert:
    that:
      - deepseek_v4_ik_control_manifest_document.experiment_id == deepseek_v4_ik_control_id
      - deepseek_v4_ik_control_manifest_document.runtime.commit == deepseek_v4_ik_commit
      - deepseek_v4_ik_control_manifest_document.runtime.image == deepseek_v4_ik_runtime_image
      - >-
        deepseek_v4_ik_control_manifest_document.runtime.binary_sha256 ==
        deepseek_v4_ik_binary_sha256
      - deepseek_v4_ik_control_manifest_document.model.sha256 == deepseek_v4_ik_model_sha256
      - >-
        deepseek_v4_ik_control_manifest_document.model.revision ==
        deepseek_v4_ik_model_revision
      - >-
        deepseek_v4_ik_control_manifest_document.candidate.cache_ram_mib |
        int == deepseek_v4_ik_control_cache_ram_mib | int
      - >-
        deepseek_v4_ik_control_manifest_document.candidate.ctx_checkpoints |
        default(32, true) | int == deepseek_v4_ik_control_ctx_checkpoints | int
      - >-
        deepseek_v4_ik_control_manifest_document.candidate.moe_mode ==
        deepseek_v4_ik_control_moe_mode
      - >-
        deepseek_v4_ik_control_manifest_document.candidate.n_cpu_moe | int ==
        deepseek_v4_ik_control_n_cpu_moe | int
      - >-
        deepseek_v4_ik_control_manifest_document.candidate.split_mode ==
        deepseek_v4_ik_control_split_mode
      - deepseek_v4_ik_control_result_document.contract_rc | int == 0
      - >-
        deepseek_v4_ik_experiment_primary_variable == 'ctx_checkpoints' or
        (deepseek_v4_ik_control_qualification_document.status == 'pass' and
        deepseek_v4_ik_control_qualification_document.accepted | bool)
      - >-
        (deepseek_v4_ik_control_manifest_document.primary_variable in
        ['baseline', 'cache_ram_mib'] and
        deepseek_v4_ik_control_result_document.benchmark_rc | int in [0, 1]) or
        (deepseek_v4_ik_control_manifest_document.primary_variable not in
        ['baseline', 'cache_ram_mib'] and
        deepseek_v4_ik_control_result_document.benchmark_rc | int == 0)
      - deepseek_v4_ik_control_benchmark_document.schema_version | int == 2
      - deepseek_v4_ik_control_benchmark_document.cold_prefill | bool
      - deepseek_v4_ik_control_benchmark_document.results | length == 2
      - >-
        deepseek_v4_ik_control_benchmark_document.results |
        map(attribute='id') | list == ['1k', '8k']
      - >-
        deepseek_v4_ik_control_benchmark_document.results[0].median_tg_tokens_per_second
        | float > 0
      - >-
        deepseek_v4_ik_control_benchmark_document.results[1].median_tg_tokens_per_second
        | float > 0
      - >-
        deepseek_v4_ik_control_manifest_document.primary_variable in
        ['baseline', 'cache_ram_mib'] or
        deepseek_v4_ik_control_benchmark_document.status == 'pass'
      - >-
        deepseek_v4_ik_control_manifest_document.primary_variable not in
        ['baseline', 'cache_ram_mib'] or
        deepseek_v4_ik_control_result_document.cache_benchmark_rc | int == 0
      - deepseek_v4_ik_control_result_document.final_owner == 'active'
      - deepseek_v4_ik_control_result_document.final_proxy == 'active'
      - deepseek_v4_ik_control_result_document.final_health_status | int == 200
    fail_msg: >-
      The named control must match the declared values, current pins, full
      contract, benchmark, restored owner, proxy, and stable health evidence.
  when:
    - deepseek_v4_ik_experiment_primary_variable != 'baseline'
    - not (deepseek_v4_ik_checkpoint_diagnostic | bool)

- name: Inspect the final qualification control for checkpoint diagnosis
  ansible.builtin.stat:
    path: "{{ deepseek_v4_ik_control_experiment_dir }}/{{ item }}"
  loop:
    - manifest.json
    - context-128k.json
    - contract-post.json
    - soak.json
    - resources-context-summary.json
  register: deepseek_v4_ik_diagnostic_control_stats
  when: deepseek_v4_ik_checkpoint_diagnostic | bool

- name: Require complete final qualification control evidence
  ansible.builtin.assert:
    that:
      - deepseek_v4_ik_diagnostic_control_stats.results | length == 5
      - >-
        deepseek_v4_ik_diagnostic_control_stats.results |
        selectattr('stat.exists', 'equalto', true) | list | length == 5
      - >-
        deepseek_v4_ik_diagnostic_control_stats.results |
        selectattr('stat.isreg', 'equalto', true) | list | length == 5
    fail_msg: >-
      Single-repeat diagnosis requires the complete immutable R6 final
      qualification evidence set.
  when: deepseek_v4_ik_checkpoint_diagnostic | bool

- name: Read the final qualification control evidence
  ansible.builtin.slurp:
    src: "{{ deepseek_v4_ik_control_experiment_dir }}/{{ item }}"
  loop:
    - manifest.json
    - context-128k.json
    - contract-post.json
    - soak.json
    - resources-context-summary.json
  register: deepseek_v4_ik_diagnostic_control_evidence
  when: deepseek_v4_ik_checkpoint_diagnostic | bool

- name: Parse the final qualification control evidence
  ansible.builtin.set_fact:
    deepseek_v4_ik_diagnostic_control_manifest: >-
      {{ deepseek_v4_ik_diagnostic_control_evidence.results[0].content |
      b64decode | from_json }}
    deepseek_v4_ik_diagnostic_control_context: >-
      {{ deepseek_v4_ik_diagnostic_control_evidence.results[1].content |
      b64decode | from_json }}
    deepseek_v4_ik_diagnostic_control_contract: >-
      {{ deepseek_v4_ik_diagnostic_control_evidence.results[2].content |
      b64decode | from_json }}
    deepseek_v4_ik_diagnostic_control_soak: >-
      {{ deepseek_v4_ik_diagnostic_control_evidence.results[3].content |
      b64decode | from_json }}
    deepseek_v4_ik_diagnostic_control_resources: >-
      {{ deepseek_v4_ik_diagnostic_control_evidence.results[4].content |
      b64decode | from_json }}
  when: deepseek_v4_ik_checkpoint_diagnostic | bool

- name: Require the exact known R6 checkpoint control
  ansible.builtin.assert:
    that:
      - >-
        deepseek_v4_ik_diagnostic_control_manifest.qualification_id ==
        deepseek_v4_ik_control_id
      - >-
        deepseek_v4_ik_diagnostic_control_manifest.runtime_commit ==
        deepseek_v4_ik_commit
      - >-
        deepseek_v4_ik_diagnostic_control_manifest.runtime_image ==
        deepseek_v4_ik_runtime_image
      - >-
        deepseek_v4_ik_diagnostic_control_manifest.runtime_binary_sha256 ==
        deepseek_v4_ik_binary_sha256
      - >-
        deepseek_v4_ik_diagnostic_control_manifest.model_sha256 ==
        deepseek_v4_ik_model_sha256
      - deepseek_v4_ik_diagnostic_control_manifest.context_length | int == 131072
      - deepseek_v4_ik_diagnostic_control_manifest.cache_ram_mib | int == 8192
      - deepseek_v4_ik_diagnostic_control_manifest.moe_mode == 'all_cpu'
      - deepseek_v4_ik_diagnostic_control_manifest.split_mode == 'layer'
      - deepseek_v4_ik_diagnostic_control_context.status == 'pass'
      - deepseek_v4_ik_diagnostic_control_context.target_prompt_tokens | int == 127000
      - deepseek_v4_ik_diagnostic_control_context.observed_prompt_tokens | int == 126992
      - deepseek_v4_ik_diagnostic_control_context.answer_matches | bool
      - deepseek_v4_ik_diagnostic_control_contract.status == 'pass'
      - deepseek_v4_ik_diagnostic_control_contract.results | length == 19
      - deepseek_v4_ik_diagnostic_control_soak.status == 'fail'
      - deepseek_v4_ik_diagnostic_control_soak.health_failures | int == 1
      - deepseek_v4_ik_diagnostic_control_soak.completion_count | int == 12
      - deepseek_v4_ik_diagnostic_control_soak.completion_failures | int == 0
      - deepseek_v4_ik_diagnostic_control_resources.host.maximum_swap_used_bytes | int == 0
      - deepseek_v4_ik_diagnostic_control_resources.host.oom_kill_count_delta | int == 0
      - >-
        deepseek_v4_ik_diagnostic_control_resources.container.maximum_restart_count |
        int == 0
    fail_msg: >-
      Diagnostic control is not the pinned, correct, resource-stable R6 run
      with the single known health-availability failure.
  when: deepseek_v4_ik_checkpoint_diagnostic | bool

- name: Require graph preflight evidence to be a regular file
  ansible.builtin.assert:
    that:
      - deepseek_v4_ik_graph_preflight_stat.stat.exists
      - deepseek_v4_ik_graph_preflight_stat.stat.isreg
    fail_msg: Graph split requires existing two-GPU topology and P2P evidence.
  when: deepseek_v4_ik_split_mode == 'graph'

- name: Read graph preflight evidence
  ansible.builtin.slurp:
    src: "{{ deepseek_v4_ik_graph_preflight_evidence_path }}"
  register: deepseek_v4_ik_graph_preflight
  when: deepseek_v4_ik_split_mode == 'graph'

- name: Parse graph preflight evidence
  ansible.builtin.set_fact:
    deepseek_v4_ik_graph_preflight_document: >-
      {{ deepseek_v4_ik_graph_preflight.content | b64decode | from_json }}
  when: deepseek_v4_ik_split_mode == 'graph'

- name: Validate graph topology and P2P results
  ansible.builtin.assert:
    that:
      - deepseek_v4_ik_graph_preflight_document.gpu_topology.returncode | int == 0
      - deepseek_v4_ik_graph_preflight_document.gpu_p2p_read.returncode | int == 0
      - deepseek_v4_ik_graph_preflight_document.gpu_count | int == 2
      - deepseek_v4_ik_graph_preflight_document.p2p_bandwidth_latency.returncode | int == 0
      - deepseek_v4_ik_graph_preflight_document.nvidia_p2p_read_enabled | bool
      - deepseek_v4_ik_graph_preflight_document.nvidia_p2p_write_enabled | bool
      - deepseek_v4_ik_graph_preflight_document.p2p_enabled_matrix_reported | bool
      - deepseek_v4_ik_graph_preflight_document.status == 'pass'
    fail_msg: Graph preflight must contain successful two-GPU topology and P2P checks.
  when: deepseek_v4_ik_split_mode == 'graph'

- name: Verify the candidate GGUF checksum
  ansible.builtin.stat:
    path: "{{ deepseek_v4_ik_model_path }}"
    checksum_algorithm: sha256
    get_checksum: "{{ not (deepseek_v4_ik_reuse_verified_model_checksum | bool) }}"
  register: deepseek_v4_ik_candidate_model_stat

- name: Inspect the reusable model checksum proof
  ansible.builtin.stat:
    path: "{{ deepseek_v4_ik_model_checksum_proof_path }}"
  register: deepseek_v4_ik_model_checksum_proof_stat
  when: deepseek_v4_ik_reuse_verified_model_checksum | bool

- name: Read the reusable model checksum proof
  ansible.builtin.slurp:
    src: "{{ deepseek_v4_ik_model_checksum_proof_path }}"
  register: deepseek_v4_ik_model_checksum_proof
  when:
    - deepseek_v4_ik_reuse_verified_model_checksum | bool
    - deepseek_v4_ik_model_checksum_proof_stat.stat.exists | default(false)

- name: Read the candidate ik_llama source revision
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ deepseek_v4_ik_source_dir }}"
      - rev-parse
      - HEAD
  register: deepseek_v4_ik_candidate_source_revision
  changed_when: false

- name: Verify the candidate llama-server binary checksum
  ansible.builtin.stat:
    path: "{{ deepseek_v4_ik_build_dir }}/bin/llama-server"
    checksum_algorithm: sha256
  register: deepseek_v4_ik_candidate_binary_stat

- name: Require pinned candidate artifacts before stopping production
  ansible.builtin.assert:
    that:
      - deepseek_v4_ik_candidate_model_stat.stat.exists
      - deepseek_v4_ik_candidate_model_stat.stat.isreg
      - not deepseek_v4_ik_candidate_model_stat.stat.islnk
      - deepseek_v4_ik_candidate_model_stat.stat.size | int == deepseek_v4_ik_model_size_bytes | int
      - >-
        (not (deepseek_v4_ik_reuse_verified_model_checksum | bool) and
        deepseek_v4_ik_candidate_model_stat.stat.checksum == deepseek_v4_ik_model_sha256) or
        (deepseek_v4_ik_reuse_verified_model_checksum | bool and
        deepseek_v4_ik_model_checksum_proof_stat.stat.exists | default(false) and
        deepseek_v4_ik_model_checksum_proof_stat.stat.isreg | default(false) and
        deepseek_v4_ik_model_checksum_proof_stat.stat.pw_name | default('') == 'root' and
        deepseek_v4_ik_model_checksum_proof_stat.stat.mtime | float >=
        deepseek_v4_ik_candidate_model_stat.stat.mtime | float and
        (deepseek_v4_ik_model_checksum_proof.content | b64decode | trim) ==
        deepseek_v4_ik_model_sha256 ~ '  ' ~ deepseek_v4_ik_model_path)
      - deepseek_v4_ik_candidate_source_revision.stdout | trim == deepseek_v4_ik_commit
      - deepseek_v4_ik_candidate_binary_stat.stat.exists
      - deepseek_v4_ik_candidate_binary_stat.stat.isreg
      - >-
        deepseek_v4_ik_candidate_binary_stat.stat.checksum ==
        deepseek_v4_ik_binary_sha256
    fail_msg: >-
      Candidate artifacts drifted from the approved model and runtime pins.

- name: Inspect initial production owner state
  ansible.builtin.command:
    argv: [systemctl, is-active, "{{ deepseek_v4_ik_service_unit }}"]
  register: deepseek_v4_ik_initial_owner
  changed_when: false
  failed_when: false

- name: Inspect initial compatibility proxy state
  ansible.builtin.command:
    argv: [systemctl, is-active, "{{ deepseek_v4_ik_compat_service_unit }}"]
  register: deepseek_v4_ik_initial_proxy
  changed_when: false
  failed_when: false

- name: Inspect superseded owner state
  ansible.builtin.command:
    argv: [systemctl, is-active, "{{ deepseek_v4_ik_main_unit }}"]
  register: deepseek_v4_ik_initial_superseded_owner
  changed_when: false
  failed_when: false

- name: Inspect compatibility proxy lifecycle dependencies
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - "{{ deepseek_v4_ik_compat_service_unit }}"
      - --property=Requires,PartOf
  register: deepseek_v4_ik_proxy_dependencies
  changed_when: false

- name: Resolve the production control container
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-name
      - "{{ deepseek_v4_ik_compose_project }}"
      - --file
      - "{{ deepseek_v4_ik_install_dir }}/docker-compose.yml"
      - ps
      - --quiet
      - candidate
  register: deepseek_v4_ik_initial_container_id
  changed_when: false

- name: Inspect the production control container
  ansible.builtin.command:
    argv:
      - docker
      - container
      - inspect
      - "{{ deepseek_v4_ik_initial_container_id.stdout | trim }}"
  register: deepseek_v4_ik_initial_container_inspect
  changed_when: false

- name: Parse the production control container
  ansible.builtin.set_fact:
    deepseek_v4_ik_initial_container_document: >-
      {{ (deepseek_v4_ik_initial_container_inspect.stdout | from_json)[0] }}

- name: Inspect checkpoint option support in the pinned runtime container
  ansible.builtin.command:
    argv:
      - docker
      - container
      - exec
      - "{{ deepseek_v4_ik_initial_container_id.stdout | trim }}"
      - /opt/ik/bin/llama-server
      - --help
  register: deepseek_v4_ik_checkpoint_help
  changed_when: false
  failed_when: false
  no_log: true
  when: deepseek_v4_ik_emit_ctx_checkpoints | bool

- name: Require checkpoint option support before a checkpoint experiment
  ansible.builtin.assert:
    that:
      - "'--ctx-checkpoints' in deepseek_v4_ik_checkpoint_help.stdout"
    fail_msg: >-
      The pinned runtime container does not advertise --ctx-checkpoints; do not
      infer its availability or default from another revision.
  when: deepseek_v4_ik_emit_ctx_checkpoints | bool

- name: Require one stable control owner and an independent proxy
  ansible.builtin.assert:
    that:
      - deepseek_v4_ik_initial_owner.stdout | trim == 'active'
      - deepseek_v4_ik_initial_proxy.stdout | trim == 'active'
      - deepseek_v4_ik_initial_superseded_owner.stdout | trim != 'active'
      - deepseek_v4_ik_service_unit not in deepseek_v4_ik_proxy_dependencies.stdout
      - deepseek_v4_ik_initial_container_document.State.Running | bool
      - >-
        deepseek_v4_ik_initial_container_document.Config.Image ==
        deepseek_v4_ik_runtime_image
      - >-
        deepseek_v4_ik_initial_container_document.Config.Cmd ==
        deepseek_v4_ik_approved_command
      - >-
        deepseek_v4_ik_initial_container_document.Config.Entrypoint in
        [none, []]
      - not (deepseek_v4_ik_initial_container_document.HostConfig.Privileged | bool)
      - >-
        'CUDA_VISIBLE_DEVICES=0,1' in
        deepseek_v4_ik_initial_container_document.Config.Env
      - >-
        'GGML_CUDA_NO_PINNED=1' not in
        deepseek_v4_ik_initial_container_document.Config.Env
      - >-
        deepseek_v4_ik_initial_container_document.Mounts |
        selectattr('Source', 'equalto', deepseek_v4_ik_model_dir) |
        selectattr('RW', 'equalto', false) | list | length == 1
    fail_msg: >-
      Qualification must start from the active production control with the
      stable proxy active and lifecycle-independent.

- name: Create the immutable experiment evidence directory
  ansible.builtin.file:
    path: "{{ deepseek_v4_ik_experiment_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Create the experiment harness directory
  ansible.builtin.file:
    path: "{{ deepseek_v4_ik_experiment_dir }}/harness"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Install the experiment harness
  ansible.builtin.copy:
    src: "{{ role_path }}/../deepseek-v4/files/{{ item }}"
    dest: "{{ deepseek_v4_ik_experiment_dir }}/harness/{{ item }}"
    owner: root
    group: root
    mode: "{{ '0750' if item.endswith('.py') else '0640' }}"
  loop:
    - contract-runner.py
    - benchmark-runner.py
    - coding-cache-runner.py
    - checkpoint-transition-runner.py
    - context-window-runner.py
    - experiment-watchdog.py
    - experiment-verdict.py
    - resource-sampler.py
    - runtime-log-sanitizer.py
    - topology-preflight.py
    - api-fixtures-v1.json
    - correctness-corpus-v1.json
    - benchmark-corpus-v1.json

- name: Validate the complete named control before service changes
  ansible.builtin.command:
    argv:
      - python3
      - "{{ deepseek_v4_ik_experiment_dir }}/harness/experiment-verdict.py"
      - --validate-control-dir
      - "{{ deepseek_v4_ik_control_experiment_dir }}"
      - --require-checkpoint-transition
  changed_when: false
  when:
    - deepseek_v4_ik_experiment_primary_variable != 'baseline'
    - deepseek_v4_ik_experiment_primary_variable == 'ctx_checkpoints'
    - not (deepseek_v4_ik_checkpoint_diagnostic | bool)

- name: Validate the complete named control before non-checkpoint service changes
  ansible.builtin.command:
    argv:
      - python3
      - "{{ deepseek_v4_ik_experiment_dir }}/harness/experiment-verdict.py"
      - --validate-control-dir
      - "{{ deepseek_v4_ik_control_experiment_dir }}"
  changed_when: false
  when:
    - deepseek_v4_ik_experiment_primary_variable not in ['baseline', 'ctx_checkpoints']

- name: Validate the rejected 16 GiB cache step before a 32 GiB test
  ansible.builtin.command:
    argv:
      - python3
      - "{{ deepseek_v4_ik_experiment_dir }}/harness/experiment-verdict.py"
      - --validate-cache-intermediate-dir
      - "{{ deepseek_v4_ik_cache_intermediate_dir }}"
  changed_when: false
  when:
    - deepseek_v4_ik_experiment_primary_variable == 'cache_ram_mib'
    - deepseek_v4_ik_cache_ram_mib | int == 32768

- name: Validate the rejected 8-checkpoint step before a 4-checkpoint test
  ansible.builtin.command:
    argv:
      - python3
      - "{{ deepseek_v4_ik_experiment_dir }}/harness/experiment-verdict.py"
      - --validate-checkpoint-intermediate-dir
      - "{{ deepseek_v4_ik_evidence_dir }}/{{ deepseek_v4_ik_checkpoint_intermediate_id }}"
  changed_when: false
  when:
    - deepseek_v4_ik_experiment_primary_variable == 'ctx_checkpoints'
    - deepseek_v4_ik_ctx_checkpoints | int == 4

- name: Recapture graph topology immediately before service changes
  ansible.builtin.command:
    argv: >-
      {{
        ['python3',
         deepseek_v4_ik_experiment_dir ~ '/harness/topology-preflight.py',
         '--output',
         deepseek_v4_ik_experiment_dir ~ '/graph-preflight-current.json']
        + (['--p2p-binary', deepseek_v4_ik_graph_preflight_document.p2p_binary]
           if deepseek_v4_ik_graph_preflight_document.p2p_binary | default('') |
           length > 0 else [])
      }}
  register: deepseek_v4_ik_graph_preflight_current_result
  changed_when: false
  failed_when: false
  when: deepseek_v4_ik_split_mode == 'graph'

- name: Read current graph topology evidence
  ansible.builtin.slurp:
    src: "{{ deepseek_v4_ik_experiment_dir }}/graph-preflight-current.json"
  register: deepseek_v4_ik_graph_preflight_current
  when:
    - deepseek_v4_ik_split_mode == 'graph'
    - deepseek_v4_ik_graph_preflight_current_result.rc == 0

- name: Parse current graph topology evidence
  ansible.builtin.set_fact:
    deepseek_v4_ik_graph_preflight_current_document: >-
      {{ deepseek_v4_ik_graph_preflight_current.content |
      default('e30=') | b64decode | from_json }}
  when: deepseek_v4_ik_split_mode == 'graph'

- name: Require fresh graph topology identity and P2P eligibility
  ansible.builtin.assert:
    that:
      - deepseek_v4_ik_graph_preflight_current_result.rc == 0
      - >-
        deepseek_v4_ik_graph_preflight_current_document.get(
        'status', 'missing') == 'pass'
      - >-
        deepseek_v4_ik_graph_preflight_current_document.get(
        'gpu_identity', {}).get('stdout', 'missing') ==
        deepseek_v4_ik_graph_preflight_document.gpu_identity.stdout
      - >-
        deepseek_v4_ik_graph_preflight_current_document.get(
        'gpu_topology', {}).get('stdout', 'missing') ==
        deepseek_v4_ik_graph_preflight_document.gpu_topology.stdout
      - >-
        deepseek_v4_ik_graph_preflight_current_document.get(
        'gpu_pcie', {}).get('stdout', 'missing') ==
        deepseek_v4_ik_graph_preflight_document.gpu_pcie.stdout
      - >-
        deepseek_v4_ik_graph_preflight_current_document.get(
        'runner_sha256', 'missing') ==
        deepseek_v4_ik_graph_preflight_document.runner_sha256
    fail_msg: >-
      Graph topology, GPU identity, PCIe state, runner, or P2P eligibility
      changed since the named preflight evidence was captured.
  when: deepseek_v4_ik_split_mode == 'graph'

- name: Render the isolated experiment Compose project
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ deepseek_v4_ik_experiment_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"

- name: Validate the isolated experiment Compose project
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-name
      - "{{ deepseek_v4_ik_experiment_compose_project }}"
      - --file
      - "{{ deepseek_v4_ik_experiment_dir }}/docker-compose.yml"
      - config
      - --quiet
  changed_when: false

- name: Preserve graph preflight evidence with the experiment
  ansible.builtin.copy:
    src: "{{ deepseek_v4_ik_graph_preflight_evidence_path }}"
    dest: "{{ deepseek_v4_ik_experiment_dir }}/graph-preflight.json"
    remote_src: true
    owner: root
    group: root
    mode: "0640"
  when: deepseek_v4_ik_split_mode == 'graph'

- name: Save the experiment manifest before service changes
  ansible.builtin.copy:
    content: >-
      {{ {
        'schema_version': 1,
        'experiment_id': deepseek_v4_ik_experiment_id,
        'control_id': deepseek_v4_ik_control_id,
        'primary_variable': deepseek_v4_ik_experiment_primary_variable,
        'runtime': {
          'commit': deepseek_v4_ik_commit,
          'image': deepseek_v4_ik_runtime_image,
          'binary_sha256': deepseek_v4_ik_candidate_binary_stat.stat.checksum
        },
        'model': {
          'revision': deepseek_v4_ik_model_revision,
          'sha256': deepseek_v4_ik_model_sha256
        },
          'candidate': {
            'cache_ram_mib': deepseek_v4_ik_cache_ram_mib | int,
            'ctx_checkpoints': deepseek_v4_ik_ctx_checkpoints | int,
            'ctx_checkpoints_explicit': deepseek_v4_ik_emit_ctx_checkpoints | bool,
            'checkpoint_diagnostic': deepseek_v4_ik_checkpoint_diagnostic | bool,
            'checkpoint_transition_repeats': deepseek_v4_ik_checkpoint_transition_repeats | int,
            'model_integrity_mode': (
              'reused-verified-proof'
              if deepseek_v4_ik_reuse_verified_model_checksum | bool
              else 'fresh-sha256'
            ),
            'cache_prompt_repeats': deepseek_v4_ik_cache_prompt_repeats | int,
          'moe_mode': deepseek_v4_ik_moe_mode,
          'n_cpu_moe': deepseek_v4_ik_n_cpu_moe | int,
          'split_mode': deepseek_v4_ik_split_mode,
          'context_length': deepseek_v4_ik_context_length | int,
          'benchmark_tg_threshold': (
            0
            if deepseek_v4_ik_experiment_primary_variable in
            ['baseline', 'cache_ram_mib'] else 8
          ),
          'gpu_devices': ['0', '1']
        },
        'control': {
          'cache_ram_mib': deepseek_v4_ik_control_cache_ram_mib | int,
          'ctx_checkpoints': deepseek_v4_ik_control_ctx_checkpoints | int,
          'moe_mode': deepseek_v4_ik_control_moe_mode,
          'n_cpu_moe': deepseek_v4_ik_control_n_cpu_moe | int,
          'split_mode': deepseek_v4_ik_control_split_mode
        },
        'initial_state': {
          'owner': deepseek_v4_ik_initial_owner.stdout | trim,
          'proxy': deepseek_v4_ik_initial_proxy.stdout | trim,
          'container_id': deepseek_v4_ik_initial_container_id.stdout | trim,
          'container_image': deepseek_v4_ik_initial_container_document.Config.Image,
          'container_command': deepseek_v4_ik_initial_container_document.Config.Cmd
        },
        'contract_case_count': 19,
        'backend_bind': deepseek_v4_ik_backend_api_bind_address,
        'graph_preflight_sha256': (
          deepseek_v4_ik_graph_preflight_stat.stat.checksum
          if deepseek_v4_ik_split_mode == 'graph' else none
        )
      } | to_nice_json }}
    dest: "{{ deepseek_v4_ik_experiment_dir }}/manifest.json"
    owner: root
    group: root
    mode: "0640"

- name: Capture pre-experiment resources
  ansible.builtin.command:
    argv:
      - python3
      - "{{ deepseek_v4_ik_experiment_dir }}/harness/resource-sampler.py"
      - --output
      - "{{ deepseek_v4_ik_experiment_dir }}/resources-pre.jsonl"
      - --summary-output
      - "{{ deepseek_v4_ik_experiment_dir }}/resources-pre-summary.json"
      - --compose-project
      - "{{ deepseek_v4_ik_experiment_compose_project }}"
      - --service-unit
      - "{{ deepseek_v4_ik_service_unit }}"
      - --service-unit
      - "{{ deepseek_v4_ik_compat_service_unit }}"
  changed_when: false

- name: Read pre-experiment resource safety evidence
  ansible.builtin.slurp:
    src: "{{ deepseek_v4_ik_experiment_dir }}/resources-pre-summary.json"
  register: deepseek_v4_ik_pre_resources

- name: Require safe host and GPU headroom before service changes
  ansible.builtin.assert:
    that:
      - >-
        (deepseek_v4_ik_pre_resources.content | b64decode |
        from_json).host.minimum_memavailable_bytes | int >=
        deepseek_v4_ik_minimum_memavailable_bytes | int
      - >-
        (deepseek_v4_ik_pre_resources.content | b64decode |
        from_json).host.maximum_swap_used_bytes is not none
      - >-
        (deepseek_v4_ik_pre_resources.content | b64decode |
        from_json).host.maximum_swap_used_bytes | int == 0
      - >-
        (deepseek_v4_ik_pre_resources.content | b64decode |
        from_json).gpus | length == 2
      - >-
        (deepseek_v4_ik_pre_resources.content | b64decode |
        from_json).gpus['0'].minimum_memory_free_mib | int >=
        deepseek_v4_ik_minimum_gpu_free_mib | int
      - >-
        (deepseek_v4_ik_pre_resources.content | b64decode |
        from_json).gpus['1'].minimum_memory_free_mib | int >=
        deepseek_v4_ik_minimum_gpu_free_mib | int
      - >-
        (deepseek_v4_ik_pre_resources.content | b64decode |
        from_json).services[deepseek_v4_ik_service_unit].collection_complete |
        bool
      - >-
        (deepseek_v4_ik_pre_resources.content | b64decode |
        from_json).services[deepseek_v4_ik_compat_service_unit].collection_complete |
        bool
      - >-
        (deepseek_v4_ik_pre_resources.content | b64decode |
        from_json).services[deepseek_v4_ik_service_unit].maximum_restarts | int == 0
      - >-
        (deepseek_v4_ik_pre_resources.content | b64decode |
        from_json).services[deepseek_v4_ik_compat_service_unit].maximum_restarts |
        int == 0
    fail_msg: >-
      Candidate execution requires zero swap/restarts, at least 32 GiB
      MemAvailable, complete service evidence, and 2 GiB free on each GPU.

- name: Initialize the managed-host experiment heartbeat
  ansible.builtin.file:
    path: "{{ deepseek_v4_ik_experiment_dir }}/watchdog.heartbeat"
    state: touch
    owner: root
    group: root
    mode: "0640"

- name: Arm managed-host experiment recovery watchdog
  ansible.builtin.command:
    argv:
      - systemd-run
      - "--unit={{ deepseek_v4_ik_experiment_watchdog_unit }}"
      - --collect
      - --property=Type=simple
      # Cover the watchdog deadline plus worst-case candidate teardown,
      # stable-owner starts, health retries, and evidence persistence.
      - "--property=RuntimeMaxSec={{ (deepseek_v4_ik_experiment_watchdog_timeout_seconds | int) + 3600 }}"
      - /usr/bin/python3
      - "{{ deepseek_v4_ik_experiment_dir }}/harness/experiment-watchdog.py"
      - --compose-file
      - "{{ deepseek_v4_ik_experiment_dir }}/docker-compose.yml"
      - --project-name
      - "{{ deepseek_v4_ik_experiment_compose_project }}"
      - --service-unit
      - "{{ deepseek_v4_ik_service_unit }}"
      - --proxy-unit
      - "{{ deepseek_v4_ik_compat_service_unit }}"
      - --disarm-file
      - "{{ deepseek_v4_ik_experiment_dir }}/watchdog.disarm"
      - --status-output
      - "{{ deepseek_v4_ik_experiment_dir }}/watchdog-status.json"
      - --timeout-seconds
      - "{{ deepseek_v4_ik_experiment_watchdog_timeout_seconds }}"
      - --heartbeat-file
      - "{{ deepseek_v4_ik_experiment_dir }}/watchdog.heartbeat"
      - --heartbeat-stale-seconds
      - "{{ deepseek_v4_ik_experiment_heartbeat_stale_seconds }}"
      - --abort-file
      - "{{ deepseek_v4_ik_experiment_dir }}/resource-abort.json"
      - --health-url
      - "http://{{ deepseek_v4_ik_api_probe_address }}:{{ deepseek_v4_ik_api_port }}/health"
  register: deepseek_v4_ik_watchdog_start
  changed_when: deepseek_v4_ik_watchdog_start.rc == 0

- name: Require the managed-host recovery watchdog
  ansible.builtin.command:
    argv: [systemctl, is-active, "{{ deepseek_v4_ik_experiment_watchdog_unit }}"]
  register: deepseek_v4_ik_watchdog_active
  changed_when: false
  failed_when: deepseek_v4_ik_watchdog_active.stdout | trim != 'active'

- name: Run candidate verification with guaranteed control restoration
  block:
    - name: Stop the active production owner for exclusive candidate access
      ansible.builtin.systemd:
        name: "{{ deepseek_v4_ik_service_unit }}"
        state: stopped

    - name: Wait for exclusive backend port release
      ansible.builtin.wait_for:
        host: "{{ deepseek_v4_ik_backend_api_bind_address }}"
        port: "{{ deepseek_v4_ik_backend_api_port }}"
        state: stopped
        timeout: 60

    - name: Wait for both GPUs after production teardown
      ansible.builtin.command:
        argv:
          - nvidia-smi
          - --query-gpu=index
          - --format=csv,noheader,nounits
      register: deepseek_v4_ik_post_teardown_gpus
      changed_when: false
      retries: 60
      delay: 2
      until: >-
        deepseek_v4_ik_post_teardown_gpus.rc == 0 and
        (deepseek_v4_ik_post_teardown_gpus.stdout_lines |
        map('trim') | reject('equalto', '') | sort | list) == ['0', '1']

    - name: Refresh the experiment heartbeat before candidate startup
      ansible.builtin.file:
        path: "{{ deepseek_v4_ik_experiment_dir }}/watchdog.heartbeat"
        state: touch
        owner: root
        group: root
        mode: "0640"

    - name: Start continuous experiment resource sampling
      ansible.builtin.command:
        argv:
          - python3
          - "{{ deepseek_v4_ik_experiment_dir }}/harness/resource-sampler.py"
          - --output
          - "{{ deepseek_v4_ik_experiment_dir }}/resources.jsonl"
          - --compose-project
          - "{{ deepseek_v4_ik_experiment_compose_project }}"
          - --service-unit
          - "{{ deepseek_v4_ik_service_unit }}"
          - --service-unit
          - "{{ deepseek_v4_ik_compat_service_unit }}"
          - --interval
          - "{{ deepseek_v4_ik_resource_sample_interval_seconds }}"
          - --sample-limit
          - "{{ deepseek_v4_ik_resource_sample_limit }}"
          - --stop-file
          - "{{ deepseek_v4_ik_experiment_dir }}/resource-sampler.stop"
          - --abort-output
          - "{{ deepseek_v4_ik_experiment_dir }}/resource-abort.json"
      async: 27000
      poll: 0
      register: deepseek_v4_ik_resource_sampler
      changed_when: false

    - name: Wait for the first safe resource sample
      ansible.builtin.wait_for:
        path: "{{ deepseek_v4_ik_experiment_dir }}/resources.jsonl"
        search_regex: '"timestamp"'
        timeout: 120

    - name: Start the isolated dual-GPU candidate
      community.docker.docker_compose_v2:
        project_src: "{{ deepseek_v4_ik_experiment_dir }}"
        project_name: "{{ deepseek_v4_ik_experiment_compose_project }}"
        state: present

    - name: Wait for candidate API readiness
      ansible.builtin.uri:
        url: "http://{{ deepseek_v4_ik_backend_api_bind_address }}:{{ deepseek_v4_ik_backend_api_port }}/health"
        status_code: 200
      register: deepseek_v4_ik_health
      retries: 90
      delay: 10
      until: deepseek_v4_ik_health.status == 200

    - name: Run the full stable-proxy API contract
      ansible.builtin.command:
        argv:
          - /usr/bin/timeout
          - --foreground
          - --signal=TERM
          - --kill-after=30s
          - 3600s
          - python3
          - "{{ deepseek_v4_ik_experiment_dir }}/harness/contract-runner.py"
          - --base-url
          - "http://{{ deepseek_v4_ik_api_probe_address }}:{{ deepseek_v4_ik_api_port }}"
          - --model
          - "{{ deepseek_v4_ik_model_name }}"
          - --output
          - "{{ deepseek_v4_ik_experiment_dir }}/contract.json"
          - --heartbeat-file
          - "{{ deepseek_v4_ik_experiment_dir }}/watchdog.heartbeat"
      register: deepseek_v4_ik_contract
      changed_when: false
      failed_when: false
      async: 3900
      poll: 30

    - name: Require correctness before performance
      ansible.builtin.assert:
        that:
          - deepseek_v4_ik_contract.rc == 0
        fail_msg: The stable-proxy API contract failed; performance was skipped.

    - name: Read the stable-proxy API contract evidence
      ansible.builtin.slurp:
        src: "{{ deepseek_v4_ik_experiment_dir }}/contract.json"
      register: deepseek_v4_ik_contract_evidence

    - name: Require the complete 19-case public contract
      ansible.builtin.assert:
        that:
          - (deepseek_v4_ik_contract_evidence.content | b64decode | from_json).status == 'pass'
          - (deepseek_v4_ik_contract_evidence.content | b64decode | from_json).results | length == 19
          - >-
            (deepseek_v4_ik_contract_evidence.content | b64decode | from_json).results
            | selectattr('pass', 'equalto', false) | list | length == 0
        fail_msg: The public contract must contain exactly 19 passing cases.

    - name: Run repeated 127K checkpoint handoff evidence
      ansible.builtin.command:
        argv:
          - /usr/bin/timeout
          - --foreground
          - --signal=TERM
          - --kill-after=30s
          - 11100s
          - python3
          - "{{ deepseek_v4_ik_experiment_dir }}/harness/checkpoint-transition-runner.py"
          - --base-url
          - "http://{{ deepseek_v4_ik_api_probe_address }}:{{ deepseek_v4_ik_api_port }}"
          - --model
          - "{{ deepseek_v4_ik_model_name }}"
          - --target-prompt-tokens
          - "{{ deepseek_v4_ik_context_validation_prompt_tokens }}"
          - --repeats
          - "{{ deepseek_v4_ik_checkpoint_transition_repeats }}"
          - --output
          - "{{ deepseek_v4_ik_experiment_dir }}/checkpoint-transition.json"
          - --heartbeat-file
          - "{{ deepseek_v4_ik_experiment_dir }}/watchdog.heartbeat"
      register: deepseek_v4_ik_checkpoint_transition
      changed_when: false
      failed_when: false
      async: 11400
      poll: 30
      when: deepseek_v4_ik_emit_ctx_checkpoints | bool

    - name: Run deterministic cache workload
      ansible.builtin.command:
        argv:
          - /usr/bin/timeout
          - --foreground
          - --signal=TERM
          - --kill-after=30s
          - 3600s
          - python3
          - "{{ deepseek_v4_ik_experiment_dir }}/harness/coding-cache-runner.py"
          - --base-url
          - "http://{{ deepseek_v4_ik_api_probe_address }}:{{ deepseek_v4_ik_api_port }}"
          - --model
          - "{{ deepseek_v4_ik_model_name }}"
          - --output
          - "{{ deepseek_v4_ik_experiment_dir }}/coding-cache.json"
          - --repeat-samples
          - "3"
          - --prompt-repeats
          - "{{ deepseek_v4_ik_cache_prompt_repeats }}"
          - --heartbeat-file
          - "{{ deepseek_v4_ik_experiment_dir }}/watchdog.heartbeat"
      register: deepseek_v4_ik_cache_benchmark
      changed_when: false
      failed_when: false
      async: 3900
      poll: 30
      when: >-
        deepseek_v4_ik_experiment_primary_variable in
        ['baseline', 'cache_ram_mib']

    - name: Run repeated cold candidate benchmark
      ansible.builtin.command:
        argv:
          - /usr/bin/timeout
          - --foreground
          - --signal=TERM
          - --kill-after=30s
          - 3600s
          - python3
          - "{{ deepseek_v4_ik_experiment_dir }}/harness/benchmark-runner.py"
          - --base-url
          - "http://{{ deepseek_v4_ik_api_probe_address }}:{{ deepseek_v4_ik_api_port }}"
          - --model
          - "{{ deepseek_v4_ik_model_name }}"
          - --output
          - "{{ deepseek_v4_ik_experiment_dir }}/benchmark.json"
          - --cold-prefill
          - --threshold-tokens-per-second
          - >-
            {{ 0 if deepseek_v4_ik_experiment_primary_variable in
            ['baseline', 'cache_ram_mib', 'ctx_checkpoints'] else 8 }}
          - --heartbeat-file
          - "{{ deepseek_v4_ik_experiment_dir }}/watchdog.heartbeat"
      register: deepseek_v4_ik_benchmark
      changed_when: false
      failed_when: false
      async: 3900
      poll: 30

    - name: Require successful performance evidence
      ansible.builtin.assert:
        that:
          - deepseek_v4_ik_benchmark.rc == 0
          - >-
            deepseek_v4_ik_experiment_primary_variable not in
            ['baseline', 'cache_ram_mib'] or
            deepseek_v4_ik_cache_benchmark.rc == 0
        fail_msg: >-
          The performance or cache runner failed; preserve its evidence and
          reject this candidate.

    - name: Require successful checkpoint handoff evidence
      ansible.builtin.assert:
        that:
          - deepseek_v4_ik_checkpoint_transition.rc == 0
        fail_msg: >-
          The explicit checkpoint control or candidate failed 127K recall,
          short-request handoff, or independent health probes.
      when: deepseek_v4_ik_emit_ctx_checkpoints | bool

  always:
    - name: Write prompt-free candidate runtime logs on the managed host
      ansible.builtin.command:
        argv:
          - python3
          - "{{ deepseek_v4_ik_experiment_dir }}/harness/runtime-log-sanitizer.py"
          - --compose-file
          - "{{ deepseek_v4_ik_experiment_dir }}/docker-compose.yml"
          - --project-name
          - "{{ deepseek_v4_ik_experiment_compose_project }}"
          - --service
          - candidate
          - --output
          - "{{ deepseek_v4_ik_experiment_dir }}/runtime-sanitized.log"
          - --status-output
          - >-
            {{ deepseek_v4_ik_experiment_dir
            }}/runtime-sanitized-status.json
      changed_when: false
      failed_when: false
      no_log: true

    - name: Stop resource sampling before intentional candidate teardown
      ansible.builtin.file:
        path: "{{ deepseek_v4_ik_experiment_dir }}/resource-sampler.stop"
        state: touch
        owner: root
        group: root
        mode: "0640"
      failed_when: false

    - name: Wait for resource sampling to stop before candidate teardown
      ansible.builtin.async_status:
        jid: "{{ deepseek_v4_ik_resource_sampler.ansible_job_id }}"
      register: deepseek_v4_ik_resource_sampler_result
      until: deepseek_v4_ik_resource_sampler_result.finished
      retries: 60
      delay: 2
      failed_when: false
      when: >-
        deepseek_v4_ik_resource_sampler is defined and
        deepseek_v4_ik_resource_sampler.ansible_job_id is defined

    - name: Stop the isolated candidate after evidence collection
      community.docker.docker_compose_v2:
        project_src: "{{ deepseek_v4_ik_experiment_dir }}"
        project_name: "{{ deepseek_v4_ik_experiment_compose_project }}"
        state: absent
        remove_orphans: true
      failed_when: false

    - name: Restore the production control owner
      ansible.builtin.systemd:
        name: "{{ deepseek_v4_ik_service_unit }}"
        state: started
      failed_when: false

    - name: Restore the stable compatibility proxy
      ansible.builtin.systemd:
        name: "{{ deepseek_v4_ik_compat_service_unit }}"
        state: started
      failed_when: false

    - name: Inspect final production owner state
      ansible.builtin.command:
        argv: [systemctl, is-active, "{{ deepseek_v4_ik_service_unit }}"]
      register: deepseek_v4_ik_final_owner
      changed_when: false
      failed_when: false

    - name: Inspect final compatibility proxy state
      ansible.builtin.command:
        argv: [systemctl, is-active, "{{ deepseek_v4_ik_compat_service_unit }}"]
      register: deepseek_v4_ik_final_proxy
      changed_when: false
      failed_when: false

    - name: Initialize restored production container evidence
      ansible.builtin.set_fact:
        deepseek_v4_ik_final_container_document: {}

    - name: Resolve the restored production control container
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-name
          - "{{ deepseek_v4_ik_compose_project }}"
          - --file
          - "{{ deepseek_v4_ik_install_dir }}/docker-compose.yml"
          - ps
          - --quiet
          - candidate
      register: deepseek_v4_ik_final_container_id
      changed_when: false
      failed_when: false

    - name: Inspect the restored production control container
      ansible.builtin.command:
        argv:
          - docker
          - container
          - inspect
          - "{{ deepseek_v4_ik_final_container_id.stdout | trim }}"
      register: deepseek_v4_ik_final_container_inspect
      changed_when: false
      failed_when: false

    - name: Parse the restored production control container
      ansible.builtin.set_fact:
        deepseek_v4_ik_final_container_document: >-
          {{ (deepseek_v4_ik_final_container_inspect.stdout | default('[]') |
          from_json | first) | default({}) }}
      when: deepseek_v4_ik_final_container_inspect.rc | default(1) == 0

    - name: Wait for the restored stable public API
      ansible.builtin.uri:
        url: "http://{{ deepseek_v4_ik_api_probe_address }}:{{ deepseek_v4_ik_api_port }}/health"
        status_code: 200
      register: deepseek_v4_ik_final_health
      retries: 120
      delay: 10
      until: deepseek_v4_ik_final_health.status | default(0) == 200
      failed_when: false

    - name: Evaluate exact production control restoration
      ansible.builtin.set_fact:
        deepseek_v4_ik_exact_restore_verified: >-
          {{
            deepseek_v4_ik_final_owner.stdout | trim ==
            deepseek_v4_ik_initial_owner.stdout | trim and
            deepseek_v4_ik_final_proxy.stdout | trim ==
            deepseek_v4_ik_initial_proxy.stdout | trim and
            deepseek_v4_ik_final_health.status | default(0) == 200 and
            deepseek_v4_ik_final_container_document.Config.Cmd | default([]) ==
            deepseek_v4_ik_initial_container_document.Config.Cmd and
            deepseek_v4_ik_final_container_document.Config.Image | default('') ==
            deepseek_v4_ik_initial_container_document.Config.Image and
            deepseek_v4_ik_final_container_document.Config.Entrypoint | default(none) ==
            deepseek_v4_ik_initial_container_document.Config.Entrypoint and
            deepseek_v4_ik_final_container_document.Config.Env | default([]) ==
            deepseek_v4_ik_initial_container_document.Config.Env and
            deepseek_v4_ik_final_container_document.HostConfig.Privileged |
            default(true) ==
            deepseek_v4_ik_initial_container_document.HostConfig.Privileged and
            deepseek_v4_ik_final_container_document.HostConfig.Devices |
            default([]) ==
            deepseek_v4_ik_initial_container_document.HostConfig.Devices |
            default([]) and
            deepseek_v4_ik_final_container_document.HostConfig.DeviceRequests |
            default([]) ==
            deepseek_v4_ik_initial_container_document.HostConfig.DeviceRequests |
            default([]) and
            deepseek_v4_ik_final_container_document.Mounts | default([]) ==
            deepseek_v4_ik_initial_container_document.Mounts
          }}

    - name: Save exact restoration evidence before candidate qualification
      ansible.builtin.copy:
        content: >-
          {{ {
            'schema_version': 1,
            'experiment_id': deepseek_v4_ik_experiment_id,
            'exact_restore': deepseek_v4_ik_exact_restore_verified | bool,
            'owner_matches': (
              deepseek_v4_ik_final_owner.stdout | trim ==
              deepseek_v4_ik_initial_owner.stdout | trim
            ),
            'proxy_matches': (
              deepseek_v4_ik_final_proxy.stdout | trim ==
              deepseek_v4_ik_initial_proxy.stdout | trim
            ),
            'health_status': deepseek_v4_ik_final_health.status | default(0),
            'command_matches': (
              deepseek_v4_ik_final_container_document.Config.Cmd | default([]) ==
              deepseek_v4_ik_initial_container_document.Config.Cmd
            ),
            'image_matches': (
              deepseek_v4_ik_final_container_document.Config.Image | default('') ==
              deepseek_v4_ik_initial_container_document.Config.Image
            )
          } | to_nice_json }}
        dest: "{{ deepseek_v4_ik_experiment_dir }}/restore-result.json"
        owner: root
        group: root
        mode: "0640"

    - name: Disarm managed-host recovery after verified restoration
      ansible.builtin.file:
        path: "{{ deepseek_v4_ik_experiment_dir }}/watchdog.disarm"
        state: touch
        owner: root
        group: root
        mode: "0640"
      when: deepseek_v4_ik_exact_restore_verified | bool
      failed_when: false

    - name: Wait for managed-host watchdog evidence
      ansible.builtin.wait_for:
        path: "{{ deepseek_v4_ik_experiment_dir }}/watchdog-status.json"
        state: present
        timeout: 30
      when: deepseek_v4_ik_exact_restore_verified | bool
      failed_when: false

    - name: Summarize experiment resource peaks
      ansible.builtin.command:
        argv:
          - python3
          - "{{ deepseek_v4_ik_experiment_dir }}/harness/resource-sampler.py"
          - --summarize
          - "{{ deepseek_v4_ik_experiment_dir }}/resources.jsonl"
          - --summary-output
          - "{{ deepseek_v4_ik_experiment_dir }}/resources-summary.json"
      changed_when: false
      failed_when: false

    - name: Evaluate typed control-versus-candidate promotion gates
      ansible.builtin.command:
        argv: >-
          {{
            ['python3',
             deepseek_v4_ik_experiment_dir ~ '/harness/experiment-verdict.py',
             '--candidate-dir', deepseek_v4_ik_experiment_dir,
             '--primary-variable', deepseek_v4_ik_experiment_primary_variable,
             '--output', deepseek_v4_ik_experiment_dir ~ '/qualification.json']
            + (['--control-dir', deepseek_v4_ik_control_experiment_dir]
               if deepseek_v4_ik_experiment_primary_variable != 'baseline'
               else [])
          }}
      register: deepseek_v4_ik_qualification
      changed_when: false
      failed_when: false
      when: not (deepseek_v4_ik_checkpoint_diagnostic | bool)

    - name: Record the non-promotional checkpoint diagnosis
      ansible.builtin.copy:
        content: >-
          {{ {
            'schema_version': 1,
            'primary_variable': 'ctx_checkpoints',
            'accepted': false,
            'status': 'diagnostic',
            'reasons': ['single-repeat checkpoint evidence is non-promotional'],
            'metrics': {}
          } | to_nice_json }}
        dest: "{{ deepseek_v4_ik_experiment_dir }}/qualification.json"
        owner: root
        group: root
        mode: "0640"
      when: deepseek_v4_ik_checkpoint_diagnostic | bool

    - name: Capture post-restoration resources
      ansible.builtin.command:
        argv:
          - python3
          - "{{ deepseek_v4_ik_experiment_dir }}/harness/resource-sampler.py"
          - --output
          - "{{ deepseek_v4_ik_experiment_dir }}/resources-post.jsonl"
          - --summary-output
          - "{{ deepseek_v4_ik_experiment_dir }}/resources-post-summary.json"
          - --service-unit
          - "{{ deepseek_v4_ik_service_unit }}"
          - --service-unit
          - "{{ deepseek_v4_ik_compat_service_unit }}"
      changed_when: false
      failed_when: false

    - name: Save lifecycle and candidate result evidence
      ansible.builtin.copy:
        content: >-
          {{ {
            'schema_version': 1,
            'experiment_id': deepseek_v4_ik_experiment_id,
            'contract_rc': (deepseek_v4_ik_contract | default({})).get('rc'),
            'cache_benchmark_rc': (deepseek_v4_ik_cache_benchmark | default({})).get('rc'),
            'checkpoint_transition_rc': (
              deepseek_v4_ik_checkpoint_transition | default({})
            ).get('rc'),
            'benchmark_rc': (deepseek_v4_ik_benchmark | default({})).get('rc'),
            'qualification_rc': (
              deepseek_v4_ik_qualification | default({})
            ).get('rc'),
            'initial_owner': deepseek_v4_ik_initial_owner.stdout | trim,
            'initial_proxy': deepseek_v4_ik_initial_proxy.stdout | trim,
            'final_owner': deepseek_v4_ik_final_owner.stdout | trim,
            'final_proxy': deepseek_v4_ik_final_proxy.stdout | trim,
            'final_health_status': deepseek_v4_ik_final_health.status | default(0),
            'exact_restore': deepseek_v4_ik_exact_restore_verified | bool,
            'final_backend_owner': (
              'production'
              if deepseek_v4_ik_final_owner.stdout | trim == 'active' and
              deepseek_v4_ik_final_health.status | default(0) == 200
              else 'unknown'
            )
          } | to_nice_json }}
        dest: "{{ deepseek_v4_ik_experiment_dir }}/candidate-result.json"
        owner: root
        group: root
        mode: "0640"

    - name: Require exact production control restoration
      ansible.builtin.assert:
        that:
          - deepseek_v4_ik_exact_restore_verified | bool
        fail_msg: The experiment did not restore the initial owner and proxy state.

    - name: Require typed candidate acceptance
      ansible.builtin.assert:
        that:
          - deepseek_v4_ik_qualification.rc == 0
        fail_msg: >-
          The candidate was safely restored but failed its typed promotion
          gates; inspect immutable qualification.json before choosing a control.
      when: not (deepseek_v4_ik_checkpoint_diagnostic | bool)

    - name: Require successful non-promotional checkpoint diagnosis
      ansible.builtin.assert:
        that:
          - deepseek_v4_ik_contract.rc | default(1) == 0
          - deepseek_v4_ik_checkpoint_transition.rc | default(1) == 0
        fail_msg: >-
          The single-repeat checkpoint diagnosis failed correctness or handoff;
          its evidence was preserved and the production control was restored.
      when: deepseek_v4_ik_checkpoint_diagnostic | bool
