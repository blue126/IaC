---
- name: Validate fixed final qualification controls
  ansible.builtin.assert:
    that:
      - >-
        deepseek_v4_ik_final_qualification_id is
        match('^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$')
      - deepseek_v4_ik_context_length | int == 131072
      - deepseek_v4_ik_cache_ram_mib | int == 8192
      - deepseek_v4_ik_moe_mode == 'all_cpu'
      - deepseek_v4_ik_n_cpu_moe | int == 0
      - deepseek_v4_ik_split_mode == 'layer'
      - deepseek_v4_ik_soak_duration_seconds | int == 3600
      - deepseek_v4_ik_soak_interval_seconds | int == 30
      - deepseek_v4_ik_soak_completion_interval_seconds | int == 300
      - deepseek_v4_ik_context_validation_prompt_tokens | int == 127000
    fail_msg: >-
      Final qualification requires the winning 128K/8GiB/all-CPU/layer profile
      and the approved one-hour soak cadence.

- name: Define the final stable API URL
  ansible.builtin.set_fact:
    deepseek_v4_ik_final_base_url: >-
      {{ 'http://' ~ deepseek_v4_ik_api_probe_address ~ ':' ~
      (deepseek_v4_ik_api_port | string) }}

- name: Reserve final qualification evidence atomically
  ansible.builtin.command:
    argv:
      - mkdir
      - --mode=0750
      - "{{ deepseek_v4_ik_final_qualification_dir }}"
  register: deepseek_v4_ik_final_reservation
  changed_when: deepseek_v4_ik_final_reservation.rc == 0
  failed_when: false

- name: Refuse duplicate final qualification evidence
  ansible.builtin.assert:
    that:
      - deepseek_v4_ik_final_reservation.rc == 0
    fail_msg: Final qualification evidence is immutable; choose a new ID.

- name: Inspect final stable owner state
  ansible.builtin.command:
    argv: [systemctl, is-active, "{{ deepseek_v4_ik_service_unit }}"]
  register: deepseek_v4_ik_final_owner
  changed_when: false
  failed_when: false

- name: Inspect final stable proxy state
  ansible.builtin.command:
    argv: [systemctl, is-active, "{{ deepseek_v4_ik_compat_service_unit }}"]
  register: deepseek_v4_ik_final_proxy
  changed_when: false
  failed_when: false

- name: Inspect final superseded runtime owner state
  ansible.builtin.command:
    argv: [systemctl, is-active, "{{ deepseek_v4_ik_main_unit }}"]
  register: deepseek_v4_ik_final_superseded_owner
  changed_when: false
  failed_when: false

- name: Verify final stable public health
  ansible.builtin.uri:
    url: "{{ deepseek_v4_ik_final_base_url }}/health"
    status_code: 200
  register: deepseek_v4_ik_final_health

- name: Require the stable production baseline
  ansible.builtin.assert:
    that:
      - deepseek_v4_ik_final_owner.stdout | trim == 'active'
      - deepseek_v4_ik_final_proxy.stdout | trim == 'active'
      - deepseek_v4_ik_final_superseded_owner.stdout | trim != 'active'
      - deepseek_v4_ik_final_health.status == 200
    fail_msg: Final qualification requires the active stable owner and proxy.

- name: Verify the live GGUF checksum
  ansible.builtin.stat:
    path: "{{ deepseek_v4_ik_model_path }}"
    checksum_algorithm: sha256
  register: deepseek_v4_ik_final_model_stat

- name: Read the live ik_llama source revision
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ deepseek_v4_ik_source_dir }}"
      - rev-parse
      - HEAD
  register: deepseek_v4_ik_final_source_revision
  changed_when: false

- name: Verify the live llama-server binary checksum
  ansible.builtin.stat:
    path: "{{ deepseek_v4_ik_build_dir }}/bin/llama-server"
    checksum_algorithm: sha256
  register: deepseek_v4_ik_final_binary_stat

- name: Resolve the live production container
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-name
      - "{{ deepseek_v4_ik_compose_project }}"
      - --file
      - "{{ deepseek_v4_ik_install_dir }}/docker-compose.yml"
      - ps
      - --quiet
      - candidate
  register: deepseek_v4_ik_final_container_id
  changed_when: false

- name: Inspect the live production container
  ansible.builtin.command:
    argv:
      - docker
      - container
      - inspect
      - "{{ deepseek_v4_ik_final_container_id.stdout | trim }}"
  register: deepseek_v4_ik_final_container_inspect
  changed_when: false

- name: Parse the live production container
  ansible.builtin.set_fact:
    deepseek_v4_ik_final_container_document: >-
      {{ (deepseek_v4_ik_final_container_inspect.stdout |
      from_json)[0] }}

- name: Require the live winning profile and pinned artifacts
  ansible.builtin.assert:
    that:
      - deepseek_v4_ik_final_model_stat.stat.exists
      - deepseek_v4_ik_final_model_stat.stat.checksum == deepseek_v4_ik_model_sha256
      - deepseek_v4_ik_final_source_revision.stdout | trim == deepseek_v4_ik_commit
      - deepseek_v4_ik_final_binary_stat.stat.exists
      - deepseek_v4_ik_final_binary_stat.stat.isreg
      - >-
        deepseek_v4_ik_final_binary_stat.stat.checksum ==
        deepseek_v4_ik_binary_sha256
      - deepseek_v4_ik_final_container_document.State.Running | bool
      - deepseek_v4_ik_final_container_document.Config.Image == deepseek_v4_ik_runtime_image
      - >-
        deepseek_v4_ik_final_container_document.Config.Cmd ==
        deepseek_v4_ik_configured_command
      - >-
        deepseek_v4_ik_final_container_document.Config.Entrypoint in
        [none, []]
      - not (deepseek_v4_ik_final_container_document.HostConfig.Privileged | bool)
      - >-
        'CUDA_VISIBLE_DEVICES=0,1' in
        deepseek_v4_ik_final_container_document.Config.Env
      - >-
        'GGML_CUDA_NO_PINNED=1' not in
        deepseek_v4_ik_final_container_document.Config.Env
      - >-
        deepseek_v4_ik_final_container_document.Mounts |
        selectattr('Source', 'equalto', deepseek_v4_ik_model_dir) |
        selectattr('RW', 'equalto', false) | list | length == 1
    fail_msg: >-
      The live container, model, binary, or source revision drifted from the
      approved winning profile.

- name: Create immutable final qualification evidence
  ansible.builtin.file:
    path: "{{ deepseek_v4_ik_final_qualification_dir }}/harness"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Install the final qualification harness
  ansible.builtin.copy:
    src: "{{ role_path }}/../deepseek-v4/files/{{ item }}"
    dest: "{{ deepseek_v4_ik_final_qualification_dir }}/harness/{{ item }}"
    owner: root
    group: root
    mode: "{{ '0750' if item.endswith('.py') else '0640' }}"
  loop:
    - contract-runner.py
    - context-window-runner.py
    - resource-sampler.py
    - soak-runner.py
    - api-fixtures-v1.json
    - correctness-corpus-v1.json
    - benchmark-corpus-v1.json

- name: Save the final qualification manifest
  ansible.builtin.copy:
    dest: "{{ deepseek_v4_ik_final_qualification_dir }}/manifest.json"
    owner: root
    group: root
    mode: "0640"
    force: false
    content: >-
      {{ {
        'schema_version': 1,
        'qualification_id': deepseek_v4_ik_final_qualification_id,
        'model_revision': deepseek_v4_ik_model_revision,
        'model_sha256': deepseek_v4_ik_model_sha256,
        'runtime_commit': deepseek_v4_ik_commit,
        'runtime_image': deepseek_v4_ik_runtime_image,
        'runtime_binary_sha256': deepseek_v4_ik_final_binary_stat.stat.checksum,
        'live_container_id': deepseek_v4_ik_final_container_id.stdout | trim,
        'live_container_image': deepseek_v4_ik_final_container_document.Config.Image,
        'live_container_command': deepseek_v4_ik_final_container_document.Config.Cmd,
        'context_length': deepseek_v4_ik_context_length | int,
        'ctx_checkpoints': deepseek_v4_ik_ctx_checkpoints | int,
        'ctx_checkpoints_explicit': deepseek_v4_ik_emit_ctx_checkpoints | bool,
        'cache_ram_mib': deepseek_v4_ik_cache_ram_mib | int,
        'moe_mode': deepseek_v4_ik_moe_mode,
        'n_cpu_moe': deepseek_v4_ik_n_cpu_moe | int,
        'split_mode': deepseek_v4_ik_split_mode,
        'context_validation_prompt_tokens':
          deepseek_v4_ik_context_validation_prompt_tokens | int,
        'soak_duration_seconds': deepseek_v4_ik_soak_duration_seconds | int
      } | to_nice_json }}

- name: Run the pre-soak 19-case public contract
  ansible.builtin.command:
    argv:
      - /usr/bin/timeout
      - --foreground
      - --signal=TERM
      - --kill-after=30s
      - 3600s
      - python3
      - >-
        {{ deepseek_v4_ik_final_qualification_dir
        }}/harness/contract-runner.py
      - --base-url
      - "{{ deepseek_v4_ik_final_base_url }}"
      - --model
      - "{{ deepseek_v4_ik_model_name }}"
      - --output
      - >-
        {{ deepseek_v4_ik_final_qualification_dir }}/contract-pre.json
  register: deepseek_v4_ik_final_contract_pre
  changed_when: false
  failed_when: false

- name: Inspect the pre-soak public contract evidence
  ansible.builtin.stat:
    path: "{{ deepseek_v4_ik_final_qualification_dir }}/contract-pre.json"
  register: deepseek_v4_ik_final_contract_pre_stat

- name: Require pre-soak runner output before reading evidence
  ansible.builtin.assert:
    that:
      - deepseek_v4_ik_final_contract_pre.rc == 0
      - deepseek_v4_ik_final_contract_pre_stat.stat.exists
      - deepseek_v4_ik_final_contract_pre_stat.stat.isreg
    fail_msg: Pre-soak contract runner failed or omitted its JSON evidence.

- name: Read the pre-soak public contract
  ansible.builtin.slurp:
    src: "{{ deepseek_v4_ik_final_qualification_dir }}/contract-pre.json"
  register: deepseek_v4_ik_final_contract_pre_evidence

- name: Require correctness before long-context and soak checks
  ansible.builtin.assert:
    that:
      - deepseek_v4_ik_final_contract_pre.rc == 0
      - >-
        (deepseek_v4_ik_final_contract_pre_evidence.content | b64decode |
        from_json).status == 'pass'
      - >-
        (deepseek_v4_ik_final_contract_pre_evidence.content | b64decode |
        from_json).results | length == 19
    fail_msg: Final qualification requires a passing 19-case public contract.

- name: Start 128K resource sampling
  ansible.builtin.command:
    argv:
      - python3
      - >-
        {{ deepseek_v4_ik_final_qualification_dir
        }}/harness/resource-sampler.py
      - --output
      - >-
        {{ deepseek_v4_ik_final_qualification_dir
        }}/resources-context.jsonl
      - --compose-project
      - "{{ deepseek_v4_ik_compose_project }}"
      - --service-unit
      - "{{ deepseek_v4_ik_service_unit }}"
      - --service-unit
      - "{{ deepseek_v4_ik_compat_service_unit }}"
      - --interval
      - "2"
      - --sample-limit
      - "7200"
      - --stop-file
      - >-
        {{ deepseek_v4_ik_final_qualification_dir
        }}/resource-context.stop
  register: deepseek_v4_ik_final_context_resource_job
  changed_when: false
  async: 15000
  poll: 0

- name: Run 128K marker recall with guaranteed resource finalization
  block:
    - name: Run 128K marker recall
      ansible.builtin.command:
        argv:
          - /usr/bin/timeout
          - --foreground
          - --signal=TERM
          - --kill-after=30s
          - 13800s
          - python3
          - >-
            {{ deepseek_v4_ik_final_qualification_dir
            }}/harness/context-window-runner.py
          - --base-url
          - "{{ deepseek_v4_ik_final_base_url }}"
          - --model
          - "{{ deepseek_v4_ik_model_name }}"
          - --target-prompt-tokens
          - "{{ deepseek_v4_ik_context_validation_prompt_tokens }}"
          - --output
          - >-
            {{ deepseek_v4_ik_final_qualification_dir }}/context-128k.json
      register: deepseek_v4_ik_final_context
      changed_when: false
      failed_when: false
      async: 14400
      poll: 30

    - name: Inspect the 128K marker recall evidence
      ansible.builtin.stat:
        path: "{{ deepseek_v4_ik_final_qualification_dir }}/context-128k.json"
      register: deepseek_v4_ik_final_context_stat

    - name: Require 128K runner output before reading evidence
      ansible.builtin.assert:
        that:
          - deepseek_v4_ik_final_context.rc == 0
          - deepseek_v4_ik_final_context_stat.stat.exists
          - deepseek_v4_ik_final_context_stat.stat.isreg
        fail_msg: The 128K runner failed or omitted its JSON evidence.

    - name: Read the 128K marker recall evidence
      ansible.builtin.slurp:
        src: "{{ deepseek_v4_ik_final_qualification_dir }}/context-128k.json"
      register: deepseek_v4_ik_final_context_evidence

    - name: Require 128K correctness before the one-hour soak
      ansible.builtin.assert:
        that:
          - deepseek_v4_ik_final_context.rc == 0
          - >-
            (deepseek_v4_ik_final_context_evidence.content | b64decode |
            from_json).status == 'pass'
          - >-
            (deepseek_v4_ik_final_context_evidence.content | b64decode |
            from_json).token_count_matches | bool
        fail_msg: Final qualification requires passing 128K marker recall.

  always:
    - name: Stop 128K resource sampling
      ansible.builtin.file:
        path: >-
          {{ deepseek_v4_ik_final_qualification_dir
          }}/resource-context.stop
        state: touch
        owner: root
        group: root
        mode: "0640"

    - name: Wait for 128K resource sampling
      ansible.builtin.async_status:
        jid: "{{ deepseek_v4_ik_final_context_resource_job.ansible_job_id }}"
      register: deepseek_v4_ik_final_context_resource_result
      until: deepseek_v4_ik_final_context_resource_result.finished
      retries: 60
      delay: 5
      changed_when: false
      failed_when: false

    - name: Summarize 128K resource sampling
      ansible.builtin.command:
        argv:
          - python3
          - >-
            {{ deepseek_v4_ik_final_qualification_dir
            }}/harness/resource-sampler.py
          - --summarize
          - >-
            {{ deepseek_v4_ik_final_qualification_dir
            }}/resources-context.jsonl
          - --summary-output
          - >-
            {{ deepseek_v4_ik_final_qualification_dir
            }}/resources-context-summary.json
      register: deepseek_v4_ik_final_context_resource_summary
      changed_when: false
      failed_when: false

- name: Start one-hour production resource sampling
  ansible.builtin.command:
    argv:
      - python3
      - >-
        {{ deepseek_v4_ik_final_qualification_dir
        }}/harness/resource-sampler.py
      - --output
      - "{{ deepseek_v4_ik_final_qualification_dir }}/resources.jsonl"
      - --summary-output
      - >-
        {{ deepseek_v4_ik_final_qualification_dir }}/resources-summary.json
      - --compose-project
      - "{{ deepseek_v4_ik_compose_project }}"
      - --service-unit
      - "{{ deepseek_v4_ik_service_unit }}"
      - --service-unit
      - "{{ deepseek_v4_ik_compat_service_unit }}"
      - --interval
      - "10"
      - --sample-limit
      - "361"
  register: deepseek_v4_ik_final_resource_job
  changed_when: false
  async: 4500
  poll: 0

- name: Run the one-hour production API soak
  ansible.builtin.command:
    argv:
      - /usr/bin/timeout
      - --foreground
      - --signal=TERM
      - --kill-after=30s
      - 4200s
      - python3
      - >-
        {{ deepseek_v4_ik_final_qualification_dir }}/harness/soak-runner.py
      - --base-url
      - "{{ deepseek_v4_ik_final_base_url }}"
      - --model
      - "{{ deepseek_v4_ik_model_name }}"
      - --output
      - "{{ deepseek_v4_ik_final_qualification_dir }}/soak.json"
      - --duration-seconds
      - "{{ deepseek_v4_ik_soak_duration_seconds }}"
      - --interval-seconds
      - "{{ deepseek_v4_ik_soak_interval_seconds }}"
      - --completion-interval-seconds
      - "{{ deepseek_v4_ik_soak_completion_interval_seconds }}"
  register: deepseek_v4_ik_final_soak
  changed_when: false
  failed_when: false
  async: 4500
  poll: 30

- name: Wait for one-hour resource sampling
  ansible.builtin.async_status:
    jid: "{{ deepseek_v4_ik_final_resource_job.ansible_job_id }}"
  register: deepseek_v4_ik_final_resource_result
  until: deepseek_v4_ik_final_resource_result.finished
  retries: 60
  delay: 10
  changed_when: false

- name: Run the post-soak 19-case public contract
  ansible.builtin.command:
    argv:
      - /usr/bin/timeout
      - --foreground
      - --signal=TERM
      - --kill-after=30s
      - 3600s
      - python3
      - >-
        {{ deepseek_v4_ik_final_qualification_dir
        }}/harness/contract-runner.py
      - --base-url
      - "{{ deepseek_v4_ik_final_base_url }}"
      - --model
      - "{{ deepseek_v4_ik_model_name }}"
      - --output
      - >-
        {{ deepseek_v4_ik_final_qualification_dir }}/contract-post.json
  register: deepseek_v4_ik_final_contract_post
  changed_when: false
  failed_when: false

- name: Read final qualification evidence
  ansible.builtin.slurp:
    src: "{{ deepseek_v4_ik_final_qualification_dir }}/{{ item }}"
  loop:
    - contract-pre.json
    - context-128k.json
    - resources-context-summary.json
    - soak.json
    - resources-summary.json
    - contract-post.json
  register: deepseek_v4_ik_final_evidence

- name: Parse final qualification evidence
  ansible.builtin.set_fact:
    deepseek_v4_ik_final_contract_pre_document: >-
      {{ deepseek_v4_ik_final_evidence.results[0].content |
      b64decode | from_json }}
    deepseek_v4_ik_final_context_document: >-
      {{ deepseek_v4_ik_final_evidence.results[1].content |
      b64decode | from_json }}
    deepseek_v4_ik_final_context_resources_document: >-
      {{ deepseek_v4_ik_final_evidence.results[2].content |
      b64decode | from_json }}
    deepseek_v4_ik_final_soak_document: >-
      {{ deepseek_v4_ik_final_evidence.results[3].content |
      b64decode | from_json }}
    deepseek_v4_ik_final_soak_resources_document: >-
      {{ deepseek_v4_ik_final_evidence.results[4].content |
      b64decode | from_json }}
    deepseek_v4_ik_final_contract_post_document: >-
      {{ deepseek_v4_ik_final_evidence.results[5].content |
      b64decode | from_json }}

- name: Require final correctness, context, soak, and resource stability
  ansible.builtin.assert:
    that:
      - deepseek_v4_ik_final_contract_pre.rc == 0
      - deepseek_v4_ik_final_context.rc == 0
      - deepseek_v4_ik_final_context_resource_result.rc == 0
      - deepseek_v4_ik_final_context_resource_summary.rc == 0
      - deepseek_v4_ik_final_soak.rc == 0
      - deepseek_v4_ik_final_resource_result.rc == 0
      - deepseek_v4_ik_final_contract_post.rc == 0
      - deepseek_v4_ik_final_contract_pre_document.status == 'pass'
      - deepseek_v4_ik_final_contract_pre_document.results | length == 19
      - >-
        deepseek_v4_ik_final_contract_pre_document.results |
        selectattr('pass', 'equalto', false) | list | length == 0
      - deepseek_v4_ik_final_context_document.status == 'pass'
      - deepseek_v4_ik_final_context_document.answer_matches | bool
      - deepseek_v4_ik_final_context_document.token_count_matches | bool
      - deepseek_v4_ik_final_soak_document.schema_version | int == 3
      - deepseek_v4_ik_final_soak_document.status == 'pass'
      - deepseek_v4_ik_final_soak_document.coverage_complete | bool
      - >-
        deepseek_v4_ik_final_soak_document.maximum_health_gap_seconds | float <=
        deepseek_v4_ik_final_soak_document.maximum_allowed_health_gap_seconds | float
      - >-
        deepseek_v4_ik_final_soak_document.maximum_completion_seconds | float <=
        deepseek_v4_ik_final_soak_document.maximum_allowed_completion_seconds | float
      - deepseek_v4_ik_final_soak_document.health_failures | int == 0
      - deepseek_v4_ik_final_soak_document.completion_failures | int == 0
      - >-
        deepseek_v4_ik_final_soak_document.completion_count | int >=
        deepseek_v4_ik_final_soak_document.minimum_completion_count | int
      - >-
        deepseek_v4_ik_final_soak_document.sample_count | int >=
        deepseek_v4_ik_final_soak_document.minimum_health_count | int
      - >-
        deepseek_v4_ik_final_soak_document.duration_observed_seconds | float >=
        deepseek_v4_ik_final_soak_document.duration_target_seconds | float
      - deepseek_v4_ik_final_context_resources_document.sample_count | int >= 2
      - deepseek_v4_ik_final_soak_resources_document.sample_count | int >= 350
      - >-
        deepseek_v4_ik_final_context_resources_document.host.minimum_memavailable_bytes
        is not none
      - >-
        deepseek_v4_ik_final_soak_resources_document.host.minimum_memavailable_bytes
        is not none
      - >-
        deepseek_v4_ik_final_context_resources_document.host.minimum_memavailable_bytes
        | int >= deepseek_v4_ik_minimum_memavailable_bytes | int
      - >-
        deepseek_v4_ik_final_soak_resources_document.host.minimum_memavailable_bytes
        | int >= deepseek_v4_ik_minimum_memavailable_bytes | int
      - >-
        deepseek_v4_ik_final_context_resources_document.host.maximum_swap_used_bytes
        is not none
      - >-
        deepseek_v4_ik_final_soak_resources_document.host.maximum_swap_used_bytes
        is not none
      - >-
        deepseek_v4_ik_final_context_resources_document.host.maximum_swap_used_bytes
        | int == 0
      - >-
        deepseek_v4_ik_final_soak_resources_document.host.maximum_swap_used_bytes
        | int == 0
      - >-
        deepseek_v4_ik_final_context_resources_document.host.oom_kill_count_delta
        is not none
      - >-
        deepseek_v4_ik_final_soak_resources_document.host.oom_kill_count_delta
        is not none
      - >-
        deepseek_v4_ik_final_context_resources_document.host.oom_kill_count_delta
        | int == 0
      - >-
        deepseek_v4_ik_final_soak_resources_document.host.oom_kill_count_delta
        | int == 0
      - >-
        deepseek_v4_ik_final_context_resources_document.container.maximum_restart_count
        is not none
      - >-
        deepseek_v4_ik_final_soak_resources_document.container.maximum_restart_count
        is not none
      - >-
        deepseek_v4_ik_final_context_resources_document.container.maximum_restart_count
        | int == 0
      - >-
        deepseek_v4_ik_final_soak_resources_document.container.maximum_restart_count
        | int == 0
      - >-
        deepseek_v4_ik_final_context_resources_document.container.oom_killed_observed
        is not none
      - >-
        deepseek_v4_ik_final_soak_resources_document.container.oom_killed_observed
        is not none
      - >-
        not (deepseek_v4_ik_final_context_resources_document.container.oom_killed_observed
