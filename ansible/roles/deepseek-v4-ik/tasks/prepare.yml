---
- name: Create isolated candidate directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ deepseek_v4_ik_install_dir }}"
    - "{{ deepseek_v4_ik_model_dir }}"
    - "{{ deepseek_v4_ik_evidence_dir }}"

- name: Check free space before candidate artifact download
  ansible.builtin.command:
    argv: [df, -B1, --output=avail, "{{ deepseek_v4_ik_model_dir }}"]
  register: deepseek_v4_ik_free_space
  changed_when: false

- name: Require download and recovery headroom
  ansible.builtin.assert:
    that:
      - (deepseek_v4_ik_free_space.stdout_lines[-1] | trim | int) >= (deepseek_v4_ik_model_size_bytes | int + 107374182400)
    fail_msg: Candidate artifact plus 100 GiB recovery headroom does not fit; no download was started.

- name: Check candidate model artifact integrity before download
  ansible.builtin.stat:
    path: "{{ deepseek_v4_ik_model_path }}"
    checksum_algorithm: sha256
  register: deepseek_v4_ik_model_stat

- name: Remove an earlier stopped candidate download container
  community.docker.docker_container:
    name: "{{ deepseek_v4_ik_download_container }}"
    state: absent
  when: >-
    not deepseek_v4_ik_model_stat.stat.exists
    or deepseek_v4_ik_model_stat.stat.checksum != deepseek_v4_ik_model_sha256

- name: Start resumable pinned GGUF candidate download
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --detach
      - --name
      - "{{ deepseek_v4_ik_download_container }}"
      - --restart
      - "no"
      - -v
      - "{{ deepseek_v4_ik_model_dir }}:/models"
      - "{{ deepseek_v4_ik_runtime_image }}"
      - /opt/venv/bin/hf
      - download
      - "{{ deepseek_v4_ik_model_repository }}"
      - DeepSeek-V4-Flash.gguf
      - --revision
      - "{{ deepseek_v4_ik_model_revision }}"
      - --local-dir
      - /models
  register: deepseek_v4_ik_download_started
  changed_when: true
  when: >-
    not deepseek_v4_ik_model_stat.stat.exists
    or deepseek_v4_ik_model_stat.stat.checksum != deepseek_v4_ik_model_sha256

- name: Wait for resumable candidate download completion
  ansible.builtin.command:
    argv: [docker, inspect, "{{ deepseek_v4_ik_download_container }}"]
  register: deepseek_v4_ik_download_inspect
  changed_when: false
  retries: 720
  delay: 30
  until: >-
    (deepseek_v4_ik_download_inspect.stdout | from_json)[0].State.Running == false
  when: deepseek_v4_ik_download_started is changed

- name: Require a successful candidate download exit code
  ansible.builtin.assert:
    that:
      - (deepseek_v4_ik_download_inspect.stdout | from_json)[0].State.ExitCode | int == 0
    fail_msg: >-
      The resumable GGUF download failed. Its container logs and partial cache
      remain available for diagnosis; no candidate runtime was started.
  when: deepseek_v4_ik_download_started is changed

- name: Verify the downloaded GGUF candidate artifact checksum
  ansible.builtin.stat:
    path: "{{ deepseek_v4_ik_model_path }}"
    checksum_algorithm: sha256
  register: deepseek_v4_ik_downloaded_model_stat

- name: Require the pinned GGUF candidate artifact checksum
  ansible.builtin.assert:
    that:
      - deepseek_v4_ik_downloaded_model_stat.stat.exists
      - deepseek_v4_ik_downloaded_model_stat.stat.checksum == deepseek_v4_ik_model_sha256
    fail_msg: Downloaded GGUF checksum differs from the approved artifact manifest.

- name: Check out the pinned isolated ik_llama.cpp source
  ansible.builtin.git:
    repo: "{{ deepseek_v4_ik_repository }}"
    dest: "{{ deepseek_v4_ik_source_dir }}"
    version: "{{ deepseek_v4_ik_commit }}"
    update: false
    depth: 1

- name: Build the pinned CUDA candidate in the already pinned runtime image
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --entrypoint
      - /bin/bash
      - -v
      - "{{ deepseek_v4_ik_source_dir }}:/src"
      - -w
      - /src
      - "{{ deepseek_v4_ik_runtime_image }}"
      - -lc
      - >-
        cmake -S . -B build -DGGML_CUDA=ON -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_CUDA_ARCHITECTURES=86 && cmake --build build --target llama-server -j 16
  args:
    creates: "{{ deepseek_v4_ik_build_dir }}/bin/llama-server"
