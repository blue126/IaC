---
- name: Reserve the immutable experiment identifier atomically
  ansible.builtin.command:
    argv:
      - mkdir
      - --mode=0750
      - "{{ deepseek_v4_ik_experiment_dir }}"
  register: deepseek_v4_ik_experiment_reservation
  changed_when: deepseek_v4_ik_experiment_reservation.rc == 0
  failed_when: false

- name: Require an unused experiment identifier
  ansible.builtin.assert:
    that:
      - deepseek_v4_ik_experiment_reservation.rc == 0
    fail_msg: >-
      Evidence directory {{ deepseek_v4_ik_experiment_dir }} already exists;
      choose a new experiment ID instead of overwriting evidence.
