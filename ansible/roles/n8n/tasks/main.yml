---
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install system dependencies
  apt:
    name:
      - curl
      - git
      - gnupg
      - build-essential
    state: present

- name: Remove manual Node.js installation (conflict with apt)
  file:
    path: "{{ item }}"
    state: absent
  with_items:
    - /usr/local/bin/node
    - /usr/local/bin/npm
    - /usr/local/lib/node_modules

- name: Install NodeSource repository
  when: not ansible_check_mode
  block:
    - name: Allocate NodeSource installer file
      ansible.builtin.tempfile:
        state: file
        suffix: .nodesource-setup.sh
      register: n8n_nodesource_installer

    - name: Download NodeSource repository installer
      ansible.builtin.get_url:
        url: "https://deb.nodesource.com/setup_{{ n8n_nodejs_version.split('.')[0] }}.x"
        dest: "{{ n8n_nodesource_installer.path }}"
        force: true
        mode: "0700"

    - name: Run NodeSource repository installer
      ansible.builtin.command:
        argv: [/bin/bash, "{{ n8n_nodesource_installer.path }}"]
      changed_when: false
  always:
    - name: Remove NodeSource installer file
      ansible.builtin.file:
        path: "{{ n8n_nodesource_installer.path }}"
        state: absent
      when: n8n_nodesource_installer.path is defined

- name: Install approved Node.js version
  ansible.builtin.apt:
    name: "nodejs={{ n8n_nodejs_version }}*"
    state: present
    update_cache: yes
  notify: Restart n8n

- name: Check Node.js version
  ansible.builtin.command:
    cmd: node --version
  register: n8n_installed_nodejs_version
  changed_when: false

- name: Assert approved Node.js version
  ansible.builtin.assert:
    that:
      - n8n_installed_nodejs_version.stdout == "v" + n8n_nodejs_version
    fail_msg: >-
      Expected Node.js v{{ n8n_nodejs_version }}, but found
      {{ n8n_installed_nodejs_version.stdout }}.

- name: Install approved n8n version globally
  community.general.npm:
    name: n8n
    version: "{{ n8n_version }}"
    global: true
    state: present
  notify: Restart n8n

- name: Check n8n version
  ansible.builtin.command:
    cmd: /usr/bin/n8n --version
  register: n8n_installed_version
  changed_when: false

- name: Assert approved n8n version
  ansible.builtin.assert:
    that:
      - n8n_installed_version.stdout == n8n_version
    fail_msg: >-
      Expected n8n {{ n8n_version }}, but found
      {{ n8n_installed_version.stdout }}.

- name: Create systemd service for n8n
  template:
    src: n8n.service.j2
    dest: /etc/systemd/system/n8n.service
    mode: '0644'
  notify: Restart n8n

- name: Enable and start n8n service
  systemd:
    name: n8n
    enabled: yes
    state: started
    daemon_reload: yes
