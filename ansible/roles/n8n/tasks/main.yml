---
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install system dependencies
  apt:
    name:
      - curl
      - git
      - gnupg
      - build-essential
    state: present

- name: Remove manual Node.js installation (conflict with apt)
  file:
    path: "{{ item }}"
    state: absent
  with_items:
    - /usr/local/bin/node
    - /usr/local/bin/npm
    - /usr/local/lib/node_modules

- name: Install NodeSource repository
  when: not ansible_check_mode
  block:
    - name: Allocate NodeSource installer file
      ansible.builtin.tempfile:
        state: file
        suffix: .nodesource-setup.sh
      register: n8n_nodesource_installer

    - name: Download NodeSource repository installer
      ansible.builtin.get_url:
        url: https://deb.nodesource.com/setup_20.x
        dest: "{{ n8n_nodesource_installer.path }}"
        force: true
        mode: "0700"

    - name: Run NodeSource repository installer
      ansible.builtin.command:
        argv: [/bin/bash, "{{ n8n_nodesource_installer.path }}"]
  always:
    - name: Remove NodeSource installer file
      ansible.builtin.file:
        path: "{{ n8n_nodesource_installer.path }}"
        state: absent
      when: n8n_nodesource_installer.path is defined

- name: Upgrade Node.js
  apt:
    name: "nodejs=20.*"
    state: present
    update_cache: yes

- name: Check Node.js version
  command: node --version
  register: node_version
  changed_when: false

- name: Display Node.js version
  debug:
    msg: "Node.js version: {{ node_version.stdout }}"

- name: Install n8n globally
  npm:
    name: n8n
    global: yes
    state: present

- name: Create systemd service for n8n
  template:
    src: n8n.service.j2
    dest: /etc/systemd/system/n8n.service
    mode: '0644'
  notify: Restart n8n

- name: Enable and start n8n service
  systemd:
    name: n8n
    enabled: yes
    state: started
    daemon_reload: yes
