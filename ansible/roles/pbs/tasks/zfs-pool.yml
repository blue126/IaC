---
# Adopt the existing PBS pool. Missing/unimported pools require manual recovery;
# a failed query must never authorize pool creation, import, or remounting.
- name: Require the existing ZFS pool
  ansible.builtin.command:
    argv: [zpool, list, -H, -o, name, "{{ pbs_zfs_pool_name }}"]
  register: pbs_pool_check
  changed_when: false
  check_mode: false

- name: Read existing ZFS pool properties
  ansible.builtin.command:
    argv:
      - zfs
      - get
      - -H
      - -o
      - property,value
      - mountpoint,compression,recordsize,atime
      - "{{ pbs_zfs_pool_name }}"
  register: pbs_pool_properties
  changed_when: false
  check_mode: false

- name: Verify existing ZFS pool properties without modifying storage
  ansible.builtin.assert:
    that:
      - item.split('\t') | length == 2
      - item.split('\t')[1] == pbs_expected_properties[item.split('\t')[0]]
    fail_msg: "Existing PBS pool differs from inventory: {{ item }}. Reconcile explicitly; no storage changes were made."
  vars:
    pbs_expected_properties:
      mountpoint: "{{ pbs_zfs_mount_point }}"
      compression: "{{ pbs_zfs_compression }}"
      recordsize: "{{ pbs_zfs_recordsize }}"
      atime: "{{ pbs_zfs_atime }}"
  loop: "{{ pbs_pool_properties.stdout_lines }}"
