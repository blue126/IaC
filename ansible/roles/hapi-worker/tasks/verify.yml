---
- name: Verify the worker is connected to the VM500 HAPI application
  ansible.builtin.uri:
    url: http://127.0.0.1:3006/health
    use_proxy: false
    status_code: 200

- name: Verify only the fixed local Claude login API is healthy
  ansible.builtin.uri:
    url: http://127.0.0.1:6082/api/login/status
    use_proxy: false
    headers:
      Host: "{{ hapi_worker_origin | regex_replace('^https://', '') }}"
      X-Hapi-Login-Service: verified-proxy
    status_code: 200
  no_log: true

- name: Read the worker service states without changing them
  ansible.builtin.service_facts:
  register: hapi_worker_running_services

- name: Require only the dedicated worker services to be running
  ansible.builtin.assert:
    that: hapi_worker_running_services.ansible_facts.services[item + '.service'].state == 'running'
  loop: [hapi-worker-runner, hapi-worker-proxy, hapi-hub-client, claude-login-agent]
