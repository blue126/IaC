---
- name: Verify the worker identity before any package or credential write
  ansible.builtin.include_tasks: identity.yml

- name: Validate supplied worker leaf material without revealing values
  ansible.builtin.assert:
    that:
      - hapi_worker_api_token is match('^[A-Za-z0-9_-]{32,256}$')
      - hapi_worker_ca | length > 0
      - hapi_worker_crl | length > 0
      - hapi_worker_server_certificate | length > 0
      - hapi_worker_server_key | length > 0
      - hapi_worker_client_certificate | length > 0
      - hapi_worker_client_key | length > 0
  no_log: true

- name: Prepare the approved native browser and Claude baseline
  ansible.builtin.include_role:
    name: hapi-workspace-baseline
  vars:
    hapi_workspace_vmid: '{{ hapi_worker_vmid }}'
    hapi_workspace_baseline_install_dependencies: '{{ hapi_worker_install_dependencies }}'

- name: Install the explicitly approved worker proxy dependency
  ansible.builtin.apt:
    name: nginx-core
    state: present
    policy_rc_d: 101
  when: hapi_worker_install_dependencies | bool

- name: Check the worker proxy runtime
  ansible.builtin.command: /usr/sbin/nginx -v
  changed_when: false

- name: Record this request as the sole worker owner
  ansible.builtin.copy:
    content: >-
      {{ {'version': 1, 'request_id': hapi_worker_request_id, 'workspace_id': hapi_worker_id,
          'vmid': hapi_worker_vmid | int, 'product_uuid': hapi_worker_product_uuid} | to_nice_json }}
    dest: /etc/hapi-worker-owner.json
    owner: root
    group: root
    mode: '0600'

- name: Create the login transport service account
  ansible.builtin.user:
    name: hapi-worker-proxy
    system: true
    create_home: false
    shell: /usr/sbin/nologin

- name: Create the private worker configuration directory
  ansible.builtin.file:
    path: /etc/hapi-worker
    state: directory
    owner: root
    group: hapi-worker-proxy
    mode: '0750'

- name: Create the fixed CLI release directory
  ansible.builtin.file:
    path: /opt/hapi-worker/v0.33.2
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Download the pinned HAPI Runner CLI release
  ansible.builtin.get_url:
    url: https://github.com/tiann/hapi/releases/download/v0.33.2/hapi-linux-x64-baseline.tar.gz
    checksum: sha256:45d843d700e656cf3a9db4b0df7c4c1b174fd334fe8194ea73b3bbc78c564290
    dest: /opt/hapi-worker/v0.33.2/release.tar.gz
    owner: root
    group: root
    mode: '0644'

- name: Extract the fixed worker CLI
  ansible.builtin.unarchive:
    src: /opt/hapi-worker/v0.33.2/release.tar.gz
    dest: /opt/hapi-worker/v0.33.2
    remote_src: true
    creates: /opt/hapi-worker/v0.33.2/hapi

- name: Create the employee project root
  ansible.builtin.file:
    path: '{{ hapi_worker_project_root }}'
    state: directory
    owner: employee
    group: employee
    mode: '0700'

- name: Connect the worker loopback endpoint to the HAPI Hub on VM500
  ansible.builtin.include_role:
    name: hapi-hub-client
  vars:
    hapi_hub_client_id: 'hapi-{{ hapi_worker_id }}'
    hapi_hub_client_address: '{{ hapi_worker_control_address }}'
    hapi_hub_client_activate: true
    hapi_hub_client_ca: '{{ hapi_worker_ca }}'
    hapi_hub_client_crl: '{{ hapi_worker_crl }}'
    hapi_hub_client_certificate: '{{ hapi_worker_client_certificate }}'
    hapi_hub_client_key: '{{ hapi_worker_client_key }}'

- name: Install only the VM-local personal login execution component
  ansible.builtin.include_role:
    name: claude-login-agent
  vars:
    claude_login_agent_origin: '{{ hapi_worker_origin }}'
    claude_login_agent_install_dependencies: '{{ hapi_worker_install_dependencies }}'

- name: Deploy only the fixed worker credential and VM500 HAPI endpoint
  ansible.builtin.template:
    src: runner.env.j2
    dest: /etc/hapi-worker/runner.env
    owner: root
    group: root
    mode: '0600'
  no_log: true
  diff: false
  notify: Restart HAPI worker Runner

- name: Deploy only the login server leaf and trust material
  ansible.builtin.copy:
    content: '{{ item.content }}'
    dest: '/etc/hapi-worker/{{ item.name }}'
    owner: root
    group: hapi-worker-proxy
    mode: '0640'
  loop:
    - {name: ca.pem, content: '{{ hapi_worker_ca }}'}
    - {name: crl.pem, content: '{{ hapi_worker_crl }}'}
    - {name: server.pem, content: '{{ hapi_worker_server_certificate }}'}
    - {name: server.key, content: '{{ hapi_worker_server_key }}'}
  no_log: true
  diff: false
  notify: Restart HAPI worker login transport

- name: Prepare the private login proxy runtime
  ansible.builtin.file:
    path: '/run/hapi-worker-proxy/{{ item }}'
    state: directory
    owner: hapi-worker-proxy
    group: hapi-worker-proxy
    mode: '0700'
  loop: ['', body, proxy, fastcgi, uwsgi, scgi]

- name: Deploy the login-only mTLS endpoint
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/hapi-worker/nginx.conf
    owner: root
    group: hapi-worker-proxy
    mode: '0640'
    validate: /usr/sbin/nginx -t -c %s
  notify: Restart HAPI worker login transport

- name: Deploy only the supervised Runner and login transport services
  ansible.builtin.template:
    src: '{{ item }}.service.j2'
    dest: '/etc/systemd/system/hapi-worker-{{ item }}.service'
    owner: root
    group: root
    mode: '0644'
  loop: [runner, proxy]
  notify:
    - Restart HAPI worker Runner
    - Restart HAPI worker login transport

- name: Inspect the PID file created by root candidate validation
  ansible.builtin.stat:
    path: /run/hapi-worker-proxy/nginx.pid
    follow: false
  register: hapi_worker_pid

- name: Require a regular worker proxy PID file
  ansible.builtin.assert:
    that: not hapi_worker_pid.stat.exists or hapi_worker_pid.stat.isreg

- name: Keep the validated PID file writable by its service account
  ansible.builtin.file:
    path: /run/hapi-worker-proxy/nginx.pid
    owner: hapi-worker-proxy
    group: hapi-worker-proxy
    mode: '0600'
    follow: false
  when: hapi_worker_pid.stat.exists

- name: Apply the approved worker service configuration
  ansible.builtin.meta: flush_handlers

- name: Enable only this worker Runner and login endpoint
  ansible.builtin.systemd_service:
    name: 'hapi-worker-{{ item }}'
    enabled: true
    daemon_reload: true
    state: started
  loop: [runner, proxy]
