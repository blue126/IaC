---
- name: Verify the local workspace Hub rejects anonymous requests
  ansible.builtin.uri:
    url: http://127.0.0.1:3006/api/sessions
    status_code: [401, 403]
    follow_redirects: none

- name: Verify the workspace Hub loopback boundary
  ansible.builtin.command: ss -H -lnt
  changed_when: false
  register: hapi_workspace_listeners
  failed_when: >-
    hapi_workspace_listeners.rc != 0 or
    '127.0.0.1:3006' not in hapi_workspace_listeners.stdout or
    (hapi_workspace_listeners.stdout is search('(?:0\.0\.0\.0|\*|\[::\]):3006')) or
    (hapi_workspace_bind_address + ':9443') not in hapi_workspace_listeners.stdout

- name: Verify the service proxy requires a client certificate
  ansible.builtin.uri:
    url: 'https://{{ hapi_workspace_bind_address }}:9443/api/sessions'
    validate_certs: false
    status_code: [400, 496]
    follow_redirects: none
  register: hapi_workspace_anonymous_mtls
  failed_when: hapi_workspace_anonymous_mtls.status not in [400, 496]

- name: Verify the fixed personal login API without starting authorization
  ansible.builtin.uri:
    url: http://127.0.0.1:6082/api/login/status
    headers:
      Host: "{{ hapi_workspace_origin | regex_replace('^https://', '') }}"
      X-Hapi-Login-Service: verified-proxy
    status_code: 200
    follow_redirects: none

- name: Verify the personal login API rejects an unverified direct request
  ansible.builtin.uri:
    url: http://127.0.0.1:6082/api/login/status
    status_code: 403
    follow_redirects: none
