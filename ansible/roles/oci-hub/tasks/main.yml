---
- name: Validate fixed Portal artifact and isolated deployment inputs
  ansible.builtin.assert:
    that:
      - oci_hub_profile == 'oci-hub'
      - oci_hub_portal_version == '2.3.1'
      - oci_hub_portal_sha256 is match('^[a-f0-9]{64}$')
      - oci_hub_portal_admin_password | length >= 16
      - oci_hub_portal_api_token | length >= 32
    fail_msg: Supply fixed, verified artifacts and explicit protected configuration.
  no_log: true

- name: Check preinstalled runtime dependencies
  ansible.builtin.command:
    argv: [which, python3, nft, wg, ip, iptables]
  changed_when: false
  check_mode: false

- name: Enumerate existing WireGuard interfaces without reading keys
  ansible.builtin.command: wg show interfaces
  register: oci_hub_existing_interfaces
  changed_when: false
  check_mode: false

- name: Require every existing foreign interface to be excluded
  ansible.builtin.assert:
    that:
      - oci_hub_existing_interfaces.stdout.split() | difference(['wg-users', 'wg-workspaces']) | difference(oci_hub_ignored_interfaces) | length == 0

- name: Create protected Hub directories
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: root
    group: root
    mode: '0700'
  loop: [/etc/oci-hub, /var/lib/oci-hub, /opt/oci-hub, /var/lib/oci-hub/portal]

# The root executor writes the monthly usage snapshot here; setgid keeps it in the caddy
# group so Caddy can read but not write it. /var/lib/oci-hub stays root-only.
- name: Create the usage snapshot directory readable by Caddy
  ansible.builtin.file:
    path: /var/lib/oci-hub-usage
    state: directory
    owner: root
    group: caddy
    mode: '2750'

- name: Deploy scoped boundary verifier
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/../../scripts/oci-hub/boundary.py'
    dest: /usr/local/lib/oci-hub-boundary.py
    owner: root
    group: root
    mode: '0755'

# wsctl owns the live policy once a Hub runs (it carries the employee pairs), so the
# role seeds it only on a new host and never overwrites it.
- name: Check for an existing Hub ACL policy
  ansible.builtin.stat:
    path: /etc/oci-hub/boundary.json
  register: oci_hub_boundary_file

- name: Require an explicit Hub ACL policy on a new host
  ansible.builtin.assert:
    that: oci_hub_boundary.kind == 'hub'
    fail_msg: A new Hub needs oci_hub_boundary with kind hub.
  when: not oci_hub_boundary_file.stat.exists

- name: Seed the explicit Hub ACL policy on a new host
  ansible.builtin.copy:
    content: '{{ oci_hub_boundary | to_nice_json }}'
    dest: /etc/oci-hub/boundary.json
    owner: root
    group: root
    mode: '0600'
  when: not oci_hub_boundary_file.stat.exists

- name: Persist approved IPv4 forwarding for this routed gateway
  ansible.builtin.copy:
    dest: /etc/sysctl.d/90-oci-hub-forwarding.conf
    content: "net.ipv4.ip_forward = 1\n"
    owner: root
    group: root
    mode: '0644'

- name: Apply live ACL before Portal startup
  ansible.builtin.command: /usr/local/lib/oci-hub-boundary.py apply
  changed_when: true

# get_url skips the download when the existing file already has this checksum.
- name: Download the pinned upstream Portal release
  ansible.builtin.get_url:
    url: 'https://github.com/h44z/wg-portal/releases/download/v{{ oci_hub_portal_version }}/wg-portal_linux_arm64'
    checksum: 'sha256:{{ oci_hub_portal_sha256 }}'
    dest: /opt/oci-hub/wg-portal
    owner: root
    group: root
    mode: '0700'

- name: Deploy protected Portal configuration
  ansible.builtin.template:
    src: portal.yaml.j2
    dest: /etc/oci-hub/portal.yaml
    owner: root
    group: root
    mode: '0600'
  notify: Restart scoped Portal after a configuration change
  no_log: true

- name: Deploy executor protected configuration
  ansible.builtin.copy:
    content: "{{ oci_hub_executor_config | to_nice_json }}"
    dest: /etc/oci-hub/executor.json
    owner: root
    group: root
    mode: '0600'
  no_log: true

- name: Deploy ordered scoped services
  ansible.builtin.template:
    src: '{{ item }}.j2'
    dest: '/etc/systemd/system/{{ item }}'
    owner: root
    group: root
    mode: '0644'
  loop: [oci-hub-boundary.service, oci-hub-portal.service, oci-hub-quota.service, oci-hub-quota.timer]

- name: Enable scoped services after live ACL validation
  ansible.builtin.systemd_service:
    name: '{{ item }}'
    enabled: true
    state: started
    daemon_reload: true
  loop: [oci-hub-boundary, oci-hub-portal]

# Service code, the ledger, the interfaces and the quota timer belong to the private
# `wsctl oci-hub-release`; `--new-hub` starts them on a host this role has prepared.
- name: Wait for the loopback-only Portal API
  ansible.builtin.uri:
    url: http://127.0.0.1:8888/api/v1/interface/all
    user: '{{ oci_hub_portal_admin_user }}'
    password: '{{ oci_hub_portal_api_token }}'
    force_basic_auth: true
    status_code: 200
    return_content: false
  register: oci_hub_portal_ready
  until: oci_hub_portal_ready.status | default(0) == 200
  retries: 20
  delay: 1
  check_mode: false
  no_log: true

- name: Configure the public Portal site using the existing Caddy installation
  ansible.builtin.include_role:
    name: caddy
    tasks_from: reverse-proxy
  vars:
    caddy_reverse_proxy_name: wgportal
    caddy_reverse_proxy_domain: "{{ oci_hub_portal_external_url | urlsplit('hostname') }}"
    caddy_reverse_proxy_upstream: 127.0.0.1:8888
    # The site's read-only view of the Portal's metrics; the Portal's other 8787 paths stay private.
    # /ga2-usage serves the executor's monthly usage snapshot with the same read-only token.
    caddy_reverse_proxy_pre_directives: "{{ (oci_hub_ga2_metrics_route ~ oci_hub_ga2_usage_route) if oci_hub_portal_metrics_password_hash | length > 0 else '' }}"
    oci_hub_ga2_metrics_route: |
      handle /ga2-metrics {
          basic_auth {
              ga2-site {{ oci_hub_portal_metrics_password_hash }}
          }
          rewrite * /metrics
          reverse_proxy 127.0.0.1:8787
      }
    oci_hub_ga2_usage_route: |
      handle /ga2-usage {
          basic_auth {
              ga2-site {{ oci_hub_portal_metrics_password_hash }}
          }
          header Cache-Control no-store
          root * /var/lib/oci-hub-usage
          rewrite * /ga2-usage.json
          file_server
      }
  when: oci_hub_portal_external_url is match('^https://')
