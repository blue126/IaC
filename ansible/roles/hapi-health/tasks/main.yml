---
- name: Require an explicitly configured HAPI health target
  ansible.builtin.assert:
    that:
      - ansible_facts.system == 'Linux'
      - hapi_health_check_network | bool or hapi_health_tls_files | length > 0

- name: Check the preinstalled public PKI inspection runtime
  ansible.builtin.command: /usr/bin/openssl version
  changed_when: false
  when: hapi_health_tls_files | length > 0

- name: Create the HAPI health configuration directory
  ansible.builtin.file:
    path: /etc/hapi-health
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install the read-only HAPI health checker
  ansible.builtin.copy:
    src: hapi-health.py
    dest: /usr/local/lib/hapi-health.py
    owner: root
    group: root
    mode: '0755'

- name: Deploy the explicitly selected HAPI public material paths
  ansible.builtin.copy:
    content: >-
      {{ {'version': 1, 'minimum_valid_days': hapi_health_min_valid_days | int,
          'network': hapi_health_check_network | bool, 'tls': hapi_health_tls_files} | to_nice_json }}
    dest: /etc/hapi-health/config.json
    owner: root
    group: root
    mode: '0644'
    validate: /usr/bin/python3 /usr/local/lib/hapi-health.py --validate %s

- name: Install the HAPI health service and timer
  ansible.builtin.template:
    src: '{{ item }}.j2'
    dest: '/etc/systemd/system/{{ item }}'
    owner: root
    group: root
    mode: '0644'
  loop: [hapi-health.service, hapi-health.timer]
  notify: Restart HAPI health timer

- name: Apply explicitly enabled HAPI health timer changes
  ansible.builtin.meta: flush_handlers

- name: Set the approved HAPI health timer activation
  ansible.builtin.systemd_service:
    name: hapi-health.timer
    daemon_reload: true
    enabled: '{{ hapi_health_enable_timer | bool }}'
    state: '{{ "started" if hapi_health_enable_timer | bool else "stopped" }}'
