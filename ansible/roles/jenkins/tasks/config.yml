---
- name: Validate desired controller mode and exclusive identities before convergence
  ansible.builtin.assert:
    that:
      - jenkins_controller_mode in ['bootstrap', 'normal']
      - jenkins_casc_nodes | map(attribute='name') | list | sort == ['iac-apps', 'iac-deploy', 'iac-plan']
      - jenkins_casc_nodes | length == 3
      - jenkins_home == '/var/lib/jenkins'
      - jenkins_systemd_override_dir == '/etc/systemd/system/jenkins.service.d'
      - jenkins_casc_dir == jenkins_home + '/casc'
      - jenkins_casc_config_path == jenkins_home + '/casc/jenkins.yaml'

- name: Load CI toolchain BOM for convergence inspection
  ansible.builtin.include_vars:
    file: "{{ role_path }}/../../../ci/toolchain-bom.yml"
    name: ci_toolchain_bom

- name: Read installed core before deciding no-op convergence
  ansible.builtin.command:
    argv: [dpkg-query, -W, '-f=${Version}', jenkins]
  register: jenkins_controller_convergence_core
  changed_when: false

- name: Reject a core version outside the BOM
  ansible.builtin.assert:
    that:
      - jenkins_controller_convergence_core.stdout == ci_toolchain_bom.jenkins.core.package_version

- name: Inspect controller directories without writing
  ansible.builtin.stat:
    path: "{{ item.path }}"
  loop:
    - path: "{{ jenkins_casc_dir }}"
      owner: root
      group: jenkins
      mode: '0750'
    - path: "{{ jenkins_systemd_override_dir }}"
      owner: root
      group: root
      mode: '0755'
  register: jenkins_controller_convergence_directories

- name: Inspect controller configuration files without writing
  ansible.builtin.stat:
    path: "{{ item.path }}"
    checksum_algorithm: sha256
  loop:
    - path: "{{ jenkins_casc_config_path }}"
      template: jenkins.yaml.j2
      owner: root
      group: jenkins
      mode: '0640'
    - path: "{{ jenkins_systemd_override_dir }}/10-casc.conf"
      template: jenkins.service.override.conf.j2
      owner: root
      group: root
      mode: '0644'
  register: jenkins_controller_convergence_files
  no_log: true

- name: Inspect pinned controller plugins without writing
  ansible.builtin.stat:
    path: "{{ jenkins_home }}/plugins/{{ item.id }}.jpi"
    checksum_algorithm: sha256
  loop: "{{ ci_toolchain_bom.jenkins.managed_plugins }}"
  register: jenkins_controller_convergence_plugins

- name: Inspect deployed recovery helper bytes without writing
  ansible.builtin.stat:
    path: "/opt/jenkins-recovery/{{ item }}"
    checksum_algorithm: sha256
  loop: [control.py, controller-maintenance.py]
  register: jenkins_controller_convergence_helpers

- name: Initialize controller convergence decision
  ansible.builtin.set_fact:
    jenkins_controller_configuration_unchanged: true

- name: Require fresh gate when configuration bytes or metadata differ
  ansible.builtin.set_fact:
    jenkins_controller_configuration_unchanged: false
  when: >-
    not item.stat.exists or
    item.stat.checksum | default('') != (lookup('template', item.item.template) | hash('sha256')) or
    item.stat.pw_name | default('') != item.item.owner or
    item.stat.gr_name | default('') != item.item.group or
    item.stat.mode | default('') != item.item.mode
  loop: "{{ jenkins_controller_convergence_files.results }}"
  no_log: true

- name: Require fresh gate when controller directory metadata differs
  ansible.builtin.set_fact:
    jenkins_controller_configuration_unchanged: false
  when: >-
    not item.stat.exists or not item.stat.isdir | default(false) or
    item.stat.pw_name | default('') != item.item.owner or
    item.stat.gr_name | default('') != item.item.group or
    item.stat.mode | default('') != item.item.mode
  loop: "{{ jenkins_controller_convergence_directories.results }}"

- name: Require fresh gate when pinned plugin bytes differ
  ansible.builtin.set_fact:
    jenkins_controller_configuration_unchanged: false
  when: not item.stat.exists or item.stat.checksum | default('') != item.item.sha256
  loop: "{{ jenkins_controller_convergence_plugins.results }}"

- name: Require fresh gate when deployed recovery helper bytes differ
  ansible.builtin.set_fact:
    jenkins_controller_configuration_unchanged: false
  when: >-
    not item.stat.exists or
    item.stat.checksum | default('') != (lookup('file', role_path + '/../../../scripts/jenkins/' + item.item, rstrip=false) | hash('sha256')) or
    item.stat.pw_name | default('') != 'root' or
    item.stat.gr_name | default('') != 'root' or
    item.stat.mode | default('') != '0500'
  loop: "{{ jenkins_controller_convergence_helpers.results }}"

- name: Apply controller configuration only with a fresh one-use gate
  ansible.builtin.include_tasks: config-write.yml
  when: not jenkins_controller_configuration_unchanged | bool
