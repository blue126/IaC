---
# Existing controllers are changed only through config.yml's signed lifecycle gate.
- name: Inspect the legacy controller bootstrap target
  ansible.builtin.stat:
    path: "{{ jenkins_home }}/config.xml"
  register: jenkins_bootstrap_existing_config
  when: jenkins_controller_bootstrap_install_authorized | bool

- name: Refuse legacy installation over an existing controller
  ansible.builtin.assert:
    that:
      - not jenkins_bootstrap_existing_config.stat.exists
    fail_msg: Existing controllers require independent maintenance and real recovery evidence.
  when: jenkins_controller_bootstrap_install_authorized | bool

- name: Run separately authorized first-controller bootstrap
  ansible.builtin.include_tasks: bootstrap.yml
  when: jenkins_controller_bootstrap_install_authorized | bool

- name: Configure Jenkins controller from code
  ansible.builtin.import_tasks: config.yml
  when: jenkins_manage_casc | bool
  tags: [jenkins_config]
