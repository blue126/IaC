---
- name: Validate the employee registry from the D1 catalog
  ansible.builtin.assert:
    that:
      - item.id is match('^[a-z][a-z0-9-]{0,27}$')
      - item.id not in hapi_registry_static_ids
      - item.email is match('^[^\s@A-Z]+@[^\s@A-Z]+$')
      - item.address is match('^10\.236\.[0-9]{1,3}\.2$')
      - item.token is match('^[A-Za-z0-9_-]{32,256}$')
  loop: '{{ hapi_registry_employees }}'
  loop_control:
    label: '{{ item.id }}'
  no_log: true

# The registry writes routes without a pre-bound subject, which only the current authorizer accepts.
- name: Install the authorizer that binds first-login subjects
  ansible.builtin.copy:
    src: '{{ role_path }}/../hapi-control-plane/files/hapi-auth.py'
    dest: /usr/local/lib/hapi-auth.py
    owner: root
    group: root
    mode: '0755'
  notify: Restart HAPI control authentication

# The login page's viewer must match the employee desktops it connects to.
- name: Install the current login page assets
  ansible.builtin.copy:
    src: '{{ role_path }}/../hapi-control-plane/files/hapi-login-portal/'
    dest: /usr/local/lib/hapi-login-portal/
    owner: root
    group: root
    mode: '0644'
    directory_mode: '0755'

# The registry reloads the transport after each change, which needs the unit's ExecReload.
- name: Install the reloadable shared Hub transport unit
  ansible.builtin.template:
    src: '{{ role_path }}/../hapi-shared-hub/templates/hapi-hub-transport.service.j2'
    dest: /etc/systemd/system/hapi-hub-transport.service
    owner: root
    group: root
    mode: '0644'
  notify: Load changed HAPI units

- name: Apply the authorizer and unit changes before routes change
  ansible.builtin.meta: flush_handlers

- name: Deploy the registry renderer
  ansible.builtin.copy:
    src: hapi-registry.py
    dest: /usr/local/lib/hapi-registry.py
    owner: root
    group: root
    mode: '0755'

- name: Render the route, token, credential and transport registries
  ansible.builtin.command:
    argv: [/usr/bin/python3, /usr/local/lib/hapi-registry.py]
    stdin: '{{ {"static_ids": hapi_registry_static_ids, "employees": hapi_registry_employees, "hub_address": hapi_registry_hub_bind_address} | to_json }}'
  register: hapi_registry_render
  changed_when: (hapi_registry_render.stdout | from_json).changed
  no_log: true

- name: Read the rendered registries for the proxies
  ansible.builtin.slurp:
    src: '{{ item }}'
  loop: [/etc/hapi-control-plane/config.json, /etc/hapi-shared-hub/agents.json]
  register: hapi_registry_rendered

- name: Render the control proxy for every route
  ansible.builtin.template:
    src: '{{ role_path }}/../hapi-control-plane/templates/nginx.conf.j2'
    dest: /etc/hapi-control-plane/nginx.conf
    owner: root
    group: hapi-proxy
    mode: '0640'
  vars:
    hapi_control_plane_routes: '{{ (hapi_registry_rendered.results[0].content | b64decode | from_json).routes }}'
    hapi_control_plane_origin: '{{ (hapi_registry_rendered.results[0].content | b64decode | from_json).origin }}'
    hapi_control_plane_shared_hub: '{{ (hapi_registry_rendered.results[0].content | b64decode | from_json).shared_hub }}'

- name: Render the shared Hub transport for every worker
  ansible.builtin.template:
    src: '{{ role_path }}/../hapi-shared-hub/templates/nginx.conf.j2'
    dest: /etc/hapi-shared-hub/nginx.conf
    owner: root
    group: hapi-hub
    mode: '0640'
    validate: /usr/sbin/nginx -t -c %s
  vars:
    hapi_shared_hub_agents: '{{ (hapi_registry_rendered.results[1].content | b64decode | from_json).agents }}'
    hapi_shared_hub_bind_address: '{{ hapi_registry_hub_bind_address }}'
    hapi_shared_hub_origin: '{{ (hapi_registry_rendered.results[0].content | b64decode | from_json).origin }}'

# Reloaded on every run, not only on change: a run whose reload failed leaves the file already
# written, and the next run must still load it. nginx reloads gracefully.
- name: Load the current routes and workers into both proxies
  ansible.builtin.systemd_service:
    name: '{{ item }}'
    state: reloaded
  loop: [hapi-control-proxy, hapi-hub-transport]
  changed_when: false
