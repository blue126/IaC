---
- name: Restart HAPI control authentication
  ansible.builtin.systemd_service:
    name: hapi-control-auth
    state: restarted

- name: Reload HAPI control proxy
  ansible.builtin.systemd_service:
    name: hapi-control-proxy
    state: reloaded

- name: Reload shared HAPI transport
  ansible.builtin.systemd_service:
    name: hapi-hub-transport
    state: reloaded
