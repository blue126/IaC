---
- name: Validate the fixed shared Hub client identity
  ansible.builtin.assert:
    that:
      - hapi_hub_client_id is match('^[a-z][a-z0-9_-]{0,63}$')
      - hapi_hub_client_address is match('^(10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.)[0-9.]+$')
      - ansible_facts.system == 'Linux'
      - hapi_hub_client_legacy_hub_unit == '' or hapi_hub_client_legacy_hub_unit is match('^[a-z][a-z0-9-]{0,63}$')
      - hapi_hub_client_runner_unit == '' or hapi_hub_client_runner_unit is match('^[a-z][a-z0-9-]{0,63}$')

- name: Validate the BWS client transport material without exposing values
  ansible.builtin.assert:
    that:
      - hapi_hub_client_ca | length > 0
      - hapi_hub_client_crl | length > 0
      - hapi_hub_client_certificate | length > 0
      - hapi_hub_client_key | length > 0
  no_log: true

- name: Check the existing worker proxy runtime without installing dependencies
  ansible.builtin.command: /usr/sbin/nginx -v
  changed_when: false

- name: Create the dedicated Hub client group
  ansible.builtin.group:
    name: hapi-hub-client
    system: true

- name: Create the dedicated Hub client account
  ansible.builtin.user:
    name: hapi-hub-client
    group: hapi-hub-client
    system: true
    create_home: false
    shell: /usr/sbin/nologin

- name: Create the private Hub client configuration directory
  ansible.builtin.file:
    path: /etc/hapi-hub-client
    state: directory
    owner: root
    group: hapi-hub-client
    mode: '0750'

- name: Deploy only the worker leaf certificate and transport trust
  ansible.builtin.copy:
    content: '{{ item.content }}'
    dest: '/etc/hapi-hub-client/{{ item.name }}'
    owner: root
    group: hapi-hub-client
    mode: '0640'
  loop:
    - {name: ca.pem, content: '{{ hapi_hub_client_ca }}'}
    - {name: crl.pem, content: '{{ hapi_hub_client_crl }}'}
    - {name: certificate.pem, content: '{{ hapi_hub_client_certificate }}'}
    - {name: private.key, content: '{{ hapi_hub_client_key }}'}
  no_log: true
  diff: false
  notify: Restart HAPI Hub client

- name: Prepare the isolated client proxy runtime
  ansible.builtin.file:
    path: '/run/hapi-hub-client/{{ item }}'
    state: directory
    owner: hapi-hub-client
    group: hapi-hub-client
    mode: '0700'
  loop: ['', body, proxy, fastcgi, uwsgi, scgi]

- name: Deploy the loopback Hub compatibility proxy
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/hapi-hub-client/nginx.conf
    owner: root
    group: hapi-hub-client
    mode: '0640'
    validate: /usr/sbin/nginx -t -c %s
  notify: Restart HAPI Hub client

- name: Deploy the compatibility proxy service
  ansible.builtin.template:
    src: client.service.j2
    dest: /etc/systemd/system/hapi-hub-client.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart HAPI Hub client

- name: Inspect the PID file created by client candidate validation
  ansible.builtin.stat:
    path: /run/hapi-hub-client/nginx.pid
    follow: false
  register: hapi_hub_client_pid

- name: Require a regular Hub client PID file
  ansible.builtin.assert:
    that: not hapi_hub_client_pid.stat.exists or hapi_hub_client_pid.stat.isreg

- name: Keep the candidate PID file writable by the Hub client account
  ansible.builtin.file:
    path: /run/hapi-hub-client/nginx.pid
    owner: hapi-hub-client
    group: hapi-hub-client
    mode: '0600'
    follow: false
  when: hapi_hub_client_pid.stat.exists

- name: Check whether the compatibility proxy already owns the loopback endpoint
  ansible.builtin.service_facts:
  when: hapi_hub_client_activate | bool

- name: Require the old loopback Hub port to be released before first activation
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 3006
    state: stopped
    timeout: 1
  when: hapi_hub_client_activate | bool and ansible_facts.services.get('hapi-hub-client.service', {}).get('state', 'stopped') != 'running'

- name: Prevent the retired worker Hub from starting after the approved cut
  when: hapi_hub_client_activate | bool and hapi_hub_client_legacy_hub_unit | length > 0
  block:
    - name: Create the legacy Hub startup guard directory
      ansible.builtin.file:
        path: '/etc/systemd/system/{{ hapi_hub_client_legacy_hub_unit }}.service.d'
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Add the shared Hub startup guard without replacing the old unit
      ansible.builtin.copy:
        content: "[Unit]\nConditionPathExists=!/etc/hapi-hub-client/shared-hub-active\n"
        dest: '/etc/systemd/system/{{ hapi_hub_client_legacy_hub_unit }}.service.d/shared-hub.conf'
        owner: root
        group: root
        mode: '0644'

    - name: Mark the completed worker endpoint handoff
      ansible.builtin.copy:
        content: "Shared Hub endpoint: hapi-hub.internal\n"
        dest: /etc/hapi-hub-client/shared-hub-active
        owner: root
        group: root
        mode: '0644'

    - name: Disable automatic startup of the already stopped legacy Hub
      ansible.builtin.systemd_service:
        name: '{{ hapi_hub_client_legacy_hub_unit }}'
        daemon_reload: true
        enabled: false

- name: Bind future Runner starts to the compatible endpoint without restarting tasks
  when: hapi_hub_client_activate | bool and hapi_hub_client_runner_unit | length > 0
  block:
    - name: Create the Runner dependency override directory
      ansible.builtin.file:
        path: '/etc/systemd/system/{{ hapi_hub_client_runner_unit }}.service.d'
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Replace only the retired Hub dependency in the existing Runner unit
      ansible.builtin.replace:
        path: '/etc/systemd/system/{{ hapi_hub_client_runner_unit }}.service'
        regexp: '(?m)^(Wants=(?:[A-Za-z0-9@_.:-]+[ \t]+)*){{ hapi_hub_client_legacy_hub_unit | regex_escape }}\.service(?=[ \t]|$)'
        replace: '\1hapi-hub-client.service'
        backup: true
      when: hapi_hub_client_legacy_hub_unit | length > 0

    - name: Add compatibility endpoint ordering without resetting unrelated dependencies
      ansible.builtin.copy:
        content: "[Unit]\nWants=hapi-hub-client.service\nAfter=hapi-hub-client.service\n"
        dest: '/etc/systemd/system/{{ hapi_hub_client_runner_unit }}.service.d/shared-hub.conf'
        owner: root
        group: root
        mode: '0644'

- name: Apply only explicitly activated Hub client changes
  ansible.builtin.meta: flush_handlers

- name: Activate the compatible worker endpoint without restarting the Runner
  ansible.builtin.systemd_service:
    name: hapi-hub-client
    daemon_reload: true
    enabled: true
    state: started
  when: hapi_hub_client_activate | bool
