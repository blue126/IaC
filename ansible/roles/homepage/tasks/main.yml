---
# Install and configure Homepage dashboard from source

- name: Install required packages
  ansible.builtin.apt:
    name:
      - git
      - curl
      - ca-certificates
      - gnupg
    state: present
    update_cache: yes

- name: Add NodeSource GPG key
  ansible.builtin.apt_key:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    state: present

- name: Configure NodeSource repository
  ansible.builtin.copy:
    content: "deb [arch=amd64] https://deb.nodesource.com/node_{{ nodejs_version }}.x nodistro main\n"
    dest: /etc/apt/sources.list.d/nodesource.list
    owner: root
    group: root
    mode: '0644'

- name: Install Node.js
  ansible.builtin.apt:
    name: nodejs
    state: latest
    update_cache: yes

- name: Check installed Node.js version
  ansible.builtin.command:
    cmd: node --version
  register: installed_nodejs_version
  changed_when: false

- name: Verify installed Node.js major version
  ansible.builtin.assert:
    that:
      - (installed_nodejs_version.stdout | regex_replace('^v', '')).split('.')[0] | int == nodejs_version | int
    fail_msg: >-
      Expected Node.js {{ nodejs_version }}.x, but found
      {{ installed_nodejs_version.stdout }}.

- name: Install pnpm globally
  ansible.builtin.command:
    cmd: npm install -g pnpm
  changed_when: false

- name: Deploy pinned Homepage source
  ansible.builtin.git:
    repo: https://github.com/gethomepage/homepage.git
    dest: "{{ homepage_install_dir }}"
    version: "{{ homepage_version }}"
    update: true
    force: true

- name: Install Homepage dependencies
  ansible.builtin.command:
    cmd: pnpm install
    chdir: "{{ homepage_install_dir }}"
  environment:
    CI: "true"

- name: Build Homepage
  ansible.builtin.command:
    cmd: pnpm build
    chdir: "{{ homepage_install_dir }}"
  notify: Restart Homepage

# Import configuration tasks
- name: Import configuration tasks
  ansible.builtin.import_tasks: config.yml
  tags: [config]

- name: Deploy Homepage systemd service
  ansible.builtin.template:
    src: homepage.service.j2
    dest: /etc/systemd/system/homepage.service
  notify: 
    - Reload systemd
    - Restart Homepage

- name: Apply Homepage changes before verification
  ansible.builtin.meta: flush_handlers

- name: Enable and start Homepage service
  ansible.builtin.systemd:
    name: homepage
    enabled: yes
    state: started
    daemon_reload: yes

- name: Wait for Homepage to be ready
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ homepage_port }}"
    status_code: 200
  register: result
  until: result.status == 200
  retries: 30
  delay: 2

- name: Display Homepage access information
  ansible.builtin.debug:
    msg: "Homepage is accessible at http://{{ ansible_host }}:{{ homepage_port }}"
