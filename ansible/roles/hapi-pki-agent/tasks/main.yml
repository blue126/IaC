---
- name: Require an explicitly approved certificate agent deployment
  ansible.builtin.assert:
    that:
      - hapi_pki_agent_activate | bool
      - hapi_pki_agent_config.role in ['control', 'worker']
      - hapi_pki_agent_config.version == 1
      - >-
        hapi_pki_agent_config.role == 'control' or
        hapi_pki_agent_control_address is match('^(10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.)[0-9.]+$')

- name: Require the existing Python cryptography dependency without installing packages
  ansible.builtin.command: /usr/bin/python3 -c 'import cryptography'
  changed_when: false

- name: Create the local certificate agent socket group
  ansible.builtin.group:
    name: hapi-pki
    system: true
  when: hapi_pki_agent_config.role == 'control'

- name: Create the root-owned certificate configuration directory
  ansible.builtin.file:
    path: /etc/hapi-pki
    state: directory
    owner: root
    group: "{{ 'hapi-pki' if hapi_pki_agent_config.role == 'control' else 'root' }}"
    mode: "{{ '0750' if hapi_pki_agent_config.role == 'control' else '0700' }}"

- name: Install the bounded certificate agent and signing implementation
  ansible.builtin.copy:
    src: hapi-pki.py
    dest: /usr/local/lib/hapi-pki.py
    owner: root
    group: root
    mode: '0755'
  register: hapi_pki_agent_script

- name: Publish the nonsecret immutable agent identity profiles
  ansible.builtin.copy:
    content: '{{ hapi_pki_agent_config | to_nice_json }}'
    dest: /etc/hapi-pki/agent.json
    owner: root
    group: root
    mode: '0600'
    validate: /usr/bin/python3 /usr/local/lib/hapi-pki.py check-agent --config %s
  register: hapi_pki_agent_profile

- name: Publish the local-only certificate agent service
  ansible.builtin.template:
    src: agent.service.j2
    dest: /etc/systemd/system/hapi-pki-agent.service
    owner: root
    group: root
    mode: '0644'
  register: hapi_pki_agent_unit

- name: Enable the local-only certificate agent
  ansible.builtin.systemd_service:
    name: hapi-pki-agent
    daemon_reload: true
    enabled: true
    state: "{{ 'restarted' if hapi_pki_agent_unit.changed or hapi_pki_agent_profile.changed or hapi_pki_agent_script.changed else 'started' }}"

- name: Create the private proxy PKI include directory
  ansible.builtin.file:
    path: /etc/hapi-ingress/pki
    state: directory
    owner: root
    group: hapi-ingress
    mode: '0750'
  when: hapi_pki_agent_config.role == 'worker'

- name: Deploy the source-limited private PKI endpoint
  ansible.builtin.template:
    src: agent-location.conf.j2
    dest: /etc/hapi-pki/agent-location.candidate.conf
    owner: root
    group: root
    mode: '0600'
  when: hapi_pki_agent_config.role == 'worker'

- name: Install the exact private proxy include publisher
  ansible.builtin.copy:
    src: hapi-pki-configure-nginx.py
    dest: /usr/local/lib/hapi-pki-configure-nginx.py
    owner: root
    group: root
    mode: '0755'
  when: hapi_pki_agent_config.role == 'worker'

- name: Add and verify only the PKI include in the approved private proxy
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - /usr/local/lib/hapi-pki-configure-nginx.py
      - --name
      - "{{ (hapi_pki_agent_config.profiles | selectattr('id', 'equalto', 'login-server') | first).cn }}"
      - --expected-sha256
      - '{{ hapi_pki_agent_nginx_sha256 }}'
  register: hapi_pki_agent_proxy
  changed_when: hapi_pki_agent_proxy.stdout == 'changed'
  when: hapi_pki_agent_config.role == 'worker'
