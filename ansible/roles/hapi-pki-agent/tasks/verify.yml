---
- name: Verify the local certificate agent socket and bounded identities
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - >-
        import http.client,json,socket;
        c=http.client.HTTPConnection('localhost',timeout=10);
        c.sock=socket.socket(socket.AF_UNIX,socket.SOCK_STREAM);
        c.sock.connect('/run/hapi-pki-agent/agent.sock');
        c.request('POST','/op',body=json.dumps({'action':'inspect'}),headers={'Content-Type':'application/json'});
        r=c.getresponse();assert r.status==200;value=json.loads(r.read());assert value['ok'];
        print(json.dumps({'ok':True,'slots':sorted(value['result']['materials'])}))
  register: hapi_pki_agent_verify
  changed_when: false
  until: hapi_pki_agent_verify.rc == 0
  retries: 5
  delay: 2
