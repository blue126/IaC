---
- name: Validate the independent personal login origin
  ansible.builtin.assert:
    that:
      - claude_login_agent_origin is match('^https://[a-z0-9.-]+$')

- name: Install explicitly approved personal login dependencies
  ansible.builtin.apt:
    name: [tmux, xvfb, xauth, x11vnc, websockify, openbox, dbus-daemon, x11-utils]
    state: present
    policy_rc_d: 101
  when: claude_login_agent_install_dependencies | bool

- name: Create the generic personal browser helper directory
  ansible.builtin.file:
    path: /usr/local/lib/employee-workspace
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install the versioned personal login helpers
  ansible.builtin.copy:
    src: '{{ item.source }}'
    dest: '{{ item.target }}'
    owner: root
    group: root
    mode: '0755'
  loop:
    - {source: workspace-login.py, target: /usr/local/bin/workspace-login}
    - {source: workspace-browser.py, target: /usr/local/bin/workspace-browser}
    - {source: auth-browser.py, target: /usr/local/lib/employee-workspace/auth-browser.py}
    - {source: open-auth-browser.sh, target: /usr/local/lib/employee-workspace/open-auth-browser}

- name: Configure the loopback personal viewer without changing credentials
  ansible.builtin.copy:
    dest: /etc/employee-workspace-browser.json
    owner: root
    group: root
    mode: '0644'
    content: >-
      {{ {'bind_address': '127.0.0.1',
          'viewer_url': claude_login_agent_origin + '/_workspace/login/',
          'viewer_access_note': '在统一入口完成本人授权，无需额外邮箱验证。'} | to_nice_json }}

- name: Install the independent personal browser service
  ansible.builtin.template:
    src: browser.service.j2
    dest: /etc/systemd/system/employee-browser.service
    owner: root
    group: root
    mode: '0644'

- name: Load the personal browser service without starting authorization
  ansible.builtin.systemd_service:
    name: employee-browser
    daemon_reload: true
    enabled: false

- name: Verify the approved baseline has the required personal browser tools
  ansible.builtin.command: /usr/local/bin/workspace-login --check
  become: true
  become_user: employee
  changed_when: false

- name: Install the shared single-workspace browser policy helper
  ansible.builtin.copy:
    src: browser-openbox.py
    dest: /usr/local/lib/claude-login-openbox.py
    owner: root
    group: root
    mode: '0755'

- name: Keep the personal browser on one workspace without restarting applications
  ansible.builtin.command: /usr/bin/python3 /usr/local/lib/claude-login-openbox.py
  become: true
  become_user: employee
  environment:
    HOME: /home/employee
  register: claude_login_agent_openbox
  changed_when: (claude_login_agent_openbox.stdout | from_json).changed

- name: Install the VM-local login flow and fixed execution API
  ansible.builtin.copy:
    src: '{{ item }}.py'
    dest: '/usr/local/lib/{{ item }}.py'
    owner: root
    group: root
    mode: '0755'
  loop: [claude-login-flow, claude-login-agent]
  notify: Restart personal Claude login agent

- name: Install the login execution service definition
  ansible.builtin.template:
    src: agent.service.j2
    dest: /etc/systemd/system/claude-login-agent.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart personal Claude login agent

- name: Apply login execution service changes
  ansible.builtin.meta: flush_handlers

- name: Enable only the fixed login API
  ansible.builtin.systemd_service:
    name: claude-login-agent
    daemon_reload: true
    enabled: true
    state: started
