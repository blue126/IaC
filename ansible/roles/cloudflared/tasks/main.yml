---
# Cloudflare Tunnel (cloudflared) Installation and Configuration
# Exposes internal services to the internet via Cloudflare's network.
#
# PREREQUISITE (manual one-time setup):
#   1. cloudflared tunnel login        → generates ~/.cloudflared/cert.pem
#   2. cloudflared tunnel create <tunnel-name>
#                                       → generates ~/.cloudflared/<TUNNEL_ID>.json
#   3. cloudflared tunnel route dns <tunnel-name> <hostname>
#   4. Configure host-specific tunnel variables in inventory

# === Install cloudflared ===

- name: Add Cloudflare GPG key
  get_url:
    url: https://pkg.cloudflare.com/cloudflare-main.gpg
    dest: /usr/share/keyrings/cloudflare-main.gpg
    mode: '0644'

- name: Add Cloudflare apt repository
  copy:
    dest: /etc/apt/sources.list.d/cloudflared.list
    content: "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main\n"
    mode: '0644'
  register: cloudflared_repo

- name: Install cloudflared
  apt:
    name: cloudflared
    state: present
    update_cache: "{{ cloudflared_repo.changed }}"

- name: Verify cloudflared installation
  command: cloudflared --version
  register: cloudflared_version
  changed_when: false

- name: Display cloudflared version
  debug:
    msg: "{{ cloudflared_version.stdout }}"

# === Configure tunnel ===

- name: Configure Cloudflare Tunnel
  when: cloudflared_configure_tunnel | bool
  block:
    - name: Validate Cloudflare Tunnel configuration
      assert:
        that:
          - cloudflared_tunnel_name | length > 0
          - cloudflared_tunnel_id | length > 0
          - cloudflared_ingress_rules | length > 0
        fail_msg: >
          cloudflared_tunnel_name, cloudflared_tunnel_id, and at least one
          cloudflared_ingress_rules entry are required when tunnel configuration
          is enabled.

    - name: Validate Cloudflare Tunnel ingress rules
      assert:
        that:
          - item.hostname is defined
          - item.hostname | length > 0
          - item.service is defined
          - item.service | length > 0
        fail_msg: >
          Each cloudflared_ingress_rules entry requires non-empty hostname and
          service values.
      loop: "{{ cloudflared_ingress_rules }}"

    - name: Create cloudflared config directory
      file:
        path: "{{ cloudflared_config_dir }}"
        state: directory
        mode: '0755'

    - name: Create cloudflared credentials directory
      file:
        path: "{{ cloudflared_credentials_dir }}"
        state: directory
        mode: '0700'

    - name: Deploy Cloudflare Tunnel credentials
      copy:
        content: "{{ cloudflared_tunnel_credentials | to_nice_json }}\n"
        dest: "{{ cloudflared_credentials_dir }}/{{ cloudflared_tunnel_id }}.json"
        mode: '0600'
      no_log: true
      when: cloudflared_tunnel_credentials is not none
      notify: Restart cloudflared

    - name: Check tunnel credentials file exists
      stat:
        path: "{{ cloudflared_credentials_dir }}/{{ cloudflared_tunnel_id }}.json"
      register: tunnel_credentials

    - name: Fail if tunnel credentials not found
      fail:
        msg: >
          Tunnel credentials file not found at
          {{ cloudflared_credentials_dir }}/{{ cloudflared_tunnel_id }}.json.
          Provide cloudflared_tunnel_credentials through Ansible Vault or create
          the credentials file manually.
      when: not tunnel_credentials.stat.exists

    - name: Deploy cloudflared config
      template:
        src: config.yml.j2
        dest: "{{ cloudflared_config_dir }}/config.yml"
        mode: '0600'
      notify: Restart cloudflared

    - name: Install cloudflared as systemd service
      command: cloudflared service install
      register: service_install
      failed_when:
        - service_install.rc != 0
        - "'already exists' not in (service_install.stderr | default(''))"
      changed_when: service_install.rc == 0

    - name: Enable and start cloudflared service
      systemd:
        name: cloudflared
        enabled: true
        state: started
        daemon_reload: true
