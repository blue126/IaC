---
# Default variables for cloudflared role

# Install cloudflared without configuring a tunnel by default.
cloudflared_configure_tunnel: false

# Locally managed tunnel configuration. Override these values in inventory.
cloudflared_tunnel_name: ""
cloudflared_tunnel_id: ""
cloudflared_ingress_rules: []

# Optional credentials dictionary stored in Ansible Vault. When omitted, the
# credentials file must already exist on the target host.
cloudflared_tunnel_credentials: null

# Config paths
cloudflared_config_dir: /etc/cloudflared
cloudflared_credentials_dir: /root/.cloudflared
