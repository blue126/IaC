---
- name: Read the live writeback threshold
  ansible.builtin.command: sysctl -n vm.dirty_background_bytes
  register: proxmox_storage_writeback_live
  changed_when: false

- name: Verify the writeback threshold
  ansible.builtin.assert:
    that:
      - proxmox_storage_writeback_live.stdout | int == proxmox_storage_dirty_background_bytes | int
  when: not ansible_check_mode or 'verify' in ansible_run_tags
