---
# VM500 only: the Cloudflare Tunnel connector. Employee VMs' private ingress is in the hapi role.
- name: Validate the VM500 connector target
  ansible.builtin.assert:
    that:
      - hapi_ingress_mode == 'gateway'
      - hapi_ingress_vmid | int == 500
      - hapi_ingress_origin == 'https://hapi.willfan.me'

- name: Check the existing proxy runtime
  ansible.builtin.command: /usr/sbin/nginx -v
  changed_when: false

- name: Create the dedicated ingress group
  ansible.builtin.group:
    name: hapi-ingress
    system: true

- name: Create the dedicated ingress account
  ansible.builtin.user:
    name: hapi-ingress
    group: hapi-ingress
    system: true
    create_home: false
    shell: /usr/sbin/nologin

- name: Create the private ingress configuration directory
  ansible.builtin.file:
    path: /etc/hapi-ingress
    state: directory
    owner: root
    group: hapi-ingress
    mode: '0750'

- name: Stage the existing pilot connector on VM500
  when: hapi_ingress_mode == 'gateway'
  block:
    - name: Deploy the approved connector application release
      ansible.builtin.get_url:
        url: https://github.com/cloudflare/cloudflared/releases/download/2026.10.5/cloudflared-linux-amd64
        checksum: sha256:e1bc0cf084fd9e590554fe769a86b1db46701c3f847a43d902f7b974a4e16298
        dest: /usr/local/bin/hapi-ingress-cloudflared
        owner: root
        group: root
        mode: '0755'

    - name: Transfer the existing BWS-managed pilot token when supplied
      ansible.builtin.copy:
        content: "{{ hapi_ingress_tunnel_token | trim }}\n"
        dest: /etc/hapi-ingress/tunnel-token
        owner: hapi-ingress
        group: hapi-ingress
        mode: '0400'
      no_log: true
      diff: false
      when: hapi_ingress_tunnel_token | length > 0

    - name: Require a nonempty existing connector token
      ansible.builtin.stat:
        path: /etc/hapi-ingress/tunnel-token
      register: hapi_ingress_token_file
      failed_when: not hapi_ingress_token_file.stat.exists or hapi_ingress_token_file.stat.size | default(0) == 0

    - name: Deploy the dedicated connector service
      ansible.builtin.template:
        src: tunnel.service.j2
        dest: /etc/systemd/system/hapi-ingress-tunnel.service
        owner: root
        group: root
        mode: '0644'

    - name: Activate the connector only after upstream acceptance
      ansible.builtin.systemd_service:
        name: hapi-ingress-tunnel
        daemon_reload: true
        enabled: true
        state: started
      when: hapi_ingress_start_tunnel | bool
