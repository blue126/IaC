---
- name: Require explicit authorization for trusted internal HTTP
  ansible.builtin.assert:
    that:
      - hapi_internal_http_authorized | bool
      - hapi_ingress_control_address is match('^(10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.)[0-9.]+$')
      - hapi_ingress_control_address != hapi_ingress_backend_address
    fail_msg: Internal HTTP requires the approved SDN isolation and trusted-network policy.

- name: Prepare the isolated proxy runtime paths for candidate validation
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: hapi-ingress
    group: hapi-ingress
    mode: '0750'
  loop: [/run/hapi-ingress, /run/hapi-ingress/body, /run/hapi-ingress/proxy, /run/hapi-ingress/fastcgi, /run/hapi-ingress/uwsgi, /run/hapi-ingress/scgi]

- name: Require the approved automatic-login frontend
  ansible.builtin.assert:
    that:
      - hapi_ingress_web_archive is match('^/')
      - hapi_ingress_web_sha256 is match('^[a-f0-9]{64}$')

- name: Verify the controller frontend artifact digest
  ansible.builtin.stat:
    path: '{{ hapi_ingress_web_archive }}'
    checksum_algorithm: sha256
  delegate_to: localhost
  become: false
  register: hapi_ingress_web_source
  failed_when: hapi_ingress_web_source.stat.checksum | default('') != hapi_ingress_web_sha256

- name: Create the immutable frontend destination
  ansible.builtin.file:
    path: '/opt/hapi-ingress/web/{{ hapi_ingress_web_sha256 }}'
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Extract the approved frontend without changing the Hub or Runner
  ansible.builtin.unarchive:
    src: '{{ hapi_ingress_web_archive }}'
    dest: '/opt/hapi-ingress/web/{{ hapi_ingress_web_sha256 }}'
    owner: root
    group: root
    creates: '/opt/hapi-ingress/web/{{ hapi_ingress_web_sha256 }}/index.html'

- name: Deploy the isolated ingress proxy configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/hapi-ingress/nginx.conf
    owner: root
    group: hapi-ingress
    mode: '0640'
    validate: /usr/sbin/nginx -t -c %s
  notify: Reload HAPI ingress proxy

- name: Deploy the dedicated proxy service definition
  ansible.builtin.template:
    src: proxy.service.j2
    dest: /etc/systemd/system/hapi-ingress-proxy.service
    owner: root
    group: root
    mode: '0644'
  notify: Reload HAPI ingress proxy

- name: Inspect the PID file created by root candidate validation
  ansible.builtin.stat:
    path: /run/hapi-ingress/nginx.pid
    follow: false
  register: hapi_ingress_pid

- name: Require a regular service PID file
  ansible.builtin.assert:
    that: not hapi_ingress_pid.stat.exists or hapi_ingress_pid.stat.isreg

- name: Keep the validated PID file writable by the isolated proxy account
  ansible.builtin.file:
    path: /run/hapi-ingress/nginx.pid
    owner: hapi-ingress
    group: hapi-ingress
    mode: '0644'
    follow: false
  when: hapi_ingress_pid.stat.exists

- name: Apply only ingress proxy changes
  ansible.builtin.meta: flush_handlers

- name: Enable the dedicated ingress proxy
  ansible.builtin.systemd_service:
    name: hapi-ingress-proxy
    daemon_reload: true
    enabled: true
    state: started
