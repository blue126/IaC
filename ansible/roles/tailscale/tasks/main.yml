---
- name: Ensure TUN device permission in LXC configuration
  delegate_to: "{{ proxmox_node | default(inventory_hostname) }}"
  ansible.builtin.lineinfile:
    path: "/etc/pve/lxc/{{ proxmox_vmid }}.conf"
    line: 'lxc.cgroup2.devices.allow: c 10:200 rwm'
    state: present
  register: lxc_tun_device_config
  when:
    - ansible_facts.virtualization_type == 'lxc'
    - proxmox_vmid is defined
    - proxmox_node is defined

- name: Ensure TUN mount entry in LXC configuration
  delegate_to: "{{ proxmox_node | default(inventory_hostname) }}"
  ansible.builtin.lineinfile:
    path: "/etc/pve/lxc/{{ proxmox_vmid }}.conf"
    line: 'lxc.mount.entry: /dev/net/tun dev/net/tun none bind,create=file'
    state: present
  register: lxc_tun_mount_config
  when:
    - ansible_facts.virtualization_type == 'lxc'
    - proxmox_vmid is defined
    - proxmox_node is defined

- name: Track LXC TUN configuration changes
  ansible.builtin.set_fact:
    lxc_config_changed: >-
      {{
        (lxc_tun_device_config.changed | default(false))
        or (lxc_tun_mount_config.changed | default(false))
      }}
  when:
    - ansible_facts.virtualization_type == 'lxc'
    - proxmox_vmid is defined
    - proxmox_node is defined

- name: Prevent Proxmox from overwriting resolv.conf (LXC only)
  ansible.builtin.file:
    path: /etc/.pve-ignore.resolv.conf
    state: touch
  when: ansible_facts.virtualization_type == 'lxc'

- name: Ensure valid DNS resolver (LXC only)
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    content: "nameserver {{ tailscale_dns_server }}"
  when: ansible_facts.virtualization_type == 'lxc'

- name: Restart LXC container to apply changes
  delegate_to: "{{ proxmox_node | default(inventory_hostname) }}"
  ansible.builtin.command: "pct reboot {{ proxmox_vmid }}"
  when: lxc_config_changed | default(false) | bool

- name: Wait for container to come back up
  ansible.builtin.wait_for_connection:
    delay: 10
    timeout: 60
  when: lxc_config_changed | default(false) | bool

- name: Check if Tailscale is installed
  ansible.builtin.shell: command -v tailscale
  register: tailscale_check
  failed_when: tailscale_check.rc not in [0, 1]
  changed_when: false
  check_mode: false

- name: Install curl
  ansible.builtin.package:
    name: curl
    state: present

- name: Install Tailscale
  when:
    - tailscale_check.rc != 0
    - not ansible_check_mode
  block:
    - name: Allocate Tailscale installer file
      ansible.builtin.tempfile:
        state: file
        suffix: .tailscale-install.sh
      register: tailscale_installer

    - name: Download Tailscale installer
      ansible.builtin.get_url:
        url: https://tailscale.com/install.sh
        dest: "{{ tailscale_installer.path }}"
        force: true
        mode: "0700"

    - name: Run Tailscale installer
      ansible.builtin.command:
        argv: [/bin/sh, "{{ tailscale_installer.path }}"]
  always:
    - name: Remove Tailscale installer file
      ansible.builtin.file:
        path: "{{ tailscale_installer.path }}"
        state: absent
      when: tailscale_installer.path is defined

- name: Enable IP forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    sysctl_set: yes
    state: present
    # LXC guests cannot reload host-only parameters such as kernel.printk.
    reload: "{{ ansible_facts.virtualization_type != 'lxc' }}"

- name: Check for /dev/net/tun
  ansible.builtin.stat:
    path: /dev/net/tun
  register: tun_device

- name: Check Tailscale connection state
  ansible.builtin.command: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false
  when: tun_device.stat.exists

- name: Authenticate Tailscale when disconnected
  ansible.builtin.command: >-
    tailscale up --authkey={{ tailscale_auth_key }} --ssh --reset
    --accept-risk=lose-ssh
    --accept-dns={{ tailscale_accept_dns | bool | lower }}
  when:
    - tun_device.stat.exists
    - tailscale_status.rc != 0 or (tailscale_status.stdout | from_json).BackendState != 'Running'
  register: tailscale_up
  changed_when: "'Success' in tailscale_up.stdout"
  # Without this the auth key is echoed in full whenever the task fails,
  # e.g. when the key has expired.
  no_log: true

- name: Configure Tailscale preferences when connected
  ansible.builtin.command: >-
    tailscale set --ssh --accept-risk=lose-ssh
    --accept-dns={{ tailscale_accept_dns | bool | lower }}
  when:
    - tun_device.stat.exists
    - tailscale_status.rc == 0
    - (tailscale_status.stdout | from_json).BackendState == 'Running'
  changed_when: false

# Must run after Tailscale configuration, because `tailscale up` clears the file.
#
# With --accept-dns=false, tailscaled hands /etc/resolv.conf back by restoring
# whatever it saved before it took DNS over. On pve0 that pre-takeover copy was
# long gone, so on 2026-08-11 the hand-back wrote a file containing a `search`
# line and no nameserver at all. The host ran without DNS for twelve hours --
# long enough to break apt, certificate renewal and, as it happened, the very
# notification rework that was meant to stop outages going unnoticed.
#
# pve1 escaped only by accident: it was reinstalled the day before, so Tailscale
# came up with the takeover already off and never had DNS to give back.
#
# The LXC branch above has always declared a resolver. Hypervisors never did.
- name: Ensure a resolver survives Tailscale handing DNS back (hosts, not LXC)
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    content: |
      search {{ tailscale_dns_search }}
      nameserver {{ tailscale_dns_server }}
    owner: root
    group: root
    mode: "0644"
  when:
    - ansible_facts.virtualization_type != 'lxc'
    - not (tailscale_accept_dns | bool)

- name: Get Tailscale IPv4
  ansible.builtin.command: tailscale ip -4
  register: tailscale_ip
  changed_when: false
  when: tun_device.stat.exists

- name: Display Tailscale Info
  ansible.builtin.debug:
    msg: "Device: {{ inventory_hostname }} | Tailscale IP: {{ tailscale_ip.stdout }}"
