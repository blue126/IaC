---
- name: Render DeepSeek V4 GGUF compatibility boundary
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../roles/deepseek-v4-ik/defaults/main.yml
  vars:
    deepseek_v4_ik_render_dir: /tmp/deepseek-v4-ik-render
    deepseek_v4_ik_compat_proxy_path: /tmp/deepseek-v4-ik-render/openai-compat-proxy.py
    deepseek_v4_ik_context_length: 131072
    deepseek_v4_ik_cpu_threads: 32
    deepseek_v4_ik_numa_mode: distribute
    deepseek_v4_ik_batch_threads: 36
    deepseek_v4_ik_disable_pinned_memory: false
    deepseek_v4_ik_batch_size: 4096
    deepseek_v4_ik_ubatch_size: 2048
  pre_tasks:
    - name: Create the render fixture directory
      ansible.builtin.file:
        path: "{{ deepseek_v4_ik_render_dir }}"
        state: directory
        mode: "0755"
  tasks:
    - name: Render the private candidate Compose fixture
      ansible.builtin.template:
        src: ../../roles/deepseek-v4-ik/templates/docker-compose.yml.j2
        dest: "{{ deepseek_v4_ik_render_dir }}/docker-compose.yml"
        mode: "0644"

    - name: Render the compatibility proxy unit fixture
      ansible.builtin.template:
        src: ../../roles/deepseek-v4-ik/templates/deepseek-v4-ik-compat.service.j2
        dest: "{{ deepseek_v4_ik_render_dir }}/deepseek-v4-ik-compat.service"
        mode: "0644"

    - name: Render the pinned GRUB fixture
      ansible.builtin.template:
        src: ../../roles/deepseek-v4-ik/templates/99-deepseek-v4-kernel.cfg.j2
        dest: "{{ deepseek_v4_ik_render_dir }}/99-deepseek-v4-kernel.cfg"
        mode: "0644"
      vars:
        deepseek_v4_ik_platform_target_kernel: 6.8.0-101-generic
        deepseek_v4_ik_platform_grub_menuentry: >-
          Advanced options for Ubuntu>Ubuntu, with Linux 6.8.0-101-generic

    - name: Render reviewed experiment Compose fixtures
      ansible.builtin.template:
        src: ../../roles/deepseek-v4-ik/templates/docker-compose.yml.j2
        dest: "{{ deepseek_v4_ik_render_dir }}/docker-compose-{{ item.id }}.yml"
        mode: "0644"
      vars:
        deepseek_v4_ik_cache_ram_mib: "{{ item.cache_ram_mib }}"
        deepseek_v4_ik_ctx_checkpoints: "{{ item.ctx_checkpoints }}"
        deepseek_v4_ik_emit_ctx_checkpoints: "{{ item.emit_ctx_checkpoints }}"
        deepseek_v4_ik_moe_mode: "{{ item.moe_mode }}"
        deepseek_v4_ik_n_cpu_moe: "{{ item.n_cpu_moe }}"
        deepseek_v4_ik_split_mode: "{{ item.split_mode }}"
      loop:
        - {id: baseline, cache_ram_mib: 8192, ctx_checkpoints: 32, emit_ctx_checkpoints: false, moe_mode: all_cpu, n_cpu_moe: 0, split_mode: layer}
        - {id: checkpoint32, cache_ram_mib: 8192, ctx_checkpoints: 32, emit_ctx_checkpoints: true, moe_mode: all_cpu, n_cpu_moe: 0, split_mode: layer}
        - {id: checkpoint8, cache_ram_mib: 8192, ctx_checkpoints: 8, emit_ctx_checkpoints: true, moe_mode: all_cpu, n_cpu_moe: 0, split_mode: layer}
        - {id: checkpoint4, cache_ram_mib: 8192, ctx_checkpoints: 4, emit_ctx_checkpoints: true, moe_mode: all_cpu, n_cpu_moe: 0, split_mode: layer}
        - {id: cache16, cache_ram_mib: 16384, ctx_checkpoints: 32, emit_ctx_checkpoints: false, moe_mode: all_cpu, n_cpu_moe: 0, split_mode: layer}
        - {id: cache32, cache_ram_mib: 32768, ctx_checkpoints: 32, emit_ctx_checkpoints: false, moe_mode: all_cpu, n_cpu_moe: 0, split_mode: layer}
        - {id: expert42, cache_ram_mib: 8192, ctx_checkpoints: 32, emit_ctx_checkpoints: false, moe_mode: n_cpu_moe, n_cpu_moe: 42, split_mode: layer}
        - {id: graph, cache_ram_mib: 8192, ctx_checkpoints: 32, emit_ctx_checkpoints: false, moe_mode: all_cpu, n_cpu_moe: 0, split_mode: graph}

    - name: Read the rendered private candidate Compose fixture
      ansible.builtin.slurp:
        src: "{{ deepseek_v4_ik_render_dir }}/docker-compose.yml"
      register: deepseek_v4_ik_rendered_compose

    - name: Read the rendered compatibility proxy unit fixture
      ansible.builtin.slurp:
        src: "{{ deepseek_v4_ik_render_dir }}/deepseek-v4-ik-compat.service"
      register: deepseek_v4_ik_rendered_unit

    - name: Read the rendered GRUB fixture
      ansible.builtin.slurp:
        src: "{{ deepseek_v4_ik_render_dir }}/99-deepseek-v4-kernel.cfg"
      register: deepseek_v4_ik_rendered_grub

    - name: Read reviewed experiment Compose fixtures
      ansible.builtin.slurp:
        src: "{{ deepseek_v4_ik_render_dir }}/docker-compose-{{ item.id }}.yml"
      loop:
        - {id: baseline, cache_ram_mib: 8192, ctx_checkpoints: 32, emit_ctx_checkpoints: false, moe_mode: all_cpu, n_cpu_moe: 0, split_mode: layer}
        - {id: checkpoint32, cache_ram_mib: 8192, ctx_checkpoints: 32, emit_ctx_checkpoints: true, moe_mode: all_cpu, n_cpu_moe: 0, split_mode: layer}
        - {id: checkpoint8, cache_ram_mib: 8192, ctx_checkpoints: 8, emit_ctx_checkpoints: true, moe_mode: all_cpu, n_cpu_moe: 0, split_mode: layer}
        - {id: checkpoint4, cache_ram_mib: 8192, ctx_checkpoints: 4, emit_ctx_checkpoints: true, moe_mode: all_cpu, n_cpu_moe: 0, split_mode: layer}
        - {id: cache16, cache_ram_mib: 16384, ctx_checkpoints: 32, emit_ctx_checkpoints: false, moe_mode: all_cpu, n_cpu_moe: 0, split_mode: layer}
        - {id: cache32, cache_ram_mib: 32768, ctx_checkpoints: 32, emit_ctx_checkpoints: false, moe_mode: all_cpu, n_cpu_moe: 0, split_mode: layer}
        - {id: expert42, cache_ram_mib: 8192, ctx_checkpoints: 32, emit_ctx_checkpoints: false, moe_mode: n_cpu_moe, n_cpu_moe: 42, split_mode: layer}
        - {id: graph, cache_ram_mib: 8192, ctx_checkpoints: 32, emit_ctx_checkpoints: false, moe_mode: all_cpu, n_cpu_moe: 0, split_mode: graph}
      register: deepseek_v4_ik_reviewed_compose

    - name: Assert reviewed runtime arguments are rendered exactly
      ansible.builtin.assert:
        that:
          - "'--cache-ram' in (item.content | b64decode)"
          - "('- \"' ~ item.item.cache_ram_mib ~ '\"') in (item.content | b64decode)"
          - "('- \"' ~ item.item.split_mode ~ '\"') in (item.content | b64decode)"
          - >-
            (item.item.emit_ctx_checkpoints | bool and
            '--ctx-checkpoints' in (item.content | b64decode) and
            ('- "' ~ item.item.ctx_checkpoints ~ '"') in (item.content | b64decode)) or
            (not (item.item.emit_ctx_checkpoints | bool) and
            '--ctx-checkpoints' not in (item.content | b64decode))
          - >-
            (item.item.moe_mode == 'all_cpu' and
            '--cpu-moe' in (item.content | b64decode) and
            '--n-cpu-moe' not in (item.content | b64decode)) or
            (item.item.moe_mode == 'n_cpu_moe' and
            '--n-cpu-moe' in (item.content | b64decode) and
            ('- \"' ~ item.item.n_cpu_moe ~ '\"') in (item.content | b64decode))
          - "'CUDA_VISIBLE_DEVICES: \"0,1\"' in (item.content | b64decode)"
          - "'nvidia.com/gpu=0' in (item.content | b64decode)"
          - "'nvidia.com/gpu=1' in (item.content | b64decode)"
          - "'--no-display-prompt' in (item.content | b64decode)"
          - "'stop_grace_period: 300s' in (item.content | b64decode)"
      loop: "{{ deepseek_v4_ik_reviewed_compose.results }}"

    - name: Validate reviewed Compose fixtures
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --file
          - "{{ deepseek_v4_ik_render_dir }}/docker-compose-{{ item }}.yml"
          - config
          - --quiet
      loop: [baseline, checkpoint32, checkpoint8, checkpoint4, cache16, cache32, expert42, graph]
      changed_when: false

    - name: Assert the stable frontend remains proxy-owned
      ansible.builtin.assert:
        that:
          - >-
            (deepseek_v4_ik_rendered_compose.content | b64decode |
            from_yaml).services.candidate.command ==
            deepseek_v4_ik_approved_command
          - "'127.0.0.1:8082:8082' in (deepseek_v4_ik_rendered_compose.content | b64decode)"
          - "'172.17.0.1:8081:8081' not in (deepseek_v4_ik_rendered_compose.content | b64decode)"
          - "'--listen-port 8081' in (deepseek_v4_ik_rendered_unit.content | b64decode)"
          - "'--backend-port 8082' in (deepseek_v4_ik_rendered_unit.content | b64decode)"
          - "'--allow-cidrs 127.0.0.0/8,172.17.0.0/16,172.18.0.0/16' in (deepseek_v4_ik_rendered_unit.content | b64decode)"
          - "'\nRestart=on-failure' in (deepseek_v4_ik_rendered_unit.content | b64decode)"
          - "'Requires=deepseek-v4-ik.service' not in (deepseek_v4_ik_rendered_unit.content | b64decode)"
          - "'PartOf=deepseek-v4-ik.service' not in (deepseek_v4_ik_rendered_unit.content | b64decode)"
          - "'--timezone' not in (deepseek_v4_ik_rendered_unit.content | b64decode)"
          - >-
            'GRUB_DEFAULT="Advanced options for Ubuntu>Ubuntu, with Linux
            6.8.0-101-generic"' in
            (deepseek_v4_ik_rendered_grub.content | b64decode)

- name: Validate reviewed and rejected DeepSeek V4 experiment policies
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../roles/deepseek-v4-ik/defaults/main.yml
  vars:
    deepseek_v4_ik_context_length: 131072
    deepseek_v4_ik_cpu_threads: 32
    deepseek_v4_ik_numa_mode: distribute
    deepseek_v4_ik_batch_threads: 36
    deepseek_v4_ik_disable_pinned_memory: false
    deepseek_v4_ik_batch_size: 4096
    deepseek_v4_ik_ubatch_size: 2048
    deepseek_v4_ik_run_candidate: true
    deepseek_v4_ik_validate_only: true
  tasks:
    - name: Accept reviewed single-variable experiment transitions
      ansible.builtin.include_role:
        name: deepseek-v4-ik
      vars:
        deepseek_v4_ik_run_candidate: true
        deepseek_v4_ik_validate_only: true
        deepseek_v4_ik_context_length: 131072
        deepseek_v4_ik_cpu_threads: 32
        deepseek_v4_ik_numa_mode: distribute
        deepseek_v4_ik_batch_threads: 36
        deepseek_v4_ik_disable_pinned_memory: false
        deepseek_v4_ik_batch_size: 4096
        deepseek_v4_ik_ubatch_size: 2048
        deepseek_v4_ik_experiment_id: "{{ item.id }}"
        deepseek_v4_ik_control_id: "{{ item.control_id }}"
        deepseek_v4_ik_cache_intermediate_id: >-
          {{ item.cache_intermediate | default('') }}
        deepseek_v4_ik_experiment_primary_variable: "{{ item.primary }}"
        deepseek_v4_ik_cache_ram_mib: "{{ item.cache_ram_mib }}"
        deepseek_v4_ik_control_cache_ram_mib: "{{ item.control_cache_ram_mib }}"
        deepseek_v4_ik_moe_mode: "{{ item.moe_mode }}"
        deepseek_v4_ik_n_cpu_moe: "{{ item.n_cpu_moe }}"
        deepseek_v4_ik_control_moe_mode: "{{ item.control_moe_mode }}"
        deepseek_v4_ik_control_n_cpu_moe: "{{ item.control_n_cpu_moe }}"
        deepseek_v4_ik_split_mode: "{{ item.split_mode }}"
        deepseek_v4_ik_control_split_mode: "{{ item.control_split_mode }}"
        deepseek_v4_ik_graph_preflight_evidence_path: "{{ item.graph_preflight }}"
      loop:
        - {id: cache8-control-r1, control_id: production-control, primary: baseline, cache_ram_mib: 8192, control_cache_ram_mib: 8192, moe_mode: all_cpu, n_cpu_moe: 0, control_moe_mode: all_cpu, control_n_cpu_moe: 0, split_mode: layer, control_split_mode: layer, graph_preflight: ""}
        - {id: cache16-r1, control_id: cache8-control, primary: cache_ram_mib, cache_ram_mib: 16384, control_cache_ram_mib: 8192, moe_mode: all_cpu, n_cpu_moe: 0, control_moe_mode: all_cpu, control_n_cpu_moe: 0, split_mode: layer, control_split_mode: layer, graph_preflight: ""}
        - {id: cache32-r1, control_id: cache8-control, cache_intermediate: cache16-rejected, primary: cache_ram_mib, cache_ram_mib: 32768, control_cache_ram_mib: 8192, moe_mode: all_cpu, n_cpu_moe: 0, control_moe_mode: all_cpu, control_n_cpu_moe: 0, split_mode: layer, control_split_mode: layer, graph_preflight: ""}
        - {id: expert42-r1, control_id: cache8-control, primary: n_cpu_moe, cache_ram_mib: 8192, control_cache_ram_mib: 8192, moe_mode: n_cpu_moe, n_cpu_moe: 42, control_moe_mode: all_cpu, control_n_cpu_moe: 0, split_mode: layer, control_split_mode: layer, graph_preflight: ""}
        - {id: graph-r1, control_id: cache8-control, primary: split_mode, cache_ram_mib: 8192, control_cache_ram_mib: 8192, moe_mode: all_cpu, n_cpu_moe: 0, control_moe_mode: all_cpu, control_n_cpu_moe: 0, split_mode: graph, control_split_mode: layer, graph_preflight: /tmp/topology.json}

    - name: Reject unsafe experiment identifiers
      block:
        - name: Validate unsafe experiment identifier
          ansible.builtin.include_role:
            name: deepseek-v4-ik
          vars:
            deepseek_v4_ik_run_candidate: true
            deepseek_v4_ik_validate_only: true
            deepseek_v4_ik_context_length: 131072
            deepseek_v4_ik_cpu_threads: 32
            deepseek_v4_ik_numa_mode: distribute
            deepseek_v4_ik_batch_threads: 36
            deepseek_v4_ik_disable_pinned_memory: false
            deepseek_v4_ik_batch_size: 4096
            deepseek_v4_ik_ubatch_size: 2048
            deepseek_v4_ik_experiment_id: ../escape
            deepseek_v4_ik_control_id: valid-control
            deepseek_v4_ik_experiment_primary_variable: cache_ram_mib
            deepseek_v4_ik_cache_ram_mib: 16384
            deepseek_v4_ik_control_cache_ram_mib: 8192
        - name: Mark unsafe identifier as accepted
          ansible.builtin.set_fact:
            deepseek_v4_ik_unsafe_id_accepted: true
      rescue:
        - name: Record unsafe identifier rejection
          ansible.builtin.set_fact:
            deepseek_v4_ik_unsafe_id_rejected: true

    - name: Accept the reviewed checkpoint transition
      ansible.builtin.include_role:
        name: deepseek-v4-ik
      vars:
        deepseek_v4_ik_run_candidate: true
        deepseek_v4_ik_validate_only: true
        deepseek_v4_ik_context_length: 131072
        deepseek_v4_ik_cpu_threads: 32
        deepseek_v4_ik_numa_mode: distribute
        deepseek_v4_ik_batch_threads: 36
        deepseek_v4_ik_disable_pinned_memory: false
        deepseek_v4_ik_batch_size: 4096
        deepseek_v4_ik_ubatch_size: 2048
        deepseek_v4_ik_experiment_id: checkpoint8-r1
        deepseek_v4_ik_control_id: checkpoint32-control
        deepseek_v4_ik_experiment_primary_variable: ctx_checkpoints
        deepseek_v4_ik_cache_ram_mib: 8192
        deepseek_v4_ik_control_cache_ram_mib: 8192
        deepseek_v4_ik_ctx_checkpoints: 8
        deepseek_v4_ik_control_ctx_checkpoints: 32
        deepseek_v4_ik_emit_ctx_checkpoints: true
        deepseek_v4_ik_reuse_verified_model_checksum: true

    - name: Accept the bounded single-repeat checkpoint diagnosis
      ansible.builtin.include_role:
        name: deepseek-v4-ik
      vars:
        deepseek_v4_ik_run_candidate: true
        deepseek_v4_ik_validate_only: true
        deepseek_v4_ik_context_length: 131072
        deepseek_v4_ik_cpu_threads: 32
        deepseek_v4_ik_numa_mode: distribute
        deepseek_v4_ik_batch_threads: 36
        deepseek_v4_ik_disable_pinned_memory: false
        deepseek_v4_ik_batch_size: 4096
        deepseek_v4_ik_ubatch_size: 2048
        deepseek_v4_ik_experiment_id: checkpoint8-diagnostic
        deepseek_v4_ik_control_id: final-baseline-r6
        deepseek_v4_ik_experiment_primary_variable: ctx_checkpoints
        deepseek_v4_ik_ctx_checkpoints: 8
        deepseek_v4_ik_control_ctx_checkpoints: 32
        deepseek_v4_ik_emit_ctx_checkpoints: true
        deepseek_v4_ik_checkpoint_diagnostic: true
        deepseek_v4_ik_checkpoint_transition_repeats: 1
        deepseek_v4_ik_reuse_verified_model_checksum: true

    - name: Reject abbreviated checkpoint evidence outside diagnostic mode
      block:
        - name: Validate one repeat as promotion evidence
          ansible.builtin.include_role:
            name: deepseek-v4-ik
          vars:
            deepseek_v4_ik_run_candidate: true
            deepseek_v4_ik_validate_only: true
            deepseek_v4_ik_experiment_id: checkpoint8-short-promotion
            deepseek_v4_ik_control_id: checkpoint32-control
            deepseek_v4_ik_experiment_primary_variable: ctx_checkpoints
            deepseek_v4_ik_ctx_checkpoints: 8
            deepseek_v4_ik_control_ctx_checkpoints: 32
            deepseek_v4_ik_emit_ctx_checkpoints: true
            deepseek_v4_ik_checkpoint_transition_repeats: 1
        - name: Mark abbreviated promotion evidence as accepted
          ansible.builtin.set_fact:
            deepseek_v4_ik_short_promotion_accepted: true
      rescue:
        - name: Record abbreviated promotion evidence rejection
          ansible.builtin.set_fact:
            deepseek_v4_ik_short_promotion_rejected: true

    - name: Reject an implicit checkpoint transition
      block:
        - name: Validate checkpoint transition without explicit option
          ansible.builtin.include_role:
            name: deepseek-v4-ik
          vars:
            deepseek_v4_ik_run_candidate: true
            deepseek_v4_ik_validate_only: true
            deepseek_v4_ik_context_length: 131072
            deepseek_v4_ik_cpu_threads: 32
            deepseek_v4_ik_numa_mode: distribute
            deepseek_v4_ik_batch_threads: 36
            deepseek_v4_ik_disable_pinned_memory: false
            deepseek_v4_ik_batch_size: 4096
            deepseek_v4_ik_ubatch_size: 2048
            deepseek_v4_ik_experiment_id: checkpoint8-implicit
            deepseek_v4_ik_control_id: checkpoint32-control
            deepseek_v4_ik_experiment_primary_variable: ctx_checkpoints
            deepseek_v4_ik_ctx_checkpoints: 8
            deepseek_v4_ik_control_ctx_checkpoints: 32
            deepseek_v4_ik_emit_ctx_checkpoints: false
        - name: Mark implicit checkpoint transition as accepted
          ansible.builtin.set_fact:
            deepseek_v4_ik_checkpoint_implicit_accepted: true
      rescue:
        - name: Record implicit checkpoint transition rejection
          ansible.builtin.set_fact:
            deepseek_v4_ik_checkpoint_implicit_rejected: true

    - name: Reject mixed primary variables
      block:
        - name: Validate mixed cache and MoE changes
          ansible.builtin.include_role:
            name: deepseek-v4-ik
          vars:
            deepseek_v4_ik_run_candidate: true
            deepseek_v4_ik_validate_only: true
            deepseek_v4_ik_context_length: 131072
            deepseek_v4_ik_cpu_threads: 32
            deepseek_v4_ik_numa_mode: distribute
            deepseek_v4_ik_batch_threads: 36
            deepseek_v4_ik_disable_pinned_memory: false
            deepseek_v4_ik_batch_size: 4096
            deepseek_v4_ik_ubatch_size: 2048
            deepseek_v4_ik_experiment_id: mixed-r1
            deepseek_v4_ik_control_id: valid-control
            deepseek_v4_ik_experiment_primary_variable: cache_ram_mib
            deepseek_v4_ik_cache_ram_mib: 16384
            deepseek_v4_ik_control_cache_ram_mib: 8192
            deepseek_v4_ik_moe_mode: n_cpu_moe
            deepseek_v4_ik_n_cpu_moe: 42
        - name: Mark mixed variables as accepted
          ansible.builtin.set_fact:
            deepseek_v4_ik_mixed_accepted: true
      rescue:
        - name: Record mixed variable rejection
          ansible.builtin.set_fact:
            deepseek_v4_ik_mixed_rejected: true

    - name: Reject graph without preflight evidence
      block:
        - name: Validate graph without preflight
          ansible.builtin.include_role:
            name: deepseek-v4-ik
          vars:
            deepseek_v4_ik_run_candidate: true
            deepseek_v4_ik_validate_only: true
            deepseek_v4_ik_context_length: 131072
            deepseek_v4_ik_cpu_threads: 32
            deepseek_v4_ik_numa_mode: distribute
            deepseek_v4_ik_batch_threads: 36
            deepseek_v4_ik_disable_pinned_memory: false
            deepseek_v4_ik_batch_size: 4096
            deepseek_v4_ik_ubatch_size: 2048
            deepseek_v4_ik_experiment_id: graph-no-preflight
            deepseek_v4_ik_control_id: valid-control
            deepseek_v4_ik_experiment_primary_variable: split_mode
            deepseek_v4_ik_split_mode: graph
            deepseek_v4_ik_control_split_mode: layer
            deepseek_v4_ik_graph_preflight_evidence_path: ""
        - name: Mark graph without preflight as accepted
          ansible.builtin.set_fact:
            deepseek_v4_ik_graph_without_preflight_accepted: true
      rescue:
        - name: Record graph preflight rejection
          ansible.builtin.set_fact:
            deepseek_v4_ik_graph_without_preflight_rejected: true

    - name: Reject 32 GiB cache without rejected 16 GiB evidence
      block:
        - name: Validate 32 GiB cache without intermediate evidence
          ansible.builtin.include_role:
            name: deepseek-v4-ik
          vars:
            deepseek_v4_ik_run_candidate: true
            deepseek_v4_ik_validate_only: true
            deepseek_v4_ik_experiment_id: cache32-no-intermediate
            deepseek_v4_ik_control_id: cache8-control
            deepseek_v4_ik_experiment_primary_variable: cache_ram_mib
            deepseek_v4_ik_cache_ram_mib: 32768
            deepseek_v4_ik_control_cache_ram_mib: 8192
        - name: Mark 32 GiB cache without intermediate as accepted
          ansible.builtin.set_fact:
            deepseek_v4_ik_cache32_without_intermediate_accepted: true
      rescue:
        - name: Record missing cache intermediate rejection
          ansible.builtin.set_fact:
            deepseek_v4_ik_cache32_without_intermediate_rejected: true

    - name: Reject 4 checkpoints without rejected 8-checkpoint evidence
      block:
        - name: Validate 4 checkpoints without intermediate evidence
          ansible.builtin.include_role:
            name: deepseek-v4-ik
          vars:
            deepseek_v4_ik_run_candidate: true
            deepseek_v4_ik_validate_only: true
            deepseek_v4_ik_context_length: 131072
            deepseek_v4_ik_cpu_threads: 32
            deepseek_v4_ik_numa_mode: distribute
            deepseek_v4_ik_batch_threads: 36
            deepseek_v4_ik_disable_pinned_memory: false
            deepseek_v4_ik_batch_size: 4096
            deepseek_v4_ik_ubatch_size: 2048
            deepseek_v4_ik_experiment_id: checkpoint4-no-intermediate
            deepseek_v4_ik_control_id: checkpoint32-control
            deepseek_v4_ik_experiment_primary_variable: ctx_checkpoints
            deepseek_v4_ik_ctx_checkpoints: 4
            deepseek_v4_ik_control_ctx_checkpoints: 32
            deepseek_v4_ik_emit_ctx_checkpoints: true
        - name: Mark 4 checkpoints without intermediate as accepted
          ansible.builtin.set_fact:
            deepseek_v4_ik_checkpoint4_without_intermediate_accepted: true
      rescue:
        - name: Record missing checkpoint intermediate rejection
          ansible.builtin.set_fact:
            deepseek_v4_ik_checkpoint4_without_intermediate_rejected: true

    - name: Reject an implicit production checkpoint reduction
      block:
        - name: Validate production checkpoint reduction without explicit option
          ansible.builtin.include_role:
            name: deepseek-v4-ik
          vars:
            deepseek_v4_ik_prepare: false
            deepseek_v4_ik_run_candidate: false
            deepseek_v4_ik_verify_stable: false
            deepseek_v4_ik_run_topology_preflight: false
            deepseek_v4_ik_run_final_qualification: false
            deepseek_v4_ik_production: true
            deepseek_v4_ik_validate_only: true
            deepseek_v4_ik_ctx_checkpoints: 8
            deepseek_v4_ik_emit_ctx_checkpoints: false
        - name: Mark implicit production checkpoint reduction as accepted
          ansible.builtin.set_fact:
            deepseek_v4_ik_production_checkpoint_implicit_accepted: true
      rescue:
        - name: Record implicit production checkpoint reduction rejection
          ansible.builtin.set_fact:
            deepseek_v4_ik_production_checkpoint_implicit_rejected: true

    - name: Require invalid policy rejection
      ansible.builtin.assert:
        that:
          - deepseek_v4_ik_unsafe_id_rejected | default(false)
          - not (deepseek_v4_ik_unsafe_id_accepted | default(false))
          - deepseek_v4_ik_mixed_rejected | default(false)
          - not (deepseek_v4_ik_mixed_accepted | default(false))
          - deepseek_v4_ik_graph_without_preflight_rejected | default(false)
          - not (deepseek_v4_ik_graph_without_preflight_accepted | default(false))
          - deepseek_v4_ik_cache32_without_intermediate_rejected | default(false)
          - not (deepseek_v4_ik_cache32_without_intermediate_accepted | default(false))
          - deepseek_v4_ik_checkpoint_implicit_rejected | default(false)
          - not (deepseek_v4_ik_checkpoint_implicit_accepted | default(false))
          - deepseek_v4_ik_checkpoint4_without_intermediate_rejected | default(false)
          - not (deepseek_v4_ik_checkpoint4_without_intermediate_accepted | default(false))
          - deepseek_v4_ik_short_promotion_rejected | default(false)
          - not (deepseek_v4_ik_short_promotion_accepted | default(false))
          - deepseek_v4_ik_production_checkpoint_implicit_rejected | default(false)
          - not (deepseek_v4_ik_production_checkpoint_implicit_accepted | default(false))

    - name: Create duplicate evidence fixture
      ansible.builtin.file:
        path: /tmp/deepseek-v4-ik-render/duplicate-evidence
        state: directory
        mode: "0755"

    - name: Reject duplicate immutable evidence
      block:
        - name: Validate duplicate immutable evidence
          ansible.builtin.include_role:
            name: deepseek-v4-ik
            tasks_from: evidence-dir-guard
          vars:
            deepseek_v4_ik_experiment_dir: /tmp/deepseek-v4-ik-render/duplicate-evidence
        - name: Mark duplicate evidence as accepted
          ansible.builtin.set_fact:
            deepseek_v4_ik_duplicate_accepted: true
      rescue:
        - name: Record duplicate evidence rejection
          ansible.builtin.set_fact:
            deepseek_v4_ik_duplicate_rejected: true

    - name: Require duplicate evidence rejection
      ansible.builtin.assert:
        that:
          - deepseek_v4_ik_duplicate_rejected | default(false)
          - not (deepseek_v4_ik_duplicate_accepted | default(false))

- name: Validate the isolated GPU platform lifecycle action
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    deepseek_v4_ik_platform_target_kernel: 6.8.0-101-generic
    deepseek_v4_ik_platform_kernel_package_version: 6.8.0-101.101
    deepseek_v4_ik_platform_nvidia_package_version: >-
      590.48.01-0ubuntu0.24.04.1
    deepseek_v4_ik_platform_nvidia_module_version: 590.48.01
    deepseek_v4_ik_platform_tracking_packages:
      - linux-virtual
      - linux-image-virtual
      - linux-headers-virtual
      - linux-headers-generic
      - linux-modules-nvidia-590-open-generic
  tasks:
    - name: Accept platform as the only validate-only lifecycle action
      ansible.builtin.include_role:
        name: deepseek-v4-ik
      vars:
        deepseek_v4_ik_platform: true
        deepseek_v4_ik_validate_only: true

    - name: Reject platform mixed with an experiment action
      block:
        - name: Validate mixed platform and experiment actions
          ansible.builtin.include_role:
            name: deepseek-v4-ik
          vars:
            deepseek_v4_ik_platform: true
            deepseek_v4_ik_run_candidate: true
            deepseek_v4_ik_validate_only: true
        - name: Mark mixed platform lifecycle as accepted
          ansible.builtin.set_fact:
            deepseek_v4_ik_platform_mixed_accepted: true
      rescue:
        - name: Record mixed platform lifecycle rejection
          ansible.builtin.set_fact:
            deepseek_v4_ik_platform_mixed_rejected: true

    - name: Reject an unapproved kernel bundle
      block:
        - name: Validate an unapproved kernel bundle
          ansible.builtin.include_role:
            name: deepseek-v4-ik
          vars:
            deepseek_v4_ik_platform: true
            deepseek_v4_ik_validate_only: true
            deepseek_v4_ik_platform_target_kernel: 6.8.0-137-generic
        - name: Mark the unapproved kernel bundle as accepted
          ansible.builtin.set_fact:
            deepseek_v4_ik_platform_kernel137_accepted: true
      rescue:
        - name: Record the unapproved kernel bundle rejection
          ansible.builtin.set_fact:
            deepseek_v4_ik_platform_kernel137_rejected: true

    - name: Reject an unapproved NVIDIA userspace bundle
      block:
        - name: Validate an unapproved NVIDIA userspace bundle
          ansible.builtin.include_role:
            name: deepseek-v4-ik
          vars:
            deepseek_v4_ik_platform: true
            deepseek_v4_ik_validate_only: true
            deepseek_v4_ik_platform_nvidia_package_version: >-
              595.45.04-0ubuntu0.24.04.1
        - name: Mark the unapproved NVIDIA bundle as accepted
          ansible.builtin.set_fact:
            deepseek_v4_ik_platform_nvidia595_accepted: true
      rescue:
        - name: Record the unapproved NVIDIA bundle rejection
          ansible.builtin.set_fact:
            deepseek_v4_ik_platform_nvidia595_rejected: true

    - name: Reject overridden versions inside the approved package names
      block:
        - name: Validate overridden package bundle versions
          ansible.builtin.include_role:
            name: deepseek-v4-ik
          vars:
            deepseek_v4_ik_platform: true
            deepseek_v4_ik_validate_only: true
            deepseek_v4_ik_platform_package_bundle:
              - name: linux-image-6.8.0-101-generic
                version: 6.8.0-137.137
              - name: linux-modules-6.8.0-101-generic
                version: 6.8.0-101.101
              - name: linux-headers-6.8.0-101-generic
                version: 6.8.0-101.101
              - name: >-
                  linux-modules-nvidia-590-open-6.8.0-101-generic
                version: 6.8.0-101.101
              - name: nvidia-driver-590-open
                version: 590.48.01-0ubuntu0.24.04.1
              - name: nvidia-utils-590
                version: 590.48.01-0ubuntu0.24.04.1
        - name: Mark overridden package versions as accepted
          ansible.builtin.set_fact:
            deepseek_v4_ik_platform_bundle_override_accepted: true
      rescue:
        - name: Record overridden package version rejection
          ansible.builtin.set_fact:
            deepseek_v4_ik_platform_bundle_override_rejected: true

    - name: Reject an extra unrelated package in the hold set
      block:
        - name: Validate an expanded platform hold set
          ansible.builtin.include_role:
            name: deepseek-v4-ik
          vars:
            deepseek_v4_ik_platform: true
            deepseek_v4_ik_validate_only: true
            deepseek_v4_ik_platform_hold_packages: >-
              {{ ((deepseek_v4_ik_platform_package_bundle |
              map(attribute='name') | list) +
              deepseek_v4_ik_platform_tracking_packages + ['openssl']) |
              unique | list }}
        - name: Mark the expanded hold set as accepted
          ansible.builtin.set_fact:
            deepseek_v4_ik_platform_extra_hold_accepted: true
      rescue:
        - name: Record the expanded hold set rejection
          ansible.builtin.set_fact:
            deepseek_v4_ik_platform_extra_hold_rejected: true

    - name: Reject an overridden GPU identity
      block:
        - name: Validate an overridden expected GPU identity
          ansible.builtin.include_role:
            name: deepseek-v4-ik
          vars:
            deepseek_v4_ik_platform: true
            deepseek_v4_ik_validate_only: true
            deepseek_v4_ik_platform_expected_gpu_name: NVIDIA A100
        - name: Mark the overridden GPU identity as accepted
          ansible.builtin.set_fact:
            deepseek_v4_ik_platform_gpu_override_accepted: true
      rescue:
        - name: Record the overridden GPU identity rejection
          ansible.builtin.set_fact:
            deepseek_v4_ik_platform_gpu_override_rejected: true

    - name: Require invalid platform policy rejection
      ansible.builtin.assert:
        that:
          - deepseek_v4_ik_platform_mixed_rejected | default(false)
          - not (deepseek_v4_ik_platform_mixed_accepted | default(false))
          - deepseek_v4_ik_platform_kernel137_rejected | default(false)
          - not (deepseek_v4_ik_platform_kernel137_accepted | default(false))
          - deepseek_v4_ik_platform_nvidia595_rejected | default(false)
          - not (deepseek_v4_ik_platform_nvidia595_accepted | default(false))
          - deepseek_v4_ik_platform_bundle_override_rejected | default(false)
          - >-
            not (deepseek_v4_ik_platform_bundle_override_accepted |
            default(false))
          - deepseek_v4_ik_platform_extra_hold_rejected | default(false)
          - >-
            not (deepseek_v4_ik_platform_extra_hold_accepted |
            default(false))
          - deepseek_v4_ik_platform_gpu_override_rejected | default(false)
          - >-
            not (deepseek_v4_ik_platform_gpu_override_accepted |
            default(false))
