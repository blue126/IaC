sections:
  - hero
  - cards
  - cta

hero:
  eyebrow: Homelab Infrastructure as Code
  title_lines:
    - words:
        - { text: Homelab IaC Documentation }
  lead: Browse Terraform, Ansible, deployment, architecture, incident, and learning documentation from one searchable site.
  note: HTML, Markdown, and llms.txt from the same source
  note_icon: fa-solid fa-file-lines
  actions:
    - { label: Browse documentation, url: docs/, icon: fa-solid fa-book-open, style: primary }
    - { label: View source, url: "https://github.com/blue126/IaC", external: true, style: ghost }

cards:
  eyebrow: Repository documentation
  title: Start with the area you need
  columns: 3
  items:
    - { title: Architecture, desc: System boundaries, design decisions, specifications, and integration patterns., icon: fa-solid fa-diagram-project, url: docs/architecture/ }
    - { title: Guides, desc: Service deployment, Terraform/Ansible operations, and practical how-to references., icon: fa-solid fa-rocket, url: docs/guides/ }
    - { title: Troubleshooting, desc: Problem-solving guides and incident retrospectives., icon: fa-solid fa-wrench, url: docs/troubleshooting/ }
    - { title: Agent, desc: BMAD/Multica/OpenCode agent workflow contracts and integration., icon: fa-solid fa-robot, url: docs/agent/ }
    - { title: Learning Notes, desc: Dated technical deep-dives and lessons learned., icon: fa-solid fa-graduation-cap, url: docs/learningnotes/ }

cta:
  title: Read the source or the site.
  text: Existing Markdown remains unchanged in the repository and is published here with search and Agent-friendly outputs.
  label: Open all documentation
  url: docs/
  style: primary
