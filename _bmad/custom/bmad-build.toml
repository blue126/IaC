# PAL transport-only customization; native reviewer arrays remain installed-version owned.
[workflow]
activation_steps_prepend = ["PAL-REVIEW: Load {project-root}/docs/agent/bmad-cross-model-review.md and docs/agent/bmad-review-routing.md. At selected native reviewer dispatch, run the X10 access probe if this Run has no reviewer-probe.json, then use clink with the first cli_name in its order and the matching isolated role instead of the native spawn transport. Keep the complete installed native child task, conditions, method, output format and synchronization. Verify the current Run service cwd and authorized per-role input directories per X2/X3; if unavailable, mark that selected review not executed, never silently fall back."]
persistent_facts = [
  "file:{project-root}/docs/agent/bmad-cross-model-review.md",
  "PAL is opt-in for this build: only an explicit cross-model review request selects PAL. Otherwise run the original native review unchanged and report no cross-model review executed. Apply opt-in equally to review_layers and oneshot_review_layers; do not suppress native reviews.",
  "Keep independent reviewer sessions separate (no shared continuation_id), await the native group before triage, and inspect actual return_code, is_error, permission_denials and full findings. If content is truncated, recover only complete raw output from that same response (Claude: metadata.raw.result); otherwise record the layer incomplete. No automatic duplicate launch, extra review round, CR-1 process extraction or fabricated zero findings.",
  "Record actual target version, model and available usage alongside results, not inside native findings. Required unexecuted reviews remain visible and cannot count as acceptance. Source, spec and other reports must obey the per-role input boundaries in X3; text-only isolation is not sufficient."
]
