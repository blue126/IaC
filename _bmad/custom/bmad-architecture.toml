# BMAD cross-model review r7: selected architecture reviewers only.
# Prompt-layer adaptation, not a platform-enforced switch. See docs/bmad-review-routing.md R2/R3.2.
[workflow]
activation_steps_prepend = [
  "Load {project-root}/docs/bmad-review-routing.md for the selective CR-1 policy and {project-root}/docs/bmad-cross-model-review.md for the transport protocol. Keep the native architecture workflow, gate timing, default reviewers and reporting contract. At its native Reviewer Gate, route ONLY the good-spine rubric walker and the architecture-consistency adversarial reviewer through a real Claude Code process using CR-1. Keep technology/version reality-checking on its native research path with web capability: a read-only Claude process cannot search the web and would return empty findings instead of failing. Missing Claude prerequisites blocks only those two selected reviews, not drafting or ordinary planning; record them as not-executed per routing R1.5."
]
persistent_facts = [
  "file:{project-root}/docs/bmad-cross-model-review.md",
  "CR-1 selection: rubric and AD-consistency adversarial review use claude-opus-5 / high; technology verification and unselected ad-hoc reviewers remain native. Preserve the exact original checklist/prompt and severity/report formats. Copy each required method file into that reviewer's staging directory and pass staged absolute paths; a {skill-root} path is unreadable under the restricted CLI. Do not append duplicate finalize_reviewers or redirect the whole gate to bmad-review. Await the native reviewer group before fixes. Report actual CLI/modelUsage evidence and the CR-1 summary line; a same-provider subagent is not Claude.",
  "A review recorded as not-executed must stay visible in the report and the handoff. The upstream work item may not enter acceptance while a required review is unexecuted. Distinguish reviewed / zero findings / not executed."
]
