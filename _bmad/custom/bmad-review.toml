# BMAD cross-model review r7 — bmad-review uses lenses keyed by code, not review_layers.
# Host-agnostic: no dependency on any agent platform. See docs/bmad-cross-model-review.md.
# These activation steps are working checks, not an access gate (core doc X1).
[workflow]
activation_steps_prepend = [
  "Read {project-root}/docs/bmad-cross-model-review.md. If unavailable, stop with an explicit configuration failure. Resolve the active customization including team, personal and invocation layers before execution; do not fall back to shipped defaults when this project's cross-model requirements would be lost. Confirm actual worktree, task authorization and code/data egress permissions. This is an execution policy, not a new BMAD routing rule.",
  "Run only after an explicit review request or a native skill:bmad-review directive. Confirm the actual content and requested lenses. Report-only: the host may stage input and write a review report to an authorized artifact location, but neither host nor reviewers may edit the reviewed product/code/spec. Resolve the configured lenses successfully before proceeding; do not accept the skill's shipped-default fallback when it would remove Claude execution."
]
activation_steps_append = [
  "After the native lens selection, verify each selected lens has the intended CR-1 execution recipe; core doc X6 is the preflight that reports this for the persistent configuration. Preserve applies_to, when and after behavior; do not add an otherwise-unselected lens merely to satisfy a model policy. A new or unmapped selected lens blocks the unattended run until explicitly configured. Stage absolute content/claims paths as the original skill prescribes. Check BMAD_REVIEW_MODEL / ALLOWED / REQUIRED and BMAD_REVIEW_MAX_USD are set and Claude is authenticated in this runtime. Prepare the required per-lens context only, and preserve an exact caller output contract."
]
persistent_facts = [
  "file:{project-root}/docs/bmad-cross-model-review.md",
  "H-CR1 is the shared host execution recipe in the core document (X3). Execute the extracted Python, stage only permitted per-lens bytes and method copies, pass key inputs as targets AND name every target in the prompt, preserve the native synchronization point, and return findings.txt verbatim after syntax validation. structured_output status is transport control, not BMAD findings or approval. persistent_facts are host context, not automatically inherited by Claude.",
  "For each selected lens, use actual native staged content/claims variables; introduce no new template keys. Copy every referenced method file into that lens staging directory and pass staged absolute paths; a {skill-root} path left in a child prompt is unreadable under the restricted CLI and, if readable, would be an unpinned live file. Supply only effective also_consider/review_guidance and the native allowed dependencies. Preserve selection, applies_to, when and after. No other findings or host conversation reach the child.",
  "Attach each lens's CR-1 summary line to the run artifact so a human can see which lenses actually ran, on which model, at what cost. A lens recorded as not-executed must stay visible; distinguish reviewed / zero findings / not executed."
]
review_guidance = [
  "Report substantiated issues within the requested scope. Zero findings is valid; do not enforce a minimum finding count, including the adversarial lens. Preserve the approved product intent and distinguish a real defect from optional new scope. Do not emit severity, priority or ranking.",
  "Keep independent lenses' inputs separate. Only a dependent lens receives the predecessor findings permitted by after. The edge-case lens alone receives claims at the original reading step. Editorial suggestions must preserve meaning and respect the requested audience."
]
on_complete = '''
Keep the native findings contract and report presentation intact. The host records lens execution metadata, the CR-1 summary lines and the exact target version as a separate run artifact, not extra text inside raw findings. Do not apply fixes, push, merge, mark the upstream work item accepted or start a second review. Execution errors remain visible and prevent acceptance.
'''

[[workflow.lenses]]
code = "adversarial"
name = "Adversarial — Claude"
applies_to = "any"
when = "always"
instruction = '''
Execute CR-1 / H-CR1 from the core document; apply the child task below in a per-lens private staging directory. Host preparation: copy references/lens-adversarial.md into that directory and pass its staged absolute path.

Child task:
Read the staged copy of the adversarial lens method file and apply its substantive review method to the staged content. Explicit project override: ignore its minimum-ten-findings and nonempty-list requirements. Preserve canonical finding fields and no severity/ranking; return valid zero findings when warranted. Include only the requested also_consider and standing review guidance. Do not receive claims or other lenses' findings.
'''

[[workflow.lenses]]
code = "edge-case-hunter"
name = "Edge-Case Hunter — Claude"
applies_to = "any"
when = "Content has behavior to trace: code, diffs, specs, requirements, plans or stories; not prose with no behavioral surface."
instruction = '''
Execute CR-1 / H-CR1 from the core document; apply the child task below in a per-lens private staging directory. Host preparation: copy references/lens-edge-case-hunter.md into that directory and pass its staged absolute path.

Child task:
Read the staged copy of the edge-case-hunter lens method file fully. Use the staged review content's absolute path. Only this lens may receive the separately staged claims path, left unread until its original instructions require it. Keep original scope, sequence, findings fields and any kind/confidence extras. Do not preload claims bytes. Include also_consider and standing review guidance, but no other findings.
'''

[[workflow.lenses]]
code = "verification-gap"
name = "Verification Gap — Claude"
applies_to = "code"
when = "Reviewed inside a repo where tests can be searched and read."
instruction = '''
Execute CR-1 / H-CR1 from the core document; apply the child task below in a per-lens private staging directory. Host preparation: copy references/lens-verification-gap.md into that directory alongside the curated source/test/consumer snapshot, and pass staged absolute paths.

Child task:
Read the staged copy of the verification-gap lens method file fully. Use the staged content and curated source/test/consumer snapshot to read/search actual tests and callers. No raw repo-root authorization; missing essential context fails the review. Retain the method and its gap_shape/consumer/evidence fields as applicable. Do not receive claims or other findings. No testing or shell execution by this child; the host handles test execution separately. Missing read/search capability is an execution failure, not proof of coverage.
'''

[[workflow.lenses]]
code = "structure"
name = "Editorial Structure — Claude"
applies_to = "docs"
when = "Documents whose shape is the author's to change."
instruction = '''
Execute CR-1 / H-CR1 from the core document; apply the child task below in a per-lens private staging directory. Host preparation: copy references/lens-structure.md, references/editorial-common.md and the structure models reference they require into that directory, and pass staged absolute paths.

Child task:
Read the staged copies of the structure lens method file, the editorial common file and the structure models reference they require. Use staged content, purpose/audience/length inputs, effective reader_type/style_guide/output_preferences and standing review guidance. The host supplies original word_metrics output once for the editorial group, or a clearly identified unavailability so the native estimation fallback is explicit. Preserve the native editorial findings table and meaning; propose, do not edit. No claims or other lens findings.
'''

[[workflow.lenses]]
code = "prose"
name = "Editorial Prose — Claude"
applies_to = "docs"
when = "Documents being copy-edited."
after = "structure"
instruction = '''
Execute CR-1 / H-CR1 from the core document; apply the child task below in a per-lens private staging directory. Host preparation: copy references/lens-prose.md and references/editorial-common.md into that directory and pass staged absolute paths.

Child task:
Read the staged copies of the prose lens method file and the editorial common file. Use staged content and the effective editorial settings/word metrics supplied by the host. When structure actually ran, receive its findings and honor them; when it was not selected or produced no findings, proceed as the original method specifies with no prior findings. Receive no other lenses' findings or claims. Preserve the native editorial findings table and author meaning; do not rewrite the source file.
'''
